<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FollowMe Chat V2 Admin</title>
  <style>
    :root{
      --green:#008069;
      --green2:#00a884;
      --bg:#efeae2;
      --panel:#f0f2f5;
      --text:#111b21;
      --muted:#667781;
      --line:rgba(0,0,0,.08);
      --danger:#d92d20;
      --owner:#d9fdd3;
      --user:#fff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;background:var(--bg)}
    header{background:var(--green);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;gap:10px}
    .back,.reset,.control,.send{border:0;border-radius:999px;font-weight:900;cursor:pointer}
    .back{width:38px;height:38px;background:rgba(255,255,255,.16);color:#fff;font-size:24px}
    .title{flex:1;min-width:0;display:grid;gap:2px}
    .title strong{font-size:16px}
    .title span{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .reset{padding:10px 13px;background:#ff3b30;color:#fff}
    .sessions{display:flex;gap:8px;overflow-x:auto;padding:8px;background:#075e54}
    .session{border:0;border-radius:999px;padding:9px 12px;background:rgba(255,255,255,.16);color:#fff;font-weight:900;white-space:nowrap}
    .session.active{background:#fff;color:#075e54}
    .controls{display:flex;gap:8px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line)}
    .control{flex:1;padding:11px 10px;background:#fff;color:var(--text);border:1px solid var(--line)}
    .control.on{background:var(--green2);color:#fff}
    .control.danger.on{background:var(--danger);color:#fff}
    .messages{min-height:0;overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:8px}
    .empty{margin:20px auto;max-width:330px;text-align:center;background:rgba(255,255,255,.78);padding:18px;border-radius:22px;color:var(--muted);line-height:1.45}
    .bubble{max-width:84%;padding:9px 10px 7px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.3}
    .bubble.owner{align-self:flex-end;background:var(--owner);border-top-right-radius:4px}
    .bubble.visitor{align-self:flex-start;background:var(--user);border-top-left-radius:4px}
    .time{display:block;margin-top:4px;font-size:10px;color:var(--muted);text-align:right}
    footer{display:flex;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
    textarea{flex:1;min-height:42px;max-height:110px;resize:none;border:0;outline:0;border-radius:22px;padding:10px 13px;font:500 16px/22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;background:#fff}
    .send{width:46px;height:46px;background:var(--green2);color:#fff;font-size:20px}
    .toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%) translateY(10px);opacity:0;transition:.18s;background:rgba(17,27,33,.94);color:#fff;border-radius:999px;padding:11px 15px;font-size:13px;font-weight:800;z-index:50;max-width:88vw;text-align:center;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%)}
    button:disabled{opacity:.55;cursor:not-allowed}
  </style>
</head>
<body>
<main class="app">
  <header>
    <button class="back" id="backBtn" type="button" title="Spegni chat e torna alla WebApp">‹</button>
    <div class="title">
      <strong>FollowMe Chat V2</strong>
      <span id="subtitle">Caricamento sessioni...</span>
    </div>
    <button class="reset" id="resetBtn" type="button">Reset</button>
  </header>

  <nav class="sessions" id="sessions"></nav>

  <section class="controls">
    <button class="control" id="extraBtn" type="button" disabled>Extra OFF</button>
    <button class="control danger" id="blockBtn" type="button" disabled>Blocca</button>
  </section>

  <section class="messages" id="messages">
    <div class="empty">In attesa di utenti collegati dal QR.</div>
  </section>

  <footer>
    <textarea id="textInput" rows="1" placeholder="Scrivi un messaggio..." disabled></textarea>
    <button class="send" id="sendBtn" type="button" disabled>➤</button>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const pathMatch = location.pathname.match(/\/fm\/chat-v2\/admin\/([^\/?#]+)/i);
  const CODE = pathMatch ? decodeURIComponent(pathMatch[1]).trim() : "FM-DEMO";

  let sessions = [];
  let selectedId = "";
  let lastMessageId = 0;
  let knownMessages = new Set();
  let sending = false;

  const els = {
    subtitle: document.getElementById("subtitle"),
    sessions: document.getElementById("sessions"),
    messages: document.getElementById("messages"),
    input: document.getElementById("textInput"),
    send: document.getElementById("sendBtn"),
    reset: document.getElementById("resetBtn"),
    back: document.getElementById("backBtn"),
    extra: document.getElementById("extraBtn"),
    block: document.getElementById("blockBtn"),
    toast: document.getElementById("toast")
  };

  function toast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(els.toast._t);
    els.toast._t = setTimeout(()=>els.toast.classList.remove("show"), 2300);
  }

  function esc(s){
    return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function timeOf(v){
    try { return new Date(v).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
    catch(e){ return ""; }
  }

  async function api(url, opts){
    const res = await fetch(url, Object.assign({cache:"no-store"}, opts || {}));
    const data = await res.json().catch(()=>null);
    if(!res.ok || !data || data.success === false){
      throw new Error((data && (data.error || data.detail)) || ("HTTP " + res.status));
    }
    return data;
  }

  function post(url, body){
    return api(url, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify(body || {})
    });
  }

  function currentSession(){
    return sessions.find(s => String(s.id) === String(selectedId)) || null;
  }

  function labelFor(s, idx){
    const n = Number(s.display_index || idx + 1);
    return "U" + n;
  }

  function renderSessions(){
    els.sessions.innerHTML = "";

    if(!sessions.length){
      selectedId = "";
      els.subtitle.textContent = "In attesa di utenti...";
      els.input.disabled = true;
      els.send.disabled = true;
      els.extra.disabled = true;
      els.block.disabled = true;
      els.messages.innerHTML = '<div class="empty">In attesa di utenti collegati dal QR.</div>';
      return;
    }

    sessions.forEach((s, idx)=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "session" + (String(s.id) === String(selectedId) ? " active" : "");
      b.textContent = labelFor(s, idx) + " · " + (s.display_name || s.visitor_label || "Utente");
      b.onclick = () => selectSession(s.id);
      els.sessions.appendChild(b);
    });

    const s = currentSession();
    if(s){
      els.subtitle.textContent = (s.display_name || s.visitor_label || "Utente collegato") + " · " + (s.uploads_enabled ? "Extra ON" : "Extra OFF");
      els.input.disabled = false;
      els.send.disabled = false;
      els.extra.disabled = false;
      els.block.disabled = false;
      els.extra.textContent = s.uploads_enabled ? "Extra ON" : "Extra OFF";
      els.extra.className = "control" + (s.uploads_enabled ? " on" : "");
      els.block.textContent = s.is_blocked ? "Sblocca" : "Blocca";
      els.block.className = "control danger" + (s.is_blocked ? " on" : "");
    }
  }

  function clearMessages(text){
    knownMessages.clear();
    lastMessageId = 0;
    els.messages.innerHTML = '<div class="empty">' + esc(text || "Conversazione aperta.") + '</div>';
  }

  function appendMessage(m){
    if(!m || !m.id) return;
    const id = String(m.id);
    if(knownMessages.has(id)) return;
    knownMessages.add(id);

    if(els.messages.querySelector(".empty")) els.messages.innerHTML = "";

    const div = document.createElement("div");
    div.className = "bubble " + (m.sender === "owner" ? "owner" : "visitor");
    div.innerHTML = esc(m.message).replace(/\n/g,"<br>") + '<span class="time">' + esc(timeOf(m.created_at)) + '</span>';
    els.messages.appendChild(div);
    els.messages.scrollTop = els.messages.scrollHeight;
    lastMessageId = Math.max(lastMessageId, Number(m.id) || 0);
  }

  async function loadSessions(){
    try{
      const data = await api("/api/followme/" + encodeURIComponent(CODE) + "/chat-v2/sessions?v=" + Date.now());
      sessions = Array.isArray(data.sessions) ? data.sessions : [];

      if(!selectedId && sessions.length){
        selectedId = String(sessions[0].id);
        clearMessages("Conversazione aperta. Scrivi il primo messaggio.");
        await loadMessages(true);
      }

      if(selectedId && !sessions.some(s => String(s.id) === String(selectedId))){
        selectedId = sessions[0] ? String(sessions[0].id) : "";
        clearMessages(selectedId ? "Conversazione aperta." : "In attesa di utenti collegati dal QR.");
        if(selectedId) await loadMessages(true);
      }

      renderSessions();
    }catch(err){
      els.subtitle.textContent = "Errore sessioni";
      toast("Errore sessioni: " + err.message);
    }
  }

  async function selectSession(id){
    selectedId = String(id || "");
    clearMessages("Caricamento conversazione...");
    renderSessions();
    await loadMessages(true);
  }

  async function loadMessages(initial){
    if(!selectedId) return;

    try{
      const after = initial ? 0 : lastMessageId;
      const data = await api("/api/followme/chat-v2/session/" + encodeURIComponent(selectedId) + "/messages?after=" + after + "&v=" + Date.now());
      const rows = Array.isArray(data.messages) ? data.messages : [];

      if(initial){
        knownMessages.clear();
        lastMessageId = 0;
        els.messages.innerHTML = rows.length ? "" : '<div class="empty">Conversazione aperta. Scrivi il primo messaggio.</div>';
      }

      rows.forEach(appendMessage);
    }catch(err){
      toast("Errore messaggi: " + err.message);
    }
  }

  async function send(){
    if(sending || !selectedId) return;

    const text = els.input.value.trim();
    if(!text) return;

    sending = true;
    els.input.value = "";

    try{
      const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(selectedId) + "/message", {
        sender:"owner",
        message:text
      });
      if(data.message) appendMessage(data.message);
    }catch(err){
      els.input.value = text;
      toast("Errore invio: " + err.message);
    }finally{
      sending = false;
      els.input.focus();
    }
  }

  async function toggleExtra(){
    const s = currentSession();
    if(!s) return;

    try{
      const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(s.id) + "/settings", {
        uploads_enabled: !s.uploads_enabled
      });
      Object.assign(s, data.session || {});
      renderSessions();
      toast(s.uploads_enabled ? "Extra attivati" : "Extra disattivati");
    }catch(err){
      toast("Errore Extra: " + err.message);
    }
  }

  async function toggleBlock(){
    const s = currentSession();
    if(!s) return;

    try{
      const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(s.id) + "/settings", {
        is_blocked: !s.is_blocked
      });
      Object.assign(s, data.session || {});
      renderSessions();
      toast(s.is_blocked ? "Utente bloccato" : "Utente sbloccato");
    }catch(err){
      toast("Errore blocco: " + err.message);
    }
  }

  async function resetAll(){
    if(!confirm("Vuoi spegnere la chat e tornare alla WebApp?")) return;

    els.reset.disabled = true;
    els.back.disabled = true;
    els.reset.textContent = "Reset...";

    try{
      await post("/api/followme/" + encodeURIComponent(CODE) + "/chat-v2/reset?v=" + Date.now(), {});
      location.replace("/fm/app/" + encodeURIComponent(CODE) + "?v=chat-off-" + Date.now());
    }catch(err){
      els.reset.disabled = false;
      els.back.disabled = false;
      els.reset.textContent = "Reset";
      toast("Reset non riuscito: " + err.message);
    }
  }

  function bind(){
    els.send.onclick = send;
    els.reset.onclick = resetAll;
    els.back.onclick = resetAll;
    els.extra.onclick = toggleExtra;
    els.block.onclick = toggleBlock;

    els.input.addEventListener("keydown", ev=>{
      if(ev.key === "Enter" && !ev.shiftKey){
        ev.preventDefault();
        send();
      }
    });
  }

  bind();
  loadSessions();

  setInterval(()=>{
    if(document.visibilityState === "visible"){
      loadSessions();
      if(selectedId) loadMessages(false);
    }
  }, 900);

  window.addEventListener("focus", loadSessions);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") loadSessions();
  });

})();
</script>
</body>
</html>
