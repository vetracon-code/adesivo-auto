<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FollowMe Chat V2 Admin</title>
  <style>
    :root{
      --green:#008069;
      --green2:#00a884;
      --darkgreen:#075e54;
      --bg:#efeae2;
      --panel:#f0f2f5;
      --text:#111b21;
      --muted:#667781;
      --line:rgba(0,0,0,.08);
      --danger:#ff3b30;
      --owner:#d9fdd3;
      --user:#fff;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);background:var(--bg);overflow:hidden;
    }
    .app{
      height:100dvh;
      display:grid;
      grid-template-rows:auto auto auto 1fr auto;
      background:var(--bg);
    }
    header{
      background:var(--green);
      color:#fff;
      padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .back,.reset,.control,.send,.plus{
      border:0;
      font-weight:900;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .back{
      width:38px;height:38px;border-radius:999px;
      background:rgba(255,255,255,.18);color:#fff;font-size:24px;
      display:grid;place-items:center;
    }
    .title{flex:1;min-width:0;display:grid;gap:2px}
    .title strong{font-size:16px;line-height:1.1}
    .title span{font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .reset{
      padding:10px 14px;border-radius:999px;
      background:var(--danger);color:#fff;font-size:13px;
    }
    .sessions{
      display:flex;gap:8px;overflow-x:auto;
      padding:8px 10px;
      background:var(--darkgreen);
      scrollbar-width:none;
    }
    .sessions::-webkit-scrollbar{display:none}
    .session{
      border:0;border-radius:999px;
      padding:9px 13px;
      background:rgba(255,255,255,.17);
      color:#fff;font-weight:900;white-space:nowrap;
      font-size:13px;
    }
    .session.active{background:#fff;color:#075e54}
    .controls{
      display:flex;
      gap:8px;
      padding:7px 10px;
      background:#e9eef2;
      border-bottom:1px solid var(--line);
      min-height:52px;
      align-items:center;
    }
    .control{
      flex:1;
      height:38px;
      border-radius:14px;
      background:#fff;
      color:#182229;
      border:1px solid var(--line);
      font-size:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 1px 2px rgba(0,0,0,.05);
    }
    .control.on{background:var(--green2);color:#fff}
    .control.danger.on{background:var(--danger);color:#fff}
    .messages{
      min-height:0;
      overflow:auto;
      padding:14px 10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .empty{
      margin:20px auto;
      max-width:330px;
      text-align:center;
      background:rgba(255,255,255,.78);
      padding:18px;
      border-radius:22px;
      color:var(--muted);
      line-height:1.45;
    }
    .bubble{
      max-width:84%;
      padding:9px 10px 7px;
      border-radius:12px;
      box-shadow:0 1px 1px rgba(0,0,0,.08);
      white-space:pre-wrap;
      word-break:break-word;
      font-size:15px;
      line-height:1.3;
    }
    .bubble.owner{align-self:flex-end;background:var(--owner);border-top-right-radius:4px}
    .bubble.visitor{align-self:flex-start;background:var(--user);border-top-left-radius:4px}
    .time{display:block;margin-top:4px;font-size:10px;color:var(--muted);text-align:right}
    footer{
      position:relative;
      display:flex;
      gap:8px;
      align-items:flex-end;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      background:var(--panel);
      border-top:1px solid var(--line);
    }
    .plus{
      width:44px;height:44px;flex:0 0 auto;border-radius:999px;
      background:#fff;color:#54656f;font-size:30px;line-height:1;
      display:grid;place-items:center;
      box-shadow:0 1px 2px rgba(0,0,0,.07);
    }
    textarea{
      flex:1;
      min-height:44px;
      max-height:110px;
      resize:none;
      border:0;
      outline:0;
      border-radius:22px;
      padding:11px 14px;
      font:500 16px/22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
      background:#fff;
    }
    .send{
      width:46px;height:46px;flex:0 0 auto;border-radius:999px;
      background:var(--green2);color:#fff;font-size:20px;
      display:grid;place-items:center;
    }
    .extra-menu{
      position:fixed;
      left:10px;
      right:10px;
      bottom:calc(68px + env(safe-area-inset-bottom));
      z-index:40;
      background:#fff;
      border-radius:24px;
      padding:12px;
      box-shadow:0 18px 55px rgba(0,0,0,.25);
      display:none;
    }
    .extra-menu.open{display:block}
    .extra-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    .extra-grid button{
      border:0;
      background:#f5f7f8;
      border-radius:18px;
      padding:12px 6px;
      display:grid;
      gap:6px;
      place-items:center;
      font-weight:900;
      color:#1f2c33;
      min-height:78px;
    }
    .ico{
      width:38px;height:38px;border-radius:14px;
      display:grid;place-items:center;
      color:#fff;
      font-size:20px;
    }
    .ico.photo{background:linear-gradient(135deg,#007aff,#5ac8fa)}
    .ico.file{background:linear-gradient(135deg,#5856d6,#af52de)}
    .ico.voice{background:linear-gradient(135deg,#ff9500,#ffcc00)}
    .ico.loc{background:linear-gradient(135deg,#34c759,#00a884)}
    .lbl{font-size:11px}
    .toast{
      position:fixed;left:50%;bottom:80px;
      transform:translateX(-50%) translateY(10px);
      opacity:0;transition:.18s;
      background:rgba(17,27,33,.94);color:#fff;
      border-radius:999px;padding:11px 15px;
      font-size:13px;font-weight:800;z-index:80;
      max-width:88vw;text-align:center;pointer-events:none;
    }
    .toast.show{opacity:1;transform:translateX(-50%)}
    .voice-sheet{
      position:fixed;
      left:10px;right:10px;
      bottom:calc(68px + env(safe-area-inset-bottom));
      z-index:70;
      background:#fff;
      border-radius:24px;
      padding:18px;
      box-shadow:0 18px 55px rgba(0,0,0,.25);
      display:none;
      text-align:center;
    }
    .voice-sheet.open{display:block}
    .voice-title{font-weight:1000;font-size:18px}
    .voice-sub{color:var(--muted);font-size:13px;margin-top:4px}
    .voice-time{font-size:34px;font-weight:1000;margin:18px 0;color:#111b21}
    .voice-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .voice-actions button{
      border:0;border-radius:16px;padding:13px 8px;font-weight:1000;
    }
    .voice-cancel{background:#eef1f3;color:#111b21}
    .voice-start{background:var(--danger);color:#fff}
    .voice-send{background:var(--green2);color:#fff}
    .attachment-card{display:grid;gap:6px}
    .attachment-card img{max-width:230px;width:100%;border-radius:12px;display:block}
    .attachment-file{
      display:flex;align-items:center;gap:8px;
      padding:9px 10px;border-radius:12px;
      background:rgba(255,255,255,.6);
      color:#111b21;text-decoration:none;font-weight:850;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .voice-card{display:grid;gap:7px;min-width:210px}
    .voice-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;background:rgba(255,255,255,.6)}
    .voice-row audio{width:190px;max-width:100%;height:34px}
    .map-card{display:grid;gap:7px}
    .map-card iframe{width:250px;max-width:100%;height:150px;border:0;border-radius:14px;background:#ddd}
    button:disabled{opacity:.55;cursor:not-allowed}
  </style>
</head>
<body>
<main class="app">
  <header>
    <button class="back" id="backBtn" type="button" title="Spegni chat e torna alla WebApp">‹</button>
    <div class="title">
      <strong>FollowMe Chat V2</strong>
      <span id="subtitle">Caricamento sessioni...</span>
    </div>
    <button class="reset" id="resetBtn" type="button">Reset</button>
  </header>

  <nav class="sessions" id="sessions"></nav>

  <section class="controls">
    <button class="control" id="extraBtn" type="button" disabled>Extra OFF</button>
    <button class="control danger" id="blockBtn" type="button" disabled>Blocca</button>
  </section>

  <section class="messages" id="messages">
    <div class="empty">In attesa di utenti collegati dal QR.</div>
  </section>

  <footer>
    <button class="plus" id="plusBtn" type="button" aria-label="Allega">+</button>
    <textarea id="textInput" rows="1" placeholder="Scrivi un messaggio..." disabled></textarea>
    <button class="send" id="sendBtn" type="button" disabled>➤</button>
  </footer>
</main>

<div class="extra-menu" id="extraMenu" aria-hidden="true">
  <div class="extra-grid">
    <button type="button" id="photoBtn"><span class="ico photo">🖼️</span><span class="lbl">Foto</span></button>
    <button type="button" id="fileBtn"><span class="ico file">📄</span><span class="lbl">File</span></button>
    <button type="button" id="voiceBtn"><span class="ico voice">🎙️</span><span class="lbl">Vocale</span></button>
    <button type="button" id="locationBtn"><span class="ico loc">📍</span><span class="lbl">Posizione</span></button>
  </div>
</div>

<div class="voice-sheet" id="voiceSheet" aria-hidden="true">
  <div class="voice-title">Messaggio vocale</div>
  <div class="voice-sub">Massimo 20 secondi</div>
  <div class="voice-time" id="voiceTimer">00:00</div>
  <div class="voice-actions">
    <button class="voice-cancel" id="voiceCancel" type="button">Annulla</button>
    <button class="voice-start" id="voiceStart" type="button">Registra</button>
    <button class="voice-send" id="voiceSend" type="button" disabled>Invia</button>
  </div>
</div>

<input id="photoInput" type="file" accept="image/*,video/*" style="display:none">
<input id="fileInput" type="file" accept=".pdf,image/*,video/*,application/pdf,text/plain" style="display:none">

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const pathMatch = location.pathname.match(/\/fm\/chat-v2\/admin\/([^\/?#]+)/i);
  const CODE = pathMatch ? decodeURIComponent(pathMatch[1]).trim() : "FM-DEMO";

  let sessions = [];
  let selectedId = "";
  let lastMessageId = 0;
  let knownMessages = new Set();
  let sending = false;

  let mediaRecorder = null;
  let voiceChunks = [];
  let voiceBlob = null;
  let voiceStartedAt = 0;
  let voiceTick = null;
  let voiceStopTimer = null;

  const els = {
    subtitle: document.getElementById("subtitle"),
    sessions: document.getElementById("sessions"),
    messages: document.getElementById("messages"),
    input: document.getElementById("textInput"),
    send: document.getElementById("sendBtn"),
    reset: document.getElementById("resetBtn"),
    back: document.getElementById("backBtn"),
    extra: document.getElementById("extraBtn"),
    block: document.getElementById("blockBtn"),
    plus: document.getElementById("plusBtn"),
    extraMenu: document.getElementById("extraMenu"),
    photoBtn: document.getElementById("photoBtn"),
    fileBtn: document.getElementById("fileBtn"),
    voiceBtn: document.getElementById("voiceBtn"),
    locationBtn: document.getElementById("locationBtn"),
    photoInput: document.getElementById("photoInput"),
    fileInput: document.getElementById("fileInput"),
    voiceSheet: document.getElementById("voiceSheet"),
    voiceTimer: document.getElementById("voiceTimer"),
    voiceCancel: document.getElementById("voiceCancel"),
    voiceStart: document.getElementById("voiceStart"),
    voiceSend: document.getElementById("voiceSend"),
    toast: document.getElementById("toast")
  };

  function toast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(els.toast._t);
    els.toast._t = setTimeout(()=>els.toast.classList.remove("show"), 2300);
  }

  function esc(s){
    return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function timeOf(v){
    try { return new Date(v).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
    catch(e){ return ""; }
  }

  async function api(url, opts){
    const res = await fetch(url, Object.assign({cache:"no-store"}, opts || {}));
    const data = await res.json().catch(()=>null);
    if(!res.ok || !data || data.success === false){
      throw new Error((data && (data.error || data.detail)) || ("HTTP " + res.status));
    }
    return data;
  }

  function post(url, body){
    return api(url, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify(body || {})
    });
  }

  // FOLLOWME_CHAT_V2_ADMIN_SELF_HEAL_READY_20260528
  function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function ensureChatV2Ready(){
    /*
      La pagina admin deve essere autonoma:
      se viene aperta subito dopo un reset o prima che la WebApp finisca l'attivazione,
      attiva direttamente Chat V2 e aspetta ready:true.
    */
    try{
      els.subtitle.textContent = "Verifico chat...";

      let ready = null;

      try{
        ready = await api("/api/followme/" + encodeURIComponent(CODE) + "/chat-v2/ready?v=" + Date.now());
      }catch(e){
        ready = null;
      }

      if(ready && ready.ready === true){
        els.subtitle.textContent = "Chat attiva";
        return true;
      }

      els.subtitle.textContent = "Attivo chat...";
      await post("/api/followme/" + encodeURIComponent(CODE) + "/chat-v2/enable?v=" + Date.now(), {});

      for(let i = 0; i < 14; i++){
        try{
          ready = await api("/api/followme/" + encodeURIComponent(CODE) + "/chat-v2/ready?v=" + Date.now());
          if(ready && ready.ready === true){
            els.subtitle.textContent = "Chat attiva";
            return true;
          }
        }catch(e){}

        els.subtitle.textContent = "Attendo chat pronta... " + (i + 1);
        await sleep(450);
      }

      els.subtitle.textContent = "Chat non pronta";
      toast("Chat non pronta. Riprovo tra pochi secondi.");
      return false;
    }catch(err){
      els.subtitle.textContent = "Errore attivazione";
      toast("Errore attivazione chat: " + (err.message || String(err)));
      return false;
    }
  }


  function currentSession(){
    return sessions.find(s => String(s.id) === String(selectedId)) || null;
  }

  function labelFor(s, idx){
    const n = Number(s.display_index || idx + 1);
    return "U" + n;
  }

  function renderSessions(){
    els.sessions.innerHTML = "";

    if(!sessions.length){
      selectedId = "";
      els.subtitle.textContent = "In attesa di utenti...";
      els.input.disabled = true;
      els.send.disabled = true;
      els.extra.disabled = true;
      els.block.disabled = true;
      els.messages.innerHTML = '<div class="empty">In attesa di utenti collegati dal QR.</div>';
      return;
    }

    sessions.forEach((s, idx)=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "session" + (String(s.id) === String(selectedId) ? " active" : "");
      b.textContent = labelFor(s, idx) + " · " + (s.display_name || s.visitor_label || "Utente");
      b.onclick = () => selectSession(s.id);
      els.sessions.appendChild(b);
    });

    const s = currentSession();
    if(s){
      els.subtitle.textContent = (s.display_name || s.visitor_label || "Utente collegato") + " · " + (s.uploads_enabled ? "Extra ON" : "Extra OFF");
      els.input.disabled = false;
      els.send.disabled = false;
      els.extra.disabled = false;
      els.block.disabled = false;
      els.extra.textContent = s.uploads_enabled ? "Extra ON" : "Extra OFF";
      els.extra.className = "control" + (s.uploads_enabled ? " on" : "");
      els.block.textContent = s.is_blocked ? "Riattiva servizio" : "Sospendi servizio";
      els.block.className = "control danger" + (s.is_blocked ? " on" : "");
    }
  }

  function clearMessages(text){
    knownMessages.clear();
    lastMessageId = 0;
    els.messages.innerHTML = '<div class="empty">' + esc(text || "Conversazione aperta.") + '</div>';
  }

  function parseAttachment(raw){
    try{
      const obj = JSON.parse(String(raw || ""));
      if(obj && obj.__followme_attachment_v2) return obj;
    }catch(e){}
    return null;
  }

  function mapUrl(att){
    const lat = Number(att.latitude || att.lat || 0);
    const lng = Number(att.longitude || att.lng || 0);
    if(lat && lng){
      return "https://maps.google.com/?q=" + encodeURIComponent(lat + "," + lng);
    }
    return String(att.url || "https://maps.google.com");
  }

  function mapEmbed(att){
    const lat = Number(att.latitude || att.lat || 0);
    const lng = Number(att.longitude || att.lng || 0);
    if(!lat || !lng) return "";
    return "https://maps.google.com/maps?q=" + encodeURIComponent(lat + "," + lng) + "&z=16&output=embed";
  }

  function renderAttachment(att, createdAt){
    const url = esc(att.url || "#");
    const label = esc(att.label || att.filename || "Allegato");
    const mime = String(att.mime || "");
    const kind = String(att.kind || "");

    if(kind === "location"){
      const open = esc(mapUrl(att));
      const embed = esc(mapEmbed(att));
      return '<div class="map-card">' +
        (embed ? '<a href="' + open + '" target="_blank" rel="noopener"><iframe src="' + embed + '" loading="lazy"></iframe></a>' : '') +
        '<a class="attachment-file" href="' + open + '" target="_blank" rel="noopener">📍 <span>Apri posizione</span></a>' +
        '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
      '</div>';
    }

    if(kind === "voice" || mime.startsWith("audio/")){
      return '<div class="voice-card">' +
        '<div class="voice-row">🎙️ <audio controls preload="metadata" src="' + url + '"></audio></div>' +
        '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
      '</div>';
    }

    if(mime.startsWith("image/")){
      return '<div class="attachment-card">' +
        '<a href="' + url + '" target="_blank" rel="noopener"><img src="' + url + '" alt="' + label + '"></a>' +
        '<a class="attachment-file" href="' + url + '" target="_blank" rel="noopener">📎 <span>' + label + '</span></a>' +
        '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
      '</div>';
    }

    return '<div class="attachment-card">' +
      '<a class="attachment-file" href="' + url + '" target="_blank" rel="noopener">📎 <span>' + label + '</span></a>' +
      '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
    '</div>';
  }

  function appendMessage(m){
    if(!m || !m.id) return;
    const id = String(m.id);
    if(knownMessages.has(id)) return;
    knownMessages.add(id);

    if(els.messages.querySelector(".empty")) els.messages.innerHTML = "";

    const div = document.createElement("div");
    div.className = "bubble " + (m.sender === "owner" ? "owner" : "visitor");

    const att = parseAttachment(m.message);
    div.innerHTML = att
      ? renderAttachment(att, m.created_at)
      : esc(m.message).replace(/\n/g,"<br>") + '<span class="time">' + esc(timeOf(m.created_at)) + '</span>';

    els.messages.appendChild(div);
    els.messages.scrollTop = els.messages.scrollHeight;
    lastMessageId = Math.max(lastMessageId, Number(m.id) || 0);
  }

  async function loadSessions(){
    try{
      const data = await api("/api/followme/" + encodeURIComponent(CODE) + "/chat-v2/sessions?v=" + Date.now());
      sessions = Array.isArray(data.sessions) ? data.sessions : [];

      if(!selectedId && sessions.length){
        selectedId = String(sessions[0].id);
        clearMessages("Conversazione aperta. Scrivi il primo messaggio.");
        await loadMessages(true);
      }

      if(selectedId && !sessions.some(s => String(s.id) === String(selectedId))){
        selectedId = sessions[0] ? String(sessions[0].id) : "";
        clearMessages(selectedId ? "Conversazione aperta." : "In attesa di utenti collegati dal QR.");
        if(selectedId) await loadMessages(true);
      }

      renderSessions();
    }catch(err){
      els.subtitle.textContent = "Errore sessioni";
      toast("Errore sessioni: " + err.message);
    }
  }

  async function selectSession(id){
    selectedId = String(id || "");
    clearMessages("Caricamento conversazione...");
    renderSessions();
    await loadMessages(true);
  }

  async function loadMessages(initial){
    if(!selectedId) return;
    try{
      const after = initial ? 0 : lastMessageId;
      const data = await api("/api/followme/chat-v2/session/" + encodeURIComponent(selectedId) + "/messages?after=" + after + "&v=" + Date.now());
      const rows = Array.isArray(data.messages) ? data.messages : [];

      if(initial){
        knownMessages.clear();
        lastMessageId = 0;
        els.messages.innerHTML = rows.length ? "" : '<div class="empty">Conversazione aperta. Scrivi il primo messaggio.</div>';
      }

      rows.forEach(appendMessage);
    }catch(err){
      toast("Errore messaggi: " + err.message);
    }
  }

  async function send(){
    if(sending || !selectedId) return;
    const text = els.input.value.trim();
    if(!text) return;

    sending = true;
    els.input.value = "";

    try{
      const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(selectedId) + "/message", {
        sender:"owner",
        message:text
      });
      if(data.message) appendMessage(data.message);
    }catch(err){
      els.input.value = text;
      toast("Errore invio: " + err.message);
    }finally{
      sending = false;
      els.input.focus();
    }
  }

  async function toggleExtra(){
    const s = currentSession();
    if(!s) return;

    try{
      const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(s.id) + "/settings", {
        uploads_enabled: !s.uploads_enabled
      });
      Object.assign(s, data.session || {});
      renderSessions();
      toast(s.uploads_enabled ? "Extra utente attivati" : "Extra utente disattivati");
    }catch(err){
      toast("Errore Extra: " + err.message);
    }
  }

  async function toggleBlock(){
    const s = currentSession();
    if(!s) return;

    try{
      const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(s.id) + "/settings", {
        is_blocked: !s.is_blocked
      });
      Object.assign(s, data.session || {});
      renderSessions();
      toast(s.is_blocked ? "Servizio momentaneamente non disponibile per l’utente." : "Servizio nuovamente funzionante per l’utente.");
    }catch(err){
      toast("Errore blocco: " + err.message);
    }
  }

  async function resetAll(){
    if(!confirm("Vuoi spegnere la chat e tornare alla WebApp?")) return;

    els.reset.disabled = true;
    els.back.disabled = true;
    els.reset.textContent = "Reset...";

    try{
      await post("/api/followme/" + encodeURIComponent(CODE) + "/chat-v2/reset?v=" + Date.now(), {});
      location.replace("/fm/app/" + encodeURIComponent(CODE) + "?v=chat-off-" + Date.now());
    }catch(err){
      els.reset.disabled = false;
      els.back.disabled = false;
      els.reset.textContent = "Reset";
      toast("Reset non riuscito: " + err.message);
    }
  }

  function toggleExtraMenu(){
    if(!selectedId){
      toast("Nessun utente selezionato.");
      return;
    }
    const open = !els.extraMenu.classList.contains("open");
    els.extraMenu.classList.toggle("open", open);
    els.extraMenu.setAttribute("aria-hidden", open ? "false" : "true");
  }

  function closeExtraMenu(){
    els.extraMenu.classList.remove("open");
    els.extraMenu.setAttribute("aria-hidden", "true");
  }

  async function uploadRaw(file, kind){
    if(!selectedId || !file){
      toast("Nessun file selezionato.");
      return;
    }

    const max = 20 * 1024 * 1024;
    if(file.size > max){
      toast("File troppo grande. Limite 20 MB.");
      return;
    }

    const qs = new URLSearchParams({
      sender:"owner",
      kind:kind || "file",
      filename:file.name || "allegato",
      label:file.name || "Allegato",
      mime:file.type || "application/octet-stream"
    });

    try{
      closeExtraMenu();
      toast("Invio allegato...");

      const res = await fetch("/api/followme/chat-v2/session/" + encodeURIComponent(selectedId) + "/attachment-raw?" + qs.toString(), {
        method:"POST",
        headers:{
          "Content-Type":file.type || "application/octet-stream",
          "X-FollowMe-Sender":"owner",
          "X-FollowMe-Kind":kind || "file",
          "X-FollowMe-Filename":file.name || "allegato"
        },
        cache:"no-store",
        body:file
      });

      const data = await res.json().catch(()=>null);
      if(!res.ok || !data || !data.success){
        throw new Error((data && (data.error || data.detail)) || ("HTTP " + res.status));
      }

      if(data.message) appendMessage(data.message);
      toast("Allegato inviato");
    }catch(err){
      toast("Errore allegato: " + err.message);
    }
  }

  function preferredMime(){
    const opts = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"];
    for(const m of opts){
      try{
        if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
      }catch(e){}
    }
    return "";
  }

  function openVoice(){
    closeExtraMenu();
    voiceBlob = null;
    voiceChunks = [];
    els.voiceSend.disabled = true;
    els.voiceStart.textContent = "Registra";
    els.voiceTimer.textContent = "00:00";
    els.voiceSheet.classList.add("open");
    els.voiceSheet.setAttribute("aria-hidden","false");
  }

  function closeVoice(){
    try{
      if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    }catch(e){}
    clearInterval(voiceTick);
    clearTimeout(voiceStopTimer);
    els.voiceSheet.classList.remove("open");
    els.voiceSheet.setAttribute("aria-hidden","true");
  }

  function updateVoiceTimer(){
    const elapsed = Math.min(20, Math.floor((Date.now() - voiceStartedAt) / 1000));
    els.voiceTimer.textContent = "00:" + String(elapsed).padStart(2,"0");
  }

  async function startVoice(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Microfono non supportato.");
      return;
    }

    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const mime = preferredMime();
      voiceChunks = [];
      voiceBlob = null;

      const opts = mime ? { mimeType:mime, audioBitsPerSecond:64000 } : { audioBitsPerSecond:64000 };
      mediaRecorder = new MediaRecorder(stream, opts);

      mediaRecorder.ondataavailable = ev => {
        if(ev.data && ev.data.size) voiceChunks.push(ev.data);
      };

      mediaRecorder.onstop = () => {
        try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
        const realMime = mediaRecorder.mimeType || mime || "audio/webm";
        voiceBlob = new Blob(voiceChunks, { type:realMime });
        els.voiceSend.disabled = !voiceBlob || !voiceBlob.size;
        els.voiceStart.textContent = "Rifai";
        clearInterval(voiceTick);
        clearTimeout(voiceStopTimer);
      };

      voiceStartedAt = Date.now();
      mediaRecorder.start(250);
      updateVoiceTimer();
      voiceTick = setInterval(updateVoiceTimer, 250);
      els.voiceStart.textContent = "Stop";

      voiceStopTimer = setTimeout(()=>{
        try{
          if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
        }catch(e){}
      }, 20000);
    }catch(err){
      toast("Microfono non disponibile: " + (err.message || String(err)));
    }
  }

  function stopOrStartVoice(){
    if(mediaRecorder && mediaRecorder.state === "recording"){
      try{ mediaRecorder.stop(); }catch(e){}
      return;
    }
    startVoice();
  }

  async function sendVoice(){
    if(!voiceBlob || !voiceBlob.size){
      toast("Nessun vocale registrato.");
      return;
    }

    const ext = String(voiceBlob.type || "").includes("mp4") ? ".m4a" : ".webm";
    const file = new File([voiceBlob], "vocale" + ext, { type:voiceBlob.type || "audio/webm" });
    await uploadRaw(file, "voice");
    closeVoice();
  }

  async function sendLocation(){
    if(!selectedId){
      toast("Nessun utente selezionato.");
      return;
    }

    if(!navigator.geolocation){
      toast("Posizione non supportata.");
      return;
    }

    closeExtraMenu();
    toast("Rilevo posizione...");

    navigator.geolocation.getCurrentPosition(async function(pos){
      try{
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy || 0);

        const payload = {
          __followme_attachment_v2:true,
          kind:"location",
          sender:"owner",
          url:"https://maps.google.com/?q=" + encodeURIComponent(lat + "," + lng),
          label:"Posizione condivisa",
          latitude:lat,
          longitude:lng,
          accuracy_m:acc,
          created_at:new Date().toISOString()
        };

        const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(selectedId) + "/message", {
          sender:"owner",
          message:JSON.stringify(payload)
        });

        if(data.message) appendMessage(data.message);
        toast("Posizione inviata");
      }catch(err){
        toast("Errore posizione: " + err.message);
      }
    }, function(err){
      toast("Posizione non disponibile: " + (err.message || "permesso negato"));
    }, {
      enableHighAccuracy:true,
      timeout:9000,
      maximumAge:0
    });
  }

  function bind(){
    els.send.onclick = send;
    els.reset.onclick = resetAll;
    els.back.onclick = resetAll;
    els.extra.onclick = toggleExtra;
    els.block.onclick = toggleBlock;
    els.plus.onclick = toggleExtraMenu;

    els.photoBtn.onclick = () => { closeExtraMenu(); els.photoInput.click(); };
    els.fileBtn.onclick = () => { closeExtraMenu(); els.fileInput.click(); };
    els.voiceBtn.onclick = openVoice;
    els.locationBtn.onclick = sendLocation;

    els.photoInput.onchange = () => {
      const f = els.photoInput.files && els.photoInput.files[0];
      els.photoInput.value = "";
      if(f) uploadRaw(f, "media");
    };

    els.fileInput.onchange = () => {
      const f = els.fileInput.files && els.fileInput.files[0];
      els.fileInput.value = "";
      if(f) uploadRaw(f, "file");
    };

    els.voiceCancel.onclick = closeVoice;
    els.voiceStart.onclick = stopOrStartVoice;
    els.voiceSend.onclick = sendVoice;

    els.input.addEventListener("keydown", ev=>{
      if(ev.key === "Enter" && !ev.shiftKey){
        ev.preventDefault();
        send();
      }
    });

    document.addEventListener("click", ev=>{
      if(!els.extraMenu.classList.contains("open")) return;
      if(ev.target === els.plus || els.extraMenu.contains(ev.target)) return;
      closeExtraMenu();
    }, true);
  }

  bind();

  (async function startAdminChatV2(){
    const ok = await ensureChatV2Ready();
    if(ok){
      await loadSessions();
    }

    setInterval(async ()=>{
      if(document.visibilityState === "visible"){
        /*
          Se dopo reset o rete lenta la chat torna non pronta,
          la pagina admin tenta di autoripristinarla senza richiedere chiusura/riapertura.
        */
        await ensureChatV2Ready();
        await loadSessions();
        if(selectedId) await loadMessages(false);
      }
    }, 1200);
  })();

  window.addEventListener("focus", loadSessions);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") loadSessions();
  });

})();
</script>

<script id="FOLLOWME_CHAT_V2_ADMIN_CLOSE_THANKS_RETURN_20260528">
(function(){
  "use strict";

  if(window.__followMeChatV2AdminCloseThanksReturn20260528) return;
  window.__followMeChatV2AdminCloseThanksReturn20260528 = true;

  function toast(msg){
    try{
      if(typeof window.toast === "function"){ window.toast(msg); return; }
    }catch(e){}
    alert(msg);
  }

  function currentSessionId(){
    try{
      if(window.currentSession && window.currentSession.id) return String(window.currentSession.id);
      if(window.activeSession && window.activeSession.id) return String(window.activeSession.id);
    }catch(e){}

    const p = new URLSearchParams(location.search || "");
    const fromUrl = p.get("session");
    if(fromUrl) return String(fromUrl);

    const active =
      document.querySelector("[data-session-id].active") ||
      document.querySelector(".active[data-id]") ||
      document.querySelector(".session.active");

    if(active){
      return String(
        active.getAttribute("data-session-id") ||
        active.getAttribute("data-id") ||
        ""
      );
    }

    return "";
  }

  async function closeWithThanks(ev){
    try{
      if(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      }
    }catch(e){}

    const sid = currentSessionId();

    if(!sid){
      toast("Seleziona prima una conversazione da chiudere.");
      return false;
    }

    const ok = confirm(
      "Vuoi chiudere questa chat?\n\n" +
      "All’utente verrà inviato un messaggio di ringraziamento e potrà tornare alla pagina di provenienza."
    );

    if(!ok) return false;

    try{
      const res = await fetch("/api/followme/chat-v2/session/" + encodeURIComponent(sid) + "/close-thanks?v=" + Date.now(), {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          message:"Grazie per averci contattato. La conversazione è stata chiusa. Puoi tornare a consultare la pagina."
        })
      });

      const data = await res.json().catch(function(){ return null; });

      if(!res.ok || !data || data.success === false){
        throw new Error((data && data.error) || "Errore chiusura chat.");
      }

      toast("Chat chiusa con messaggio di ringraziamento.");

      setTimeout(function(){
        location.href = location.pathname + "?v=" + Date.now();
      }, 650);

    }catch(err){
      toast(err.message || "Errore chiusura chat.");
    }

    return false;
  }

  function patchCloseButtons(){
    const buttons = Array.prototype.slice.call(document.querySelectorAll("button,a"));

    buttons.forEach(function(btn){
      if(btn.dataset.closeThanksBound20260528 === "1") return;

      const txt = String(btn.textContent || btn.innerText || "").trim().toLowerCase();
      const id = String(btn.id || "").toLowerCase();

      const looksClose =
        id.indexOf("close") >= 0 ||
        id.indexOf("chiudi") >= 0 ||
        txt === "chiudi" ||
        txt.indexOf("chiudi chat") >= 0 ||
        txt.indexOf("chiudi conversazione") >= 0;

      if(!looksClose) return;

      btn.dataset.closeThanksBound20260528 = "1";

      btn.addEventListener("click", closeWithThanks, true);
      btn.addEventListener("touchend", closeWithThanks, true);
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    patchCloseButtons();
    setTimeout(patchCloseButtons, 800);
    setTimeout(patchCloseButtons, 1800);
  });

  setInterval(patchCloseButtons, 2000);
})();
</script>



<script id="FOLLOWME_CHAT_V2_ADMIN_PREMIUM_TOOLS_FIX_20260529">
(function(){
  "use strict";

  if(window.__followMeChatV2AdminPremiumToolsFix20260529) return;
  window.__followMeChatV2AdminPremiumToolsFix20260529 = true;

  function $(id){ return document.getElementById(id); }

  function toast(msg){
    var t = $("toast");
    if(t){
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._premiumFixTimer);
      t._premiumFixTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
      return;
    }
    alert(msg);
  }

  function currentSessionId(){
    try{
      if(window.selectedId) return String(window.selectedId || "");
    }catch(e){}

    try{
      var active = document.querySelector(".session.active");
      if(active){
        return active.getAttribute("data-session-id") ||
               active.dataset.sessionId ||
               active.dataset.id ||
               "";
      }
    }catch(e){}

    try{
      var qs = new URLSearchParams(location.search || "");
      return qs.get("session") || qs.get("chatSession") || "";
    }catch(e){}

    return "";
  }

  function currentSessionObject(){
    var sid = currentSessionId();
    try{
      if(Array.isArray(window.sessions)){
        return window.sessions.find(function(x){ return String(x.id) === String(sid); }) || null;
      }
    }catch(e){}
    return null;
  }

  async function apiJson(url, options){
    var res = await fetch(url, options || {});
    var data = await res.json().catch(function(){ return null; });
    if(!res.ok || !data || data.success === false){
      throw new Error((data && data.error) || ("Errore HTTP " + res.status));
    }
    return data;
  }

  async function refreshNow(){
    try{
      if(typeof window.loadSessions === "function") await window.loadSessions();
    }catch(e){}

    try{
      if(typeof window.loadMessages === "function") await window.loadMessages();
    }catch(e){}

    try{
      if(typeof window.pollMessages === "function") await window.pollMessages();
    }catch(e){}
  }

  function updateLocalSession(patch){
    var sid = currentSessionId();
    try{
      if(Array.isArray(window.sessions)){
        var s = window.sessions.find(function(x){ return String(x.id) === String(sid); });
        if(s) Object.assign(s, patch || {});
      }
    }catch(e){}

    try{
      if(typeof window.renderSessions === "function") window.renderSessions();
    }catch(e){}
  }

  async function setSettings(patch){
    var sid = currentSessionId();
    if(!sid) throw new Error("Nessuna sessione selezionata.");

    var data = await apiJson("/api/followme/chat-v2/session/" + encodeURIComponent(sid) + "/settings?v=" + Date.now(), {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(patch || {})
    });

    if(data.session) updateLocalSession(data.session);
    await refreshNow();
    return data;
  }

  async function toggleExtra(ev){
    if(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();
    }

    try{
      var s = currentSessionObject();
      var next = !(s && s.uploads_enabled === true);

      var btn = $("extraBtn");
      if(btn) btn.disabled = true;

      await setSettings({ uploads_enabled:next });

      toast(next ? "Extra attivati per l’utente." : "Extra disattivati per l’utente.");
    }catch(err){
      toast("Errore Extra: " + (err.message || err));
    }finally{
      var b = $("extraBtn");
      if(b) b.disabled = false;
    }

    return false;
  }

  async function toggleBlock(ev){
    if(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();
    }

    try{
      var s = currentSessionObject();
      var next = !(s && s.is_blocked === true);

      var btn = $("blockBtn");
      if(btn) btn.disabled = true;

      await setSettings({
        is_blocked:next,
        uploads_enabled: next ? false : (s && s.uploads_enabled === true)
      });

      toast(next ? "Utente bloccato." : "Utente riattivato.");
    }catch(err){
      toast("Errore blocco: " + (err.message || err));
    }finally{
      var b = $("blockBtn");
      if(b) b.disabled = false;
    }

    return false;
  }

  async function sendAttachmentRaw(file, kind){
    var sid = currentSessionId();
    if(!sid) throw new Error("Nessuna sessione selezionata.");
    if(!file || !file.size) throw new Error("File mancante.");

    var res = await fetch("/api/followme/chat-v2/session/" + encodeURIComponent(sid) + "/attachment-raw?v=" + Date.now(), {
      method:"POST",
      headers:{
        "Content-Type": file.type || "application/octet-stream",
        "X-FollowMe-Sender":"owner",
        "X-FollowMe-Kind": kind || ((file.type || "").startsWith("image/") ? "image" : "document"),
        "X-FollowMe-Filename": encodeURIComponent(file.name || ("allegato-" + Date.now()))
      },
      body:file
    });

    var data = await res.json().catch(function(){ return null; });
    if(!res.ok || !data || data.success === false){
      throw new Error((data && data.error) || "Invio allegato non riuscito.");
    }

    await refreshNow();
    return data;
  }

  function bindFileInputs(){
    var photoInput = $("photoInput");
    var fileInput = $("fileInput");

    if(photoInput && photoInput.dataset.premiumFixBound !== "1"){
      photoInput.dataset.premiumFixBound = "1";
      photoInput.addEventListener("change", async function(ev){
        var file = ev.target.files && ev.target.files[0];
        try{
          await sendAttachmentRaw(file, "image");
          toast("Foto inviata.");
        }catch(err){
          toast("Errore foto: " + (err.message || err));
        }
        try{ ev.target.value = ""; }catch(e){}
      }, true);
    }

    if(fileInput && fileInput.dataset.premiumFixBound !== "1"){
      fileInput.dataset.premiumFixBound = "1";
      fileInput.addEventListener("change", async function(ev){
        var file = ev.target.files && ev.target.files[0];
        try{
          await sendAttachmentRaw(file, (file && (file.type || "").startsWith("image/")) ? "image" : "document");
          toast("File inviato.");
        }catch(err){
          toast("Errore file: " + (err.message || err));
        }
        try{ ev.target.value = ""; }catch(e){}
      }, true);
    }
  }

  async function sendLocation(ev){
    if(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();
    }

    var sid = currentSessionId();
    if(!sid){
      toast("Nessuna sessione selezionata.");
      return false;
    }

    if(!navigator.geolocation){
      toast("Geolocalizzazione non disponibile.");
      return false;
    }

    toast("Richiedo posizione...");

    navigator.geolocation.getCurrentPosition(async function(pos){
      try{
        var lat = pos.coords.latitude;
        var lng = pos.coords.longitude;
        var acc = pos.coords.accuracy || 0;
        var maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lat + "," + lng);

        var payload = {
          __followme_attachment_v2:true,
          kind:"location",
          label:"Posizione condivisa",
          latitude:lat,
          longitude:lng,
          accuracy_m:acc,
          url:maps,
          maps_url:maps
        };

        var data = await apiJson("/api/followme/chat-v2/session/" + encodeURIComponent(sid) + "/message?v=" + Date.now(), {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            sender:"owner",
            message:JSON.stringify(payload)
          })
        });

        await refreshNow();
        toast("Posizione inviata.");
      }catch(err){
        toast("Errore posizione: " + (err.message || err));
      }
    }, function(err){
      toast("Posizione non autorizzata.");
    }, {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:30000
    });

    return false;
  }

  async function sendVoiceBlob(blob){
    if(!blob || !blob.size) throw new Error("Audio mancante.");
    var file = new File([blob], "audio-admin-" + Date.now() + ".webm", { type:blob.type || "audio/webm" });
    return sendAttachmentRaw(file, "voice");
  }

  function hookVoiceSend(){
    var btn = $("voiceSend");
    if(!btn || btn.dataset.premiumFixBound === "1") return;

    btn.dataset.premiumFixBound = "1";
    btn.addEventListener("click", async function(ev){
      try{
        setTimeout(refreshNow, 250);
        setTimeout(refreshNow, 900);
      }catch(e){}
    }, true);
  }

  function bindButtons(){
    var extra = $("extraBtn");
    var block = $("blockBtn");
    var photo = $("photoBtn");
    var file = $("fileBtn");
    var loc = $("locationBtn");

    if(extra && extra.dataset.premiumFixBound !== "1"){
      extra.dataset.premiumFixBound = "1";
      extra.addEventListener("click", toggleExtra, true);
    }

    if(block && block.dataset.premiumFixBound !== "1"){
      block.dataset.premiumFixBound = "1";
      block.addEventListener("click", toggleBlock, true);
    }

    if(photo && photo.dataset.premiumFixBound !== "1"){
      photo.dataset.premiumFixBound = "1";
      photo.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();
        var input = $("photoInput");
        if(input) input.click();
        return false;
      }, true);
    }

    if(file && file.dataset.premiumFixBound !== "1"){
      file.dataset.premiumFixBound = "1";
      file.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();
        var input = $("fileInput");
        if(input) input.click();
        return false;
      }, true);
    }

    if(loc && loc.dataset.premiumFixBound !== "1"){
      loc.dataset.premiumFixBound = "1";
      loc.addEventListener("click", sendLocation, true);
    }

    bindFileInputs();
    hookVoiceSend();
  }

  function boot(){
    bindButtons();
    setTimeout(bindButtons, 400);
    setTimeout(bindButtons, 1200);
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  }else{
    boot();
  }

  window.addEventListener("pageshow", boot);
  setInterval(bindButtons, 1500);
})();
</script>

<!-- FOLLOWME_CHAT_V2_ADMIN_NEUTRAL_BLOCK_LABELS_20260528 -->
