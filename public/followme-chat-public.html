<!doctype html><button type="button" class="followme-public-close-chat" id="followmePublicCloseChatBtn">Chiudi</button>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FollowMe Chat</title>
  <style>
    :root{
      --bg:#071018;
      --panel:#101820;
      --panel2:#142231;
      --text:#f7fafc;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.10);
      --lime:#c8ff2e;
      --cyan:#5ee7ff;
      --bot:#182838;
      --user:#c8ff2e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
    body{
      background:
        radial-gradient(circle at 20% -10%,rgba(200,255,46,.14),transparent 34%),
        radial-gradient(circle at 92% 0%,rgba(94,231,255,.13),transparent 30%),
        #071018;
    }
    .chat{
      width:min(520px,100%);
      height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto 1fr auto;
      background:rgba(7,16,24,.76);
      border-left:1px solid rgba(255,255,255,.06);
      border-right:1px solid rgba(255,255,255,.06);
    }
    .top{
      padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
      display:flex;
      align-items:center;
      gap:11px;
      background:rgba(16,24,32,.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }
    .avatar{
      width:44px;height:44px;border-radius:16px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:1.2rem;
      box-shadow:0 12px 28px rgba(94,231,255,.16);
    }
    .top h1{margin:0;font-size:1.02rem;letter-spacing:-.03em;line-height:1.08}
    .top p{margin:3px 0 0;color:var(--muted);font-size:.76rem}
    .messages{
      overflow:auto;
      padding:16px 12px 18px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .msgrow{display:flex;gap:8px;align-items:flex-end}
    .msgrow.user{justify-content:flex-end}
    .boticon{
      width:30px;height:30px;border-radius:11px;flex:0 0 auto;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:.85rem;
    }
    .bubble{
      max-width:78%;
      border-radius:20px;
      padding:10px 12px;
      font-size:.92rem;
      line-height:1.34;
      box-shadow:0 10px 26px rgba(0,0,0,.18);
    }
    .bot .bubble{
      background:var(--bot);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      border-bottom-left-radius:7px;
    }
    .user .bubble{
      background:linear-gradient(135deg,var(--lime),#e9ff9c);
      color:#101820;
      font-weight:750;
      border-bottom-right-radius:7px;
    }
    .typing{
      display:inline-flex;gap:4px;align-items:center;
      padding:2px 0;
    }
    .typing span{
      width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.65);
      animation:bounce 1s infinite ease-in-out;
    }
    .typing span:nth-child(2){animation-delay:.16s}
    .typing span:nth-child(3){animation-delay:.32s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
    .choices{
      display:flex;gap:8px;flex-wrap:wrap;margin-left:38px;margin-top:-2px;
    }
    .choice{
      border:1px solid rgba(200,255,46,.28);
      background:rgba(200,255,46,.10);
      color:#e9ff9c;
      border-radius:999px;
      padding:8px 10px;
      font-weight:850;
      font-size:.78rem;
    }
    .composer{
      padding:10px 12px calc(12px + env(safe-area-inset-bottom));
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      background:rgba(16,24,32,.94);
      border-top:1px solid var(--line);
      backdrop-filter:blur(14px);
    }
    textarea{
      resize:none;height:46px;max-height:110px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.22);
      color:#fff;
      border-radius:18px;
      padding:12px 13px;
      font:inherit;
      outline:none;
    }
    button{
      border:0;border-radius:18px;padding:0 15px;
      font-weight:950;color:#101820;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
    }
    .smallnote{
      text-align:center;color:rgba(255,255,255,.48);font-size:.72rem;padding:4px 10px 0;
    }
  
    /* Avatar chat FollowMe */
    .boticon{
      width:38px !important;
      height:38px !important;
      border-radius:0 !important;
      background:transparent !important;
      box-shadow:none !important;
      font-size:1.65rem !important;
      flex:0 0 auto !important;
    }

    .adminicon{
      width:38px;
      height:38px;
      border-radius:999px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 33%, #f1c7a5 0 28%, transparent 29%),
        radial-gradient(circle at 44% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 57% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 50% 61%, #2c1c16 0 10%, transparent 11%),
        linear-gradient(180deg,#263244,#101820);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 10px 24px rgba(0,0,0,.22);
      position:relative;
      overflow:hidden;
    }

    .adminicon::before{
      content:"";
      position:absolute;
      width:18px;
      height:7px;
      border-radius:999px;
      background:#241713;
      left:10px;
      top:24px;
      opacity:.95;
    }

    .adminicon::after{
      content:"";
      position:absolute;
      width:10px;
      height:8px;
      border-radius:0 0 999px 999px;
      background:#241713;
      left:14px;
      top:28px;
      opacity:.9;
    }

    .msgrow.admin{
      justify-content:flex-start;
    }

    .admin .bubble{
      background:#162536;
      border:1px solid rgba(94,231,255,.18);
      color:#fff;
      border-bottom-left-radius:7px;
    }


    /* Effetto digitazione presentazione FollowMe */
    .typed-cursor{
      display:inline-block;
      width:7px;
      height:1.05em;
      margin-left:2px;
      vertical-align:-2px;
      background:rgba(255,255,255,.72);
      border-radius:2px;
      animation:followmeTypedCursorBlink .85s infinite;
    }

    @keyframes followmeTypedCursorBlink{
      0%,45%{opacity:1}
      46%,100%{opacity:.15}
    }


    /* FollowMe WhatsApp-like restyle */
    body.followme-wa-chat{
      background:#efe7db !important;
      color:#2f3437 !important;
    }

    body.followme-wa-chat .chat{
      background:#efe7db !important;
      border-left:1px solid rgba(0,0,0,.05) !important;

    }

    body.followme-wa-chat .messages{

      background-image:
        radial-gradient(circle at 12px 18px, rgba(120,110,95,.055) 0 1.2px, transparent 1.4px),

        linear-gradient(45deg, transparent 48%, rgba(120,110,95,.035) 49%, rgba(120,110,95,.035) 51%, transparent 52%);
      background-size:86px 86px, 112px 112px, 74px 74px;
    }

    body.followme-wa-chat .top{
      background:#f4eee5 !important;
      border-bottom:1px solid rgba(0,0,0,.08) !important;
      color:#2f3437 !important;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }

    body.followme-wa-chat .top h1{
      color:#2f3437 !important;
    }

    body.followme-wa-chat .top p{
      color:#667071 !important;
    }

    body.followme-wa-chat .avatar{
      background:#ffffff !important;
      color:#2f3437 !important;
      box-shadow:0 1px 2px rgba(0,0,0,.10) !important;
    }

    body.followme-wa-chat .bot .bubble,
    body.followme-wa-chat .admin .bubble,
    body.followme-wa-chat .system .bubble{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:0 !important;
      box-shadow:0 1px 1px rgba(0,0,0,.12) !important;
    }

    body.followme-wa-chat .user .bubble{
      background:#dcf8c6 !important;
      color:#1f2c2f !important;
      box-shadow:0 1px 1px rgba(0,0,0,.12) !important;
      font-weight:500 !important;
    }

    body.followme-wa-chat .bubble{
      border-radius:9px !important;

    }

    body.followme-wa-chat .bot .bubble,
    body.followme-wa-chat .admin .bubble{
      border-bottom-left-radius:3px !important;
    }

    body.followme-wa-chat .user .bubble{

    }

    body.followme-wa-chat .composer{
      background:#f4eee5 !important;
      border-top:1px solid rgba(0,0,0,.08) !important;
      grid-template-columns:1fr auto !important;
    }

    body.followme-wa-chat textarea{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:0 !important;
      border-radius:22px !important;
      box-shadow:0 1px 2px rgba(0,0,0,.08) !important;
    }

    body.followme-wa-chat textarea::placeholder{

    }

    body.followme-wa-chat #sendBtn{

      border-radius:999px !important;
      padding:0 !important;

    body.followme-wa-chat #sendBtn::before{
      content:"➤";
      font-size:20px;
      display:block;
      transform:translateX(1px);
    }

    body.followme-wa-chat .choices{
      margin-left:46px !important;
    }

    body.followme-wa-chat .choice{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:1px solid rgba(0,0,0,.08) !important;
      box-shadow:0 1px 1px rgba(0,0,0,.10) !important;
    }

    body.followme-wa-chat .choice:first-child{
      color:#128c7e !important;
      font-weight:900 !important;
    }

    body.followme-wa-chat .smallnote{
      background:#f4eee5 !important;
      color:#667071 !important;
    }

    body.followme-wa-chat .boticon{
      background:transparent !important;
      box-shadow:none !important;
    }


    /* Pulsante chiusura chat utente */
    .followme-public-close-chat{
      position:absolute;
      right:10px;
      top:calc(10px + env(safe-area-inset-top));
      z-index:5;
      min-height:32px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:rgba(255,255,255,.82);
      color:#3a3f41;
      font-size:.74rem;
      font-weight:850;
      padding:0 10px;
      box-shadow:0 1px 2px rgba(0,0,0,.08);
    }

    body.followme-chat-closed .composer{
      opacity:.55;
      pointer-events:none;
    }

    body.followme-chat-closed .followme-public-close-chat{
      display:none;
    }


    /* Scelta info discreta se l'utente scrive subito */
    .choices .choice-prompt{
      grid-column:1 / -1;
      margin:0 0 4px;
      padding:0 2px;
      color:#667071;
      font-size:.78rem;
      font-weight:800;
      text-align:left;
    }

    body.followme-wa-chat .choices .choice-prompt{
      color:#667071 !important;
    }


    /* Preview allegati lato utente FollowMe */
    .followme-attachment-card{
      display:grid;
      gap:7px;
      max-width:240px;
    }

    .followme-attachment-image{
      display:block;
      width:220px;
      max-width:70vw;
      border-radius:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.14);
      background:#eee;
    }

    .followme-attachment-file,
    .followme-attachment-location,
    .followme-attachment-audio{
      display:flex;
      align-items:center;
      gap:9px;
      padding:10px 11px;
      border-radius:12px;
      background:rgba(255,255,255,.58);
      border:1px solid rgba(0,0,0,.08);
      color:#253033;
      text-decoration:none;
      font-weight:800;
      line-height:1.25;
    }

    .followme-attachment-audio audio{

    .followme-attachment-name{

    }

    .followme-attachment-meta{
      display:block;

    }


    /* Chat chiusa da Admin */
    .followme-public-admin-closed{
      display:none;
      margin:10px auto;
      max-width:88%;

      background:rgba(255,255,255,.86);
      color:#3a3f41;
      border:1px solid rgba(0,0,0,.08);

    body.followme-public-session-closed .followme-public-admin-closed{
      display:block;
    }

    body.followme-public-session-closed .composer{

      pointer-events:none;
    }


    /* Stato utente bloccato */
    body.followme-public-user-blocked .composer,
    body.followme-public-user-blocked form,
    body.followme-public-user-blocked .followme-public-composer{
      opacity:.55 !important;

    }

    .followme-public-blocked-notice{
      display:none;
      margin:10px auto;
      max-width:88%;
      padding:10px 12px;

      color:#3a3f41;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 1px 2px rgba(0,0,0,.08);
      font-size:.86rem;
      line-height:1.35;
      font-weight:750;
      text-align:center;
    }

    body.followme-public-user-blocked .followme-public-blocked-notice{
      display:block;
    }


    /* FollowMe public: utente bloccato */
    .followme-public-blocked-system-message{
      display:none;
      margin:12px auto;
      max-width:88%;
      padding:12px 14px;
      border-radius:15px;
      background:#fff1ef;
      color:#9b241c;
      border:1px solid rgba(155,36,28,.18);
      box-shadow:0 1px 3px rgba(0,0,0,.08);
      font-size:.9rem;
      line-height:1.35;

      text-align:center;
    }

    body.followme-public-user-blocked .followme-public-blocked-system-message{
      display:block;
    }

    body.followme-public-user-blocked textarea,
    body.followme-public-user-blocked input[type="text"],
    body.followme-public-user-blocked button[type="submit"],
    body.followme-public-user-blocked #sendBtn,
    body.followme-public-user-blocked .send-btn{
      opacity:.45 !important;
      pointer-events:none !important;
    }

    body:not(.followme-public-uploads-enabled) .followme-public-upload-btn,
    body:not(.followme-public-uploads-enabled) .followme-public-attach-btn,
    body:not(.followme-public-uploads-enabled) .followme-admin-wa-plus,
    body:not(.followme-public-uploads-enabled) button[aria-label*="alleg"],
    body:not(.followme-public-uploads-enabled) button[aria-label*="Alleg"],

</style>

<body class="followme-wa-chat">
  <main class="chat">
    <header class="top">
      <div class="avatar">🤖</div>
      <div>
        <h1>FollowMe Chat</h1>
        <p id="statusText">Connessione in corso...</p>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <footer>
      <div class="smallnote">Scrivi qui. Il proprietario riceverà il tuo messaggio in questa chat.</div>
      <div class="composer">
        <textarea id="messageInput" placeholder="Scrivi un messaggio..." rows="1"></textarea>
        <button id="sendBtn">Invia</button>
      </div>
    </footer>
  
<div class="followme-public-blocked-system-message" id="followmePublicBlockedSystemMessage">
  Sei stato bloccato dal sistema.
</div>

</main>

<script>
(function(){
  const TOKEN = (location.pathname.match(/\/fm\/chat\/c\/([^\/?#]+)/i)||[])[1] || "";
  let sessionId = "";
  let lastMessageId = 0;
  let realConversationStarted = false;
  let robotTimers = [];
  let followMeInfoChoiceSent = false;
  let followMeInfoExplained = false;
  let followMeRobotFallbackSent = false;
  let followMeInfoChoiceRendered = false;
  const renderedMessageKeys = new Set();
  const messages = document.getElementById("messages");
  const statusText = document.getElementById("statusText");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  function scrollBottom(){
    messages.scrollTop = messages.scrollHeight;
  }

  function scheduleRobot(fn, delay){
    const t = setTimeout(function(){
      if(!realConversationStarted){
        fn();
      }
    }, delay);
    robotTimers.push(t);
    return t;
  }

  function stopRobotSequence(){
    realConversationStarted = true;
    robotTimers.forEach(clearTimeout);
    robotTimers = [];

    try{
      document.querySelectorAll(".choices").forEach(el => el.remove());
      document.querySelectorAll("[data-robot-typing='1']").forEach(el => el.remove());
    }catch(e){}
  }

  function messageKey(sender, text, id){
    if(id) return "id:" + id;
    return String(sender || "") + ":" + String(text || "").replace(/\s+/g, " ").trim().slice(0, 180);
  }

  function alreadyRendered(sender, text, id){
    const key = messageKey(sender, text, id);
    if(renderedMessageKeys.has(key)) return true;
    renderedMessageKeys.add(key);
    return false;
  }

  function row(kind, html, typing){
    const r = document.createElement("div");
    r.className = "msgrow " + (kind === "user" ? "user" : (kind === "admin" ? "admin" : "bot"));

    if(kind === "bot"){
      const ico = document.createElement("div");
      ico.className = "boticon";
      ico.textContent = "🤖";
      r.appendChild(ico);
    }

    if(kind === "admin"){
      const ico = document.createElement("div");
      ico.className = "adminicon";
      ico.setAttribute("aria-label", "Admin");
      r.appendChild(ico);
    }

    const b = document.createElement("div");
    b.className = "bubble";
    if(typing){
      r.setAttribute("data-robot-typing", "1");
      b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    }else{
      b.innerHTML = html;
    }
    r.appendChild(b);
    messages.appendChild(r);
    scrollBottom();
    return r;
  }

  function addBot(text){
    row("bot", text.replace(/\n/g,"<br>"));
  }

  function addBotHtml(html){
    row("bot", String(html || ""));
  }

  function tokenizeHtmlForTyping(html){
    const tokens = [];
    const re = /(<[^>]+>|[^<])/g;
    let m;
    while((m = re.exec(String(html || ""))) !== null){
      tokens.push(m[0]);
    }
    return tokens;
  }

  function typeBotHtml(html){
    const r = row("bot", "", false);
    const bubble = r.querySelector(".bubble");
    if(!bubble) return;

    const tokens = tokenizeHtmlForTyping(html);
    let out = "";
    let i = 0;

    function currentDelay(token, previousOutput){
      if(token && token.startsWith("<strong")) return 80;
      if(previousOutput.endsWith("</strong>")) return 260;
      if(/[.!?]$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 360;
      if(/:$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 280;
      if(token === "<br>") return 220;

      // Rallenta leggermente quando siamo dentro un grassetto aperto.
      const openStrong = (previousOutput.match(/<strong>/g) || []).length;
      const closeStrong = (previousOutput.match(/<\/strong>/g) || []).length;
      if(openStrong > closeStrong) return 44;

      return 24;
    }

    function step(){
      if(i >= tokens.length){
        bubble.innerHTML = out;
        scrollBottom();
        return;
      }

      const token = tokens[i++];
      out += token;
      bubble.innerHTML = out + '<span class="typed-cursor"></span>';
      scrollBottom();

      setTimeout(step, currentDelay(token, out));
    }

    step();
  }

  function addUser(text){
    row("user", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function addAdmin(text){
    row("admin", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function botTypingThen(text, delay){
    if(realConversationStarted) return;

    const t = row("bot", "", true);
    scheduleRobot(()=>{
      if(realConversationStarted){
        t.remove();
        return;
      }
      t.remove();
      addBot(text);
    }, delay || 900);
  }

  function addChoices(){
    if(followMeInfoChoiceRendered) return;
    followMeInfoChoiceRendered = true;

    const wrap = document.createElement("div");
    wrap.className = "choices";

    if(realConversationStarted){
      const prompt = document.createElement("div");
      prompt.className = "choice-prompt";
      prompt.textContent = "Vuoi sapere cosa sono?";
      wrap.appendChild(prompt);
    }

    const yes = document.createElement("button");
    yes.className = "choice";
    yes.textContent = "👀 Sì, raccontami";

    const no = document.createElement("button");
    no.className = "choice";
    no.textContent = "No, aspetto";

    yes.onclick = ()=>{
      wrap.remove();
      addUser("Sì, raccontami");
      followMeInfoChoiceSent = true;
      followMeInfoExplained = true;

    };

    scrollBottom();
  }

  async function createSession(){
    const res = await fetch("/api/followme/chat/" + encodeURIComponent(TOKEN) + "/session", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ source:"public_chat" })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || "Errore apertura chat");
    sessionId = data.session_id;
    statusText.textContent = "Connesso · in attesa del proprietario";
  }


  function playFollowMeSendSound(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;

      const ctx = new AudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = "sine";
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.055);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.13);

      filter.type = "highpass";
      filter.frequency.setValueAtTime(420, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.075, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.17);

      setTimeout(()=>ctx.close().catch(()=>{}), 280);
    }catch(e){}
  }

  function isFollowMeMeaningfulQuestion(text){
    const t = String(text || "").toLowerCase().trim();

    if(!t) return false;

    const hasQuestionMark = t.includes("?");

    const keywords = [
      "quanto costa",
      "costo",
      "costa",
      "prezzo",
      "prezzi",
      "dove lo compro",
      "dove posso comprar",
      "comprare",
      "acquistare",
      "acquisto",
      "come funziona",
      "funziona",
      "posso averlo",
      "averlo",
      "lo voglio",
      "mi interessa",
      "informazioni",
      "info",
      "dettagli",
      "abbonamento",
      "canone",
      "attivarlo",
      "attivare",
      "qr dinamico",
      "followme"
    ];

    if(hasQuestionMark && t.length >= 4) return true;

    return keywords.some(k => t.includes(k));
  }

  async function sendSystemNoteToOwner(message){
    if(!sessionId || !message) return;

    try{
      await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ sender:"visitor", message:message })
      });
    }catch(e){}
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text || !sessionId) return;

    const shouldRobotFallback = followMeInfoExplained && !followMeRobotFallbackSent && isFollowMeMeaningfulQuestion(text);

    stopRobotSequence();

    input.value = "";
    addUser(text);
    playFollowMeSendSound();
    alreadyRendered("visitor", text, null);

    if(!followMeInfoChoiceSent && !followMeInfoChoiceRendered){
      setTimeout(function(){
        addChoices();
      }, 650);
    }

    if(shouldRobotFallback){
      followMeRobotFallbackSent = true;
      setTimeout(function(){
        addBot("Mi piacerebbe aiutarti, ma io sono solo il robottino di accoglienza 🤖<br><br>Per <strong>prezzi, acquisto o dettagli pratici</strong> deve risponderti il proprietario.<br><br><strong>Puoi attendere ancora un momento?</strong>");
      }, 650);
    }

    const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ sender:"visitor", message:text })
    });

    const data = await res.json().catch(()=>null);
    if(data && data.success && data.message && data.message.id){
      lastMessageId = Math.max(lastMessageId, Number(data.message.id) || 0);
      alreadyRendered("visitor", text, data.message.id);
      setTimeout(poll, 700);
    }
  }

  async function poll(){
    if(!sessionId) return;
    try{
      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/messages?after=" + encodeURIComponent(lastMessageId), { cache:"no-store" });
      const data = await res.json();
      if(data.success && Array.isArray(data.messages)){
        data.messages.forEach(m=>{
          lastMessageId = Math.max(lastMessageId, Number(m.id)||0);
          if(m.sender === "owner"){
            stopRobotSequence();
            addAdmin(String(m.message || ""));
          }
        });
      }
    }catch(e){}
  }

  async function boot(){
    try{
      await createSession();

      botTypingThen("Ciao, sono <strong>FollowMe QR</strong> 👋", 800);

      scheduleRobot(()=>botTypingThen("Ho avvisato il proprietario che ti sei collegato.<br>Se è disponibile, ti risponderà qui.", 850), 1800);

      scheduleRobot(()=>botTypingThen("Mentre aspetti, vuoi sapere <strong>cosa sono</strong>?", 750), 4200);

      scheduleRobot(addChoices, 5600);

      setInterval(poll, 1500);
    }catch(err){
      statusText.textContent = "Chat non disponibile";
      addBot("Mi dispiace, la chat non è disponibile in questo momento.");
      console.error(err);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  boot();
})();
</script>

<script id="followme-real-attachments-public-script">
(function(){
  function esc(v){
    return String(v || "").replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));
  }

  function parseAttachment(text){
    try{
      const obj = JSON.parse(String(text || "").trim());
      if(obj && obj.__followme_attachment) return obj;
    }catch(e){}
    return null;
  }

  function attachmentHtml(a){
    const url = a.url || "";
    const name = a.label || a.filename || "Allegato";

    if(a.kind === "image" || (a.mime || "").startsWith("image/")){
      return '<div class="followme-attachment-card">' +
        '<img class="followme-attachment-image" src="' + esc(url) + '" alt="' + esc(name) + '">' +
        '<span class="followme-attachment-meta">' + esc(name) + (a.temporary ? ' · Allegato temporaneo' : '') + '</span>' +
      '</div>';
    }

    if(a.kind === "audio" || (a.mime || "").startsWith("audio/")){
      return '<div class="followme-attachment-audio">' +
        '<span>🎙️</span><audio controls src="' + esc(url) + '"></audio>' +
      '</div>';
    }

    if(a.kind === "location"){
      return '<a class="followme-attachment-location" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<span>📍</span><span><span class="followme-attachment-name">Posizione condivisa</span><span class="followme-attachment-meta">Apri mappa</span></span>' +
      '</a>';
    }

    return '<a class="followme-attachment-file" href="' + esc(url) + '" target="_blank" rel="noopener" download>' +
      '<span>📄</span><span><span class="followme-attachment-name">' + esc(name) + '</span><span class="followme-attachment-meta">Apri documento</span></span>' +
    '</a>';
  }

  function transformAttachmentBubbles(){
    document.querySelectorAll("#messages .bubble").forEach(function(b){
      if(b.dataset.attachmentRendered === "1") return;

      const a = parseAttachment(b.textContent);
      if(!a) return;

      b.dataset.attachmentRendered = "1";
      b.innerHTML = attachmentHtml(a);
    });
  }

  window.followMeTransformPublicAttachmentBubbles = transformAttachmentBubbles;

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", transformAttachmentBubbles);
  }else{
    transformAttachmentBubbles();
  }

  window.addEventListener("pageshow", function(){
    setTimeout(transformAttachmentBubbles, 300);
  });

  setInterval(transformAttachmentBubbles, 1000);
})();
</script>

  // Intercetta fetch dei messaggi: se il server risponde session_closed, chiude la UI utente.

    const originalFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){

    const photoInput = bar.querySelector("#fmPublicAdminLikePhotoInput20260518");
    const fileInput = bar.querySelector("#fmPublicAdminLikeFileInput20260518");

    plusBtn.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(canUseExtra() && fileInput) fileInput.click();
    });

    photoBtn.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(canUseExtra() && photoInput) photoInput.click();
    });

    sendBtn.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      clickOriginalSend();
    });

    photoInput.addEventListener("change", async function(){
      const file = photoInput.files && photoInput.files[0];
      if(!file) return;
      try{ await sendRawFile(file, "image"); }
      catch(err){ alert(err.message || "Errore invio foto."); }
      finally{ photoInput.value = ""; }
    });

    fileInput.addEventListener("change", async function(){
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      try{ await sendRawFile(file, "document"); }
      catch(err){ alert(err.message || "Errore invio file."); }
      finally{ fileInput.value = ""; }
    });

    locBtn.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(!canUseExtra()) return;

      if(!navigator.geolocation){
        alert("Geolocalizzazione non disponibile.");
        return;
      }

      navigator.geolocation.getCurrentPosition(async function(pos){
        try{
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const url = "https://www.google.com/maps?q=" + encodeURIComponent(lat + "," + lng);
          const sid = getSid();

          const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/attachment", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
              sender:"visitor",
              kind:"location",
              url:url,
              label:"Posizione condivisa",
              mime:"text/uri-list",
              filename:"posizione"
            })
          });

          const data = await res.json().catch(()=>null);
          if(!res.ok || !data || !data.success){
            throw new Error((data && data.error) || "Errore invio posizione.");
          }

          try{
            if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages();
          }catch(e){}
        }catch(err){
          alert(err.message || "Errore invio posizione.");
        }
      }, function(){
        alert("Posizione non autorizzata.");
      }, {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:0
      });
    });
  }

  function applyState(session){
    if(!session) return;

    const uploads = !!session.uploads_enabled;
    const blocked = !!session.is_blocked;
    const key = String(session.id || "") + "|" + uploads + "|" + blocked + "|" + String(session.updated_at || "");

    if(key === lastKey) return;
    lastKey = key;

    if(session.id) saveSid(session.id);

    document.body.classList.toggle("fm-public-extra-adminlike-on", uploads);
    document.body.classList.toggle("fm-public-user-blocked-adminlike", blocked);

    document.body.classList.toggle("followme-public-uploads-enabled", uploads);
    document.body.classList.toggle("followme-public-user-blocked", blocked);

    const input = findInput();
    const send = findSend();

    if(input){
      input.disabled = blocked;
      if(blocked){
        input.dataset.oldPlaceholder = input.dataset.oldPlaceholder || input.placeholder || "";
        input.placeholder = "Sei stato bloccato dal sistema.";
      }else if(input.dataset.oldPlaceholder){
        input.placeholder = input.dataset.oldPlaceholder;
      }
    }

    if(send) send.disabled = blocked;

    ensureBlockedNotice();
    ensureExtraBar();
  }

  async function recoverLatestSessionIfMissing(){
    if(getSid()) return;

    try{
      const res = await fetch("/api/followme/FM-DEMO/chat/sessions?v=" + Date.now(), { cache:"no-store" });
      const data = await res.json().catch(()=>null);
      if(!res.ok || !data || !data.success) return;

      const sessions = Array.isArray(data.sessions) ? data.sessions : [];
      const open = sessions.filter(s => s && s.status === "open");
      const chosen = open[0] || sessions[0];

      if(chosen && chosen.id) saveSid(chosen.id);
    }catch(e){}
  }

  async function fetchState(force){
    const now = Date.now();
    if(!force && now - lastFetchAt < 1400) return;
    if(inFlight) return;

    lastFetchAt = now;
    inFlight = true;

    try{
      let sid = getSid();
      if(!sid){
        await recoverLatestSessionIfMissing();
        sid = getSid();
      }

      if(!sid) return;

      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
        cache:"no-store"
      });

      const data = await res.json().catch(()=>null);
      if(!res.ok || !data || !data.success) return;

      applyState(data.session);
    }catch(e){
      console.warn("[FM public adminlike] state error", e);
    }finally{
      inFlight = false;
    }
  }

  if(!window.__fmPublicAdminLikeFetchBridge20260518){
    window.__fmPublicAdminLikeFetchBridge20260518 = true;
    const previousFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await previousFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");
        if(url && url.includes("/api/followme/chat/") && !url.includes("/messages?")){
          const clone = res.clone();
          const data = await clone.json().catch(()=>null);
          const sid = extractSid(data);
          if(sid){
            saveSid(sid);
            setTimeout(function(){ fetchState(true); }, 120);
          }
        }
      }catch(e){}

      return res;
    };
  }

  function patchSubmitGuard(){
    if(window.__fmPublicAdminLikeSubmitGuard20260518) return;
    window.__fmPublicAdminLikeSubmitGuard20260518 = true;

    document.addEventListener("submit", function(ev){
      if(document.body.classList.contains("fm-public-user-blocked-adminlike")){
        ev.preventDefault();
        ev.stopPropagation();
        ev.stopImmediatePropagation();
        alert("Sei stato bloccato dal sistema.");
      }
    }, true);
  }

  function boot(){
    injectCss();
    ensureBlockedNotice();
    ensureExtraBar();
    patchSubmitGuard();
    fetchState(true);

    if(!pollTimer){
      pollTimer = setInterval(function(){ fetchState(false); }, 2500);
    }
  }

  window.fmPublicForceFetchState20260518 = function(){
    return fetchState(true);
  };

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  }else{
    boot();
  }

  window.addEventListener("load", function(){
    setTimeout(function(){ fetchState(true); }, 300);
    setTimeout(function(){ fetchState(true); }, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(function(){ fetchState(true); }, 250);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      setTimeout(function(){ fetchState(true); }, 250);
    }
  });
})();
</script>

</body>
</html>


<script id="followme-public-blocked-fetch-hard-guard">
(function(){
  if(window.__followMePublicBlockedFetchHardGuard) return;
  window.__followMePublicBlockedFetchHardGuard = true;

  function applyBlocked(){
    try{
      document.body.classList.add("followme-public-user-blocked");
      const notice = document.getElementById("followmePublicBlockedNotice");
      if(notice) notice.textContent = "Sei stato bloccato dal sistema.";

      const input = document.getElementById("messageInput") ||
                    document.querySelector("textarea") ||
                    document.querySelector("input[type='text']");
      if(input){
        input.disabled = true;
        input.placeholder = "Sei stato bloccato dal sistema.";
      }

      const send = document.getElementById("sendBtn") ||
                   document.querySelector("button[type='submit']") ||
                   document.querySelector(".send-btn");
      if(send) send.disabled = true;
    }catch(e){}
  }

  const previousFetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const res = await previousFetch(input, init);

    try{
      const url = typeof input === "string" ? input : (input && input.url ? input.url : "");
      if(url && url.includes("/api/followme/chat/session/")){
        const clone = res.clone();
        const data = await clone.json().catch(()=>null);
        if(data && (data.blocked === true || String(data.error || "").includes("bloccato"))){
          applyBlocked();
        }
      }
    }catch(e){}

    return res;
  };
})();
</script>
