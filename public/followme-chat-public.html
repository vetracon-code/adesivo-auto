<!doctype html><button type="button" class="followme-public-close-chat" id="followmePublicCloseChatBtn">Chiudi</button>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FollowMe Chat</title>
  <style>
    :root{
      --bg:#071018;
      --panel:#101820;
      --panel2:#142231;
      --text:#f7fafc;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.10);
      --lime:#c8ff2e;
      --cyan:#5ee7ff;
      --bot:#182838;
      --user:#c8ff2e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
    body{
      background:
        radial-gradient(circle at 20% -10%,rgba(200,255,46,.14),transparent 34%),
        radial-gradient(circle at 92% 0%,rgba(94,231,255,.13),transparent 30%),
        #071018;
    }
    .chat{
      width:min(520px,100%);
      height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto 1fr auto;
      background:rgba(7,16,24,.76);
      border-left:1px solid rgba(255,255,255,.06);
      border-right:1px solid rgba(255,255,255,.06);
    }
    .top{
      padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
      display:flex;
      align-items:center;
      gap:11px;
      background:rgba(16,24,32,.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }
    .avatar{
      width:44px;height:44px;border-radius:16px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:1.2rem;
      box-shadow:0 12px 28px rgba(94,231,255,.16);
    }
    .top h1{margin:0;font-size:1.02rem;letter-spacing:-.03em;line-height:1.08}
    .top p{margin:3px 0 0;color:var(--muted);font-size:.76rem}
    .messages{
      overflow:auto;
      padding:16px 12px 18px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .msgrow{display:flex;gap:8px;align-items:flex-end}
    .msgrow.user{justify-content:flex-end}
    .boticon{
      width:30px;height:30px;border-radius:11px;flex:0 0 auto;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:.85rem;
    }
    .bubble{
      max-width:78%;
      border-radius:20px;
      padding:10px 12px;
      font-size:.92rem;
      line-height:1.34;
      box-shadow:0 10px 26px rgba(0,0,0,.18);
    }
    .bot .bubble{
      background:var(--bot);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      border-bottom-left-radius:7px;
    }
    .user .bubble{
      background:linear-gradient(135deg,var(--lime),#e9ff9c);
      color:#101820;
      font-weight:750;
      border-bottom-right-radius:7px;
    }
    .typing{
      display:inline-flex;gap:4px;align-items:center;
      padding:2px 0;
    }
    .typing span{
      width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.65);
      animation:bounce 1s infinite ease-in-out;
    }
    .typing span:nth-child(2){animation-delay:.16s}
    .typing span:nth-child(3){animation-delay:.32s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
    .choices{
      display:flex;gap:8px;flex-wrap:wrap;margin-left:38px;margin-top:-2px;
    }
    .choice{
      border:1px solid rgba(200,255,46,.28);
      background:rgba(200,255,46,.10);
      color:#e9ff9c;
      border-radius:999px;
      padding:8px 10px;
      font-weight:850;
      font-size:.78rem;
    }
    .composer{
      padding:10px 12px calc(12px + env(safe-area-inset-bottom));
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      background:rgba(16,24,32,.94);
      border-top:1px solid var(--line);
      backdrop-filter:blur(14px);
    }
    textarea{
      resize:none;height:46px;max-height:110px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.22);
      color:#fff;
      border-radius:18px;
      padding:12px 13px;
      font:inherit;
      outline:none;
    }
    button{
      border:0;border-radius:18px;padding:0 15px;
      font-weight:950;color:#101820;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
    }
    .smallnote{
      text-align:center;color:rgba(255,255,255,.48);font-size:.72rem;padding:4px 10px 0;
    }
  
    /* Avatar chat FollowMe */
    .boticon{
      width:38px !important;
      height:38px !important;
      border-radius:0 !important;
      background:transparent !important;
      box-shadow:none !important;
      font-size:1.65rem !important;
      flex:0 0 auto !important;
    }

    .adminicon{
      width:38px;
      height:38px;
      border-radius:999px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 33%, #f1c7a5 0 28%, transparent 29%),
        radial-gradient(circle at 44% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 57% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 50% 61%, #2c1c16 0 10%, transparent 11%),
        linear-gradient(180deg,#263244,#101820);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 10px 24px rgba(0,0,0,.22);
      position:relative;
      overflow:hidden;
    }

    .adminicon::before{
      content:"";
      position:absolute;
      width:18px;
      height:7px;
      border-radius:999px;
      background:#241713;
      left:10px;
      top:24px;
      opacity:.95;
    }

    .adminicon::after{
      content:"";
      position:absolute;
      width:10px;
      height:8px;
      border-radius:0 0 999px 999px;
      background:#241713;
      left:14px;
      top:28px;
      opacity:.9;
    }

    .msgrow.admin{
      justify-content:flex-start;
    }

    .admin .bubble{
      background:#162536;
      border:1px solid rgba(94,231,255,.18);
      color:#fff;
      border-bottom-left-radius:7px;
    }


    /* Effetto digitazione presentazione FollowMe */
    .typed-cursor{
      display:inline-block;
      width:7px;
      height:1.05em;
      margin-left:2px;
      vertical-align:-2px;
      background:rgba(255,255,255,.72);
      border-radius:2px;
      animation:followmeTypedCursorBlink .85s infinite;
    }

    @keyframes followmeTypedCursorBlink{
      0%,45%{opacity:1}
      46%,100%{opacity:.15}
    }


    /* FollowMe WhatsApp-like restyle */
    body.followme-wa-chat{
      background:#efe7db !important;
      color:#2f3437 !important;
    }

    body.followme-wa-chat .chat{
      background:#efe7db !important;
      border-left:1px solid rgba(0,0,0,.05) !important;
      border-right:1px solid rgba(0,0,0,.05) !important;
    }

    body.followme-wa-chat .messages{
      background-color:#efe7db !important;
      background-image:
        radial-gradient(circle at 12px 18px, rgba(120,110,95,.055) 0 1.2px, transparent 1.4px),
        radial-gradient(circle at 52px 64px, rgba(120,110,95,.045) 0 1.4px, transparent 1.6px),
        linear-gradient(45deg, transparent 48%, rgba(120,110,95,.035) 49%, rgba(120,110,95,.035) 51%, transparent 52%);
      background-size:86px 86px, 112px 112px, 74px 74px;
    }

    body.followme-wa-chat .top{
      background:#f4eee5 !important;
      border-bottom:1px solid rgba(0,0,0,.08) !important;
      color:#2f3437 !important;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }

    body.followme-wa-chat .top h1{
      color:#2f3437 !important;
    }

    body.followme-wa-chat .top p{
      color:#667071 !important;
    }

    body.followme-wa-chat .avatar{
      background:#ffffff !important;
      color:#2f3437 !important;
      box-shadow:0 1px 2px rgba(0,0,0,.10) !important;
    }

    body.followme-wa-chat .bot .bubble,
    body.followme-wa-chat .admin .bubble,
    body.followme-wa-chat .system .bubble{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:0 !important;
      box-shadow:0 1px 1px rgba(0,0,0,.12) !important;
    }

    body.followme-wa-chat .user .bubble{
      background:#dcf8c6 !important;
      color:#1f2c2f !important;
      box-shadow:0 1px 1px rgba(0,0,0,.12) !important;
      font-weight:500 !important;
    }

    body.followme-wa-chat .bubble{
      border-radius:9px !important;
      font-size:.94rem !important;
      line-height:1.36 !important;
    }

    body.followme-wa-chat .bot .bubble,
    body.followme-wa-chat .admin .bubble{
      border-bottom-left-radius:3px !important;
    }

    body.followme-wa-chat .user .bubble{
      border-bottom-right-radius:3px !important;
    }

    body.followme-wa-chat .composer{
      background:#f4eee5 !important;
      border-top:1px solid rgba(0,0,0,.08) !important;
      grid-template-columns:1fr auto !important;
    }

    body.followme-wa-chat textarea{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:0 !important;
      border-radius:22px !important;
      box-shadow:0 1px 2px rgba(0,0,0,.08) !important;
    }

    body.followme-wa-chat textarea::placeholder{
      color:#7c8588 !important;
    }

    body.followme-wa-chat #sendBtn{
      width:46px !important;
      height:46px !important;
      border-radius:999px !important;
      padding:0 !important;
      background:#25d366 !important;
      color:#ffffff !important;
      font-size:0 !important;
      box-shadow:0 1px 2px rgba(0,0,0,.16) !important;
      position:relative;
    }

    body.followme-wa-chat #sendBtn::before{
      content:"➤";
      font-size:20px;
      display:block;
      transform:translateX(1px);
    }

    body.followme-wa-chat .choices{
      margin-left:46px !important;
    }

    body.followme-wa-chat .choice{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:1px solid rgba(0,0,0,.08) !important;
      box-shadow:0 1px 1px rgba(0,0,0,.10) !important;
    }

    body.followme-wa-chat .choice:first-child{
      color:#128c7e !important;
      font-weight:900 !important;
    }

    body.followme-wa-chat .smallnote{
      background:#f4eee5 !important;
      color:#667071 !important;
    }

    body.followme-wa-chat .boticon{
      background:transparent !important;
      box-shadow:none !important;
    }


    /* Pulsante chiusura chat utente */
    .followme-public-close-chat{
      position:absolute;
      right:10px;
      top:calc(10px + env(safe-area-inset-top));
      z-index:5;
      min-height:32px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:rgba(255,255,255,.82);
      color:#3a3f41;
      font-size:.74rem;
      font-weight:850;
      padding:0 10px;
      box-shadow:0 1px 2px rgba(0,0,0,.08);
    }

    body.followme-chat-closed .composer{
      opacity:.55;
      pointer-events:none;
    }

    body.followme-chat-closed .followme-public-close-chat{
      display:none;
    }


    /* Scelta info discreta se l'utente scrive subito */
    .choices .choice-prompt{
      grid-column:1 / -1;
      margin:0 0 4px;
      padding:0 2px;
      color:#667071;
      font-size:.78rem;
      font-weight:800;
      text-align:left;
    }

    body.followme-wa-chat .choices .choice-prompt{
      color:#667071 !important;
    }


    /* Preview allegati lato utente FollowMe */
    .followme-attachment-card{
      display:grid;
      gap:7px;
      max-width:240px;
    }

    .followme-attachment-image{
      display:block;
      width:220px;
      max-width:70vw;
      border-radius:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.14);
      background:#eee;
    }

    .followme-attachment-file,
    .followme-attachment-location,
    .followme-attachment-audio{
      display:flex;
      align-items:center;
      gap:9px;
      padding:10px 11px;
      border-radius:12px;
      background:rgba(255,255,255,.58);
      border:1px solid rgba(0,0,0,.08);
      color:#253033;
      text-decoration:none;
      font-weight:800;
      line-height:1.25;
    }

    .followme-attachment-audio audio{
      width:210px;

    }

    .followme-attachment-name{
      display:block;
      font-size:.82rem;
      word-break:break-word;
    }

    .followme-attachment-meta{
      display:block;
      margin-top:2px;
      color:#667071;
      font-size:.68rem;
      font-weight:700;
    }


    /* Chat chiusa da Admin */
    .followme-public-admin-closed{
      display:none;
      margin:10px auto;
      max-width:88%;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.86);
      color:#3a3f41;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 1px 2px rgba(0,0,0,.08);
      font-size:.86rem;
      line-height:1.35;
      font-weight:750;
      text-align:center;
    }

    body.followme-public-session-closed .followme-public-admin-closed{
      display:block;
    }

    body.followme-public-session-closed .composer{
      opacity:.55;
      pointer-events:none;
    }


    /* Stato utente bloccato */
    body.followme-public-user-blocked .composer,
    body.followme-public-user-blocked form,
    body.followme-public-user-blocked .followme-public-composer{
      opacity:.55 !important;
      pointer-events:none !important;
    }

    .followme-public-blocked-notice{
      display:none;
      margin:10px auto;
      max-width:88%;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.88);
      color:#3a3f41;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 1px 2px rgba(0,0,0,.08);
      font-size:.86rem;
      line-height:1.35;
      font-weight:750;
      text-align:center;
    }

    body.followme-public-user-blocked .followme-public-blocked-notice{
      display:block;
    }


    /* FollowMe public: utente bloccato */
    .followme-public-blocked-system-message{
      display:none;
      margin:12px auto;
      max-width:88%;
      padding:12px 14px;
      border-radius:15px;
      background:#fff1ef;
      color:#9b241c;
      border:1px solid rgba(155,36,28,.18);
      box-shadow:0 1px 3px rgba(0,0,0,.08);
      font-size:.9rem;
      line-height:1.35;
      font-weight:850;
      text-align:center;
    }

    body.followme-public-user-blocked .followme-public-blocked-system-message{
      display:block;
    }

    body.followme-public-user-blocked textarea,
    body.followme-public-user-blocked input[type="text"],
    body.followme-public-user-blocked button[type="submit"],
    body.followme-public-user-blocked #sendBtn,
    body.followme-public-user-blocked .send-btn{
      opacity:.45 !important;
      pointer-events:none !important;
    }

    body:not(.followme-public-uploads-enabled) .followme-public-upload-btn,
    body:not(.followme-public-uploads-enabled) .followme-public-attach-btn,
    body:not(.followme-public-uploads-enabled) .followme-admin-wa-plus,
    body:not(.followme-public-uploads-enabled) button[aria-label*="alleg"],
    body:not(.followme-public-uploads-enabled) button[aria-label*="Alleg"],
    body:not(.followme-public-uploads-enabled) button[aria-label*="upload"],

      display:none !important;
      visibility:hidden !important;
      pointer-events:none !important;

</style>
</head>
<body class="followme-wa-chat">
  <main class="chat">
    <header class="top">
      <div class="avatar">🤖</div>
      <div>
        <h1>FollowMe Chat</h1>
        <p id="statusText" style="display:none!important;" aria-hidden="true"></p>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <footer>
      <div class="smallnote">Scrivi qui. Il proprietario riceverà il tuo messaggio in questa chat.</div>
      <div class="composer">
        <textarea id="messageInput" placeholder="Scrivi un messaggio..." rows="1"></textarea>
        <button id="sendBtn">Invia</button>
      </div>
    </footer>
  
<div class="followme-public-blocked-system-message" id="followmePublicBlockedSystemMessage">
  Sei stato bloccato dal sistema.
</div>

</main>

<script>
(function(){
  const TOKEN = (location.pathname.match(/\/fm\/chat\/c\/([^\/?#]+)/i)||[])[1] || "";
  let sessionId = "";
  let lastMessageId = 0;
  let realConversationStarted = false;
  let robotTimers = [];
  let followMeInfoChoiceSent = false;
  let followMeInfoExplained = false;
  let followMeRobotFallbackSent = false;
  let followMeInfoChoiceRendered = false;
  const renderedMessageKeys = new Set();
  const messages = document.getElementById("messages");
  const statusText = document.getElementById("statusText");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  function scrollBottom(){
    messages.scrollTop = messages.scrollHeight;
  }

  function scheduleRobot(fn, delay){
    const t = setTimeout(function(){
      if(!realConversationStarted){
        fn();
      }
    }, delay);
    robotTimers.push(t);
    return t;
  }

  function stopRobotSequence(){
    realConversationStarted = true;
    robotTimers.forEach(clearTimeout);
    robotTimers = [];

    try{
      document.querySelectorAll(".choices").forEach(el => el.remove());
      document.querySelectorAll("[data-robot-typing='1']").forEach(el => el.remove());
    }catch(e){}
  }

  function messageKey(sender, text, id){
    if(id) return "id:" + id;
    return String(sender || "") + ":" + String(text || "").replace(/\s+/g, " ").trim().slice(0, 180);
  }

  function alreadyRendered(sender, text, id){
    const key = messageKey(sender, text, id);
    if(renderedMessageKeys.has(key)) return true;
    renderedMessageKeys.add(key);
    return false;
  }

  function row(kind, html, typing){
    const r = document.createElement("div");
    r.className = "msgrow " + (kind === "user" ? "user" : (kind === "admin" ? "admin" : "bot"));

    if(kind === "bot"){
      const ico = document.createElement("div");
      ico.className = "boticon";
      ico.textContent = "🤖";
      r.appendChild(ico);
    }

    if(kind === "admin"){
      const ico = document.createElement("div");
      ico.className = "adminicon";
      ico.setAttribute("aria-label", "Admin");
      r.appendChild(ico);
    }

    const b = document.createElement("div");
    b.className = "bubble";
    if(typing){
      r.setAttribute("data-robot-typing", "1");
      b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    }else{
      b.innerHTML = html;
    }
    r.appendChild(b);
    messages.appendChild(r);
    scrollBottom();
    return r;
  }

  function addBot(text){
    row("bot", text.replace(/\n/g,"<br>"));
  }

  function addBotHtml(html){
    row("bot", String(html || ""));
  }

  function tokenizeHtmlForTyping(html){
    const tokens = [];
    const re = /(<[^>]+>|[^<])/g;
    let m;
    while((m = re.exec(String(html || ""))) !== null){
      tokens.push(m[0]);
    }
    return tokens;
  }

  function typeBotHtml(html){
    const r = row("bot", "", false);
    const bubble = r.querySelector(".bubble");
    if(!bubble) return;

    const tokens = tokenizeHtmlForTyping(html);
    let out = "";
    let i = 0;

    function currentDelay(token, previousOutput){
      if(token && token.startsWith("<strong")) return 80;
      if(previousOutput.endsWith("</strong>")) return 260;
      if(/[.!?]$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 360;
      if(/:$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 280;
      if(token === "<br>") return 220;

      // Rallenta leggermente quando siamo dentro un grassetto aperto.
      const openStrong = (previousOutput.match(/<strong>/g) || []).length;
      const closeStrong = (previousOutput.match(/<\/strong>/g) || []).length;
      if(openStrong > closeStrong) return 44;

      return 24;
    }

    function step(){
      if(i >= tokens.length){
        bubble.innerHTML = out;
        scrollBottom();
        return;
      }

      const token = tokens[i++];
      out += token;
      bubble.innerHTML = out + '<span class="typed-cursor"></span>';
      scrollBottom();

      setTimeout(step, currentDelay(token, out));
    }

    step();
  }

  function addUser(text){
    row("user", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function addAdmin(text){
    row("admin", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function botTypingThen(text, delay){
    if(realConversationStarted) return;

    const t = row("bot", "", true);
    scheduleRobot(()=>{
      if(realConversationStarted){
        t.remove();
        return;
      }
      t.remove();
      addBot(text);
    }, delay || 900);
  }

  function addChoices(){
    if(followMeInfoChoiceRendered) return;
    followMeInfoChoiceRendered = true;

    const wrap = document.createElement("div");
    wrap.className = "choices";

    if(realConversationStarted){
      const prompt = document.createElement("div");
      prompt.className = "choice-prompt";
      prompt.textContent = "Vuoi sapere cosa sono?";
      wrap.appendChild(prompt);
    }

    const yes = document.createElement("button");
    yes.className = "choice";
    yes.textContent = "👀 Sì, raccontami";

    const no = document.createElement("button");
    no.className = "choice";
    no.textContent = "No, aspetto";

    yes.onclick = ()=>{
      wrap.remove();
      addUser("Sì, raccontami");
      followMeInfoChoiceSent = true;

      addBot("Va bene, resto qui con te in attesa.");
    };

    wrap.appendChild(yes);
    wrap.appendChild(no);
    messages.appendChild(wrap);
    scrollBottom();
  }

  async function createSession(){
    const res = await fetch("/api/followme/chat/" + encodeURIComponent(TOKEN) + "/session", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ source:"public_chat" })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || "Errore apertura chat");
    sessionId = data.session_id;
    statusText.textContent = "";
  }


  function playFollowMeSendSound(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;

      const ctx = new AudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = "sine";
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.055);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.13);

      filter.type = "highpass";
      filter.frequency.setValueAtTime(420, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.075, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.17);

      setTimeout(()=>ctx.close().catch(()=>{}), 280);
    }catch(e){}
  }

  function isFollowMeMeaningfulQuestion(text){
    const t = String(text || "").toLowerCase().trim();

    if(!t) return false;

    const hasQuestionMark = t.includes("?");

    const keywords = [
      "quanto costa",
      "costo",
      "costa",
      "prezzo",
      "prezzi",
      "dove lo compro",
      "dove posso comprar",
      "comprare",
      "acquistare",
      "acquisto",
      "come funziona",
      "funziona",
      "posso averlo",
      "averlo",
      "lo voglio",
      "mi interessa",
      "informazioni",
      "info",
      "dettagli",
      "abbonamento",
      "canone",
      "attivarlo",
      "attivare",
      "qr dinamico",
      "followme"
    ];

    if(hasQuestionMark && t.length >= 4) return true;

    return keywords.some(k => t.includes(k));
  }

  async function sendSystemNoteToOwner(message){
    if(!sessionId || !message) return;

    try{
      await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ sender:"visitor", message:message })
      });
    }catch(e){}
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text || !sessionId) return;

    const shouldRobotFallback = followMeInfoExplained && !followMeRobotFallbackSent && isFollowMeMeaningfulQuestion(text);

    stopRobotSequence();

    input.value = "";
    addUser(text);
    playFollowMeSendSound();
    alreadyRendered("visitor", text, null);

    if(!followMeInfoChoiceSent && !followMeInfoChoiceRendered){
      setTimeout(function(){
        addChoices();
      }, 650);
    }

    if(shouldRobotFallback){
      followMeRobotFallbackSent = true;
      setTimeout(function(){
        addBot("Mi piacerebbe aiutarti, ma io sono solo il robottino di accoglienza 🤖<br><br>Per <strong>prezzi, acquisto o dettagli pratici</strong> deve risponderti il proprietario.<br><br><strong>Puoi attendere ancora un momento?</strong>");
      }, 650);
    }

    const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ sender:"visitor", message:text })
    });

    const data = await res.json().catch(()=>null);
    if(data && data.success && data.message && data.message.id){
      lastMessageId = Math.max(lastMessageId, Number(data.message.id) || 0);
      alreadyRendered("visitor", text, data.message.id);
      setTimeout(poll, 700);
    }
  }

  async function poll(){
    if(!sessionId) return;
    try{
      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/messages?after=" + encodeURIComponent(lastMessageId), { cache:"no-store" });
      const data = await res.json();
      if(data.success && Array.isArray(data.messages)){
        data.messages.forEach(m=>{
          lastMessageId = Math.max(lastMessageId, Number(m.id)||0);
          if(m.sender === "owner"){
            stopRobotSequence();
            addAdmin(String(m.message || ""));
          }
        });
      }
    }catch(e){}
  }

  async function boot(){
    try{
      await createSession();

      botTypingThen("Ciao, sono <strong>FollowMe QR</strong> 👋", 800);

      scheduleRobot(()=>botTypingThen("Ho avvisato il proprietario che ti sei collegato.<br>Se è disponibile, ti risponderà qui.", 850), 1800);

      scheduleRobot(()=>botTypingThen("Mentre aspetti, vuoi sapere <strong>cosa sono</strong>?", 750), 4200);

      scheduleRobot(addChoices, 5600);

      setInterval(poll, 1500);
    }catch(err){
      statusText.textContent = "Chat non disponibile";
      addBot("Mi dispiace, la chat non è disponibile in questo momento.");
      console.error(err);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  boot();
})();
</script>

  function ensureBlockedNotice(){
    let notice = document.getElementById("fmPublicBlockedNotice20260519");
    if(notice) return notice;

    notice = document.createElement("div");
    notice.id = "fmPublicBlockedNotice20260519";
    notice.textContent = "Digita il testo qui e premi invio";

    const composer = findComposer();
    if(composer && composer.parentNode){
      composer.parentNode.insertBefore(notice, composer);
    }else{
      document.body.appendChild(notice);
    }

    return notice;
  }

  function ensureInlinePlus(){
    const composer = findComposer();
    const input = findInput();

    if(!composer || !input) return;

    composer.classList.add("fm-public-composer-inline-plus-ready");

    try{
      if(getComputedStyle(composer).position === "static"){
        composer.style.position = "relative";
      }
    }catch(e){
      composer.style.position = "relative";
    }

    let plus = document.getElementById("fmPublicInlinePlusBtn20260519");
    if(!plus){
      plus = document.createElement("button");
      plus.type = "button";
      plus.id = "fmPublicInlinePlusBtn20260519";
      plus.setAttribute("aria-label", "Aggiungi");
      plus.textContent = "+";
      input.parentNode.insertBefore(plus, input);
    }else if(plus.nextSibling !== input){
      input.parentNode.insertBefore(plus, input);
    }

    let menu = document.getElementById("fmPublicAttachMenu20260519");
    if(!menu){
      menu = document.createElement("div");
      menu.id = "fmPublicAttachMenu20260519";
      menu.innerHTML = `

        <button type="button" id="fmPublicFileBtn20260519">📎 Documento</button>
        <button type="button" id="fmPublicLocationBtn20260519">📍 Posizione</button>
        <button type="button" id="fmPublicAudioBtn20260519">🎙️ Audio</button>
        <input type="file" id="fmPublicPhotoInput20260519" accept="image/*" capture="environment" hidden>
        <input type="file" id="fmPublicFileInput20260519" hidden>
      `;
      composer.appendChild(menu);
    }

    bindMenu();
  }

  function canUseExtra(){
    return document.body.classList.contains("fm-public-extra-inline-on") &&
           !document.body.classList.contains("fm-public-clean-blocked");
  }

  function toggleMenu(force){
    const menu = document.getElementById("fmPublicAttachMenu20260519");
    if(!menu) return;

    if(!canUseExtra()){
      menu.classList.remove("is-open");
      return;
    }

    const open = typeof force === "boolean" ? force : !menu.classList.contains("is-open");
    menu.classList.toggle("is-open", open);
  }

  async function uploadBlob(blob, filename, kind, mime){
    const sid = getSid();
    if(!sid) throw new Error("Sessione chat mancante.");
    if(!blob) throw new Error("File mancante.");

    const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/attachment-raw", {
      method:"POST",
      headers:{
        "Content-Type": mime || blob.type || "application/octet-stream",
        "X-FollowMe-Sender": "visitor",
        "X-FollowMe-Kind": kind || "document",
        "X-FollowMe-Filename": encodeURIComponent(filename || "allegato")
      },
      body: await blob.arrayBuffer()
    });

    const data = await res.json().catch(()=>null);
    if(!res.ok || !data || !data.success){
      throw new Error((data && data.error) || "Errore invio allegato.");
    }

    toggleMenu(false);
    forceLoadMessages();
  }

  async function uploadFile(file, kind){
    if(!file) return;
    await uploadBlob(file, file.name || "allegato", kind || (file.type && file.type.indexOf("image/") === 0 ? "image" : "document"), file.type);
  }

  function forceLoadMessages(){
    try{ if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages(); }catch(e){}
    try{ if(typeof window.loadMessages === "function") window.loadMessages(); }catch(e){}
    setTimeout(renderAttachmentsInBubbles, 80);
    setTimeout(renderAttachmentsInBubbles, 400);
  }

  async function sendLocation(){
    if(!navigator.geolocation){
      alert("Geolocalizzazione non disponibile.");
      return;
    }

    navigator.geolocation.getCurrentPosition(async function(pos){
      try{
        const sid = getSid();
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const url = "https://www.google.com/maps?q=" + encodeURIComponent(lat + "," + lng);

        const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/attachment", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({
            sender:"visitor",
            kind:"location",
            url:url,
            label:"Posizione condivisa",
            mime:"text/uri-list",
            filename:"posizione"
          })
        });

        const data = await res.json().catch(()=>null);
        if(!res.ok || !data || !data.success){
          throw new Error((data && data.error) || "Errore invio posizione.");
        }

        toggleMenu(false);
        forceLoadMessages();
      }catch(e){
        alert(e.message || "Errore invio posizione.");
      }
    }, function(){
      alert("Posizione non autorizzata.");
    }, {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    });
  }

  async function toggleAudioRecording(){
    try{
      if(recording && mediaRecorder){
        mediaRecorder.stop();
        return;
      }

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        alert("Registrazione audio non supportata su questo dispositivo.");
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioChunks = [];

      mediaRecorder = new MediaRecorder(stream);
      recording = true;

      const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
      if(audioBtn) audioBtn.textContent = "⏹️ Stop audio";

      mediaRecorder.ondataavailable = function(ev){
        if(ev.data && ev.data.size > 0) audioChunks.push(ev.data);
      };

      mediaRecorder.onstop = async function(){
        recording = false;

        try{
          stream.getTracks().forEach(t => t.stop());
        }catch(e){}

        const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
        if(audioBtn) audioBtn.textContent = "🎙️ Audio";

        try{
          const mime = audioChunks[0] ? audioChunks[0].type || "audio/webm" : "audio/webm";
          const blob = new Blob(audioChunks, { type:mime });
          await uploadBlob(blob, "audio_" + Date.now() + ".webm", "audio", mime);
        }catch(e){
          alert(e.message || "Errore invio audio.");
        }
      };

      mediaRecorder.start();
    }catch(e){
      recording = false;
      alert(e.message || "Errore registrazione audio.");
    }
  }

  function bindMenu(){
    const plus = document.getElementById("fmPublicInlinePlusBtn20260519");
    const photoBtn = document.getElementById("fmPublicPhotoBtn20260519");
    const fileBtn = document.getElementById("fmPublicFileBtn20260519");
    const locBtn = document.getElementById("fmPublicLocationBtn20260519");
    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    const photoInput = document.getElementById("fmPublicPhotoInput20260519");
    const fileInput = document.getElementById("fmPublicFileInput20260519");

    if(plus && plus.dataset.boundInlinePlus !== "1"){
      plus.dataset.boundInlinePlus = "1";
      plus.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        toggleMenu();
      }, true);
    }

    if(photoBtn && photoBtn.dataset.boundInlinePlus !== "1"){
      photoBtn.dataset.boundInlinePlus = "1";
      photoBtn.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(canUseExtra() && photoInput) photoInput.click();
      }, true);
    }

    if(fileBtn && fileBtn.dataset.boundInlinePlus !== "1"){
      fileBtn.dataset.boundInlinePlus = "1";
      fileBtn.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(canUseExtra() && fileInput) fileInput.click();
      }, true);
    }

    if(locBtn && locBtn.dataset.boundInlinePlus !== "1"){
      locBtn.dataset.boundInlinePlus = "1";
      locBtn.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(canUseExtra()) sendLocation();
      }, true);
    }

    if(audioBtn && audioBtn.dataset.boundInlinePlus !== "1"){
      audioBtn.dataset.boundInlinePlus = "1";
      audioBtn.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(canUseExtra()) toggleAudioRecording();
      }, true);
    }

    if(photoInput && photoInput.dataset.boundInlinePlus !== "1"){
      photoInput.dataset.boundInlinePlus = "1";
      photoInput.addEventListener("change", async function(){
        const file = photoInput.files && photoInput.files[0];
        if(!file) return;
        try{ await uploadFile(file, "image"); }
        catch(e){ alert(e.message || "Errore invio foto."); }
        finally{ photoInput.value = ""; }
      });
    }

    if(fileInput && fileInput.dataset.boundInlinePlus !== "1"){
      fileInput.dataset.boundInlinePlus = "1";
      fileInput.addEventListener("change", async function(){
        const file = fileInput.files && fileInput.files[0];
        if(!file) return;
        try{ await uploadFile(file, "document"); }
        catch(e){ alert(e.message || "Errore invio documento."); }
        finally{ fileInput.value = ""; }
      });
    }

    if(!document.body.dataset.fmInlinePlusCloseBound){
      document.body.dataset.fmInlinePlusCloseBound = "1";
      document.addEventListener("click", function(ev){
        const menu = document.getElementById("fmPublicAttachMenu20260519");
        const plus = document.getElementById("fmPublicInlinePlusBtn20260519");
        if(!menu || !menu.classList.contains("is-open")) return;
        if(menu.contains(ev.target) || (plus && plus.contains(ev.target))) return;
        menu.classList.remove("is-open");
      }, true);
    }
  }

  function renderAttachmentsInBubbles(){
    document.querySelectorAll(".message, .bubble, .followme-public-bubble, .followme-owner-chat-bubble").forEach(function(b){
      if(b.dataset.fmAttachmentRendered === "1") return;

      const txt = (b.textContent || "").trim();
      const a = parseAttachmentMessage(txt);

      if(!a) return;

      b.dataset.fmAttachmentRendered = "1";
      b.innerHTML = renderAttachment(a);
    });
  }

  async function recoverOpenSession(){
    try{
      const res = await fetch("/api/followme/FM-DEMO/chat/sessions?v=" + Date.now(), { cache:"no-store" });
      const data = await res.json().catch(()=>null);

      if(!res.ok || !data || !data.success) return "";

      const sessions = Array.isArray(data.sessions) ? data.sessions : [];
      const open = sessions.filter(s => s && s.status === "open");
      const chosen = open[0] || sessions[0];

      if(chosen && chosen.id) return saveSid(chosen.id);
    }catch(e){}

    return "";
  }

  function applyState(session){
    if(!session) return;

    const sid = session.id ? saveSid(session.id) : getSid();
    const uploads = !!session.uploads_enabled;
    const blocked = !!session.is_blocked;
    const key = String(sid) + "|" + uploads + "|" + blocked + "|" + String(session.updated_at || "");

    if(key !== lastStateKey){
      lastStateKey = key;

      document.body.classList.toggle("fm-public-extra-inline-on", uploads);
      document.body.classList.toggle("fm-public-clean-blocked", blocked);
      document.body.classList.toggle("followme-public-uploads-enabled", uploads);
      document.body.classList.toggle("followme-public-user-blocked", blocked);

      const input = findInput();
      const send = findSend();

      if(input){
        input.disabled = blocked;
        if(blocked){
          input.dataset.oldPlaceholder = input.dataset.oldPlaceholder || input.placeholder || "";
          input.placeholder = "Digita il testo qui e premi invio";
        }else if(input.dataset.oldPlaceholder){
          input.placeholder = input.dataset.oldPlaceholder;
        }
      }

      if(send) send.disabled = blocked;

      if(!uploads) toggleMenu(false);
    }

    ensureBlockedNotice();
    ensureInlinePlus();
    renderAttachmentsInBubbles();
  }

  async function fetchState(force){
    const now = Date.now();
    if(!force && now - lastStateAt < 1200) return;
    if(stateBusy) return;

    lastStateAt = now;
    stateBusy = true;

    try{
      let sid = getSid();
      if(!sid) sid = await recoverOpenSession();
      if(!sid) return;

      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
        cache:"no-store"
      });

      const data = await res.json().catch(()=>null);

      if(res.status === 404 || !data || !data.success){
        clearSid();
        sid = await recoverOpenSession();
        if(!sid) return;

        const res2 = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
          cache:"no-store"
        });

        const data2 = await res2.json().catch(()=>null);
        if(!res2.ok || !data2 || !data2.success) return;

        applyState(data2.session);
        return;
      }

      applyState(data.session);
    }catch(e){
      console.warn("[FM public inline plus] state error", e);
    }finally{
      stateBusy = false;
    }
  }

  if(!window.__fmPublicInlinePlusFetchBridge20260519){
    window.__fmPublicInlinePlusFetchBridge20260519 = true;
    const oldFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await oldFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        if(url && url.includes("/api/followme/chat/") && !url.includes("/messages?")){
          const clone = res.clone();
          const data = await clone.json().catch(()=>null);
          const sid = extractSid(data);

          if(sid){
            saveSid(sid);
            setTimeout(function(){ fetchState(true); }, 120);
          }
        }

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/messages")){
          setTimeout(renderAttachmentsInBubbles, 80);
          setTimeout(renderAttachmentsInBubbles, 400);
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    injectCss();
    ensureBlockedNotice();
    ensureInlinePlus();
    fetchState(true);
    renderAttachmentsInBubbles();

    setTimeout(ensureInlinePlus, 300);
    setTimeout(renderAttachmentsInBubbles, 700);
  }

  window.fmPublicForceFetchState20260518 = function(){ return fetchState(true); };
  window.fmPublicInlinePlusState20260519 = function(){ return { sid:getSid(), lastStateKey:lastStateKey }; };

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(function(){ fetchState(true); renderAttachmentsInBubbles(); }, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(function(){ fetchState(true); ensureInlinePlus(); renderAttachmentsInBubbles(); }, 250);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      setTimeout(function(){ fetchState(true); ensureInlinePlus(); renderAttachmentsInBubbles(); }, 250);
    }
  });

  setInterval(function(){
    fetchState(false);
    ensureInlinePlus();
    renderAttachmentsInBubbles();
  }, 2500);
})();
</script>



<script id="followme-public-upload-render-like-admin-20260519">
(function(){
  if(window.__FollowMePublicUploadRenderLikeAdmin20260519) return;
  window.__FollowMePublicUploadRenderLikeAdmin20260519 = true;

  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function parseAttachmentMessage(message){
    try{
      const obj = typeof message === "string" ? JSON.parse(message) : message;
      if(obj && obj.__followme_attachment) return obj;
    }catch(e){}
    return null;
  }

  function renderAttachment(a){
    const url = a.url || "";
    const name = a.label || a.filename || "Allegato";
    const mime = a.mime || "";
    const kind = a.kind || "";

    if(kind === "image" || mime.indexOf("image/") === 0){
      return '<a class="followme-attachment-card" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<img class="followme-attachment-image" src="' + esc(url) + '" alt="' + esc(name) + '">' +
        '<span class="followme-attachment-meta">' + esc(name) + (a.temporary ? ' · Allegato temporaneo' : '') + '</span>' +
      '</a>';
    }

    if(kind === "audio" || mime.indexOf("audio/") === 0){
      return '<div class="followme-attachment-audio">' +
        '<span>🎙️</span><audio controls src="' + esc(url) + '"></audio>' +
      '</div>';
    }

    if(kind === "location"){
      return '<a class="followme-attachment-location" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<span>📍</span><span><span class="followme-attachment-name">Posizione condivisa</span><span class="followme-attachment-meta">Apri mappa</span></span>' +
      '</a>';
    }

    return '<a class="followme-attachment-file" href="' + esc(url) + '" target="_blank" rel="noopener" download>' +
      '<span>📎</span><span><span class="followme-attachment-name">' + esc(name) + '</span><span class="followme-attachment-meta">Apri documento</span></span>' +
    '</a>';
  }

  function findMessagesBox(){
    return document.getElementById("messages") ||
           document.getElementById("chatMessages") ||
           document.getElementById("followmePublicMessages") ||
           document.querySelector(".messages") ||
           document.querySelector(".chat-messages") ||
           document.querySelector(".followme-public-messages") ||
           document.querySelector("main") ||
           document.body;
  }

  function appendLocalAttachmentBubble(attachment, sender){
    const box = findMessagesBox();
    if(!box || !attachment) return;

    const bubble = document.createElement("div");
    bubble.className = "message bubble followme-public-bubble " + (sender === "owner" ? "owner" : "visitor");
    bubble.dataset.fmAttachmentRendered = "1";
    bubble.innerHTML = renderAttachment(attachment);

    box.appendChild(bubble);

    try{
      box.scrollTop = box.scrollHeight;
    }catch(e){}

    setTimeout(renderAllAttachments, 80);
    setTimeout(renderAllAttachments, 400);
  }

  function renderAllAttachments(){
    document.querySelectorAll(".message, .bubble, .followme-public-bubble, .followme-owner-chat-bubble, [data-message-id]").forEach(function(b){
      if(b.dataset.fmAttachmentRendered === "1") return;

      const txt = (b.textContent || "").trim();
      const a = parseAttachmentMessage(txt);

      if(!a) return;

      b.dataset.fmAttachmentRendered = "1";
      b.innerHTML = renderAttachment(a);
    });
  }

  async function callOriginalFetch(input, init){
    return window.__fmOriginalFetchForPublicUpload20260519(input, init);
  }

  if(!window.__fmOriginalFetchForPublicUpload20260519){
    window.__fmOriginalFetchForPublicUpload20260519 = window.fetch.bind(window);
  }

  if(!window.__fmPublicUploadRenderFetchPatched20260519){
    window.__fmPublicUploadRenderFetchPatched20260519 = true;

    window.fetch = async function(input, init){
      const res = await callOriginalFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        const isAttachment =
          url &&
          url.includes("/api/followme/chat/session/") &&
          (url.includes("/attachment-raw") || url.includes("/attachment"));

        if(isAttachment){
          const clone = res.clone();
          const data = await clone.json().catch(()=>null);

          if(data && data.success){
            const attachment =
              data.attachment ||
              (data.message && parseAttachmentMessage(data.message.message)) ||
              null;

            if(attachment){
              appendLocalAttachmentBubble(attachment, "visitor");
            }

            setTimeout(renderAllAttachments, 80);
            setTimeout(renderAllAttachments, 400);
            setTimeout(renderAllAttachments, 1200);
          }
        }

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/messages")){
          setTimeout(renderAllAttachments, 80);
          setTimeout(renderAllAttachments, 400);
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    renderAllAttachments();

    // Rende disponibili funzioni globali anche agli script precedenti.
    window.fmPublicAppendLocalAttachmentBubble20260519 = appendLocalAttachmentBubble;
    window.fmPublicRenderAllAttachments20260519 = renderAllAttachments;
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(renderAllAttachments, 1000);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(renderAllAttachments, 250);
  });

  setInterval(renderAllAttachments, 1500);
})();
</script>



<script id="followme-public-audio-state-reset-final-20260519">
(function(){
  if(window.__FollowMePublicAudioStateResetFinal20260519) return;
  window.__FollowMePublicAudioStateResetFinal20260519 = true;

  let forcedAudioOpenAt = 0;

  function setAudioBtnIdle(){
    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(audioBtn){
      audioBtn.textContent = "🎙️ Audio";
      audioBtn.disabled = false;
      audioBtn.removeAttribute("disabled");
      audioBtn.dataset.recording = "0";

    try{
      if(window.fmAudioSuccessOnlyState20260519){
        // Solo lettura: non possiamo azzerare le closure interne, ma impediamo lo stato UI sporco.
        window.__fmAudioLastHardResetAt = Date.now();
      }
    }catch(e){}

    try{
      if(window.fmAudioMultipleSendFixState20260519){
        window.__fmAudioLastHardResetAt = Date.now();
      }
    }catch(e){}
  }

  /*
    Patch del pulsante +:
    ogni volta che riapro il menu allegati, l'audio deve ripartire da stato pulito.
  */
  function patchPlusButton(){
    const plus = document.getElementById("fmPublicInlinePlusBtn20260519");
    if(!plus || plus.dataset.audioResetPlusBound === "1") return;

    plus.dataset.audioResetPlusBound = "1";

    plus.addEventListener("click", function(){
      hardResetAudioUi();
    }, true);
  }

  /*
    Patch del pulsante Audio:
    non deve mai mostrare Stop audio prima di essere entrati nel pannello.
    Quando lo clicco, resetta e poi apre il pannello pulito.
  */
  function patchAudioButton(){
    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(!audioBtn) return;

    if(audioBtn.textContent.trim().toLowerCase().includes("stop")){
      setAudioBtnIdle();
    }

    if(audioBtn.dataset.audioResetFinalBound === "1") return;

    audioBtn.dataset.audioResetFinalBound = "1";

    audioBtn.addEventListener("click", function(ev){
      /*

  */
  function patchStartButton(){

    start.dataset.audioResetStartBound = "1";

        send.setAttribute("disabled", "disabled");

      const stop = document.getElementById("fmPublicAudioStop20260519");

        stop.disabled = false;
        stop.removeAttribute("disabled");

    stop.dataset.audioResetStopBound = "1";

    stop.addEventListener("click", function(){

          send.removeAttribute("disabled");

    }, true);

  /*

    dopo un invio, riuscito o fallito, il ciclo deve tornare pulito.
    Il messaggio in chat viene comunque gestito dalle patch di rendering esistenti.

  function patchSendButton(){
    const send = document.getElementById("fmPublicAudioSend20260519");

    send.dataset.audioResetSendBound = "1";

    send.addEventListener("click", function(){

        setAudioBtnIdle();

      setTimeout(function(){
        closeAudioPanel();
        hardResetAudioUi();
      }, 1800);

      setTimeout(function(){
        hardResetAudioUi();
      }, 3500);
    }, false);

  function patchCancelButton(){

    if(!cancel || cancel.dataset.audioResetCancelBound === "1") return;

    cancel.dataset.audioResetCancelBound = "1";

    cancel.addEventListener("click", function(){
      closeAudioPanel();
      hardResetAudioUi();
    }, true);
  }

  /*
    Osservatore: se qualsiasi vecchio script rimette "Stop audio" sul bottone menu,
    lo correggiamo, tranne durante i primi istanti del click Audio.
  */
  function watchAudioButtonLabel(){
    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(!audioBtn || audioBtn.dataset.audioLabelObserver === "1") return;

    audioBtn.dataset.audioLabelObserver = "1";

    const obs = new MutationObserver(function(){
      const t = String(audioBtn.textContent || "").trim().toLowerCase();

      if(t.includes("stop") && Date.now() - forcedAudioOpenAt > 300){
        setAudioBtnIdle();
      }
    });

    obs.observe(audioBtn, { childList:true, characterData:true, subtree:true });
  }

  function boot(){
    patchPlusButton();
    patchAudioButton();
    patchStartButton();
    patchStopButton();
    patchSendButton();
    patchCancelButton();
    watchAudioButtonLabel();

    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(audioBtn && String(audioBtn.textContent || "").toLowerCase().includes("stop")){
      setAudioBtnIdle();
    }

  window.fmPublicHardResetAudioUi20260519 = hardResetAudioUi;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(boot, 900);
    setTimeout(hardResetAudioUi, 1200);

  window.addEventListener("pageshow", function(){

    setTimeout(hardResetAudioUi, 500);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      setTimeout(boot, 250);
      setTimeout(hardResetAudioUi, 500);
    }
  });

  setInterval(boot, 1000);
})();
</script>

<script id="followme-public-audio-clean-controller-20260519">

  let recorder = null;
  let stream = null;
  let chunks = [];
  let blob = null;
  let recording = false;
  let sending = false;

  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function cleanSid(v){
    const s = String(v || "").trim();
    return /^\d+$/.test(s) ? s : "";
  }

  function getSid(){
    try{
      const q = new URLSearchParams(location.search || "");
      const fromUrl = cleanSid(q.get("session") || q.get("chatSession"));
      if(fromUrl) return fromUrl;
    }catch(e){}

    const arr = [
      window.followMeChatSessionId,

    try{ arr.push(sessionStorage.getItem("followme_chat_session_id")); }catch(e){}
    /* localStorage followme_chat_session_id intentionally ignored: each QR user must have a separated chat. */

    for(const v of arr){

      if(sid) return sid;
    }

    return "";
  }

  function canUseExtra(){
    return document.body.classList.contains("fm-public-extra-inline-on") &&
           !document.body.classList.contains("fm-public-clean-blocked") &&

           document.querySelector("main") ||
           document.body;

  function chooseMime(){
    try{
      if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";

      const candidates = [
        "audio/mp4",
        "audio/aac",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];

      for(const t of candidates){
        if(MediaRecorder.isTypeSupported(t)) return t;
      }
    }catch(e){}

    return "";
  }

  function extForMime(mime){
    mime = String(mime || "").toLowerCase();

    if(mime.includes("mp4")) return "m4a";
    if(mime.includes("aac")) return "aac";
    if(mime.includes("ogg")) return "ogg";
    if(mime.includes("webm")) return "webm";

    return "audio";
  }

  function parseAttachmentMessage(message){
    try{
      const obj = typeof message === "string" ? JSON.parse(message) : message;
      if(obj && obj.__followme_attachment) return obj;
    }catch(e){}
    return null;
  }

  function renderAttachment(a){
    const url = a.url || "";
    const name = a.label || a.filename || "Allegato";
    const mime = a.mime || "";
    const kind = a.kind || "";

    if(kind === "audio" || mime.indexOf("audio/") === 0){
      return '<div class="followme-attachment-audio" data-audio-url="' + esc(url) + '">' +
        '<span>🎙️</span><audio controls preload="metadata" src="' + esc(url) + '"></audio>' +
      '</div>';
    }

    if(kind === "image" || mime.indexOf("image/") === 0){
      return '<a class="followme-attachment-card" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<img class="followme-attachment-image" src="' + esc(url) + '" alt="' + esc(name) + '">' +
        '<span class="followme-attachment-meta">' + esc(name) + '</span>' +
      '</a>';
    }

    if(kind === "location"){
      return '<a class="followme-attachment-location" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<span>📍</span><span><span class="followme-attachment-name">Posizione condivisa</span><span class="followme-attachment-meta">Apri mappa</span></span>' +
      '</a>';
    }

    return '<a class="followme-attachment-file" href="' + esc(url) + '" target="_blank" rel="noopener" download>' +
      '<span>📎</span><span><span class="followme-attachment-name">' + esc(name) + '</span><span class="followme-attachment-meta">Apri documento</span></span>' +
    '</a>';
  }

  function appendServerMessage(message){
    if(!message) return;

    const id = String(message.id || "").trim();

  function ensurePanel(){

      if(getComputedStyle(composer).position === "static"){

      <div class="fm-audio-actions">

        <button type="button" id="fmPublicCleanAudioStop20260519" class="warn" disabled>Stop</button>
        <button type="button" id="fmPublicCleanAudioSend20260519" class="primary" disabled>Invia audio</button>
        <button type="button" id="fmPublicCleanAudioCancel20260519" class="danger">Annulla</button>
      </div>
    `;

    composer.appendChild(panel);
    bindPanel();

    return panel;
  }

  function status(msg){
    const el = document.getElementById("fmPublicCleanAudioStatus20260519");
    if(el) el.textContent = msg;
  }

  function setButtons(state){
    const start = document.getElementById("fmPublicCleanAudioStart20260519");
    const stop = document.getElementById("fmPublicCleanAudioStop20260519");
    const send = document.getElementById("fmPublicCleanAudioSend20260519");

    if(!start || !stop || !send) return;

    start.disabled = state === "recording" || state === "sending";
    stop.disabled = state !== "recording";
    send.disabled = state !== "ready";
  }

  function stopStream(){
    try{
      if(stream) stream.getTracks().forEach(t => t.stop());
    }catch(e){}
    stream = null;
  }

  function resetAll(){
    try{
      if(recorder && recording){
        recorder.stop();
      }
    }catch(e){}

    stopStream();

    if(timer){
      clearInterval(timer);
      timer = null;
    }

    recorder = null;
    chunks = [];
    blob = null;
    recording = false;
    sending = false;
    startedAt = 0;

    const oldAudioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(oldAudioBtn){
      oldAudioBtn.textContent = "🎙️ Audio";
      oldAudioBtn.disabled = false;
    }

    setButtons("idle");
    status("Premi Registra per iniziare.");

  function openPanel(){
    if(!canUseExtra()) return;

    ensurePanel();

    const panel = document.getElementById("fmPublicCleanAudioPanel20260519");

  function closePanel(){

  async function startRecording(){
    try{
      if(!canUseExtra()) return;

      resetAll();

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        status("Microfono non supportato da questo dispositivo.");
        return;
      }

      if(!window.MediaRecorder){
        status("Registrazione audio non supportata da questo browser.");
        return;
      }

      status("Richiesta autorizzazione microfono…");

      stream = await navigator.mediaDevices.getUserMedia({ audio:true });

      const mime = chooseMime();
      recorder = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);

      chunks = [];
      blob = null;

      recorder.ondataavailable = function(ev){
        if(ev.data && ev.data.size > 0) chunks.push(ev.data);
      };

      recorder.onstop = function(){
        stopStream();

        if(timer){
          clearInterval(timer);
          timer = null;
        }

        recording = false;

        const finalMime = recorder && recorder.mimeType ? recorder.mimeType : (mime || "audio/webm");
        blob = new Blob(chunks, { type:finalMime });

        if(!blob || blob.size < 1000){
          blob = null;
          setButtons("idle");
          status("Audio troppo breve o vuoto. Riprova.");
          return;
        }

        setButtons("ready");
        status("Audio pronto. Premi Invia audio.");
      };

      recorder.start(250);

      setButtons("recording");

        status("Registrazione in corso… " + sec + "s");
      }, 500);

    }catch(err){
      console.error("clean audio start error:", err);
      resetAll();

      const msg = String(err && (err.name || err.message) || err || "");

      if(msg.includes("NotAllowed") || msg.includes("denied") || msg.includes("Permission")){
        status("Microfono non autorizzato. Consenti il microfono nelle impostazioni e riprova.");
      }else{
        status("Errore microfono: " + (err.message || msg || "non disponibile"));
      }

  }

  function stopRecording(){
    try{
      if(recorder && recording){
        status("Preparazione audio…");
        recorder.stop();
      }

      resetAll();
      status("Errore stop registrazione.");

      const sid = getSid();

      if(!sid){
        status("Sessione chat mancante.");
        return;
      }

      if(!blob || blob.size < 1000){
        status("Nessun audio valido da inviare.");
        return;
      }

      sending = true;
      setButtons("sending");
      status("Invio audio…");

      const mime = blob.type || "audio/webm";
      const ext = extForMime(mime);
      const filename = "audio_" + Date.now() + "." + ext;

      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/attachment-raw", {
        method:"POST",
        headers:{
          "Content-Type": mime,
          "X-FollowMe-Sender": "visitor",
          "X-FollowMe-Kind": "audio",
          "X-FollowMe-Filename": encodeURIComponent(filename)
        },
        body: await blob.arrayBuffer()
      });

      const data = await res.json().catch(function(){ return null; });

      if(!res.ok || !data || !data.success){
        throw new Error((data && data.error) || "Errore invio audio.");
      }

      // Audio: NON aggiungere più una bolla locale.
      // Deve comparire solo dal reload server, altrimenti l'utente lo vede doppio.
      status("Audio inviato.");
      closePanel();

      blob = null;
      chunks = [];
      sending = false;
      setButtons("idle");

      setTimeout(forceReload, 250);
      setTimeout(forceReload, 900);
      setTimeout(forceReload, 1800);

    }catch(err){
      console.error("clean audio send error:", err);
      sending = false;
      setButtons(blob ? "ready" : "idle");
      status(err.message || "Errore invio audio.");
    }
  }

  function bindPanel(){
    const start = document.getElementById("fmPublicCleanAudioStart20260519");
    const stop = document.getElementById("fmPublicCleanAudioStop20260519");
    const send = document.getElementById("fmPublicCleanAudioSend20260519");
    const cancel = document.getElementById("fmPublicCleanAudioCancel20260519");

    if(start && start.dataset.cleanAudioBound !== "1"){
      start.dataset.cleanAudioBound = "1";
      start.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        startRecording();
      }, true);
    }

    if(stop && stop.dataset.cleanAudioBound !== "1"){
      stop.dataset.cleanAudioBound = "1";
      stop.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        stopRecording();
      }, true);
    }

    if(send && send.dataset.cleanAudioBound !== "1"){
      send.dataset.cleanAudioBound = "1";
      send.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        sendAudio();
      }, true);
    }

    if(cancel && cancel.dataset.cleanAudioBound !== "1"){
      cancel.dataset.cleanAudioBound = "1";
      cancel.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        resetAll();
        closePanel();
      }, true);
    }
  }

  function bindAudioIntercept(){
    if(document.body.dataset.cleanAudioDocumentIntercept === "1") return;
    document.body.dataset.cleanAudioDocumentIntercept = "1";

    document.addEventListener("click", function(ev){
      const btn = ev.target && ev.target.closest ? ev.target.closest("#fmPublicAudioBtn20260519") : null;
      if(!btn) return;

      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();

      btn.textContent = "🎙️ Audio";
      openPanel();

  function keepAudioButtonClean(){

  function boot(){

  window.fmPublicCleanAudioController20260519 = {
    openPanel,
    resetAll,
    state:function(){
      return {
        recording,
        sending,
        hasBlob:!!blob,
        blobSize:blob ? blob.size : 0,
        sid:getSid(),
        mime:blob ? blob.type : chooseMime()
      };
