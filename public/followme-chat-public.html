<script id="followme-public-audio-server-truth-render-20260519">
(function(){
  if(window.__FollowMePublicAudioServerTruthRender20260519) return;
  window.__FollowMePublicAudioServerTruthRender20260519 = true;

  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function parseAttachment(message){
    try{
      const obj = typeof message === "string" ? JSON.parse(message) : message;
      if(obj && obj.__followme_attachment) return obj;
    }catch(e){}
    return null;
  }

  function isAudio(a){
    return !!a && (
      a.kind === "audio" ||
      String(a.mime || "").toLowerCase().indexOf("audio/") === 0
    );
  }

  function renderAttachment(a){
    const url = a.url || "";
    const mime = a.mime || "";
    const kind = a.kind || "";
    const name = a.label || a.filename || "Allegato";

    if(kind === "audio" || mime.indexOf("audio/") === 0){
      return '<div class="followme-attachment-audio" data-audio-url="' + esc(url) + '">' +
        '<span>🎙️</span><audio controls preload="metadata" src="' + esc(url) + '"></audio>' +
      '</div>';
    }

    if(kind === "image" || mime.indexOf("image/") === 0){
      return '<a class="followme-attachment-card" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<img class="followme-attachment-image" src="' + esc(url) + '" alt="' + esc(name) + '">' +
        '<span class="followme-attachment-meta">' + esc(name) + '</span>' +
      '</a>';
    }

    if(kind === "location"){
      return '<a class="followme-attachment-location" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<span>📍</span><span><span class="followme-attachment-name">Posizione condivisa</span><span class="followme-attachment-meta">Apri mappa</span></span>' +
      '</a>';
    }

    return '<a class="followme-attachment-file" href="' + esc(url) + '" target="_blank" rel="noopener" download>' +
      '<span>📎</span><span><span class="followme-attachment-name">' + esc(name) + '</span><span class="followme-attachment-meta">Apri documento</span></span>' +
    '</a>';
  }

  function box(){
    return document.getElementById("messages") ||
           document.getElementById("chatMessages") ||
           document.getElementById("followmePublicMessages") ||
           document.querySelector(".messages") ||
           document.querySelector(".chat-messages") ||
           document.querySelector(".followme-public-messages") ||
           document.querySelector("main") ||
           document.body;
  }

  function removeLocalAudioGhosts(){
    document.querySelectorAll(".followme-public-bubble, .message, .bubble").forEach(function(el){
      const html = el.innerHTML || "";
      const txt = el.textContent || "";

      const looksAudio =
        html.includes("<audio") ||
        html.includes("followme-attachment-audio") ||
        txt.includes('"kind":"audio"') ||
        txt.includes('"kind": "audio"');

      if(!looksAudio) return;

      const hasServerId =
        el.hasAttribute("data-message-id") ||
        el.dataset.messageId ||
        el.dataset.serverMessageId;

      if(!hasServerId){
        el.remove();
      }
    });
  }

  function renderOne(m){
    if(!m) return;

    const id = String(m.id || "").trim();
    const a = parseAttachment(m.message);

    if(!id || !a) return;

    const existing = document.querySelector('[data-message-id="' + CSS.escape(id) + '"]');

    if(existing){
      if(existing.dataset.fmAttachmentRendered !== "1"){
        existing.dataset.fmAttachmentRendered = "1";
        if(a.url) existing.dataset.fmAttachmentUrl = a.url;
        existing.innerHTML = renderAttachment(a);
      }
      return;
    }

    const b = document.createElement("div");
    b.className = "message bubble followme-public-bubble " + (m.sender === "owner" ? "owner" : "visitor");
    b.dataset.messageId = id;
    b.setAttribute("data-message-id", id);
    b.dataset.fmAttachmentRendered = "1";
    if(a.url) b.dataset.fmAttachmentUrl = a.url;
    b.innerHTML = renderAttachment(a);

    box().appendChild(b);
  }

  function renderMessages(messages){
    if(!Array.isArray(messages)) return;

    removeLocalAudioGhosts();

    messages.forEach(renderOne);

    try{
      const el = box();
      el.scrollTop = el.scrollHeight;
    }catch(e){}
  }

  if(!window.__fmPublicAudioServerTruthFetch20260519){
    window.__fmPublicAudioServerTruthFetch20260519 = true;
    const oldFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await oldFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/messages")){
          const clone = res.clone();
          const data = await clone.json().catch(function(){ return null; });

          if(data && Array.isArray(data.messages)){
            setTimeout(function(){ renderMessages(data.messages); }, 50);
            setTimeout(function(){ renderMessages(data.messages); }, 350);
          }
        }

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/attachment-raw")){
          const clone = res.clone();
          const data = await clone.json().catch(function(){ return null; });

          removeLocalAudioGhosts();

          if(data && data.success){
            setTimeout(function(){
              try{ if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages(); }catch(e){}
              try{ if(typeof window.loadMessages === "function") window.loadMessages(); }catch(e){}
            }, 200);

            setTimeout(function(){
              try{ if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages(); }catch(e){}
              try{ if(typeof window.loadMessages === "function") window.loadMessages(); }catch(e){}
            }, 900);
          }
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    removeLocalAudioGhosts();
  }

  window.fmPublicAudioServerTruthRender20260519 = {
    renderMessages,
    removeLocalAudioGhosts
  };

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(boot, 1200);
  });

  setInterval(removeLocalAudioGhosts, 1500);
})();
</script>





<script id="followme-public-status-and-close-final-20260519">
(function(){
  if(window.__FollowMePublicStatusAndCloseFinal20260519) return;
  window.__FollowMePublicStatusAndCloseFinal20260519 = true;

  let knownOwnerConnected = false;
  let locallyPaused = false;
  let lastOwnerMessageIdSeen = "";
  let lastKnownOwnerMessageId = "";

  function cleanSid(v){
    const s = String(v || "").trim();
    return /^\d+$/.test(s) ? s : "";
  }

  function sessionId(){
    try{
      const p = new URLSearchParams(location.search || "");
      const fromUrl = cleanSid(p.get("session") || p.get("chatSession"));
      if(fromUrl) return fromUrl;
    }catch(e){}

    const arr = [
      window.followMeChatSessionId,
      window.FOLLOWME_CHAT_SESSION_ID
    ];

    try{ arr.push(sessionStorage.getItem("followme_chat_session_id")); }catch(e){}
    /* localStorage followme_chat_session_id intentionally ignored: each QR user must have a separated chat. */

    for(const v of arr){
      const sid = cleanSid(v);
      if(sid) return sid;
    }

    return "";
  }

  function storageKey(){
    return "followme_chat_user_paused_" + (sessionId() || "unknown");
  }

  function readPaused(){
    try{
      locallyPaused = localStorage.getItem(storageKey()) === "1";
    }catch(e){
      locallyPaused = false;
    }

    document.body.classList.toggle("followme-public-locally-paused", locallyPaused);
    applyComposerPausedState();

    return locallyPaused;
  }

  function notifyPauseServer(value){
    const sid = sessionId();
    if(!sid) return;

    try{
      fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/pause", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ is_user_paused: !!value })
      }).catch(function(){});
    }catch(e){}
  }

  function writePaused(value){
    locallyPaused = !!value;

    try{
      if(locallyPaused) localStorage.setItem(storageKey(), "1");
      else localStorage.removeItem(storageKey());
    }catch(e){}

    notifyPauseServer(locallyPaused);

    document.body.classList.toggle("followme-public-locally-paused", locallyPaused);
    applyComposerPausedState();
  }

  function findChatSubtitle(){
    const candidates = [
      document.getElementById("followmePublicChatSubtitle"),
      document.getElementById("followmeChatSubtitle"),
      document.querySelector(".followme-public-chat-subtitle"),
      document.querySelector(".chat-subtitle"),
      document.querySelector(".subtitle"),
      document.querySelector("header span"),
      document.querySelector(".top span")
    ].filter(Boolean);

    for(const el of candidates){
      const txt = String(el.textContent || "").trim().toLowerCase();

      if(
        txt.includes("conness") ||
        txt.includes("attesa") ||
        txt.includes("proprietario") ||
        txt.includes("pausa") ||
        txt.includes("chat")
      ){
        return el;
      }
    }

    const titleCandidates = Array.from(document.querySelectorAll("h1,h2,h3,strong,div,span"))
      .filter(function(el){
        return String(el.textContent || "").trim().toLowerCase() === "followme chat";
      });

    const title = titleCandidates[0];

    if(title && title.parentElement){
      const sub = document.createElement("div");
      sub.id = "followmePublicChatSubtitle";
      sub.className = "followme-public-chat-subtitle";
      sub.style.fontSize = ".82rem";
      sub.style.fontWeight = "800";
      sub.style.opacity = ".78";
      sub.style.marginTop = "2px";
      title.parentElement.appendChild(sub);
      return sub;
    }

    return null;
  }

  function setSubtitle(connected){
    const el = findChatSubtitle();
    if(!el) return;

    knownOwnerConnected = !!connected;

    if(locallyPaused){
      el.textContent = "Chat in pausa";
      return;
    }

    el.textContent = knownOwnerConnected
      ? "Connessi"
      : "Connesso - in attesa del proprietario";
  }

  function findComposerElements(){
    return Array.from(document.querySelectorAll("textarea,input[type='text'],button")).filter(function(el){
      const txt = String(el.textContent || el.value || el.getAttribute("aria-label") || "").toLowerCase();

      if(txt.includes("chiudi")) return false;
      if(txt.includes("riattiva")) return false;

      return true;
    });
  }

  function applyComposerPausedState(){
    findComposerElements().forEach(function(el){
      try{
        if(locallyPaused){
          el.disabled = true;
        }else{
          if(!document.body.classList.contains("followme-public-user-blocked")){
            el.disabled = false;
          }
        }
      }catch(e){}
    });
  }

  function ensurePausedNotice(){
    let box = document.getElementById("followmePublicPausedNotice20260519");

    if(box) return box;

    box = document.createElement("div");
    box.id = "followmePublicPausedNotice20260519";
    box.style.display = "none";
    box.style.margin = "14px";
    box.style.padding = "14px 16px";
    box.style.borderRadius = "18px";
    box.style.background = "rgba(255,255,255,.94)";
    box.style.color = "#202629";
    box.style.fontWeight = "900";
    box.style.textAlign = "center";
    box.style.boxShadow = "0 10px 32px rgba(0,0,0,.18)";
    box.innerHTML = `
      <div id="followmePublicPausedText20260519">Chat messa in pausa su questo dispositivo.</div>
      <button id="followmePublicReactivateBtn20260519" type="button" style="
        margin-top:10px;
        min-height:42px;
        border:0;
        border-radius:999px;
        padding:0 18px;
        background:#25d366;
        color:#fff;
        font-weight:950;
        cursor:pointer;
      ">Riattiva chat</button>
    `;

    const main = document.querySelector("main") || document.body;
    main.appendChild(box);

    const btn = box.querySelector("#followmePublicReactivateBtn20260519");
    if(btn){
      btn.addEventListener("click", function(ev){
        ev.preventDefault();
        reactivateChat();
      }, true);
    }

    return box;
  }

  function showPausedNotice(ownerReplied){
    const box = ensurePausedNotice();
    const txt = document.getElementById("followmePublicPausedText20260519");

    if(txt){
      txt.textContent = ownerReplied
        ? "Il proprietario ha risposto. Vuoi riattivare la chat?"
        : "Chat messa in pausa su questo dispositivo.";
    }

    box.style.display = "block";
  }

  function hidePausedNotice(){
    const box = document.getElementById("followmePublicPausedNotice20260519");
    if(box) box.style.display = "none";
  }

  function pauseChatLocally(ev){
    if(ev){
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();
    }

    /*
      IMPORTANTE:
      Non chiudiamo più la sessione lato server.
      L'utente mette solo in pausa la propria UI.
    */
    writePaused(true);
    showPausedNotice(false);
    setSubtitle(knownOwnerConnected);

    return false;
  }

  function reactivateChat(){
    writePaused(false);
    hidePausedNotice();
    setSubtitle(knownOwnerConnected);

    try{
      if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages();
    }catch(e){}

    try{
      if(typeof window.loadMessages === "function") window.loadMessages();
    }catch(e){}

    try{
      const input =
        document.getElementById("messageInput") ||
        document.querySelector("textarea") ||
        document.querySelector("input[type='text']");
      if(input) input.focus();
    }catch(e){}
  }

  function findCloseButtons(){
    const buttons = Array.from(document.querySelectorAll("button,a"));

    return buttons.filter(function(el){
      const txt = String(el.textContent || el.getAttribute("aria-label") || "").trim().toLowerCase();

      return txt === "chiudi" ||
             txt.includes("chiudi chat") ||
             txt.includes("chiudi");
    });
  }

  function bindCloseButtons(){
    findCloseButtons().forEach(function(btn){
      if(btn.dataset.fmCloseLocalOnlyBound === "1") return;

      btn.dataset.fmCloseLocalOnlyBound = "1";
      btn.id = btn.id || "followmePublicCloseBtn20260519";

      btn.addEventListener("click", pauseChatLocally, true);
    });
  }

  function latestOwnerMessageId(messages){
    if(!Array.isArray(messages)) return "";

    const ownerMessages = messages.filter(function(m){
      return m && m.sender === "owner";
    });

    if(!ownerMessages.length) return "";

    const last = ownerMessages[ownerMessages.length - 1];
    return String(last.id || last.created_at || "").trim();
  }

  function applyMessages(messages){
    if(!Array.isArray(messages)) return;

    const ownerId = latestOwnerMessageId(messages);

    if(ownerId){
      knownOwnerConnected = true;
      setSubtitle(true);

      if(!lastOwnerMessageIdSeen){
        lastOwnerMessageIdSeen = ownerId;
      }

      if(ownerId !== lastKnownOwnerMessageId){
        const hadPrevious = !!lastKnownOwnerMessageId;
        lastKnownOwnerMessageId = ownerId;

        /*
          Se l'utente aveva chiuso/pausato e admin scrive dopo,
          non riattiviamo automaticamente: proponiamo la riattivazione.
        */
        if(locallyPaused && hadPrevious){
          showPausedNotice(true);
        }
      }
    }
  }

  function applyState(session){
    if(!session) return;

    const ownerConnected =
      !!session.owner_opened_at ||
      !!session.owner_last_seen_at ||
      knownOwnerConnected;

    setSubtitle(ownerConnected);

    /*
      Se admin in futuro chiuderà davvero la sessione server,
      qui potremo mostrare "Chat chiusa dal proprietario".
      Per ora NON trattiamo il Chiudi utente come chiusura definitiva.
    */
    if(String(session.status || "").toLowerCase() === "closed"){
      document.body.classList.add("followme-public-session-closed");
    }
  }

  async function fetchState(){
    const sid = sessionId();
    if(!sid) return;

    try{
      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
        cache:"no-store"
      });

      const data = await res.json().catch(function(){ return null; });

      if(res.ok && data && data.success){
        applyState(data.session);
      }
    }catch(e){}
  }

  function patchMessagesFetchForOwnerActivity(){
    if(window.__fmPublicStatusMessagesFetchPatch20260519) return;
    window.__fmPublicStatusMessagesFetchPatch20260519 = true;

    const oldFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await oldFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/messages")){
          const clone = res.clone();
          const data = await clone.json().catch(function(){ return null; });

          if(data && Array.isArray(data.messages)){
            setTimeout(function(){ applyMessages(data.messages); }, 50);
            setTimeout(function(){ applyComposerPausedState(); }, 80);
          }

          if(data && data.session){
            applyState(data.session);
          }
        }
      }catch(e){}

      return res;
    };
  }

  function injectCss(){
    if(document.getElementById("followmePublicLocalPauseCss20260519")) return;

    const style = document.createElement("style");
    style.id = "followmePublicLocalPauseCss20260519";
    style.textContent = `
      body.followme-public-locally-paused .followme-public-composer,
      body.followme-public-locally-paused .composer{
        opacity:.55;
        pointer-events:none;
      }

      body.followme-public-locally-paused #followmePublicPausedNotice20260519{
        display:block !important;
      }
    `;

    document.head.appendChild(style);
  }

  function boot(){
    injectCss();
    patchMessagesFetchForOwnerActivity();
    readPaused();
    setSubtitle(knownOwnerConnected);
    bindCloseButtons();
    fetchState();

    if(locallyPaused){
      showPausedNotice(false);
    }

    setTimeout(bindCloseButtons, 500);
    setTimeout(fetchState, 700);
    setTimeout(fetchState, 1800);
  }

  window.fmPublicPauseChatLocalOnly20260519 = pauseChatLocally;
  window.fmPublicReactivateChat20260519 = reactivateChat;
  window.fmPublicRefreshConnectedLabel20260519 = fetchState;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(boot, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      setTimeout(fetchState, 250);
      setTimeout(bindCloseButtons, 250);
    }
  });

  setInterval(fetchState, 3000);
  setInterval(bindCloseButtons, 1500);
  setInterval(applyComposerPausedState, 1500);
})();
</script>

<script id="followme-public-attachment-render-dedupe-final-20260519">
(function(){
  if(window.__FollowMePublicAttachmentRenderDedupeFinal20260519) return;
  window.__FollowMePublicAttachmentRenderDedupeFinal20260519 = true;

  function normUrl(u){
    try{
      let s = String(u || "").trim();
      if(!s) return "";
      s = s.replace(/&amp;/g, "&");
      const url = new URL(s, location.origin);
      return url.pathname + url.search;
    }catch(e){
      return String(u || "").trim().replace(/^https?:\/\/[^\/]+/i, "");
    }
  }

  function isAttachmentBubble(el){
    if(!el) return false;

    const html = el.innerHTML || "";
    const txt = el.textContent || "";

    return html.includes("__followme_attachment") ||
           html.includes("followme-attachment") ||
           html.includes("/uploads/followme-chat/") ||
           !!(el.querySelector && el.querySelector("audio,img,a[href*='/uploads/followme-chat/']"));
  }

  function getKey(el){
    if(!el || !isAttachmentBubble(el)) return "";

    const id =
      el.getAttribute("data-message-id") ||
      el.dataset.messageId ||
      el.dataset.serverMessageId ||
      "";

    if(id) return "id:" + String(id).trim();

    const media = el.querySelector && el.querySelector(
      "audio[src], img[src], a[href*='/uploads/followme-chat/'], [data-audio-url], [data-fm-attachment-url]"
    );

    if(media){
      const raw =
        media.getAttribute("src") ||
        media.getAttribute("href") ||
        media.getAttribute("data-audio-url") ||
        media.getAttribute("data-fm-attachment-url") ||
        "";

      const u = normUrl(raw);
      if(u) return "url:" + u;
    }

    const html = el.innerHTML || "";
    const txt = el.textContent || "";

    const patterns = [
      /src=["']([^"']*\/uploads\/followme-chat\/[^"']+)["']/i,
      /href=["']([^"']*\/uploads\/followme-chat\/[^"']+)["']/i,
      /data-audio-url=["']([^"']*\/uploads\/followme-chat\/[^"']+)["']/i,
      /"url"\s*:\s*"([^"]*\/uploads\/followme-chat\/[^"]+)"/i,
      /(\/uploads\/followme-chat\/[A-Za-z0-9._%\-]+)/i
    ];

    for(const re of patterns){
      const m = html.match(re) || txt.match(re);
      if(m && m[1]){
        const u = normUrl(m[1]);
        if(u) return "url:" + u;
      }
    }

    return "";
  }

  function getAttachmentBubbles(){
    return Array.from(document.querySelectorAll(
      ".message, .bubble, .followme-public-bubble, .followme-owner-chat-bubble, " +
      "[data-message-id], [data-fm-attachment-url]"
    )).filter(isAttachmentBubble);
  }

  function dedupe(){
    const seen = new Map();

    getAttachmentBubbles().forEach(function(el){
      const key = getKey(el);
      if(!key) return;

      if(seen.has(key)){
        const first = seen.get(key);

        const firstHasId = !!(
          first.getAttribute("data-message-id") ||
          first.dataset.messageId ||
          first.dataset.serverMessageId
        );

        const currentHasId = !!(
          el.getAttribute("data-message-id") ||
          el.dataset.messageId ||
          el.dataset.serverMessageId
        );

        /*
          Tieni quello più affidabile: se uno ha data-message-id e l'altro no,
          tieni quello con id server.
        */
        if(!firstHasId && currentHasId){
          first.remove();
          seen.set(key, el);
        }else{
          el.remove();
        }
      }else{
        seen.set(key, el);
      }
    });
  }

  if(!window.__fmPublicAttachmentDedupeFetchPatch20260519){
    window.__fmPublicAttachmentDedupeFetchPatch20260519 = true;
    const oldFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await oldFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        if(url && url.includes("/api/followme/chat/session/")){
          setTimeout(dedupe, 50);
          setTimeout(dedupe, 250);
          setTimeout(dedupe, 900);
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    dedupe();
    setTimeout(dedupe, 200);
    setTimeout(dedupe, 900);
    setTimeout(dedupe, 1800);
  }

  window.fmPublicAttachmentRenderDedupe20260519 = boot;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(boot, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
  });

  setInterval(dedupe, 1200);
})();
</script>

<script id="followme-public-fast-state-only-final-20260519">
(function(){
  if(window.__FollowMePublicFastStateOnlyFinal20260519) return;
  window.__FollowMePublicFastStateOnlyFinal20260519 = true;

  let lastUploads = null;
  let lastBlocked = null;
  let lastPaused = null;
  let inFlight = false;
  let fastModeUntil = Date.now() + 30000;

  function cleanSid(v){
    const s = String(v || "").trim();
    return /^\d+$/.test(s) ? s : "";
  }

  function sessionId(){
    try{
      const p = new URLSearchParams(location.search || "");
      const fromUrl = cleanSid(p.get("session") || p.get("chatSession"));
      if(fromUrl) return fromUrl;
    }catch(e){}

    const arr = [
      window.followMeChatSessionId,
      window.FOLLOWME_CHAT_SESSION_ID
    ];

    try{ arr.push(sessionStorage.getItem("followme_chat_session_id")); }catch(e){}
    /* localStorage followme_chat_session_id intentionally ignored: each QR user must have a separated chat. */

    for(const v of arr){
      const sid = cleanSid(v);
      if(sid) return sid;
    }

    return "";
  }

  function findInput(){
    return document.getElementById("messageInput") ||
           document.querySelector("textarea") ||
           document.querySelector("input[type='text']");
  }

  function findSend(){
    return document.getElementById("sendBtn") ||
           document.querySelector("button[type='submit']") ||
           document.querySelector(".send-btn");
  }

  function applyExtraVisibility(uploads, blocked){
    /*
      Compatibilità con le barre Extra già create dalle patch precedenti.
      Non crea nuova UI, non tocca i messaggi.
    */
    [
      "fmPublicAdminLikeExtraBar20260518",
      "fmPublicExtraBarForce20260518"
    ].forEach(function(id){
      const el = document.getElementById(id);
      if(!el) return;

      if(uploads && !blocked){
        el.style.display = "";
        el.removeAttribute("aria-hidden");
      }else{
        el.style.display = "none";
        el.setAttribute("aria-hidden", "true");
      }
    });

    /*
      Se il pulsante + è gestito da classi body, aggiorniamo tutte quelle già usate.
    */
    document.body.classList.toggle("followme-public-uploads-enabled", uploads);
    document.body.classList.toggle("fm-public-extra-enabled-live", uploads);
    document.body.classList.toggle("fm-public-extra-adminlike-on", uploads);
  }

  function applyBlocked(blocked){
    document.body.classList.toggle("followme-public-user-blocked", blocked);
    document.body.classList.toggle("fm-public-blocked-live", blocked);
    document.body.classList.toggle("fm-public-user-blocked-adminlike", blocked);

    const input = findInput();
    const send = findSend();

    if(input){
      input.disabled = blocked;

      if(blocked){
        input.dataset.fmOldPlaceholder = input.dataset.fmOldPlaceholder || input.placeholder || "";
        input.placeholder = "Digita il testo qui e premi invio";
      }else{
        if(input.dataset.fmOldPlaceholder){
          input.placeholder = input.dataset.fmOldPlaceholder;
        }
      }
    }

    if(send){
      send.disabled = blocked;
    }
  }

  function applyPaused(paused){
    document.body.classList.toggle("followme-public-locally-paused", paused);

    /*
      Non forziamo il blocco input qui se esiste già la logica pausa locale:
      lasciamo che la patch pausa faccia il suo lavoro.
      Qui sincronizziamo solo la classe e la visibilità se serve.
    */
    try{
      if(typeof window.fmPublicRefreshConnectedLabel20260519 === "function"){
        window.fmPublicRefreshConnectedLabel20260519();
      }
    }catch(e){}
  }

  function applyState(session){
    if(!session) return;

    const uploads = !!session.uploads_enabled;
    const blocked = !!session.is_blocked;
    const paused = !!session.is_user_paused;

    const changed =
      uploads !== lastUploads ||
      blocked !== lastBlocked ||
      paused !== lastPaused;

    lastUploads = uploads;
    lastBlocked = blocked;
    lastPaused = paused;

    applyExtraVisibility(uploads, blocked);
    applyBlocked(blocked);
    applyPaused(paused);

    if(changed){
      /*
        Dopo un cambio stato, restiamo rapidi per qualche secondo.
      */
      fastModeUntil = Date.now() + 12000;
    }
  }

  async function fetchState(){
    const sid = sessionId();

    if(!sid || inFlight) return;

    inFlight = true;

    try{
      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
        cache:"no-store"
      });

      const data = await res.json().catch(function(){ return null; });

      if(res.ok && data && data.success && data.session){
        applyState(data.session);
      }
    }catch(e){
      /*
        Silenzioso: non blocca la chat.
      */
    }finally{
      inFlight = false;
    }
  }

  function loop(){
    fetchState();

    /*
      Fast mode: 500 ms.
      Dopo stabilizzazione: 1200 ms.
      Non ricarica messaggi, quindi è molto più leggero delle patch precedenti.
    */
    const delay = Date.now() < fastModeUntil ? 500 : 1200;
    setTimeout(loop, delay);
  }

  function boot(){
    fastModeUntil = Date.now() + 30000;

    fetchState();
    setTimeout(fetchState, 150);
    setTimeout(fetchState, 500);
    setTimeout(fetchState, 1000);
  }

  window.fmPublicFastStateOnly20260519 = {
    boot,
    fetchState,
    applyState
  };

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  }else{
    boot();
  }

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      fastModeUntil = Date.now() + 15000;
      setTimeout(fetchState, 100);
    }
  });

  loop();
})();
</script>

<script id="followme-public-reset-closed-session-when-service-open-final-20260519">
(function(){
  if(window.__FollowMePublicResetClosedSessionWhenServiceOpen20260519) return;
  window.__FollowMePublicResetClosedSessionWhenServiceOpen20260519 = true;

  let checking = false;

  function cleanSid(v){
    const s = String(v || "").trim();
    return /^\d+$/.test(s) ? s : "";
  }

  function sessionId(){
    try{
      const p = new URLSearchParams(location.search || "");
      const fromUrl = cleanSid(p.get("session") || p.get("chatSession"));
      if(fromUrl) return fromUrl;
    }catch(e){}

    const arr = [
      window.followMeChatSessionId,
      window.FOLLOWME_CHAT_SESSION_ID
    ];

    try{ arr.push(sessionStorage.getItem("followme_chat_session_id")); }catch(e){}
    /* localStorage followme_chat_session_id intentionally ignored: each QR user must have a separated chat. */

    for(const v of arr){
      const sid = cleanSid(v);
      if(sid) return sid;
    }

    return "";
  }

  function clearStoredSession(){
    const keys = [
      "followme_chat_session_id",
      "FOLLOWME_CHAT_SESSION_ID",
      "followMeChatSessionId"
    ];

    keys.forEach(function(k){
      try{ localStorage.removeItem(k); }catch(e){}
      try{ sessionStorage.removeItem(k); }catch(e){}
    });

    try{
      Object.keys(localStorage).forEach(function(k){
        if(k.includes("followme") && k.includes("session")) localStorage.removeItem(k);
        if(k.includes("followme_chat_user_paused_")) localStorage.removeItem(k);
      });
    }catch(e){}

    try{
      Object.keys(sessionStorage).forEach(function(k){
        if(k.includes("followme") && k.includes("session")) sessionStorage.removeItem(k);
      });
    }catch(e){}
  }

  function reloadClean(){
    /*
      Ricarica la pagina senza parametri session/chatSession, così il QR riparte da capo.
    */
    try{
      const url = new URL(location.href);
      url.searchParams.delete("session");
      url.searchParams.delete("chatSession");
      url.searchParams.set("restart", String(Date.now()));
      location.replace(url.toString());
    }catch(e){
      location.reload();
    }
  }

  async function check(){
    const sid = sessionId();
    if(!sid || checking) return;

    checking = true;

    try{
      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/service-state?v=" + Date.now(), {
        cache:"no-store"
      });

      const data = await res.json().catch(function(){ return null; });

      if(res.ok && data && data.success && data.session){
        const serviceOpen = data.session.chat_mode_enabled === true;
        const sessionClosed = String(data.session.status || "").toLowerCase() === "closed";

        /*
          Caso corretto dopo Riapri servizio:
          progetto aperto, ma browser agganciato a vecchia sessione chiusa.
          Reset locale e ripartenza da capo.
        */
        if(serviceOpen && sessionClosed){
          clearStoredSession();
          reloadClean();
          return;
        }
      }
    }catch(e){
    }finally{
      checking = false;
    }
  }

  function boot(){
    setTimeout(check, 200);
    setTimeout(check, 900);
  }

  window.fmPublicResetClosedSessionWhenServiceOpen20260519 = {
    boot,
    check,
    clearStoredSession
  };

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(check, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
  });

  setInterval(check, 1500);
})();
</script>





<script id="followme-public-force-fresh-qr-session-final-20260519">
(function(){
  if(window.__FollowMePublicForceFreshQrSessionFinal20260519) return;
  window.__FollowMePublicForceFreshQrSessionFinal20260519 = true;

  function hasExplicitSessionInUrl(){
    try{
      const q = new URLSearchParams(location.search || "");
      return !!(q.get("session") || q.get("chatSession"));
    }catch(e){
      return false;
    }
  }

  function cleanGlobalSharedSession(){
    /*
      Il QR pubblico non deve riagganciare una sessione globale precedente.
      Ogni dispositivo/tab deve ricevere una sessione propria.
      Se invece l'URL contiene ?session=..., lo rispettiamo.
    */
    if(hasExplicitSessionInUrl()) return;

    try{ localStorage.removeItem("followme_chat_session_id"); }catch(e){}

    try{
      Object.keys(localStorage).forEach(function(k){
        if(k === "followme_chat_session_id") localStorage.removeItem(k);
      });
    }catch(e){}
  }

  cleanGlobalSharedSession();

  window.addEventListener("pageshow", cleanGlobalSharedSession);
})();
</script>







<script id="followme-public-request-extra-final-20260519">

  let requestSent = false;

  function cleanSid(v){
    const s = String(v || "").trim();
    return /^\d+$/.test(s) ? s : "";
  }

  function sessionId(){
    try{
      const q = new URLSearchParams(location.search || "");
      const fromUrl = cleanSid(q.get("session") || q.get("chatSession"));
      if(fromUrl) return fromUrl;
    }catch(e){}

      window.followMeChatSessionId,
      window.FOLLOWME_CHAT_SESSION_ID
    ];

    try{ arr.push(sessionStorage.getItem("followme_chat_session_id")); }catch(e){}

    for(const v of arr){
      const sid = cleanSid(v);
      if(sid) return sid;
    }

    return "";
  }

  function findMessages(){
    return document.getElementById("messages") ||
           document.getElementById("chatMessages") ||
           document.getElementById("followmePublicMessages") ||
           document.querySelector(".messages") ||
           document.querySelector(".chat-messages") ||
           document.querySelector(".followme-public-messages");

    const box = findMessages();

    if(!box){
      alert(String(html || "").replace(/<[^>]+>/g, ""));
      return null;
    }

    const wrap = document.createElement("div");
    wrap.className = "bot message followme-extra-request-local";

  async function sendOwnerMessage(message){
    const sid = sessionId();

    if(!sid){
      throw new Error("Sessione chat non ancora pronta.");
    }

    const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/message", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ sender:"visitor", message:String(message || "") })
    });

    const data = await res.json().catch(function(){ return null; });

    if(!res.ok || !data || !data.success){
      throw new Error((data && data.error) || "Invio richiesta non riuscito.");
    }

    return data;
  }

  function showRequestConfirm(){
    if(requestOpen) return;
    requestOpen = true;

    const card = addBotMessage(
      "<strong>Stai chiedendo la possibilità di inviare foto, messaggi audio, posizione e altri allegati.</strong><br><br>" +

      return;
    }

    const confirm = card.querySelector(".followme-extra-request-confirm");
    const cancel = card.querySelector(".followme-extra-request-cancel");

        confirm.disabled = true;

            kind:"extra_request",

          confirm.disabled = false;

          addBotMessage("<strong>Non sono riuscito a inviare la richiesta.</strong><br>Riprova tra poco.");

        }

    /*

    */
    for(const el of buttons){

      if(candidate){

        btn.id = "followmePublicRequestExtraBtn20260519";
      }else{
        btn = document.createElement("button");
        btn.id = "followmePublicRequestExtraBtn20260519";
        btn.type = "button";

        btn.style.position = "fixed";
        btn.style.top = "14px";
        btn.style.right = "14px";

    btn.style.visibility = "";
    btn.disabled = false;

    if(!btn.dataset.followmeRequestExtraBound20260519){

      btn.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        showRequestConfirm();
      }, true);

      "followme-public-locally-paused",
      "followme-public-paused",
      "fm-public-paused",
      "fm-public-user-paused",
      "user-paused"
    );

    document.documentElement.classList.remove(
      "followme-public-locally-paused",
      "followme-public-paused",
      "fm-public-paused",
      "fm-public-user-paused",
      "user-paused"
    );

    [
      "followmePublicPauseOverlay20260519",
      "followmePublicPausedOverlay20260519",
      "followmePublicPausedBox20260519"
    ].forEach(function(id){

      if(el) el.remove();
    });

  function boot(){

    ensureRequestButton();

    setTimeout(ensureRequestButton, 350);

  });

        background:#020617 !important;
      }
    `;

    document.head.appendChild(style);
  }

  function cleanPauseResidues(){
    document.body.classList.remove(
      "followme-public-locally-paused",
      "followme-public-paused",
      "fm-public-paused",
      "fm-public-user-paused",
      "user-paused"
    );

    document.documentElement.classList.remove(
      "followme-public-locally-paused",
      "followme-public-paused",
      "fm-public-paused",
      "fm-public-user-paused",
      "user-paused"
    );

    [
      "followmePublicPauseOverlay20260519",
      "followmePublicPausedOverlay20260519",
      "followmePublicPausedBox20260519"
    ].forEach(function(id){
      const el = document.getElementById(id);
      if(el) el.remove();
    });
  }

  function findOldPauseOrExtraButton(){
    const all = Array.from(document.querySelectorAll("button,a"));

    for(const el of all){
      const t = String(el.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();

      if(
        el.id === "followmePublicRequestExtraBtn20260519" ||
        t === "richiedi extra" ||
        t === "richiedi" ||
        t === "extra" ||
        t === "pausa" ||
        t === "pausa chat" ||
        t === "chiudi" ||
        t === "chiudi chat"
      ){
        return el;
      }
    }

    return null;
  }

  function callRequestExtraFlow(){
    cleanPauseResidues();

    try{
      if(window.fmPublicRequestExtra20260519 && typeof window.fmPublicRequestExtra20260519.showRequestConfirm === "function"){
        window.fmPublicRequestExtra20260519.showRequestConfirm();
        return;
      }
    }catch(e){}

    /*
      Fallback se la patch principale non fosse ancora pronta.
    */
    alert("Stai chiedendo la possibilità di inviare foto, messaggi audio, posizione e altri allegati.");
  }

  function replaceWithCleanButton(){
    ensureStyle();
    cleanPauseResidues();

    let current = document.getElementById("followmePublicRequestExtraBtn20260519");

    /*
      Se il pulsante esiste ma può avere vecchi listener, lo sostituiamo una volta
      con clone pulito. Usiamo data-clean per evitare sostituzioni continue.
    */
    if(current && current.dataset.cleanRequestExtra20260519 === "1"){
      current.innerHTML = "<span class='fm-extra-line'>Richiedi</span><span class='fm-extra-line'>Extra</span>";
      current.disabled = false;
      current.style.display = "";
      current.style.visibility = "";
      return current;
    }

    const old = current || findOldPauseOrExtraButton();

    const btn = document.createElement("button");
    btn.id = "followmePublicRequestExtraBtn20260519";
    btn.type = "button";
    btn.dataset.cleanRequestExtra20260519 = "1";
    btn.innerHTML = "<span class='fm-extra-line'>Richiedi</span><span class='fm-extra-line'>Extra</span>";
    btn.setAttribute("aria-label", "Richiedi Extra");

    btn.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();
      callRequestExtraFlow();
      return false;
    }, true);

    if(old && old.parentElement){
      old.parentElement.replaceChild(btn, old);
    }else{
      btn.style.position = "fixed";
      btn.style.top = "14px";
      btn.style.right = "14px";
      document.body.appendChild(btn);
    }

    return btn;
  }

  /*
    Intercetta eventuali vecchi click Pausa ancora presenti prima che facciano danni.
  */
  document.addEventListener("click", function(ev){
    const target = ev.target && ev.target.closest ? ev.target.closest("button,a") : ev.target;
    if(!target) return;

    const t = String(target.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();

    if(
      target.id === "followmePublicRequestExtraBtn20260519" ||
      t === "richiedi extra" ||
      t === "richiedi" ||
      t === "extra"
    ){
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();
      callRequestExtraFlow();
      return false;
    }

    if(t === "pausa" || t === "pausa chat" || t === "chiudi" || t === "chiudi chat"){
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();
      replaceWithCleanButton();
      callRequestExtraFlow();
      return false;
    }
  }, true);

  /*
    Neutralizza qualsiasi vecchia chiamata /pause lato pubblico.
  */
  if(!window.__fmPublicRequestExtraBlockPauseFetch20260519){
    window.__fmPublicRequestExtraBlockPauseFetch20260519 = true;

    const oldFetch = window.fetch.bind(window);

    window.fetch = function(input, init){
      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/pause")){
          return Promise.resolve(new Response(JSON.stringify({
            success:true,
            pause_removed:true,
            request_extra_mode:true
          }), {
            status:200,
            headers:{ "Content-Type":"application/json" }
          }));
        }
      }catch(e){}

      return oldFetch(input, init);
    };
  }

  function boot(){
    cleanPauseResidues();
    replaceWithCleanButton();

    setTimeout(replaceWithCleanButton, 300);
    setTimeout(replaceWithCleanButton, 1000);
  }

  window.fmPublicRequestExtraButtonFix20260519 = {
    boot,
    replaceWithCleanButton,
    callRequestExtraFlow
  };

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(boot, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
  });

  setInterval(function(){
    cleanPauseResidues();
    replaceWithCleanButton();
  }, 1500);
})();
</script>

</body>
</html>


<script id="followme-public-blocked-fetch-hard-guard">
(function(){
  if(window.__followMePublicBlockedFetchHardGuard) return;
  window.__followMePublicBlockedFetchHardGuard = true;

  function applyBlocked(){
    try{
      document.body.classList.add("followme-public-user-blocked");
      const notice = document.getElementById("followmePublicBlockedNotice");
      if(notice) notice.textContent = "Digita il testo qui e premi invio";

      const input = document.getElementById("messageInput") ||
                    document.querySelector("textarea") ||
                    document.querySelector("input[type='text']");
      if(input){
        input.disabled = true;
        input.placeholder = "Digita il testo qui e premi invio";
      }

      const send = document.getElementById("sendBtn") ||
                   document.querySelector("button[type='submit']") ||
                   document.querySelector(".send-btn");
      if(send) send.disabled = true;
    }catch(e){}
  }

  const previousFetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const res = await previousFetch(input, init);

    try{
      const url = typeof input === "string" ? input : (input && input.url ? input.url : "");
      if(url && url.includes("/api/followme/chat/session/")){
        const clone = res.clone();
        const data = await clone.json().catch(()=>null);
        if(data && (data.blocked === true || String(data.error || "").includes("bloccato"))){
          applyBlocked();
        }
      }
    }catch(e){}

    return res;
  };
})();
</script>
