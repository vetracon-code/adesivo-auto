<!doctype html><button type="button" class="followme-public-close-chat" id="followmePublicCloseChatBtn">Chiudi</button>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FollowMe Chat</title>
  <style>
    :root{
      --bg:#071018;
      --panel:#101820;
      --panel2:#142231;
      --text:#f7fafc;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.10);
      --lime:#c8ff2e;
      --cyan:#5ee7ff;
      --bot:#182838;
      --user:#c8ff2e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
    body{
      background:
        radial-gradient(circle at 20% -10%,rgba(200,255,46,.14),transparent 34%),
        radial-gradient(circle at 92% 0%,rgba(94,231,255,.13),transparent 30%),
        #071018;
    }
    .chat{
      width:min(520px,100%);
      height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto 1fr auto;
      background:rgba(7,16,24,.76);
      border-left:1px solid rgba(255,255,255,.06);
      border-right:1px solid rgba(255,255,255,.06);
    }
    .top{
      padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
      display:flex;
      align-items:center;
      gap:11px;
      background:rgba(16,24,32,.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }
    .avatar{
      width:44px;height:44px;border-radius:16px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:1.2rem;
      box-shadow:0 12px 28px rgba(94,231,255,.16);
    }
    .top h1{margin:0;font-size:1.02rem;letter-spacing:-.03em;line-height:1.08}
    .top p{margin:3px 0 0;color:var(--muted);font-size:.76rem}
    .messages{
      overflow:auto;
      padding:16px 12px 18px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .msgrow{display:flex;gap:8px;align-items:flex-end}
    .msgrow.user{justify-content:flex-end}
    .boticon{
      width:30px;height:30px;border-radius:11px;flex:0 0 auto;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:.85rem;
    }
    .bubble{
      max-width:78%;
      border-radius:20px;
      padding:10px 12px;
      font-size:.92rem;
      line-height:1.34;
      box-shadow:0 10px 26px rgba(0,0,0,.18);
    }
    .bot .bubble{
      background:var(--bot);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      border-bottom-left-radius:7px;
    }
    .user .bubble{
      background:linear-gradient(135deg,var(--lime),#e9ff9c);
      color:#101820;
      font-weight:750;
      border-bottom-right-radius:7px;
    }
    .typing{
      display:inline-flex;gap:4px;align-items:center;
      padding:2px 0;
    }
    .typing span{
      width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.65);
      animation:bounce 1s infinite ease-in-out;
    }
    .typing span:nth-child(2){animation-delay:.16s}
    .typing span:nth-child(3){animation-delay:.32s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
    .choices{
      display:flex;gap:8px;flex-wrap:wrap;margin-left:38px;margin-top:-2px;
    }
    .choice{
      border:1px solid rgba(200,255,46,.28);
      background:rgba(200,255,46,.10);
      color:#e9ff9c;
      border-radius:999px;
      padding:8px 10px;
      font-weight:850;
      font-size:.78rem;
    }
    .composer{
      padding:10px 12px calc(12px + env(safe-area-inset-bottom));
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      background:rgba(16,24,32,.94);
      border-top:1px solid var(--line);
      backdrop-filter:blur(14px);
    }
    textarea{
      resize:none;height:46px;max-height:110px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.22);
      color:#fff;
      border-radius:18px;
      padding:12px 13px;
      font:inherit;
      outline:none;
    }
    button{
      border:0;border-radius:18px;padding:0 15px;
      font-weight:950;color:#101820;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
    }
    .smallnote{
      text-align:center;color:rgba(255,255,255,.48);font-size:.72rem;padding:4px 10px 0;
    }
  
    /* Avatar chat FollowMe */
    .boticon{
      width:38px !important;
      height:38px !important;
      border-radius:0 !important;
      background:transparent !important;
      box-shadow:none !important;
      font-size:1.65rem !important;
      flex:0 0 auto !important;
    }

    .adminicon{
      width:38px;
      height:38px;
      border-radius:999px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 33%, #f1c7a5 0 28%, transparent 29%),
        radial-gradient(circle at 44% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 57% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 50% 61%, #2c1c16 0 10%, transparent 11%),
        linear-gradient(180deg,#263244,#101820);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 10px 24px rgba(0,0,0,.22);
      position:relative;
      overflow:hidden;
    }

    .adminicon::before{
      content:"";
      position:absolute;
      width:18px;
      height:7px;
      border-radius:999px;
      background:#241713;
      left:10px;
      top:24px;
      opacity:.95;
    }

    .adminicon::after{
      content:"";
      position:absolute;
      width:10px;
      height:8px;
      border-radius:0 0 999px 999px;
      background:#241713;
      left:14px;
      top:28px;
      opacity:.9;
    }

    .msgrow.admin{
      justify-content:flex-start;
    }

    .admin .bubble{
      background:#162536;
      border:1px solid rgba(94,231,255,.18);
      color:#fff;
      border-bottom-left-radius:7px;
    }


    /* Effetto digitazione presentazione FollowMe */
    .typed-cursor{
      display:inline-block;
      width:7px;
      height:1.05em;
      margin-left:2px;
      vertical-align:-2px;
      background:rgba(255,255,255,.72);
      border-radius:2px;
      animation:followmeTypedCursorBlink .85s infinite;
    }

    @keyframes followmeTypedCursorBlink{
      0%,45%{opacity:1}
      46%,100%{opacity:.15}
    }


    /* FollowMe WhatsApp-like restyle */
    body.followme-wa-chat{
      background:#efe7db !important;
      color:#2f3437 !important;
    }

    body.followme-wa-chat .chat{
      background:#efe7db !important;
      border-left:1px solid rgba(0,0,0,.05) !important;

    }

    body.followme-wa-chat .messages{

      background-image:
        radial-gradient(circle at 12px 18px, rgba(120,110,95,.055) 0 1.2px, transparent 1.4px),

        linear-gradient(45deg, transparent 48%, rgba(120,110,95,.035) 49%, rgba(120,110,95,.035) 51%, transparent 52%);
      background-size:86px 86px, 112px 112px, 74px 74px;
    }

    body.followme-wa-chat .top{
      background:#f4eee5 !important;
      border-bottom:1px solid rgba(0,0,0,.08) !important;
      color:#2f3437 !important;
      box-shadow:0 1px 0 rgba(0,0,0,.04);
    }

    body.followme-wa-chat .top h1{
      color:#2f3437 !important;
    }

    body.followme-wa-chat .top p{
      color:#667071 !important;
    }

    body.followme-wa-chat .avatar{
      background:#ffffff !important;
      color:#2f3437 !important;
      box-shadow:0 1px 2px rgba(0,0,0,.10) !important;
    }

    body.followme-wa-chat .bot .bubble,
    body.followme-wa-chat .admin .bubble,
    body.followme-wa-chat .system .bubble{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:0 !important;
      box-shadow:0 1px 1px rgba(0,0,0,.12) !important;
    }

    body.followme-wa-chat .user .bubble{
      background:#dcf8c6 !important;
      color:#1f2c2f !important;
      box-shadow:0 1px 1px rgba(0,0,0,.12) !important;
      font-weight:500 !important;
    }

    body.followme-wa-chat .bubble{
      border-radius:9px !important;

    }

    body.followme-wa-chat .bot .bubble,
    body.followme-wa-chat .admin .bubble{
      border-bottom-left-radius:3px !important;
    }

    body.followme-wa-chat .user .bubble{

    }

    body.followme-wa-chat .composer{
      background:#f4eee5 !important;
      border-top:1px solid rgba(0,0,0,.08) !important;
      grid-template-columns:1fr auto !important;
    }

    body.followme-wa-chat textarea{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:0 !important;
      border-radius:22px !important;
      box-shadow:0 1px 2px rgba(0,0,0,.08) !important;
    }

    body.followme-wa-chat textarea::placeholder{

    }

    body.followme-wa-chat #sendBtn{

      border-radius:999px !important;
      padding:0 !important;

    body.followme-wa-chat #sendBtn::before{
      content:"➤";
      font-size:20px;
      display:block;
      transform:translateX(1px);
    }

    body.followme-wa-chat .choices{
      margin-left:46px !important;
    }

    body.followme-wa-chat .choice{
      background:#ffffff !important;
      color:#2f3437 !important;
      border:1px solid rgba(0,0,0,.08) !important;
      box-shadow:0 1px 1px rgba(0,0,0,.10) !important;
    }

    body.followme-wa-chat .choice:first-child{
      color:#128c7e !important;
      font-weight:900 !important;
    }

    body.followme-wa-chat .smallnote{
      background:#f4eee5 !important;
      color:#667071 !important;
    }

    body.followme-wa-chat .boticon{
      background:transparent !important;
      box-shadow:none !important;
    }


    /* Pulsante chiusura chat utente */
    .followme-public-close-chat{
      position:absolute;
      right:10px;
      top:calc(10px + env(safe-area-inset-top));
      z-index:5;
      min-height:32px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:rgba(255,255,255,.82);
      color:#3a3f41;
      font-size:.74rem;
      font-weight:850;
      padding:0 10px;
      box-shadow:0 1px 2px rgba(0,0,0,.08);
    }

    body.followme-chat-closed .composer{
      opacity:.55;
      pointer-events:none;
    }

    body.followme-chat-closed .followme-public-close-chat{
      display:none;
    }


    /* Scelta info discreta se l'utente scrive subito */
    .choices .choice-prompt{
      grid-column:1 / -1;
      margin:0 0 4px;
      padding:0 2px;
      color:#667071;
      font-size:.78rem;
      font-weight:800;
      text-align:left;
    }

    body.followme-wa-chat .choices .choice-prompt{
      color:#667071 !important;
    }


    /* Preview allegati lato utente FollowMe */
    .followme-attachment-card{
      display:grid;
      gap:7px;
      max-width:240px;
    }

    .followme-attachment-image{
      display:block;
      width:220px;
      max-width:70vw;
      border-radius:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.14);
      background:#eee;
    }

    .followme-attachment-file,
    .followme-attachment-location,
    .followme-attachment-audio{
      display:flex;
      align-items:center;
      gap:9px;
      padding:10px 11px;
      border-radius:12px;
      background:rgba(255,255,255,.58);
      border:1px solid rgba(0,0,0,.08);
      color:#253033;
      text-decoration:none;
      font-weight:800;
      line-height:1.25;
    }

    .followme-attachment-audio audio{

    .followme-attachment-name{

    }

    .followme-attachment-meta{
      display:block;

    }


    /* Chat chiusa da Admin */
    .followme-public-admin-closed{
      display:none;
      margin:10px auto;
      max-width:88%;

      background:rgba(255,255,255,.86);
      color:#3a3f41;
      border:1px solid rgba(0,0,0,.08);

    body.followme-public-session-closed .followme-public-admin-closed{
      display:block;
    }

    body.followme-public-session-closed .composer{

      pointer-events:none;
    }


    /* Stato utente bloccato */
    body.followme-public-user-blocked .composer,
    body.followme-public-user-blocked form,
    body.followme-public-user-blocked .followme-public-composer{
      opacity:.55 !important;

    }

    .followme-public-blocked-notice{
      display:none;
      margin:10px auto;
      max-width:88%;
      padding:10px 12px;

      color:#3a3f41;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 1px 2px rgba(0,0,0,.08);
      font-size:.86rem;
      line-height:1.35;
      font-weight:750;
      text-align:center;
    }

    body.followme-public-user-blocked .followme-public-blocked-notice{
      display:block;
    }


    /* FollowMe public: utente bloccato */
    .followme-public-blocked-system-message{
      display:none;
      margin:12px auto;
      max-width:88%;
      padding:12px 14px;
      border-radius:15px;
      background:#fff1ef;
      color:#9b241c;
      border:1px solid rgba(155,36,28,.18);
      box-shadow:0 1px 3px rgba(0,0,0,.08);
      font-size:.9rem;
      line-height:1.35;

      text-align:center;
    }

    body.followme-public-user-blocked .followme-public-blocked-system-message{
      display:block;
    }

    body.followme-public-user-blocked textarea,
    body.followme-public-user-blocked input[type="text"],
    body.followme-public-user-blocked button[type="submit"],
    body.followme-public-user-blocked #sendBtn,
    body.followme-public-user-blocked .send-btn{
      opacity:.45 !important;
      pointer-events:none !important;
    }

    body:not(.followme-public-uploads-enabled) .followme-public-upload-btn,
    body:not(.followme-public-uploads-enabled) .followme-public-attach-btn,
    body:not(.followme-public-uploads-enabled) .followme-admin-wa-plus,
    body:not(.followme-public-uploads-enabled) button[aria-label*="alleg"],
    body:not(.followme-public-uploads-enabled) button[aria-label*="Alleg"],

</style>

<body class="followme-wa-chat">
  <main class="chat">
    <header class="top">
      <div class="avatar">🤖</div>
      <div>
        <h1>FollowMe Chat</h1>
        <p id="statusText">Connessione in corso...</p>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <footer>
      <div class="smallnote">Scrivi qui. Il proprietario riceverà il tuo messaggio in questa chat.</div>
      <div class="composer">
        <textarea id="messageInput" placeholder="Scrivi un messaggio..." rows="1"></textarea>
        <button id="sendBtn">Invia</button>
      </div>
    </footer>
  
<div class="followme-public-blocked-system-message" id="followmePublicBlockedSystemMessage">
  Sei stato bloccato dal sistema.
</div>

</main>

<script>
(function(){
  const TOKEN = (location.pathname.match(/\/fm\/chat\/c\/([^\/?#]+)/i)||[])[1] || "";
  let sessionId = "";
  let lastMessageId = 0;
  let realConversationStarted = false;
  let robotTimers = [];
  let followMeInfoChoiceSent = false;
  let followMeInfoExplained = false;
  let followMeRobotFallbackSent = false;
  let followMeInfoChoiceRendered = false;
  const renderedMessageKeys = new Set();
  const messages = document.getElementById("messages");
  const statusText = document.getElementById("statusText");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  function scrollBottom(){
    messages.scrollTop = messages.scrollHeight;
  }

  function scheduleRobot(fn, delay){
    const t = setTimeout(function(){
      if(!realConversationStarted){
        fn();
      }
    }, delay);
    robotTimers.push(t);
    return t;
  }

  function stopRobotSequence(){
    realConversationStarted = true;
    robotTimers.forEach(clearTimeout);
    robotTimers = [];

    try{
      document.querySelectorAll(".choices").forEach(el => el.remove());
      document.querySelectorAll("[data-robot-typing='1']").forEach(el => el.remove());
    }catch(e){}
  }

  function messageKey(sender, text, id){
    if(id) return "id:" + id;
    return String(sender || "") + ":" + String(text || "").replace(/\s+/g, " ").trim().slice(0, 180);
  }

  function alreadyRendered(sender, text, id){
    const key = messageKey(sender, text, id);
    if(renderedMessageKeys.has(key)) return true;
    renderedMessageKeys.add(key);
    return false;
  }

  function row(kind, html, typing){
    const r = document.createElement("div");
    r.className = "msgrow " + (kind === "user" ? "user" : (kind === "admin" ? "admin" : "bot"));

    if(kind === "bot"){
      const ico = document.createElement("div");
      ico.className = "boticon";
      ico.textContent = "🤖";
      r.appendChild(ico);
    }

    if(kind === "admin"){
      const ico = document.createElement("div");
      ico.className = "adminicon";
      ico.setAttribute("aria-label", "Admin");
      r.appendChild(ico);
    }

    const b = document.createElement("div");
    b.className = "bubble";
    if(typing){
      r.setAttribute("data-robot-typing", "1");
      b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    }else{
      b.innerHTML = html;
    }
    r.appendChild(b);
    messages.appendChild(r);
    scrollBottom();
    return r;
  }

  function addBot(text){
    row("bot", text.replace(/\n/g,"<br>"));
  }

  function addBotHtml(html){
    row("bot", String(html || ""));
  }

  function tokenizeHtmlForTyping(html){
    const tokens = [];
    const re = /(<[^>]+>|[^<])/g;
    let m;
    while((m = re.exec(String(html || ""))) !== null){
      tokens.push(m[0]);
    }
    return tokens;
  }

  function typeBotHtml(html){
    const r = row("bot", "", false);
    const bubble = r.querySelector(".bubble");
    if(!bubble) return;

    const tokens = tokenizeHtmlForTyping(html);
    let out = "";
    let i = 0;

    function currentDelay(token, previousOutput){
      if(token && token.startsWith("<strong")) return 80;
      if(previousOutput.endsWith("</strong>")) return 260;
      if(/[.!?]$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 360;
      if(/:$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 280;
      if(token === "<br>") return 220;

      // Rallenta leggermente quando siamo dentro un grassetto aperto.
      const openStrong = (previousOutput.match(/<strong>/g) || []).length;
      const closeStrong = (previousOutput.match(/<\/strong>/g) || []).length;
      if(openStrong > closeStrong) return 44;

      return 24;
    }

    function step(){
      if(i >= tokens.length){
        bubble.innerHTML = out;
        scrollBottom();
        return;
      }

      const token = tokens[i++];
      out += token;
      bubble.innerHTML = out + '<span class="typed-cursor"></span>';
      scrollBottom();

      setTimeout(step, currentDelay(token, out));
    }

    step();
  }

  function addUser(text){
    row("user", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function addAdmin(text){
    row("admin", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function botTypingThen(text, delay){
    if(realConversationStarted) return;

    const t = row("bot", "", true);
    scheduleRobot(()=>{
      if(realConversationStarted){
        t.remove();
        return;
      }
      t.remove();
      addBot(text);
    }, delay || 900);
  }

  function addChoices(){
    if(followMeInfoChoiceRendered) return;
    followMeInfoChoiceRendered = true;

    const wrap = document.createElement("div");
    wrap.className = "choices";

    if(realConversationStarted){
      const prompt = document.createElement("div");
      prompt.className = "choice-prompt";
      prompt.textContent = "Vuoi sapere cosa sono?";
      wrap.appendChild(prompt);
    }

    const yes = document.createElement("button");
    yes.className = "choice";
    yes.textContent = "👀 Sì, raccontami";

    const no = document.createElement("button");
    no.className = "choice";
    no.textContent = "No, aspetto";

    yes.onclick = ()=>{
      wrap.remove();
      addUser("Sì, raccontami");
      followMeInfoChoiceSent = true;
      followMeInfoExplained = true;

    };

    wrap.appendChild(yes);
    wrap.appendChild(no);
    messages.appendChild(wrap);
    scrollBottom();
  }

  async function createSession(){
    const res = await fetch("/api/followme/chat/" + encodeURIComponent(TOKEN) + "/session", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ source:"public_chat" })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || "Errore apertura chat");
    sessionId = data.session_id;
    statusText.textContent = "Connesso · in attesa del proprietario";
  }


  function playFollowMeSendSound(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;

      const ctx = new AudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = "sine";
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.055);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.13);

      filter.type = "highpass";
      filter.frequency.setValueAtTime(420, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.075, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.17);

      setTimeout(()=>ctx.close().catch(()=>{}), 280);
    }catch(e){}
  }

  function isFollowMeMeaningfulQuestion(text){
    const t = String(text || "").toLowerCase().trim();

    if(!t) return false;

    const hasQuestionMark = t.includes("?");

    const keywords = [
      "quanto costa",
      "costo",
      "costa",
      "prezzo",
      "prezzi",
      "dove lo compro",
      "dove posso comprar",
      "comprare",
      "acquistare",
      "acquisto",
      "come funziona",
      "funziona",
      "posso averlo",
      "averlo",
      "lo voglio",
      "mi interessa",
      "informazioni",
      "info",
      "dettagli",
      "abbonamento",
      "canone",
      "attivarlo",
      "attivare",
      "qr dinamico",
      "followme"
    ];

    if(hasQuestionMark && t.length >= 4) return true;

    return keywords.some(k => t.includes(k));
  }

  async function sendSystemNoteToOwner(message){
    if(!sessionId || !message) return;

    try{
      await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ sender:"visitor", message:message })
      });
    }catch(e){}
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text || !sessionId) return;

    const shouldRobotFallback = followMeInfoExplained && !followMeRobotFallbackSent && isFollowMeMeaningfulQuestion(text);

    stopRobotSequence();

    input.value = "";
    addUser(text);
    playFollowMeSendSound();
    alreadyRendered("visitor", text, null);

    if(!followMeInfoChoiceSent && !followMeInfoChoiceRendered){
      setTimeout(function(){
        addChoices();
      }, 650);
    }

    if(shouldRobotFallback){
      followMeRobotFallbackSent = true;
      setTimeout(function(){
        addBot("Mi piacerebbe aiutarti, ma io sono solo il robottino di accoglienza 🤖<br><br>Per <strong>prezzi, acquisto o dettagli pratici</strong> deve risponderti il proprietario.<br><br><strong>Puoi attendere ancora un momento?</strong>");
      }, 650);
    }

    const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ sender:"visitor", message:text })
    });

    const data = await res.json().catch(()=>null);
    if(data && data.success && data.message && data.message.id){
      lastMessageId = Math.max(lastMessageId, Number(data.message.id) || 0);
      alreadyRendered("visitor", text, data.message.id);
      setTimeout(poll, 700);
    }
  }

  async function poll(){
    if(!sessionId) return;
    try{
      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/messages?after=" + encodeURIComponent(lastMessageId), { cache:"no-store" });
      const data = await res.json();
      if(data.success && Array.isArray(data.messages)){
        data.messages.forEach(m=>{
          lastMessageId = Math.max(lastMessageId, Number(m.id)||0);
          if(m.sender === "owner"){
            stopRobotSequence();
            addAdmin(String(m.message || ""));
          }
        });
      }
    }catch(e){}
  }

  async function boot(){
    try{
      await createSession();

      botTypingThen("Ciao, sono <strong>FollowMe QR</strong> 👋", 800);

      scheduleRobot(()=>botTypingThen("Ho avvisato il proprietario che ti sei collegato.<br>Se è disponibile, ti risponderà qui.", 850), 1800);

      scheduleRobot(()=>botTypingThen("Mentre aspetti, vuoi sapere <strong>cosa sono</strong>?", 750), 4200);

      scheduleRobot(addChoices, 5600);

      setInterval(poll, 1500);
    }catch(err){
      statusText.textContent = "Chat non disponibile";
      addBot("Mi dispiace, la chat non è disponibile in questo momento.");
      console.error(err);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  boot();
})();
</script>

  function ensureBlockedNotice(){

  function canUseExtra(){

           !document.body.classList.contains("fm-public-clean-blocked");

  function toggleMenu(force){
    const menu = document.getElementById("fmPublicAttachMenu20260519");
    if(!menu) return;

    if(!canUseExtra()){
      menu.classList.remove("is-open");
      return;

    const open = typeof force === "boolean" ? force : !menu.classList.contains("is-open");

  async function uploadBlob(blob, filename, kind, mime){
    const sid = getSid();
    if(!sid) throw new Error("Sessione chat mancante.");
    if(!blob) throw new Error("File mancante.");

    const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/attachment-raw", {
      method:"POST",
      headers:{
        "Content-Type": mime || blob.type || "application/octet-stream",
        "X-FollowMe-Sender": "visitor",
        "X-FollowMe-Kind": kind || "document",
        "X-FollowMe-Filename": encodeURIComponent(filename || "allegato")
      },
      body: await blob.arrayBuffer()
    });

    const data = await res.json().catch(()=>null);
    if(!res.ok || !data || !data.success){
      throw new Error((data && data.error) || "Errore invio allegato.");
    }

    toggleMenu(false);
    forceLoadMessages();
  }

  async function uploadFile(file, kind){
    if(!file) return;
    await uploadBlob(file, file.name || "allegato", kind || (file.type && file.type.indexOf("image/") === 0 ? "image" : "document"), file.type);
  }

  function forceLoadMessages(){
    try{ if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages(); }catch(e){}
    try{ if(typeof window.loadMessages === "function") window.loadMessages(); }catch(e){}
    setTimeout(renderAttachmentsInBubbles, 80);
    setTimeout(renderAttachmentsInBubbles, 400);
  }

  async function sendLocation(){
    if(!navigator.geolocation){
      alert("Geolocalizzazione non disponibile.");
      return;
    }

    navigator.geolocation.getCurrentPosition(async function(pos){
      try{
        const sid = getSid();
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const url = "https://www.google.com/maps?q=" + encodeURIComponent(lat + "," + lng);

        const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/attachment", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({
            sender:"visitor",
            kind:"location",
            url:url,
            label:"Posizione condivisa",
            mime:"text/uri-list",
            filename:"posizione"
          })
        });

        const data = await res.json().catch(()=>null);
        if(!res.ok || !data || !data.success){
          throw new Error((data && data.error) || "Errore invio posizione.");
        }

        toggleMenu(false);
        forceLoadMessages();
      }catch(e){
        alert(e.message || "Errore invio posizione.");
      }
    }, function(){
      alert("Posizione non autorizzata.");
    }, {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    });
  }

  async function toggleAudioRecording(){
    try{
      if(recording && mediaRecorder){
        mediaRecorder.stop();
        return;
      }

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        alert("Registrazione audio non supportata su questo dispositivo.");
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioChunks = [];

      mediaRecorder = new MediaRecorder(stream);
      recording = true;

      const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
      if(audioBtn) audioBtn.textContent = "⏹️ Stop audio";

      mediaRecorder.ondataavailable = function(ev){
        if(ev.data && ev.data.size > 0) audioChunks.push(ev.data);
      };

      mediaRecorder.onstop = async function(){
        recording = false;

        try{
          stream.getTracks().forEach(t => t.stop());
        }catch(e){}

        const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
        if(audioBtn) audioBtn.textContent = "🎙️ Audio";

        try{
          const mime = audioChunks[0] ? audioChunks[0].type || "audio/webm" : "audio/webm";
          const blob = new Blob(audioChunks, { type:mime });
          await uploadBlob(blob, "audio_" + Date.now() + ".webm", "audio", mime);
        }catch(e){
          alert(e.message || "Errore invio audio.");
        }
      };

      mediaRecorder.start();
    }catch(e){
      recording = false;
      alert(e.message || "Errore registrazione audio.");
    }
  }

  function bindMenu(){
    const plus = document.getElementById("fmPublicInlinePlusBtn20260519");
    const photoBtn = document.getElementById("fmPublicPhotoBtn20260519");
    const fileBtn = document.getElementById("fmPublicFileBtn20260519");
    const locBtn = document.getElementById("fmPublicLocationBtn20260519");

    if(plus && plus.dataset.boundInlinePlus !== "1"){

      }, true);

    if(photoBtn && photoBtn.dataset.boundInlinePlus !== "1"){
      photoBtn.dataset.boundInlinePlus = "1";
      photoBtn.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(canUseExtra() && photoInput) photoInput.click();
      }, true);

    if(fileBtn && fileBtn.dataset.boundInlinePlus !== "1"){
      fileBtn.dataset.boundInlinePlus = "1";
      fileBtn.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        if(canUseExtra() && fileInput) fileInput.click();
      }, true);
    }

    if(locBtn && locBtn.dataset.boundInlinePlus !== "1"){
      locBtn.dataset.boundInlinePlus = "1";

    if(audioBtn && audioBtn.dataset.boundInlinePlus !== "1"){

        ev.preventDefault();
        ev.stopPropagation();
        if(canUseExtra()) toggleAudioRecording();
      }, true);
    }

    if(photoInput && photoInput.dataset.boundInlinePlus !== "1"){
      photoInput.dataset.boundInlinePlus = "1";
      photoInput.addEventListener("change", async function(){
        const file = photoInput.files && photoInput.files[0];
        if(!file) return;
        try{ await uploadFile(file, "image"); }
        catch(e){ alert(e.message || "Errore invio foto."); }
        finally{ photoInput.value = ""; }
      });
    }

    if(fileInput && fileInput.dataset.boundInlinePlus !== "1"){
      fileInput.dataset.boundInlinePlus = "1";
      fileInput.addEventListener("change", async function(){
        const file = fileInput.files && fileInput.files[0];
        if(!file) return;
        try{ await uploadFile(file, "document"); }
        catch(e){ alert(e.message || "Errore invio documento."); }
        finally{ fileInput.value = ""; }
      });
    }

    if(!document.body.dataset.fmInlinePlusCloseBound){
      document.body.dataset.fmInlinePlusCloseBound = "1";
      document.addEventListener("click", function(ev){
        const menu = document.getElementById("fmPublicAttachMenu20260519");
        const plus = document.getElementById("fmPublicInlinePlusBtn20260519");
        if(!menu || !menu.classList.contains("is-open")) return;
        if(menu.contains(ev.target) || (plus && plus.contains(ev.target))) return;
        menu.classList.remove("is-open");
      }, true);
    }
  }

  function renderAttachmentsInBubbles(){
    document.querySelectorAll(".message, .bubble, .followme-public-bubble, .followme-owner-chat-bubble").forEach(function(b){
      if(b.dataset.fmAttachmentRendered === "1") return;

      const txt = (b.textContent || "").trim();
      const a = parseAttachmentMessage(txt);

      if(!a) return;

      b.dataset.fmAttachmentRendered = "1";
      b.innerHTML = renderAttachment(a);
    });
  }

  async function recoverOpenSession(){
    try{
      const res = await fetch("/api/followme/FM-DEMO/chat/sessions?v=" + Date.now(), { cache:"no-store" });
      const data = await res.json().catch(()=>null);

      if(!res.ok || !data || !data.success) return "";

      const sessions = Array.isArray(data.sessions) ? data.sessions : [];
      const open = sessions.filter(s => s && s.status === "open");
      const chosen = open[0] || sessions[0];

      if(chosen && chosen.id) return saveSid(chosen.id);
    }catch(e){}

    return "";
  }

  function applyState(session){
    if(!session) return;

    const sid = session.id ? saveSid(session.id) : getSid();
    const uploads = !!session.uploads_enabled;
    const blocked = !!session.is_blocked;
    const key = String(sid) + "|" + uploads + "|" + blocked + "|" + String(session.updated_at || "");

    if(key !== lastStateKey){
      lastStateKey = key;

      document.body.classList.toggle("fm-public-extra-inline-on", uploads);
      document.body.classList.toggle("fm-public-clean-blocked", blocked);
      document.body.classList.toggle("followme-public-uploads-enabled", uploads);
      document.body.classList.toggle("followme-public-user-blocked", blocked);

      const input = findInput();
      const send = findSend();

      if(input){
        input.disabled = blocked;
        if(blocked){
          input.dataset.oldPlaceholder = input.dataset.oldPlaceholder || input.placeholder || "";
          input.placeholder = "Sei stato bloccato dal sistema.";
        }else if(input.dataset.oldPlaceholder){
          input.placeholder = input.dataset.oldPlaceholder;
        }
      }

      if(send) send.disabled = blocked;

      if(!uploads) toggleMenu(false);
    }

    ensureBlockedNotice();
    ensureInlinePlus();
    renderAttachmentsInBubbles();
  }

  async function fetchState(force){
    const now = Date.now();
    if(!force && now - lastStateAt < 1200) return;
    if(stateBusy) return;

    lastStateAt = now;
    stateBusy = true;

    try{
      let sid = getSid();
      if(!sid) sid = await recoverOpenSession();
      if(!sid) return;

      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
        cache:"no-store"
      });

      const data = await res.json().catch(()=>null);

      if(res.status === 404 || !data || !data.success){
        clearSid();
        sid = await recoverOpenSession();
        if(!sid) return;

        const res2 = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
          cache:"no-store"
        });

        const data2 = await res2.json().catch(()=>null);
        if(!res2.ok || !data2 || !data2.success) return;

        applyState(data2.session);
        return;
      }

      applyState(data.session);
    }catch(e){
      console.warn("[FM public inline plus] state error", e);
    }finally{
      stateBusy = false;
    }
  }

  if(!window.__fmPublicInlinePlusFetchBridge20260519){
    window.__fmPublicInlinePlusFetchBridge20260519 = true;
    const oldFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await oldFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        if(url && url.includes("/api/followme/chat/") && !url.includes("/messages?")){
          const clone = res.clone();
          const data = await clone.json().catch(()=>null);
          const sid = extractSid(data);

          if(sid){
            saveSid(sid);
            setTimeout(function(){ fetchState(true); }, 120);
          }
        }

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/messages")){
          setTimeout(renderAttachmentsInBubbles, 80);
          setTimeout(renderAttachmentsInBubbles, 400);
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    injectCss();
    ensureBlockedNotice();
    ensureInlinePlus();
    fetchState(true);
    renderAttachmentsInBubbles();

    setTimeout(ensureInlinePlus, 300);
    setTimeout(renderAttachmentsInBubbles, 700);
  }

  window.fmPublicForceFetchState20260518 = function(){ return fetchState(true); };
  window.fmPublicInlinePlusState20260519 = function(){ return { sid:getSid(), lastStateKey:lastStateKey }; };

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(function(){ fetchState(true); renderAttachmentsInBubbles(); }, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(function(){ fetchState(true); ensureInlinePlus(); renderAttachmentsInBubbles(); }, 250);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      setTimeout(function(){ fetchState(true); ensureInlinePlus(); renderAttachmentsInBubbles(); }, 250);
    }
  });

  setInterval(function(){
    fetchState(false);
    ensureInlinePlus();
    renderAttachmentsInBubbles();
  }, 2500);
})();
</script>



<script id="followme-public-upload-render-like-admin-20260519">
(function(){
  if(window.__FollowMePublicUploadRenderLikeAdmin20260519) return;
  window.__FollowMePublicUploadRenderLikeAdmin20260519 = true;

  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function parseAttachmentMessage(message){
    try{
      const obj = typeof message === "string" ? JSON.parse(message) : message;
      if(obj && obj.__followme_attachment) return obj;
    }catch(e){}
    return null;
  }

  function renderAttachment(a){
    const url = a.url || "";
    const name = a.label || a.filename || "Allegato";
    const mime = a.mime || "";
    const kind = a.kind || "";

    if(kind === "image" || mime.indexOf("image/") === 0){
      return '<a class="followme-attachment-card" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<img class="followme-attachment-image" src="' + esc(url) + '" alt="' + esc(name) + '">' +
        '<span class="followme-attachment-meta">' + esc(name) + (a.temporary ? ' · Allegato temporaneo' : '') + '</span>' +
      '</a>';
    }

    if(kind === "audio" || mime.indexOf("audio/") === 0){
      return '<div class="followme-attachment-audio">' +
        '<span>🎙️</span><audio controls src="' + esc(url) + '"></audio>' +
      '</div>';
    }

    if(kind === "location"){
      return '<a class="followme-attachment-location" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<span>📍</span><span><span class="followme-attachment-name">Posizione condivisa</span><span class="followme-attachment-meta">Apri mappa</span></span>' +
      '</a>';
    }

    return '<a class="followme-attachment-file" href="' + esc(url) + '" target="_blank" rel="noopener" download>' +
      '<span>📎</span><span><span class="followme-attachment-name">' + esc(name) + '</span><span class="followme-attachment-meta">Apri documento</span></span>' +
    '</a>';
  }

  function findMessagesBox(){
    return document.getElementById("messages") ||
           document.getElementById("chatMessages") ||
           document.getElementById("followmePublicMessages") ||
           document.querySelector(".messages") ||
           document.querySelector(".chat-messages") ||
           document.querySelector(".followme-public-messages") ||
           document.querySelector("main") ||
           document.body;
  }

  function appendLocalAttachmentBubble(attachment, sender){
    const box = findMessagesBox();
    if(!box || !attachment) return;

    const bubble = document.createElement("div");
    bubble.className = "message bubble followme-public-bubble " + (sender === "owner" ? "owner" : "visitor");
    bubble.dataset.fmAttachmentRendered = "1";
    bubble.innerHTML = renderAttachment(attachment);

    box.appendChild(bubble);

    try{
      box.scrollTop = box.scrollHeight;
    }catch(e){}

    setTimeout(renderAllAttachments, 80);
    setTimeout(renderAllAttachments, 400);
  }

  function renderAllAttachments(){
    document.querySelectorAll(".message, .bubble, .followme-public-bubble, .followme-owner-chat-bubble, [data-message-id]").forEach(function(b){
      if(b.dataset.fmAttachmentRendered === "1") return;

      const txt = (b.textContent || "").trim();
      const a = parseAttachmentMessage(txt);

      if(!a) return;

      b.dataset.fmAttachmentRendered = "1";
      b.innerHTML = renderAttachment(a);
    });
  }

  async function callOriginalFetch(input, init){
    return window.__fmOriginalFetchForPublicUpload20260519(input, init);
  }

  if(!window.__fmOriginalFetchForPublicUpload20260519){
    window.__fmOriginalFetchForPublicUpload20260519 = window.fetch.bind(window);
  }

  if(!window.__fmPublicUploadRenderFetchPatched20260519){
    window.__fmPublicUploadRenderFetchPatched20260519 = true;

    window.fetch = async function(input, init){
      const res = await callOriginalFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        const isAttachment =
          url &&
          url.includes("/api/followme/chat/session/") &&
          (url.includes("/attachment-raw") || url.includes("/attachment"));

        if(isAttachment){
          const clone = res.clone();
          const data = await clone.json().catch(()=>null);

          if(data && data.success){
            const attachment =
              data.attachment ||
              (data.message && parseAttachmentMessage(data.message.message)) ||
              null;

            if(attachment){
              appendLocalAttachmentBubble(attachment, "visitor");
            }

            setTimeout(renderAllAttachments, 80);
            setTimeout(renderAllAttachments, 400);
            setTimeout(renderAllAttachments, 1200);
          }
        }

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/messages")){
          setTimeout(renderAllAttachments, 80);
          setTimeout(renderAllAttachments, 400);
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    renderAllAttachments();

    // Rende disponibili funzioni globali anche agli script precedenti.
    window.fmPublicAppendLocalAttachmentBubble20260519 = appendLocalAttachmentBubble;
    window.fmPublicRenderAllAttachments20260519 = renderAllAttachments;
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(renderAllAttachments, 1000);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(renderAllAttachments, 250);
  });

  setInterval(renderAllAttachments, 1500);
})();
</script>



<script id="followme-public-audio-panel-fix-20260519">
(function(){
  if(window.__FollowMePublicAudioPanelFix20260519) return;
  window.__FollowMePublicAudioPanelFix20260519 = true;

  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;
  let audioStream = null;
  let isRecording = false;
  let startedAt = 0;
  let timer = null;

  function cleanSid(v){
    const s = String(v || "").trim();
    return /^\d+$/.test(s) ? s : "";
  }

  function getSid(){
    try{
      const q = new URLSearchParams(location.search || "");
      const fromUrl = cleanSid(q.get("session") || q.get("chatSession"));
      if(fromUrl) return fromUrl;
    }catch(e){}

    const arr = [
      window.followMeChatSessionId,
      window.FOLLOWME_CHAT_SESSION_ID
    ];

    try{ arr.push(sessionStorage.getItem("followme_chat_session_id")); }catch(e){}
    try{ arr.push(localStorage.getItem("followme_chat_session_id")); }catch(e){}

    for(const v of arr){
      const sid = cleanSid(v);
      if(sid) return sid;
    }

    return "";
  }

  function canUseExtra(){
    return document.body.classList.contains("fm-public-extra-inline-on") &&
           !document.body.classList.contains("fm-public-clean-blocked");
  }

  function findComposer(){
    return document.querySelector(".followme-public-composer") ||
           document.querySelector(".composer") ||
           document.querySelector("form") ||
           document.body;
  }

  function chooseMimeType(){
    try{
      if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";

      const candidates = [
        "audio/mp4",
        "audio/aac",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];

      for(const type of candidates){
        if(MediaRecorder.isTypeSupported(type)) return type;
      }
    }catch(e){}

    return "";
  }

  function extensionForMime(mime){
    mime = String(mime || "").toLowerCase();

    if(mime.includes("mp4")) return "m4a";
    if(mime.includes("aac")) return "aac";
    if(mime.includes("ogg")) return "ogg";
    if(mime.includes("webm")) return "webm";

    return "audio";
  }

  function injectCss(){
    if(document.getElementById("followmePublicAudioPanelFixCss20260519")) return;

    const style = document.createElement("style");
    style.id = "followmePublicAudioPanelFixCss20260519";
    style.textContent = `
      #fmPublicAudioPanel20260519{
        display:none;
        position:absolute;
        left:10px;
        right:10px;
        bottom:58px;
        z-index:100000;
        background:#ffffff;
        color:#202629;
        border-radius:22px;
        border:1px solid rgba(0,0,0,.10);
        box-shadow:0 18px 60px rgba(0,0,0,.28);
        padding:12px;
        box-sizing:border-box;
      }

      #fmPublicAudioPanel20260519.is-open{

      body.fm-public-clean-blocked #fmPublicAudioPanel20260519,
      body:not(.fm-public-extra-inline-on) #fmPublicAudioPanel20260519{

      #fmPublicAudioPanel20260519 .fm-audio-title{
        font-size:.86rem;

      #fmPublicAudioPanel20260519 .fm-audio-status{
        min-height:22px;

        font-weight:800;

      #fmPublicAudioPanel20260519 .fm-audio-actions{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:8px;
      }

      #fmPublicAudioPanel20260519 button{
        min-height:40px;
        border-radius:999px;
        border:1px solid rgba(0,0,0,.08);
        background:#f6f7f8;
        color:#202629;

        font-weight:950;
        cursor:pointer;
      }

      #fmPublicAudioPanel20260519 button.primary{
        background:#25d366;
        color:#ffffff;
        border-color:rgba(37,211,102,.45);
      }

      #fmPublicAudioPanel20260519 button.danger{
        background:#fff1ef;
        color:#b42318;
      }

      #fmPublicAudioPanel20260519 button.warn{

      }

      #fmPublicAudioPanel20260519 button:disabled{
        opacity:.45;
        cursor:not-allowed;
      }
    `;
    document.head.appendChild(style);
  }

  function ensurePanel(){
    let panel = document.getElementById("fmPublicAudioPanel20260519");
    if(panel) return panel;

    const composer = findComposer();

    try{
      if(getComputedStyle(composer).position === "static"){
        composer.style.position = "relative";
      }
    }catch(e){
      composer.style.position = "relative";
    }

    panel = document.createElement("div");
    panel.id = "fmPublicAudioPanel20260519";
    panel.innerHTML = `
      <div class="fm-audio-title">Messaggio audio</div>
      <div class="fm-audio-status" id="fmPublicAudioStatus20260519">Premi Registra per autorizzare il microfono e iniziare.</div>
      <div class="fm-audio-actions">
        <button type="button" id="fmPublicAudioStart20260519" class="primary">Registra</button>
        <button type="button" id="fmPublicAudioStop20260519" class="warn" disabled>Stop</button>
        <button type="button" id="fmPublicAudioSend20260519" class="primary" disabled>Invia audio</button>
        <button type="button" id="fmPublicAudioCancel20260519" class="danger">Annulla</button>
      </div>
    `;

    composer.appendChild(panel);
    bindPanel();

    return panel;
  }

  function setStatus(msg){
    const el = document.getElementById("fmPublicAudioStatus20260519");
    if(el) el.textContent = msg;
  }

  function setButtons(state){
    const start = document.getElementById("fmPublicAudioStart20260519");
    const stop = document.getElementById("fmPublicAudioStop20260519");
    const send = document.getElementById("fmPublicAudioSend20260519");

    if(!start || !stop || !send) return;

    if(state === "idle"){
      start.disabled = false;
      stop.disabled = true;
      send.disabled = true;
    }

    if(state === "recording"){
      start.disabled = true;
      stop.disabled = false;
      send.disabled = true;
    }

    if(state === "ready"){
      start.disabled = false;
      stop.disabled = true;
      send.disabled = false;
    }

    if(state === "sending"){
      start.disabled = true;
      stop.disabled = true;
      send.disabled = true;
    }
  }

  function openPanel(){
    if(!canUseExtra()) return;

    const panel = ensurePanel();
    panel.classList.add("is-open");

    if(audioBlob){
      setButtons("ready");
      setStatus("Audio pronto. Puoi inviarlo o registrarlo di nuovo.");
    }else{
      setButtons("idle");
      setStatus("Premi Registra per autorizzare il microfono e iniziare.");
    }
  }

  function closePanel(){
    const panel = document.getElementById("fmPublicAudioPanel20260519");
    if(panel) panel.classList.remove("is-open");
  }

  function resetAudio(){
    try{
      if(mediaRecorder && isRecording){
        mediaRecorder.stop();
      }
    }catch(e){}

    try{
      if(audioStream){
        audioStream.getTracks().forEach(t => t.stop());
      }
    }catch(e){}

    mediaRecorder = null;
    audioChunks = [];
    audioBlob = null;
    audioStream = null;
    isRecording = false;
    startedAt = 0;

    if(timer){
      clearInterval(timer);
      timer = null;
    }

    setButtons("idle");
    setStatus("Premi Registra per autorizzare il microfono e iniziare.");
  }

  function updateTimer(){
    if(!isRecording || !startedAt) return;

    const sec = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
    setStatus("Registrazione in corso… " + sec + "s");
  }

  async function startRecording(){
    try{
      if(!canUseExtra()) return;

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setStatus("Microfono non supportato su questo dispositivo/browser.");
        return;
      }

      if(!window.MediaRecorder){
        setStatus("Registrazione audio non supportata da questo browser.");
        return;
      }

      resetAudio();

      setStatus("Richiesta autorizzazione microfono…");

      audioStream = await navigator.mediaDevices.getUserMedia({ audio:true });

      const mimeType = chooseMimeType();
      const options = mimeType ? { mimeType } : undefined;

      audioChunks = [];
      mediaRecorder = new MediaRecorder(audioStream, options);

      mediaRecorder.ondataavailable = function(ev){
        if(ev.data && ev.data.size > 0){
          audioChunks.push(ev.data);
        }
      };

      mediaRecorder.onerror = function(ev){
        console.warn("MediaRecorder error:", ev);
        setStatus("Errore registrazione audio.");
      };

      mediaRecorder.onstop = function(){
        try{
          if(audioStream){
            audioStream.getTracks().forEach(t => t.stop());
          }
        }catch(e){}

        audioStream = null;
        isRecording = false;

        if(timer){
          clearInterval(timer);
          timer = null;
        }

        const finalMime = mediaRecorder && mediaRecorder.mimeType ? mediaRecorder.mimeType : (mimeType || "audio/webm");

        if(!audioChunks.length){
          audioBlob = null;
          setButtons("idle");
          setStatus("Registrazione vuota. Riprova parlando dopo aver premuto Registra.");
          return;
        }

        audioBlob = new Blob(audioChunks, { type: finalMime });

        if(!audioBlob || audioBlob.size < 1000){
          setButtons("idle");
          setStatus("Audio troppo breve o vuoto. Riprova.");
          return;
        }

        setButtons("ready");
        setStatus("Audio registrato. Premi Invia audio.");
      };

      mediaRecorder.start(250);
      isRecording = true;
      startedAt = Date.now();

      setButtons("recording");
      setStatus("Registrazione in corso… 0s");

      timer = setInterval(updateTimer, 500);

    }catch(err){
      console.error("startRecording error:", err);

      resetAudio();

      const msg = String(err && (err.name || err.message) || err || "");

      if(msg.includes("NotAllowed") || msg.includes("Permission") || msg.includes("denied")){
        setStatus("Microfono non autorizzato. Consenti l’uso del microfono nelle impostazioni di Safari/iPhone e riprova.");
      }else{
        setStatus("Errore microfono: " + (err.message || msg || "non disponibile"));
      }
    }
  }

  function stopRecording(){
    try{
      if(mediaRecorder && isRecording){
        setStatus("Preparazione audio…");
        mediaRecorder.stop();
      }
    }catch(err){
      console.error("stopRecording error:", err);
      setStatus("Errore stop registrazione.");
      resetAudio();
    }
  }

  async function uploadAudio(){
    try{
      if(!audioBlob || audioBlob.size <= 0){
        setStatus("Nessun audio da inviare.");
        return;
      }

      const sid = getSid();
      if(!sid){
        setStatus("Sessione chat mancante.");
        return;
      }

      setButtons("sending");
      setStatus("Invio audio…");

      const mime = audioBlob.type || "audio/webm";
      const ext = extensionForMime(mime);
      const filename = "audio_" + Date.now() + "." + ext;

      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sid) + "/attachment-raw", {
        method:"POST",
        headers:{
          "Content-Type": mime,
          "X-FollowMe-Sender": "visitor",
          "X-FollowMe-Kind": "audio",
          "X-FollowMe-Filename": encodeURIComponent(filename)
        },
        body: await audioBlob.arrayBuffer()
      });

      const data = await res.json().catch(()=>null);

      if(!res.ok || !data || !data.success){
        throw new Error((data && data.error) || "Errore invio audio.");
      }

      if(window.fmPublicAppendLocalAttachmentBubble20260519 && data.attachment){
        window.fmPublicAppendLocalAttachmentBubble20260519(data.attachment, "visitor");
      }

      if(window.fmPublicRenderAllAttachments20260519){
        window.fmPublicRenderAllAttachments20260519();
      }

      try{
        if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages();
      }catch(e){}

      try{
        if(typeof window.loadMessages === "function") window.loadMessages();
      }catch(e){}

      setStatus("Audio inviato.");
      closePanel();

      audioBlob = null;
      audioChunks = [];
      setButtons("idle");

    }catch(err){
      console.error("uploadAudio error:", err);
      setButtons("ready");
      setStatus(err.message || "Errore invio audio.");
    }
  }

  function bindPanel(){
    const start = document.getElementById("fmPublicAudioStart20260519");
    const stop = document.getElementById("fmPublicAudioStop20260519");
    const send = document.getElementById("fmPublicAudioSend20260519");
    const cancel = document.getElementById("fmPublicAudioCancel20260519");

    if(start && start.dataset.boundAudioFix !== "1"){
      start.dataset.boundAudioFix = "1";
      start.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        startRecording();
      }, true);
    }

    if(stop && stop.dataset.boundAudioFix !== "1"){
      stop.dataset.boundAudioFix = "1";
      stop.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        stopRecording();
      }, true);
    }

    if(send && send.dataset.boundAudioFix !== "1"){
      send.dataset.boundAudioFix = "1";
      send.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        uploadAudio();
      }, true);
    }

    if(cancel && cancel.dataset.boundAudioFix !== "1"){
      cancel.dataset.boundAudioFix = "1";
      cancel.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        resetAudio();
        closePanel();
      }, true);
    }
  }

  function patchExistingAudioButton(){
    const oldBtn = document.getElementById("fmPublicAudioBtn20260519");

    if(!oldBtn || oldBtn.dataset.audioPanelPatched === "1") return;

    oldBtn.dataset.audioPanelPatched = "1";
    oldBtn.textContent = "🎙️ Audio";

    oldBtn.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();

      openPanel();
    }, true);
  }

  function boot(){
    injectCss();
    ensurePanel();
    patchExistingAudioButton();
    setButtons(audioBlob ? "ready" : "idle");

    setTimeout(patchExistingAudioButton, 300);
    setTimeout(patchExistingAudioButton, 900);
  }

  window.fmPublicOpenAudioPanel20260519 = openPanel;
  window.fmPublicAudioDebug20260519 = function(){
    return {
      hasMediaDevices:!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
      hasMediaRecorder:!!window.MediaRecorder,
      chosenMime:chooseMimeType(),
      isRecording,
      hasBlob:!!audioBlob,
      blobSize:audioBlob ? audioBlob.size : 0
    };
  };

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(patchExistingAudioButton, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
  });

  setInterval(patchExistingAudioButton, 2000);
})();
</script>



<script id="followme-public-audio-state-reset-final-20260519">
(function(){
  if(window.__FollowMePublicAudioStateResetFinal20260519) return;
  window.__FollowMePublicAudioStateResetFinal20260519 = true;

  let forcedAudioOpenAt = 0;

  function setAudioBtnIdle(){
    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(audioBtn){
      audioBtn.textContent = "🎙️ Audio";
      audioBtn.disabled = false;
      audioBtn.removeAttribute("disabled");
      audioBtn.dataset.recording = "0";
      audioBtn.dataset.audioState = "idle";
    }
  }

  function setPanelIdle(){
    const start = document.getElementById("fmPublicAudioStart20260519");
    const stop = document.getElementById("fmPublicAudioStop20260519");
    const send = document.getElementById("fmPublicAudioSend20260519");
    const status = document.getElementById("fmPublicAudioStatus20260519");

    if(start){
      start.disabled = false;
      start.removeAttribute("disabled");
    }

    if(stop){
      stop.disabled = true;
      stop.setAttribute("disabled", "disabled");
    }

    if(send){
      send.disabled = true;
      send.setAttribute("disabled", "disabled");
      send.dataset.forceSending = "";
      send.dataset.singleSendGuard = "";
      send.dataset.multiAudioSendBound = send.dataset.multiAudioSendBound || "";
    }

    if(status){
      status.textContent = "Premi Registra per autorizzare il microfono e iniziare.";
    }
  }

  function closeAudioPanel(){
    const panel = document.getElementById("fmPublicAudioPanel20260519");
    if(panel){
      panel.classList.remove("is-open");
    }
  }

  function hardResetAudioUi(){
    setAudioBtnIdle();
    setPanelIdle();

    try{
      if(window.fmAudioSuccessOnlyState20260519){
        // Solo lettura: non possiamo azzerare le closure interne, ma impediamo lo stato UI sporco.
        window.__fmAudioLastHardResetAt = Date.now();
      }
    }catch(e){}

    try{
      if(window.fmAudioMultipleSendFixState20260519){
        window.__fmAudioLastHardResetAt = Date.now();
      }
    }catch(e){}
  }

  /*
    Patch del pulsante +:
    ogni volta che riapro il menu allegati, l'audio deve ripartire da stato pulito.
  */
  function patchPlusButton(){
    const plus = document.getElementById("fmPublicInlinePlusBtn20260519");
    if(!plus || plus.dataset.audioResetPlusBound === "1") return;

    plus.dataset.audioResetPlusBound = "1";

    plus.addEventListener("click", function(){
      hardResetAudioUi();
    }, true);
  }

  /*
    Patch del pulsante Audio:
    non deve mai mostrare Stop audio prima di essere entrati nel pannello.
    Quando lo clicco, resetta e poi apre il pannello pulito.
  */
  function patchAudioButton(){
    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(!audioBtn) return;

    if(audioBtn.textContent.trim().toLowerCase().includes("stop")){
      setAudioBtnIdle();
    }

    if(audioBtn.dataset.audioResetFinalBound === "1") return;

    audioBtn.dataset.audioResetFinalBound = "1";

    audioBtn.addEventListener("click", function(ev){
      /*
        Se il vecchio handler prova a trasformarlo in Stop audio,
        lo rimettiamo subito in stato Audio e apriamo il pannello.
      */
      forcedAudioOpenAt = Date.now();

      setTimeout(function(){
        setAudioBtnIdle();
        setPanelIdle();

        if(typeof window.fmPublicOpenAudioPanel20260519 === "function"){
          window.fmPublicOpenAudioPanel20260519();
        }else{
          const panel = document.getElementById("fmPublicAudioPanel20260519");
          if(panel) panel.classList.add("is-open");
        }
      }, 20);
    }, true);
  }

  /*
    Patch Registra:
    quando parte una nuova registrazione deve essere un ciclo nuovo.
  */
  function patchStartButton(){
    const start = document.getElementById("fmPublicAudioStart20260519");
    if(!start || start.dataset.audioResetStartBound === "1") return;

    start.dataset.audioResetStartBound = "1";

    start.addEventListener("click", function(){
      const send = document.getElementById("fmPublicAudioSend20260519");
      if(send){
        send.disabled = true;
        send.setAttribute("disabled", "disabled");
      }

      const stop = document.getElementById("fmPublicAudioStop20260519");
      if(stop){
        stop.disabled = false;
        stop.removeAttribute("disabled");
      }

      const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
      if(audioBtn){
        audioBtn.textContent = "🎙️ Audio";
      }
    }, true);
  }

  /*
    Patch Stop:
    dopo Stop deve abilitare Invia audio, non lasciare Audio in stato Stop.
  */
  function patchStopButton(){
    const stop = document.getElementById("fmPublicAudioStop20260519");
    if(!stop || stop.dataset.audioResetStopBound === "1") return;

    stop.dataset.audioResetStopBound = "1";

    stop.addEventListener("click", function(){
      setTimeout(function(){
        setAudioBtnIdle();

        const send = document.getElementById("fmPublicAudioSend20260519");
        if(send){
          send.disabled = false;
          send.removeAttribute("disabled");
        }
      }, 450);
    }, true);
  }

  /*
    Patch Invia:
    dopo un invio, riuscito o fallito, il ciclo deve tornare pulito.
    Il messaggio in chat viene comunque gestito dalle patch di rendering esistenti.
  */
  function patchSendButton(){
    const send = document.getElementById("fmPublicAudioSend20260519");
    if(!send || send.dataset.audioResetSendBound === "1") return;

    send.dataset.audioResetSendBound = "1";

    send.addEventListener("click", function(){
      const status = document.getElementById("fmPublicAudioStatus20260519");
      if(status) status.textContent = "Invio audio…";

      setTimeout(function(){
        setAudioBtnIdle();
      }, 200);

      setTimeout(function(){
        closeAudioPanel();
        hardResetAudioUi();
      }, 1800);

      setTimeout(function(){
        hardResetAudioUi();
      }, 3500);
    }, false);
  }

  function patchCancelButton(){
    const cancel = document.getElementById("fmPublicAudioCancel20260519");
    if(!cancel || cancel.dataset.audioResetCancelBound === "1") return;

    cancel.dataset.audioResetCancelBound = "1";

    cancel.addEventListener("click", function(){
      closeAudioPanel();
      hardResetAudioUi();
    }, true);
  }

  /*
    Osservatore: se qualsiasi vecchio script rimette "Stop audio" sul bottone menu,
    lo correggiamo, tranne durante i primi istanti del click Audio.
  */
  function watchAudioButtonLabel(){
    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(!audioBtn || audioBtn.dataset.audioLabelObserver === "1") return;

    audioBtn.dataset.audioLabelObserver = "1";

    const obs = new MutationObserver(function(){
      const t = String(audioBtn.textContent || "").trim().toLowerCase();

      if(t.includes("stop") && Date.now() - forcedAudioOpenAt > 300){
        setAudioBtnIdle();
      }
    });

    obs.observe(audioBtn, { childList:true, characterData:true, subtree:true });
  }

  function boot(){
    patchPlusButton();
    patchAudioButton();
    patchStartButton();
    patchStopButton();
    patchSendButton();
    patchCancelButton();
    watchAudioButtonLabel();

    const audioBtn = document.getElementById("fmPublicAudioBtn20260519");
    if(audioBtn && String(audioBtn.textContent || "").toLowerCase().includes("stop")){
      setAudioBtnIdle();
    }
  }

  window.fmPublicHardResetAudioUi20260519 = hardResetAudioUi;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(boot, 900);
    setTimeout(hardResetAudioUi, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
    setTimeout(hardResetAudioUi, 500);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      setTimeout(boot, 250);
      setTimeout(hardResetAudioUi, 500);
    }
  });

  setInterval(boot, 1000);
})();
</script>





<script id="followme-public-keep-all-attachments-final-20260519">
(function(){
  if(window.__FollowMePublicKeepAllAttachmentsFinal20260519) return;
  window.__FollowMePublicKeepAllAttachmentsFinal20260519 = true;

  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function parseAttachmentMessage(message){
    try{
      const obj = typeof message === "string" ? JSON.parse(message) : message;
      if(obj && obj.__followme_attachment) return obj;
    }catch(e){}
    return null;
  }

  function renderAttachment(a){
    const url = a.url || "";
    const name = a.label || a.filename || "Allegato";
    const mime = a.mime || "";
    const kind = a.kind || "";

    if(kind === "image" || mime.indexOf("image/") === 0){
      return '<a class="followme-attachment-card" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<img class="followme-attachment-image" src="' + esc(url) + '" alt="' + esc(name) + '">' +
        '<span class="followme-attachment-meta">' + esc(name) + (a.persistent ? ' · Salvato' : '') + '</span>' +
      '</a>';
    }

    if(kind === "audio" || mime.indexOf("audio/") === 0){
      return '<div class="followme-attachment-audio" data-audio-url="' + esc(url) + '">' +
        '<span>🎙️</span><audio controls preload="metadata" src="' + esc(url) + '"></audio>' +
      '</div>';
    }

    if(kind === "location"){
      return '<a class="followme-attachment-location" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<span>📍</span><span><span class="followme-attachment-name">Posizione condivisa</span><span class="followme-attachment-meta">Apri mappa</span></span>' +
      '</a>';
    }

    return '<a class="followme-attachment-file" href="' + esc(url) + '" target="_blank" rel="noopener" download>' +
      '<span>📎</span><span><span class="followme-attachment-name">' + esc(name) + '</span><span class="followme-attachment-meta">Apri documento</span></span>' +
    '</a>';
  }

  function injectCss(){
    if(document.getElementById("followmeKeepAllAttachmentsCss20260519")) return;

    const style = document.createElement("style");
    style.id = "followmeKeepAllAttachmentsCss20260519";
    style.textContent = `
      .followme-attachment-card{
        display:block;
        max-width:280px;
        border-radius:16px;
        overflow:hidden;
        background:rgba(0,0,0,.08);
        text-decoration:none;
        color:inherit;
      }

      .followme-attachment-image{
        display:block;
        width:100%;
        max-width:280px;
        max-height:280px;
        object-fit:cover;
        border-radius:16px;
      }

      .followme-attachment-file,
      .followme-attachment-location,
      .followme-attachment-audio{
        display:flex;
        align-items:center;
        gap:10px;
        padding:10px 12px;
        border-radius:16px;
        background:rgba(255,255,255,.16);
        color:inherit;
        text-decoration:none;
        font-weight:800;
      }

      .followme-attachment-audio audio{
        width:210px;
        max-width:100%;
      }

      .followme-attachment-name{
        display:block;
        font-size:.86rem;
        font-weight:900;
      }

      .followme-attachment-meta{
        display:block;
        font-size:.72rem;
        opacity:.72;
        margin-top:2px;
      }
    `;
    document.head.appendChild(style);
  }

  function renderAllAttachments(){
    /*
      Regola fondamentale:
      NON rimuoviamo mai bolle audio diverse.
      Renderizziamo soltanto le bolle che contengono JSON attachment.
    */
    document.querySelectorAll(".message, .bubble, .followme-public-bubble, [data-message-id]").forEach(function(b){
      if(b.dataset.fmAttachmentRendered === "1") return;

      const txt = (b.textContent || "").trim();
      const a = parseAttachmentMessage(txt);

      if(!a) return;

      b.dataset.fmAttachmentRendered = "1";

      if(a.url){
        b.dataset.fmAttachmentUrl = a.url;
      }

      b.innerHTML = renderAttachment(a);
    });
  }

  /*
    Append locale disattivato per gli audio:
    l'audio deve apparire dal reload server, così non creiamo duplicati/fantasmi.
    Per immagini/documenti lasciamo append locale solo se già usato.
  */
  const oldAppend = window.fmPublicAppendLocalAttachmentBubble20260519;

  window.fmPublicAppendLocalAttachmentBubble20260519 = function(attachment, sender){
    if(attachment && (attachment.kind === "audio" || String(attachment.mime || "").indexOf("audio/") === 0)){
      setTimeout(renderAllAttachments, 150);
      setTimeout(function(){
        try{ if(typeof window.followMePublicLoadMessages === "function") window.followMePublicLoadMessages(); }catch(e){}
        try{ if(typeof window.loadMessages === "function") window.loadMessages(); }catch(e){}
      }, 250);
      setTimeout(renderAllAttachments, 800);
      return;
    }

    if(typeof oldAppend === "function"){
      return oldAppend(attachment, sender);
    }
  };

  if(!window.__fmKeepAllPublicFetchPatch20260519){
    window.__fmKeepAllPublicFetchPatch20260519 = true;
    const oldFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await oldFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        if(url && url.includes("/api/followme/chat/session/") && (
          url.includes("/messages") ||
          url.includes("/attachment")
        )){
          setTimeout(renderAllAttachments, 100);
          setTimeout(renderAllAttachments, 500);
          setTimeout(renderAllAttachments, 1200);
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    injectCss();
    renderAllAttachments();
  }

  window.fmPublicRenderAllAttachments20260519 = renderAllAttachments;
  window.fmPublicKeepAllAttachments20260519 = boot;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(renderAllAttachments, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(renderAllAttachments, 250);
  });

  setInterval(renderAllAttachments, 1500);
})();
</script>



<script id="followme-public-audio-server-only-final-20260519">
(function(){
  if(window.__FollowMePublicAudioServerOnlyFinal20260519) return;
  window.__FollowMePublicAudioServerOnlyFinal20260519 = true;

  function isAudioAttachment(a){
    return !!a && (
      a.kind === "audio" ||
      String(a.mime || "").toLowerCase().indexOf("audio/") === 0
    );
  }

  /*
    Disattiva definitivamente l'append locale audio.
    Gli audio devono comparire SOLO dopo reload dal server.
    Questo elimina:
    - doppi audio lato utente;
    - audio fantasma quando il server dà errore.
  */
  const previousAppend = window.fmPublicAppendLocalAttachmentBubble20260519;

  window.fmPublicAppendLocalAttachmentBubble20260519 = function(attachment, sender){
    if(isAudioAttachment(attachment)){
      setTimeout(forceReloadMessages, 120);
      setTimeout(forceReloadMessages, 500);
      setTimeout(forceReloadMessages, 1200);
      return;
    }

    if(typeof previousAppend === "function"){
      return previousAppend(attachment, sender);
    }
  };

  function forceReloadMessages(){
    try{
      if(typeof window.followMePublicLoadMessages === "function"){
        window.followMePublicLoadMessages();
      }
    }catch(e){}

    try{
      if(typeof window.loadMessages === "function"){
        window.loadMessages();
      }
    }catch(e){}

    try{
      if(typeof window.fmPublicRenderAllAttachments20260519 === "function"){
        window.fmPublicRenderAllAttachments20260519();
      }
    }catch(e){}
  }

  function removeLocalAudioGhosts(){
    /*
      Rimuove soltanto audio locali senza data-message-id.
      Gli audio reali caricati dal server devono restare.
    */
    document.querySelectorAll(".followme-public-bubble, .message, .bubble").forEach(function(el){
      const html = el.innerHTML || "";
      const txt = el.textContent || "";

      const isAudio =
        html.includes("<audio") ||
        html.includes("followme-attachment-audio") ||
        txt.includes('"kind":"audio"') ||
        txt.includes('"kind": "audio"');

      if(!isAudio) return;

      const hasServerId =
        el.hasAttribute("data-message-id") ||
        el.dataset.messageId ||
        el.dataset.serverMessageId;

      if(!hasServerId){
        /*
          Se è una bolla locale creata da append immediato, la togliamo.
          Il reload server la ricreerà se l'audio è stato davvero salvato.
        */
        el.remove();
      }
    });
  }

  if(!window.__fmAudioServerOnlyFetchPatch20260519){
    window.__fmAudioServerOnlyFetchPatch20260519 = true;
    const oldFetch = window.fetch.bind(window);

    window.fetch = async function(input, init){
      const res = await oldFetch(input, init);

      try{
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        const isAudioUpload =
          url &&
          url.includes("/api/followme/chat/session/") &&
          url.includes("/attachment-raw");

        if(isAudioUpload){
          const clone = res.clone();
          const data = await clone.json().catch(function(){ return null; });

          removeLocalAudioGhosts();

          if(data && data.success){
            setTimeout(forceReloadMessages, 120);
            setTimeout(forceReloadMessages, 500);
            setTimeout(forceReloadMessages, 1200);
          }
        }

        if(url && url.includes("/api/followme/chat/session/") && url.includes("/messages")){
          setTimeout(function(){
            removeLocalAudioGhosts();
            try{
              if(typeof window.fmPublicRenderAllAttachments20260519 === "function"){
                window.fmPublicRenderAllAttachments20260519();
              }
            }catch(e){}
          }, 120);
        }
      }catch(e){}

      return res;
    };
  }

  function boot(){
    removeLocalAudioGhosts();
    forceReloadMessages();
  }

  window.fmPublicAudioServerOnlyFix20260519 = boot;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.addEventListener("load", function(){
    setTimeout(boot, 250);
    setTimeout(boot, 1200);
  });

  window.addEventListener("pageshow", function(){
    setTimeout(boot, 250);
  });

  setInterval(removeLocalAudioGhosts, 1500);
})();
</script>

</body>

<script id="followme-public-blocked-fetch-hard-guard">
(function(){
  if(window.__followMePublicBlockedFetchHardGuard) return;
  window.__followMePublicBlockedFetchHardGuard = true;

  function applyBlocked(){
    try{
      document.body.classList.add("followme-public-user-blocked");
      const notice = document.getElementById("followmePublicBlockedNotice");
      if(notice) notice.textContent = "Sei stato bloccato dal sistema.";

      const input = document.getElementById("messageInput") ||
                    document.querySelector("textarea") ||
                    document.querySelector("input[type='text']");
      if(input){
        input.disabled = true;
        input.placeholder = "Sei stato bloccato dal sistema.";
      }

      const send = document.getElementById("sendBtn") ||
                   document.querySelector("button[type='submit']") ||
                   document.querySelector(".send-btn");
      if(send) send.disabled = true;
    }catch(e){}
  }

  const previousFetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const res = await previousFetch(input, init);

    try{
      const url = typeof input === "string" ? input : (input && input.url ? input.url : "");
      if(url && url.includes("/api/followme/chat/session/")){
        const clone = res.clone();
        const data = await clone.json().catch(()=>null);
        if(data && (data.blocked === true || String(data.error || "").includes("bloccato"))){
          applyBlocked();
        }
      }
    }catch(e){}

    return res;
  };
})();
</script>
