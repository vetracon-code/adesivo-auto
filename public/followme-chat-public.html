<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FollowMe Chat</title>
  <style>
    :root{
      --bg:#071018;
      --panel:#101820;
      --panel2:#142231;
      --text:#f7fafc;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.10);
      --lime:#c8ff2e;
      --cyan:#5ee7ff;
      --bot:#182838;
      --user:#c8ff2e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
    body{
      background:
        radial-gradient(circle at 20% -10%,rgba(200,255,46,.14),transparent 34%),
        radial-gradient(circle at 92% 0%,rgba(94,231,255,.13),transparent 30%),
        #071018;
    }
    .chat{
      width:min(520px,100%);
      height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto 1fr auto;
      background:rgba(7,16,24,.76);
      border-left:1px solid rgba(255,255,255,.06);
      border-right:1px solid rgba(255,255,255,.06);
    }
    .top{
      padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
      display:flex;
      align-items:center;
      gap:11px;
      background:rgba(16,24,32,.92);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }
    .avatar{
      width:44px;height:44px;border-radius:16px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:1.2rem;
      box-shadow:0 12px 28px rgba(94,231,255,.16);
    }
    .top h1{margin:0;font-size:1.02rem;letter-spacing:-.03em;line-height:1.08}
    .top p{margin:3px 0 0;color:var(--muted);font-size:.76rem}
    .messages{
      overflow:auto;
      padding:16px 12px 18px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .msgrow{display:flex;gap:8px;align-items:flex-end}
    .msgrow.user{justify-content:flex-end}
    .boticon{
      width:30px;height:30px;border-radius:11px;flex:0 0 auto;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
      color:#101820;font-weight:1000;font-size:.85rem;
    }
    .bubble{
      max-width:78%;
      border-radius:20px;
      padding:10px 12px;
      font-size:.92rem;
      line-height:1.34;
      box-shadow:0 10px 26px rgba(0,0,0,.18);
    }
    .bot .bubble{
      background:var(--bot);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      border-bottom-left-radius:7px;
    }
    .user .bubble{
      background:linear-gradient(135deg,var(--lime),#e9ff9c);
      color:#101820;
      font-weight:750;
      border-bottom-right-radius:7px;
    }
    .typing{
      display:inline-flex;gap:4px;align-items:center;
      padding:2px 0;
    }
    .typing span{
      width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.65);
      animation:bounce 1s infinite ease-in-out;
    }
    .typing span:nth-child(2){animation-delay:.16s}
    .typing span:nth-child(3){animation-delay:.32s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
    .choices{
      display:flex;gap:8px;flex-wrap:wrap;margin-left:38px;margin-top:-2px;
    }
    .choice{
      border:1px solid rgba(200,255,46,.28);
      background:rgba(200,255,46,.10);
      color:#e9ff9c;
      border-radius:999px;
      padding:8px 10px;
      font-weight:850;
      font-size:.78rem;
    }
    .composer{
      padding:10px 12px calc(12px + env(safe-area-inset-bottom));
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      background:rgba(16,24,32,.94);
      border-top:1px solid var(--line);
      backdrop-filter:blur(14px);
    }
    textarea{
      resize:none;height:46px;max-height:110px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.22);
      color:#fff;
      border-radius:18px;
      padding:12px 13px;
      font:inherit;
      outline:none;
    }
    button{
      border:0;border-radius:18px;padding:0 15px;
      font-weight:950;color:#101820;
      background:linear-gradient(135deg,var(--lime),var(--cyan));
    }
    .smallnote{
      text-align:center;color:rgba(255,255,255,.48);font-size:.72rem;padding:4px 10px 0;
    }
  
    /* Avatar chat FollowMe */
    .boticon{
      width:38px !important;
      height:38px !important;
      border-radius:0 !important;
      background:transparent !important;
      box-shadow:none !important;
      font-size:1.65rem !important;
      flex:0 0 auto !important;
    }

    .adminicon{
      width:38px;
      height:38px;
      border-radius:999px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 33%, #f1c7a5 0 28%, transparent 29%),
        radial-gradient(circle at 44% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 57% 24%, #1d2028 0 18%, transparent 19%),
        radial-gradient(circle at 50% 61%, #2c1c16 0 10%, transparent 11%),
        linear-gradient(180deg,#263244,#101820);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 10px 24px rgba(0,0,0,.22);
      position:relative;
      overflow:hidden;
    }

    .adminicon::before{
      content:"";
      position:absolute;
      width:18px;
      height:7px;
      border-radius:999px;
      background:#241713;
      left:10px;
      top:24px;
      opacity:.95;
    }

    .adminicon::after{
      content:"";
      position:absolute;
      width:10px;
      height:8px;
      border-radius:0 0 999px 999px;
      background:#241713;
      left:14px;
      top:28px;
      opacity:.9;
    }

    .msgrow.admin{
      justify-content:flex-start;
    }

    .admin .bubble{
      background:#162536;
      border:1px solid rgba(94,231,255,.18);
      color:#fff;
      border-bottom-left-radius:7px;
    }


    /* Effetto digitazione presentazione FollowMe */
    .typed-cursor{
      display:inline-block;
      width:7px;
      height:1.05em;
      margin-left:2px;
      vertical-align:-2px;
      background:rgba(255,255,255,.72);
      border-radius:2px;
      animation:followmeTypedCursorBlink .85s infinite;
    }

    @keyframes followmeTypedCursorBlink{
      0%,45%{opacity:1}
      46%,100%{opacity:.15}
    }

</style>
</head>
<body>
  <main class="chat">
    <header class="top">
      <div class="avatar">🤖</div>
      <div>
        <h1>FollowMe Chat</h1>
        <p id="statusText">Connessione in corso...</p>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <footer>
      <div class="smallnote">Scrivi qui. Il proprietario riceverà il tuo messaggio in questa chat.</div>
      <div class="composer">
        <textarea id="messageInput" placeholder="Scrivi un messaggio..." rows="1"></textarea>
        <button id="sendBtn">Invia</button>
      </div>
    </footer>
  </main>

<script>
(function(){
  const TOKEN = (location.pathname.match(/\/fm\/chat\/c\/([^\/?#]+)/i)||[])[1] || "";
  let sessionId = "";
  let lastMessageId = 0;
  let realConversationStarted = false;
  let robotTimers = [];
  let followMeInfoChoiceSent = false;
  let followMeInfoExplained = false;
  let followMeRobotFallbackSent = false;
  const messages = document.getElementById("messages");
  const statusText = document.getElementById("statusText");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  function scrollBottom(){
    messages.scrollTop = messages.scrollHeight;
  }

  function scheduleRobot(fn, delay){
    const t = setTimeout(function(){
      if(!realConversationStarted){
        fn();
      }
    }, delay);
    robotTimers.push(t);
    return t;
  }

  function stopRobotSequence(){
    realConversationStarted = true;
    robotTimers.forEach(clearTimeout);
    robotTimers = [];

    try{
      document.querySelectorAll(".choices").forEach(el => el.remove());
      document.querySelectorAll("[data-robot-typing='1']").forEach(el => el.remove());
    }catch(e){}
  }

  function row(kind, html, typing){
    const r = document.createElement("div");
    r.className = "msgrow " + (kind === "user" ? "user" : (kind === "admin" ? "admin" : "bot"));

    if(kind === "bot"){
      const ico = document.createElement("div");
      ico.className = "boticon";
      ico.textContent = "🤖";
      r.appendChild(ico);
    }

    if(kind === "admin"){
      const ico = document.createElement("div");
      ico.className = "adminicon";
      ico.setAttribute("aria-label", "Admin");
      r.appendChild(ico);
    }

    const b = document.createElement("div");
    b.className = "bubble";
    if(typing){
      r.setAttribute("data-robot-typing", "1");
      b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    }else{
      b.innerHTML = html;
    }
    r.appendChild(b);
    messages.appendChild(r);
    scrollBottom();
    return r;
  }

  function addBot(text){
    row("bot", text.replace(/\n/g,"<br>"));
  }

  function addBotHtml(html){
    row("bot", String(html || ""));
  }

  function tokenizeHtmlForTyping(html){
    const tokens = [];
    const re = /(<[^>]+>|[^<])/g;
    let m;
    while((m = re.exec(String(html || ""))) !== null){
      tokens.push(m[0]);
    }
    return tokens;
  }

  function typeBotHtml(html){
    const r = row("bot", "", false);
    const bubble = r.querySelector(".bubble");
    if(!bubble) return;

    const tokens = tokenizeHtmlForTyping(html);
    let out = "";
    let i = 0;

    function currentDelay(token, previousOutput){
      if(token && token.startsWith("<strong")) return 80;
      if(previousOutput.endsWith("</strong>")) return 260;
      if(/[.!?]$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 360;
      if(/:$/.test(previousOutput.replace(/<[^>]+>/g,"").trim())) return 280;
      if(token === "<br>") return 220;

      // Rallenta leggermente quando siamo dentro un grassetto aperto.
      const openStrong = (previousOutput.match(/<strong>/g) || []).length;
      const closeStrong = (previousOutput.match(/<\/strong>/g) || []).length;
      if(openStrong > closeStrong) return 44;

      return 24;
    }

    function step(){
      if(i >= tokens.length){
        bubble.innerHTML = out;
        scrollBottom();
        return;
      }

      const token = tokens[i++];
      out += token;
      bubble.innerHTML = out + '<span class="typed-cursor"></span>';
      scrollBottom();

      setTimeout(step, currentDelay(token, out));
    }

    step();
  }

  function addUser(text){
    row("user", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function addAdmin(text){
    row("admin", String(text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  }

  function botTypingThen(text, delay){
    if(realConversationStarted) return;

    const t = row("bot", "", true);
    scheduleRobot(()=>{
      if(realConversationStarted){
        t.remove();
        return;
      }
      t.remove();
      addBot(text);
    }, delay || 900);
  }

  function addChoices(){
    if(realConversationStarted) return;

    const wrap = document.createElement("div");
    wrap.className = "choices";

    const yes = document.createElement("button");
    yes.className = "choice";
    yes.textContent = "👀 Sì, raccontami";

    const no = document.createElement("button");
    no.className = "choice";
    no.textContent = "No, aspetto";

    yes.onclick = ()=>{
      wrap.remove();
      addUser("Sì, raccontami");
      followMeInfoExplained = true;
      followMeInfoChoiceSent = true;
      sendSystemNoteToOwner("Ok, info trasmesse.");

      typeBotHtml(
        "<strong>Piacere, sono FollowMe QR.</strong><br><br>" +
        "Ora sono in <strong>modalità Dialogo 💬</strong>: ho avvisato il proprietario che sei in attesa.<br><br>" +
        "Sono un <strong>QR dinamico 🔄</strong>: posso cambiare destinazione senza essere ristampato. Ora sto aprendo questa chat; più tardi potrei aprire un sito, un canale social o qualsiasi link scelto dal proprietario.<br><br>" +
        "Il QR resta sempre lo stesso.<br><br>" +
        "Quello che comunica può cambiare quando serve, <strong>anche in meno di un secondo</strong>.<br><br>" +
        "<strong>Creo movimento attorno a me 👀</strong><br><br>" +
        "e trasformo un QR in un contatto 🤝<br><br>" +
        "All’inizio è tutto anonimo.<br><br>" +
        "Poi, se nasce il dialogo, decidete voi due."
      );
    };

    no.onclick = ()=>{
      wrap.remove();
      addUser("No, aspetto");
      followMeInfoExplained = false;
      followMeInfoChoiceSent = true;
      sendSystemNoteToOwner("No, nessuna presentazione.");
      addBot("Va bene, resto qui con te in attesa.");
    };

    wrap.appendChild(yes);
    wrap.appendChild(no);
    messages.appendChild(wrap);
    scrollBottom();
  }

  async function createSession(){
    const res = await fetch("/api/followme/chat/" + encodeURIComponent(TOKEN) + "/session", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ source:"public_chat" })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || "Errore apertura chat");
    sessionId = data.session_id;
    statusText.textContent = "Connesso · in attesa del proprietario";
  }


  function playFollowMeSendSound(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;

      const ctx = new AudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = "sine";
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.055);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.13);

      filter.type = "highpass";
      filter.frequency.setValueAtTime(420, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.075, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.17);

      setTimeout(()=>ctx.close().catch(()=>{}), 280);
    }catch(e){}
  }

  async function sendSystemNoteToOwner(message){
    if(!sessionId || !message) return;

    try{
      await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ sender:"visitor", message:message })
      });
    }catch(e){}
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text || !sessionId) return;

    const shouldRobotFallback = followMeInfoExplained && !followMeRobotFallbackSent;

    stopRobotSequence();

    input.value = "";
    addUser(text);
    playFollowMeSendSound();

    if(shouldRobotFallback){
      followMeRobotFallbackSent = true;
      setTimeout(function(){
        addBot("Mi spiace, io sono solo un robottino 🤖<br>Per altre risposte devi attendere il proprietario.<br><strong>Puoi attendere?</strong>");
      }, 650);
    }

    const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/message", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ sender:"visitor", message:text })
    });

    const data = await res.json().catch(()=>null);
    if(data && data.success && data.message && data.message.id){
      lastMessageId = Math.max(lastMessageId, Number(data.message.id) || 0);
      setTimeout(poll, 700);
    }
  }

  async function poll(){
    if(!sessionId) return;
    try{
      const res = await fetch("/api/followme/chat/session/" + encodeURIComponent(sessionId) + "/messages?after=" + encodeURIComponent(lastMessageId), { cache:"no-store" });
      const data = await res.json();
      if(data.success && Array.isArray(data.messages)){
        data.messages.forEach(m=>{
          lastMessageId = Math.max(lastMessageId, Number(m.id)||0);
          if(m.sender === "owner"){
            stopRobotSequence();
            addAdmin(String(m.message || ""));
          }
        });
      }
    }catch(e){}
  }

  async function boot(){
    try{
      await createSession();

      botTypingThen("Ciao, sono <strong>FollowMe QR</strong> 👋", 800);

      scheduleRobot(()=>botTypingThen("Ho avvisato il proprietario che ti sei collegato.<br>Se è disponibile, ti risponderà qui.", 850), 1800);

      scheduleRobot(()=>botTypingThen("Mentre aspetti, vuoi sapere <strong>cosa sono</strong>?", 750), 4200);

      scheduleRobot(addChoices, 5600);

      setInterval(poll, 1500);
    }catch(err){
      statusText.textContent = "Chat non disponibile";
      addBot("Mi dispiace, la chat non è disponibile in questo momento.");
      console.error(err);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  boot();
})();
</script>
</body>
</html>
