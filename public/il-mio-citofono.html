<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Il mio citofono</title>
  <link rel="icon" href="/icons/il-mio-citofono.svg">
  <meta name="theme-color" content="#f8fafc">
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--sky:#0ea5e9;--shadow:0 22px 60px rgba(15,23,42,.12)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#eff6ff 0,#f8fafc 48%,#f8fafc 100%);color:var(--ink)}
    body{display:grid;place-items:center;padding:18px}
    .phone{width:100%;max-width:420px;min-height:720px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);padding:34px 22px;text-align:center;display:flex;flex-direction:column;justify-content:center}
    .brand{font-size:15px;font-weight:950;letter-spacing:.12em;color:#2563eb;text-transform:uppercase;margin-bottom:24px}
    .speaker{width:240px;height:240px;border-radius:50%;border:1.5px solid var(--blue);margin:0 auto 34px;display:grid;place-items:center;background:radial-gradient(circle,#fff,#f8fafc);position:relative}
    .speaker.active{box-shadow:0 0 0 8px rgba(37,99,235,.06),0 0 38px rgba(37,99,235,.18)}
    .speaker.active:after{content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(56,189,248,.35);animation:pulse 1.45s ease-in-out infinite}
    .holes{width:130px;height:130px;border-radius:50%;background-image:radial-gradient(circle,#0f172a 3px,transparent 3.5px);background-size:17px 17px}
    .name{font-size:32px;line-height:1.08;font-weight:950;margin:0 0 10px}
    .address{font-size:17px;color:var(--muted);margin-bottom:36px}
    .ring{width:88%;max-width:330px;margin:0 auto;border:0;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;padding:20px;font-size:23px;font-weight:950;box-shadow:0 15px 34px rgba(37,99,235,.28);cursor:pointer}
    .ring:active{transform:scale(.985)}
    .hint{min-height:22px;font-size:15px;color:var(--muted);margin-top:22px}
    .closed{display:none;margin-top:18px;padding:14px;border-radius:18px;background:#ecfdf5;color:#166534;font-weight:850}
    .audio-gate{
      margin:18px auto 0;
      max-width:330px;
      padding:14px 15px;
      border-radius:18px;
      background:#eff6ff;
      border:1px solid #bfdbfe;
      color:#1e3a8a;
      font-size:14px;
      line-height:1.35;
      font-weight:750;
      display:none;
    }
    .audio-gate.show{display:block}
    .audio-gate.ok{
      background:#ecfdf5;
      border-color:#bbf7d0;
      color:#166534;
    }
    .audio-debug{
      margin-top:10px;
      font-size:12px;
      line-height:1.35;
      color:#64748b;
      min-height:18px;
    }

    @keyframes pulse{0%,100%{transform:scale(.94);opacity:.45}50%{transform:scale(1.05);opacity:1}}
    @media(max-width:430px){.phone{min-height:calc(100vh - 24px);border-radius:32px}.speaker{width:220px;height:220px}.name{font-size:29px}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="brand">Citofonami</div>
    <div id="speaker" class="speaker"><div class="holes"></div></div>
    <h1 class="name" id="name">Casa Rossi</h1>
    <div class="address" id="address">Via Roma 123, Milano</div>
    <button class="ring" id="ringBtn">🔔 SUONA</button>
    <div class="hint" id="hint">Premi per citofonare.</div>
    <div class="audio-gate" id="audioGate">Prima di chiamare verranno attivati microfono e ascolto.</div>
    <div class="audio-debug" id="audioDebug"></div>
    <div class="closed" id="closed">Conversazione chiusa. Grazie.</div>
  </main>

  




<script>
  const $ = id => document.getElementById(id);

  const CODE = new URLSearchParams(location.search).get("code") || "DEMO";

  let userPeer = null;
  let userStream = null;
  let remoteAudio = null;
  let statusTimer = null;
  let offerTimer = null;
  let iceTimer = null;
  let currentCallId = null;
  let adminAnswered = false;
  let offerReceived = null;
  let mode = "idle";
  const seenAdminIce = new Set();

  function api(path){
    return `/api/citofonami/${encodeURIComponent(CODE)}${path}`;
  }

  function setHint(text){
    $("hint").textContent = text;
    console.log("[IL-MIO-CITOFONO USER]", text);
  }

  function setNote(text, ok){
    const n = $("audioNote");
    if(!n) return;
    n.textContent = text;
    n.classList.add("show");
    n.classList.toggle("ok", !!ok);
  }

  function setDebug(text){
    const el = $("audioDebug");
    if(el) el.textContent = text || "";
    console.log("[IL-MIO-CITOFONO USER DEBUG]", text || "");
  }

  function callerId(){
    let id = localStorage.getItem("ilMioCitofono.callerId");
    if(!id){
      id = "caller_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
      localStorage.setItem("ilMioCitofono.callerId", id);
    }
    return id;
  }

  function setMainButton(text, disabled){
    const btn = $("ringBtn");
    if(!btn) return;
    btn.textContent = text;
    btn.disabled = !!disabled;
  }

  function setMode(nextMode){
    mode = nextMode;
    const btn = $("ringBtn");
    if(!btn) return;

    if(mode === "idle"){
      btn.style.background = "";
      setMainButton("🔔 SUONA", false);
    }

    if(mode === "ringing"){
      btn.style.background = "";
      setMainButton("CHIAMATA IN CORSO", true);
    }

    if(mode === "talk-ready"){
      btn.style.background = "linear-gradient(135deg,#22c55e,#16a34a)";
      setMainButton("🎙️ PARLA ORA", false);
    }

    if(mode === "mic-permission"){
      btn.style.background = "linear-gradient(135deg,#f59e0b,#ea580c)";
      setMainButton("CONSENTI MICROFONO", false);
    }

    if(mode === "connecting"){
      btn.style.background = "linear-gradient(135deg,#22c55e,#16a34a)";
      setMainButton("COLLEGO AUDIO...", true);
    }

    if(mode === "connected"){
      btn.style.background = "linear-gradient(135deg,#22c55e,#16a34a)";
      setMainButton("AUDIO ATTIVO", true);
    }
  }

  async function loadSettings(){
    try{
      const res = await fetch(api("/config?t=" + Date.now()), { cache:"no-store" });
      const data = await res.json();
      const c = data.config || data || {};
      const name = c.name || c.displayName || c.doorName || localStorage.getItem("ilMioCitofono.name") || "Casa Rossi";
      const address = c.address || localStorage.getItem("ilMioCitofono.address") || "Via Roma 123, Milano";

      $("name").textContent = name;

      if(address){
        $("address").textContent = address;
        $("address").style.display = "block";
      }else{
        $("address").style.display = "none";
      }
    }catch(e){
      const name = localStorage.getItem("ilMioCitofono.name") || "Casa Rossi";
      const address = localStorage.getItem("ilMioCitofono.address") || "Via Roma 123, Milano";
      $("name").textContent = name;
      $("address").textContent = address;
    }
  }

  function createRemoteAudioShell(){
    if(remoteAudio) return remoteAudio;

    remoteAudio = document.createElement("audio");
    remoteAudio.id = "citofonamiUserRemoteAudio";
    remoteAudio.autoplay = true;
    remoteAudio.playsInline = true;
    remoteAudio.setAttribute("playsinline", "true");
    remoteAudio.setAttribute("webkit-playsinline", "true");
    remoteAudio.controls = false;
    remoteAudio.muted = false;
    remoteAudio.volume = 1;
    remoteAudio.style.position = "fixed";
    remoteAudio.style.left = "-9999px";
    remoteAudio.style.width = "1px";
    remoteAudio.style.height = "1px";
    document.body.appendChild(remoteAudio);

    return remoteAudio;
  }

  async function unlockUserAudioFromGesture(){
    const audio = createRemoteAudioShell();

    try{
      audio.muted = true;
      const p1 = audio.play();
      if(p1 && p1.catch) await p1.catch(() => null);
      audio.pause();
      audio.currentTime = 0;
      audio.muted = false;
      audio.volume = 1;
    }catch(e){
      console.warn("[IL-MIO-CITOFONO] unlock audio element:", e);
    }

    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(AudioCtx){
        window.__citofonamiUserAudioCtx = window.__citofonamiUserAudioCtx || new AudioCtx();
        if(window.__citofonamiUserAudioCtx.state === "suspended"){
          await window.__citofonamiUserAudioCtx.resume();
        }

        const ctx = window.__citofonamiUserAudioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.value = 0.00001;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.03);
      }
    }catch(e){
      console.warn("[IL-MIO-CITOFONO] unlock AudioContext:", e);
    }

    setDebug("Audio utente sbloccato dal gesto.");
  }

  async function askMicrophoneExplicitly(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Microfono non disponibile su questo browser.");
    }

    setHint("Conferma l’uso del microfono.");
    setNote("Tocca CONSENTI MICROFONO e conferma l’autorizzazione del telefono.", false);
    setDebug("Richiedo getUserMedia audio...");

    let stream;

    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },
        video:false
      });
    }catch(error){
      const name = error && error.name ? error.name : "";
      if(name === "NotAllowedError" || name === "PermissionDeniedError"){
        throw new Error("Autorizzazione microfono negata. Riattivala nelle impostazioni del sito/browser.");
      }
      if(name === "NotFoundError"){
        throw new Error("Nessun microfono trovato.");
      }
      throw error;
    }

    const tracks = stream.getAudioTracks();

    if(!tracks || !tracks.length){
      try{ stream.getTracks().forEach(t => t.stop()); }catch(e){}
      throw new Error("Il telefono non ha restituito il microfono.");
    }

    const track = tracks[0];

    if(track.readyState !== "live" || track.enabled === false || track.muted === true){
      try{ stream.getTracks().forEach(t => t.stop()); }catch(e){}
      throw new Error("Microfono non realmente attivo. Premi di nuovo e conferma l’autorizzazione.");
    }

    userStream = stream;

    setDebug("Microfono autorizzato: " + (track.label || "attivo") + " · stato: " + track.readyState);
    setHint("Microfono autorizzato. Collego l’audio.");
    setNote("Microfono attivo. Collegamento in corso.", true);

    return stream;
  }

  function stopAll(){
    clearInterval(statusTimer);
    clearInterval(offerTimer);
    clearInterval(iceTimer);
    statusTimer = null;
    offerTimer = null;
    iceTimer = null;

    if(userPeer){
      try{ userPeer.close(); }catch(e){}
      userPeer = null;
    }

    if(userStream){
      userStream.getTracks().forEach(t => {
        try{ t.stop(); }catch(e){}
      });
      userStream = null;
    }

    if(remoteAudio){
      try{
        remoteAudio.pause();
        remoteAudio.srcObject = null;
        remoteAudio.remove();
      }catch(e){}
      remoteAudio = null;
    }

    seenAdminIce.clear();
    currentCallId = null;
    adminAnswered = false;
    offerReceived = null;
    setMode("idle");
  }

  async function ring(){
    setMode("ringing");
    $("speaker").classList.add("active");
    $("closed").style.display = "none";

    try{
      setHint("Invio chiamata all'admin...");
      setNote("Attendi la risposta. Quando l’admin accetta, premi PARLA ORA.", false);

      const payload = {
        callerId: callerId(),
        source: "il-mio-citofono",
        lightClone: true,
        userAgent: (navigator.userAgent + " IL_MIO_CITOFONO_LIGHT_CLONE"),
        locationEnabled: false,
        geofenceEnabled: false,
        requireLocation: false,
        radiusDisabled: true,
        door: {
          name: $("name").textContent || "Il mio citofono",
          description: $("address").textContent || ""
        }
      };

      const res = await fetch(api("/ring-v2"), {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(payload)
      });

      const data = await res.json();

      if(!data.ok){
        throw new Error(data.error || data.message || "Chiamata non accettata dal server.");
      }

      const call = data.call || data.pendingCall || data;
      currentCallId = data.callId || call.id || call.callId;

      if(!currentCallId){
        throw new Error("CallId non ricevuto dal server.");
      }

      setHint("Chiamata inviata. Attendi la risposta...");
      setDebug("callId: " + currentCallId);

      statusTimer = setInterval(() => pollStatus(currentCallId), 700);
      offerTimer = setInterval(() => pollOffer(currentCallId), 700);

    }catch(e){
      console.error("[IL-MIO-CITOFONO] errore ring:", e);
      setHint("Errore chiamata: " + (e.message || e));
      setNote("Chiamata non avviata. Riprova.", false);
      $("speaker").classList.remove("active");
      stopAll();
    }
  }

  async function pollStatus(callId){
    try{
      const res = await fetch(api(`/calls/${encodeURIComponent(callId)}/status?t=${Date.now()}`), { cache:"no-store" });
      const data = await res.json();
      const status = data.status || (data.call && data.call.status) || "";

      setDebug("callId: " + callId + " · stato: " + (status || "in attesa"));

      if(status === "answered" && !adminAnswered){
        adminAnswered = true;
        setHint("Admin ha risposto.");
        setNote("Premi PARLA ORA. Poi dovrai confermare il microfono.", false);
        setMode("talk-ready");
      }

      if(status === "closed" || status === "rejected" || status === "ended"){
        setHint("Conversazione chiusa.");
        setNote("Conversazione chiusa. Microfono spento.", true);
        $("closed").style.display = "block";
        $("speaker").classList.remove("active");
        stopAll();

        setTimeout(() => {
          try{ window.close(); }catch(e){}
        }, 1200);
      }
    }catch(e){}
  }

  async function pollOffer(callId){
    try{
      const res = await fetch(api(`/calls/${encodeURIComponent(callId)}/webrtc/offer?t=${Date.now()}`), { cache:"no-store" });
      const data = await res.json();

      if(!data.ok || !data.offer) return;

      offerReceived = data.offer;
      setDebug("Offer admin ricevuta.");

      if(adminAnswered){
        setMode("talk-ready");
      }

      clearInterval(offerTimer);
      offerTimer = null;

    }catch(e){
      console.warn("[IL-MIO-CITOFONO] pollOffer error:", e);
    }
  }

  async function prepareTalkStep(){
    if(!currentCallId){
      setHint("Chiamata non trovata. Riprova.");
      setMode("idle");
      return;
    }

    setHint("Ora autorizza il microfono.");
    setNote("Premi CONSENTI MICROFONO e conferma la richiesta del telefono.", false);
    setMode("mic-permission");
  }

  async function confirmMicrophoneAndConnect(){
    if(!currentCallId){
      setHint("Chiamata non trovata. Riprova.");
      setMode("idle");
      return;
    }

    setMode("connecting");

    try{
      // Entrambi nel gesto reale sul pulsante CONSENTI MICROFONO.
      await unlockUserAudioFromGesture();
      await askMicrophoneExplicitly();

      if(!offerReceived){
        setHint("Attendo collegamento admin...");
        await waitOffer(currentCallId);
      }

      if(!offerReceived){
        throw new Error("Offer admin non ricevuta.");
      }

      await createAnswer(currentCallId, offerReceived);

    }catch(e){
      console.error("[IL-MIO-CITOFONO] confirmMicrophoneAndConnect error:", e);
      setHint("Errore microfono: " + (e.message || e));
      setNote("Microfono non attivo. Premi CONSENTI MICROFONO e conferma dal telefono.", false);
      setMode("mic-permission");
    }
  }

  async function waitOffer(callId){
    for(let i=0;i<20;i++){
      try{
        const res = await fetch(api(`/calls/${encodeURIComponent(callId)}/webrtc/offer?t=${Date.now()}`), { cache:"no-store" });
        const data = await res.json();

        if(data.ok && data.offer){
          offerReceived = data.offer;
          setDebug("Offer admin ricevuta dopo attesa.");
          return;
        }
      }catch(e){}

      await new Promise(resolve => setTimeout(resolve, 500));
    }
  }

  async function createAnswer(callId, offer){
    if(!userStream){
      throw new Error("Microfono utente non pronto.");
    }

    const audio = createRemoteAudioShell();

    userPeer = new RTCPeerConnection({
      iceServers:[{ urls:["stun:stun.l.google.com:19302"] }]
    });

    userStream.getTracks().forEach(track => {
      userPeer.addTrack(track, userStream);
    });

    userPeer.ontrack = event => {
      const stream = event.streams && event.streams[0] ? event.streams[0] : new MediaStream([event.track]);

      audio.srcObject = stream;
      audio.muted = false;
      audio.volume = 1;

      const playPromise = audio.play();

      if(playPromise && playPromise.catch){
        playPromise.catch(err => {
          console.warn("[IL-MIO-CITOFONO] play remoto bloccato:", err);
          setHint("Audio pronto. Premi CONSENTI MICROFONO di nuovo se non senti.");
          setDebug("Playback remoto bloccato: " + (err.message || err));
          setMode("mic-permission");
        });
      }

      setHint("Parla ora.");
      setNote("Microfono e vivavoce attivi. Parla ora.", true);
      setMode("connected");
    };

    userPeer.onconnectionstatechange = () => {
      if(!userPeer) return;

      const st = userPeer.connectionState;
      setDebug("Connessione: " + st + " · ICE: " + userPeer.iceConnectionState);

      if(st === "connected"){
        setHint("Audio collegato. Parla ora.");
        setNote("Microfono e vivavoce attivi. Parla ora.", true);
        setMode("connected");
      }

      if(st === "failed" || st === "disconnected"){
        setHint("Connessione audio instabile.");
      }
    };

    userPeer.oniceconnectionstatechange = () => {
      if(!userPeer) return;
      setDebug("Connessione: " + userPeer.connectionState + " · ICE: " + userPeer.iceConnectionState);
    };

    userPeer.onicecandidate = event => {
      if(event.candidate){
        fetch(api(`/calls/${encodeURIComponent(callId)}/webrtc/ice`), {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ role:"user", candidate:event.candidate })
        }).catch(()=>{});
      }
    };

    await userPeer.setRemoteDescription(offer);

    const answer = await userPeer.createAnswer();
    await userPeer.setLocalDescription(answer);

    await fetch(api(`/calls/${encodeURIComponent(callId)}/webrtc/answer`), {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ answer:userPeer.localDescription })
    });

    setHint("Risposta inviata. Collegamento audio...");
    setNote("Microfono autorizzato. Vivavoce in attivazione.", true);
    setDebug("Answer inviata all’admin · attendo ICE");

    iceTimer = setInterval(() => pollAdminIce(callId), 700);
  }

  async function pollAdminIce(callId){
    if(!userPeer) return;

    try{
      const res = await fetch(api(`/calls/${encodeURIComponent(callId)}/webrtc/ice?role=user&t=${Date.now()}`), { cache:"no-store" });
      const data = await res.json();
      const candidates = data.candidates || data.ice || [];

      for(const item of candidates){
        const candidate = item.candidate || item;
        const key = JSON.stringify(candidate);

        if(seenAdminIce.has(key)) continue;
        seenAdminIce.add(key);

        try{
          await userPeer.addIceCandidate(candidate);
        }catch(e){}
      }
    }catch(e){}
  }

  $("ringBtn").addEventListener("click", () => {
    if(mode === "idle"){
      ring();
      return;
    }

    if(mode === "talk-ready"){
      prepareTalkStep();
      return;
    }

    if(mode === "mic-permission"){
      confirmMicrophoneAndConnect();
      return;
    }
  });

  if($("talkNowBtn")){
    $("talkNowBtn").style.display = "none";
  }

  window.addEventListener("beforeunload", () => {
    stopAll();
  });

  loadSettings();
  setMode("idle");
</script>





</body>
</html>
