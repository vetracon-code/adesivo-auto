<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Il mio citofono</title>
  <link rel="icon" href="/icons/il-mio-citofono.svg">
  <meta name="theme-color" content="#f8fafc">
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--sky:#0ea5e9;--shadow:0 22px 60px rgba(15,23,42,.12)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#eff6ff 0,#f8fafc 48%,#f8fafc 100%);color:var(--ink)}
    body{display:grid;place-items:center;padding:18px}
    .phone{width:100%;max-width:420px;min-height:720px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);padding:34px 22px;text-align:center;display:flex;flex-direction:column;justify-content:center}
    .brand{font-size:15px;font-weight:950;letter-spacing:.12em;color:#2563eb;text-transform:uppercase;margin-bottom:24px}
    .speaker{width:240px;height:240px;border-radius:50%;border:1.5px solid var(--blue);margin:0 auto 34px;display:grid;place-items:center;background:radial-gradient(circle,#fff,#f8fafc);position:relative}
    .speaker.active{box-shadow:0 0 0 8px rgba(37,99,235,.06),0 0 38px rgba(37,99,235,.18)}
    .speaker.active:after{content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(56,189,248,.35);animation:pulse 1.45s ease-in-out infinite}
    .holes{width:130px;height:130px;border-radius:50%;background-image:radial-gradient(circle,#0f172a 3px,transparent 3.5px);background-size:17px 17px}
    .name{font-size:32px;line-height:1.08;font-weight:950;margin:0 0 10px}
    .address{font-size:17px;color:var(--muted);margin-bottom:36px}
    .ring{width:88%;max-width:330px;margin:0 auto;border:0;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;padding:20px;font-size:23px;font-weight:950;box-shadow:0 15px 34px rgba(37,99,235,.28);cursor:pointer}
    .ring:active{transform:scale(.985)}
    .hint{min-height:22px;font-size:15px;color:var(--muted);margin-top:22px}
    .closed{display:none;margin-top:18px;padding:14px;border-radius:18px;background:#ecfdf5;color:#166534;font-weight:850}
    @keyframes pulse{0%,100%{transform:scale(.94);opacity:.45}50%{transform:scale(1.05);opacity:1}}
    @media(max-width:430px){.phone{min-height:calc(100vh - 24px);border-radius:32px}.speaker{width:220px;height:220px}.name{font-size:29px}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="brand">Citofonami</div>
    <div id="speaker" class="speaker"><div class="holes"></div></div>
    <h1 class="name" id="name">Casa Rossi</h1>
    <div class="address" id="address">Via Roma 123, Milano</div>
    <button class="ring" id="ringBtn">🔔 SUONA</button>
    <div class="hint" id="hint">Premi per citofonare.</div>
    <div class="closed" id="closed">Conversazione chiusa. Grazie.</div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let currentCallId = null;
    let userPeer = null;
    let userStream = null;
    let remoteAudio = null;
    let statusTimer = null;
    let offerTimer = null;
    let iceTimer = null;
    let offerReceived = null;
    let mode = "idle";
    const seenAdminIce = new Set();

    function api(path){
      return "/api/citofonami/" + encodeURIComponent(new URLSearchParams(location.search).get("code") || "DEMO") + path;
    }

    function callerId(){
      let id = localStorage.getItem("ilMioCitofono.callerId");
      if(!id){
        id = "caller_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
        localStorage.setItem("ilMioCitofono.callerId", id);
      }
      return id;
    }

    function loadSettings(){
      const name = localStorage.getItem("ilMioCitofono.name") || "Casa Rossi";
      const address = localStorage.getItem("ilMioCitofono.address") || "Via Roma 123, Milano";
      $("name").textContent = name;
      if(address){ $("address").textContent = address; $("address").style.display = "block"; }
      else{ $("address").style.display = "none"; }
    }

    function setMode(next){
      mode = next;

      if(next === "idle"){
        $("ringBtn").disabled = false;
        $("ringBtn").textContent = "🔔 SUONA";
      }

      if(next === "ringing"){
        $("ringBtn").disabled = true;
        $("ringBtn").textContent = "CHIAMATA IN CORSO";
      }

      if(next === "talk"){
        $("ringBtn").disabled = false;
        $("ringBtn").textContent = "🎙️ PARLA ORA";
      }

      if(next === "connecting"){
        $("ringBtn").disabled = true;
        $("ringBtn").textContent = "COLLEGO AUDIO...";
      }

      if(next === "connected"){
        $("ringBtn").disabled = true;
        $("ringBtn").textContent = "AUDIO ATTIVO";
      }
    }

    function stopStream(stream){
      if(stream){ stream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} }); }
    }

    function makeRemoteAudio(){
      if(remoteAudio) return remoteAudio;

      remoteAudio = document.createElement("audio");
      remoteAudio.autoplay = true;
      remoteAudio.playsInline = true;
      remoteAudio.setAttribute("playsinline","true");
      remoteAudio.setAttribute("webkit-playsinline","true");
      remoteAudio.controls = true;
      remoteAudio.muted = false;
      remoteAudio.volume = 1;
      remoteAudio.style.display = "block";
      remoteAudio.style.width = "100%";
      remoteAudio.style.maxWidth = "420px";
      remoteAudio.style.margin = "14px auto";
      remoteAudio.style.borderRadius = "14px";
      remoteAudio.style.background = "#f1f5f9";
      remoteAudio.dataset.role = "remote-audio";
      document.body.appendChild(remoteAudio);

      return remoteAudio;
    }

    async function ring(){
      setMode("ringing");
      $("speaker").classList.add("active");
      $("closed").style.display = "none";
      $("hint").textContent = "Invio chiamata all'admin...";

      try{
        const res = await fetch(api("/ring-v2"), {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({
            callerId: callerId(),
            source: "il-mio-citofono",
            lightClone: true,
            userAgent: navigator.userAgent + " IL_MIO_CITOFONO_LIGHT_CLONE",
            locationEnabled: false,
            geofenceEnabled: false,
            requireLocation: false,
            radiusDisabled: true,
            door: {
              name: $("name").textContent || "Il mio citofono",
              description: $("address").textContent || ""
            }
          })
        });

        const data = await res.json();

        if(!data.ok){
          throw new Error(data.error || data.message || "Chiamata non inviata.");
        }

        const call = data.call || data.pendingCall || data;
        currentCallId = data.callId || call.id || call.callId || "";

        if(!currentCallId){
          throw new Error("CallId mancante.");
        }

        window.__IL_MIO_CITOFONO_CALL_ID__ = currentCallId;
        $("hint").textContent = "Chiamata inviata. Attendi la risposta...";

        statusTimer = setInterval(() => pollStatus(currentCallId), 700);
        offerTimer = setInterval(() => pollOffer(currentCallId), 700);

      }catch(e){
        console.error(e);
        $("speaker").classList.remove("active");
        $("hint").textContent = "Errore chiamata: " + (e.message || e);
        setMode("idle");
      }
    }

    async function pollStatus(callId){
      try{
        const res = await fetch(api("/calls/" + encodeURIComponent(callId) + "/status?t=" + Date.now()), { cache:"no-store" });
        const data = await res.json();
        const status = data.status || "";

        if(status === "answered" && mode === "ringing"){
          $("hint").textContent = "Admin ha risposto. Premi PARLA ORA.";
          setMode("talk");
        }

        if(status === "closed" || status === "rejected" || status === "ended"){
          $("hint").textContent = "Conversazione chiusa.";
          $("closed").style.display = "block";
          stopAll();
        }
      }catch(e){}
    }

    async function pollOffer(callId){
      try{
        const offer = await fetchOffer(callId);
        if(offer){
          offerReceived = offer;
          clearInterval(offerTimer);
          offerTimer = null;
        }
      }catch(e){}
    }

    async function fetchOffer(callId){
      const res = await fetch(api("/calls/" + encodeURIComponent(callId) + "/webrtc/offer?t=" + Date.now()), { cache:"no-store" });
      const data = await res.json();

      if(data.ok && data.offer && data.offer.type === "offer"){
        return data.offer;
      }

      return null;
    }

    async function waitOffer(callId){
      if(offerReceived) return offerReceived;

      for(let i=0;i<30;i++){
        const offer = await fetchOffer(callId).catch(() => null);
        if(offer) return offer;
        await new Promise(r => setTimeout(r, 400));
      }

      return null;
    }

    async function talkNow(){
      if(!currentCallId){
        $("hint").textContent = "Chiamata non trovata.";
        setMode("idle");
        return;
      }

      setMode("connecting");
      $("hint").textContent = "Autorizza il microfono...";

      try{
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
          throw new Error("Microfono non disponibile.");
        }

        userStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });

        const tracks = userStream.getAudioTracks();
        if(!tracks || !tracks.length || tracks[0].readyState !== "live"){
          throw new Error("Microfono non attivo.");
        }

        tracks[0].enabled = true;

        const offer = await waitOffer(currentCallId);
        if(!offer){
          throw new Error("Offer admin non ricevuta.");
        }

        await createAnswer(currentCallId, offer);

      }catch(e){
        console.error(e);
        $("hint").textContent = "Errore audio: " + (e.message || e);
        setMode("talk");
      }
    }

    async function createAnswer(callId, offer){
      const audio = makeRemoteAudio();

      if(userPeer){
        try{ userPeer.close(); }catch(e){}
        userPeer = null;
      }

      userPeer = new RTCPeerConnection({
        iceServers:[{ urls:["stun:stun.l.google.com:19302"] }]
      });

      userPeer.onicecandidate = event => {
        if(event.candidate){
          fetch(api("/calls/" + encodeURIComponent(callId) + "/webrtc/ice"), {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ role:"user", candidate:event.candidate })
          }).catch(()=>{});
        }
      };

      userPeer.ontrack = event => {
        const stream = event.streams && event.streams[0]
          ? event.streams[0]
          : new MediaStream([event.track]);

        audio.srcObject = stream;
        audio.muted = false;
        audio.volume = 1;

        const p = audio.play();
        if(p && p.catch){
          p.catch(err => {
            console.warn("Audio remoto utente bloccato:", err);
            $("hint").textContent = "Audio pronto. Tocca lo schermo se non senti.";
          });
        }

        const remoteTracks = stream.getAudioTracks ? stream.getAudioTracks() : [];
        $("hint").textContent = "Audio remoto ricevuto: " + remoteTracks.length + " traccia/e. Premi play se non senti.";
        setMode("connected");
      };

      userPeer.onconnectionstatechange = () => {
        if(!userPeer) return;
        if(userPeer.connectionState === "connected"){
          $("hint").textContent = "Audio collegato. Parla ora.";
          setMode("connected");
        }
      };

      userStream.getAudioTracks().forEach(track => {
        track.enabled = true;
        userPeer.addTrack(track, userStream);
      });

      await userPeer.setRemoteDescription(new RTCSessionDescription(offer));

      const answer = await userPeer.createAnswer();
      await userPeer.setLocalDescription(answer);

      await fetch(api("/calls/" + encodeURIComponent(callId) + "/webrtc/answer"), {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ answer:userPeer.localDescription })
      });

      $("hint").textContent = "Risposta inviata. Collegamento audio...";

      clearInterval(iceTimer);
      iceTimer = setInterval(() => pollAdminIce(callId), 700);
    }

    async function pollAdminIce(callId){
      if(!userPeer) return;

      try{
        const res = await fetch(api("/calls/" + encodeURIComponent(callId) + "/webrtc/ice?role=admin&t=" + Date.now()), { cache:"no-store" });
        const data = await res.json();
        const candidates = data.candidates || data.ice || [];

        for(const item of candidates){
          const candidate = item.candidate || item;
          if(!candidate) continue;

          const key = JSON.stringify(candidate);
          if(seenAdminIce.has(key)) continue;
          seenAdminIce.add(key);

          try{
            await userPeer.addIceCandidate(candidate);
          }catch(e){
            console.warn("ICE admin non aggiunto:", e);
          }
        }
      }catch(e){}
    }

    function stopAll(){
      clearInterval(statusTimer);
      clearInterval(offerTimer);
      clearInterval(iceTimer);
      statusTimer = null;
      offerTimer = null;
      iceTimer = null;

      if(userPeer){
        try{ userPeer.close(); }catch(e){}
        userPeer = null;
      }

      if(userStream){
        stopStream(userStream);
        userStream = null;
      }

      if(remoteAudio){
        try{
          remoteAudio.pause();
          remoteAudio.srcObject = null;
          remoteAudio.remove();
        }catch(e){}
        remoteAudio = null;
      }

      currentCallId = null;
      offerReceived = null;
      seenAdminIce.clear();

      $("speaker").classList.remove("active");
      setMode("idle");
    }

    $("ringBtn").addEventListener("click", async () => {
      if(mode === "idle"){
        ring();
        return;
      }

      if(mode === "talk"){
        talkNow();
        return;
      }
    });

    window.addEventListener("beforeunload", stopAll);
    loadSettings();
    setMode("idle");
  
  // IL_MIO_CITOFONO_STATS_UTENTE_20260609
  function ensureStatsBox(){
    var box = document.getElementById("webrtcStatsBox");
    if(box) return box;

    box = document.createElement("pre");
    box.id = "webrtcStatsBox";
    box.style.whiteSpace = "pre-wrap";
    box.style.fontSize = "12px";
    box.style.lineHeight = "1.35";
    box.style.margin = "14px auto";
    box.style.maxWidth = "420px";
    box.style.padding = "12px";
    box.style.borderRadius = "14px";
    box.style.background = "#020617";
    box.style.color = "#dbeafe";
    box.style.textAlign = "left";
    box.textContent = "UTENTE WebRTC stats in attesa...";
    document.body.appendChild(box);
    return box;
  }

  async function updateWebrtcStats(){
    var box = ensureStatsBox();
    var pc = typeof userPeer !== "undefined" ? userPeer : null;
    var localStream = typeof userStream !== "undefined" ? userStream : null;
    var audioEl = typeof remoteAudio !== "undefined" ? remoteAudio : null;

    var lines = [];
    lines.push("UTENTE WEBRTC LIVE");
    lines.push("time=" + new Date().toLocaleTimeString());

    if(!pc){
      lines.push("pc=null");
      box.textContent = lines.join("\n");
      return;
    }

    lines.push("pc.connectionState=" + pc.connectionState);
    lines.push("pc.iceConnectionState=" + pc.iceConnectionState);
    lines.push("pc.signalingState=" + pc.signalingState);

    try{
      var senders = pc.getSenders ? pc.getSenders() : [];
      var receivers = pc.getReceivers ? pc.getReceivers() : [];
      lines.push("senders=" + senders.length);
      lines.push("receivers=" + receivers.length);

      senders.forEach(function(sender, i){
        var t = sender.track;
        if(t){
          lines.push("sender[" + i + "] kind=" + t.kind + " enabled=" + t.enabled + " muted=" + t.muted + " readyState=" + t.readyState);
        }
      });

      receivers.forEach(function(receiver, i){
        var t = receiver.track;
        if(t){
          lines.push("receiver[" + i + "] kind=" + t.kind + " enabled=" + t.enabled + " muted=" + t.muted + " readyState=" + t.readyState);
        }
      });
    }catch(e){
      lines.push("tracks error=" + (e.message || e));
    }

    try{
      if(localStream){
        var lt = localStream.getAudioTracks ? localStream.getAudioTracks() : [];
        lines.push("localAudioTracks=" + lt.length);
        lt.forEach(function(t, i){
          lines.push("local[" + i + "] enabled=" + t.enabled + " muted=" + t.muted + " readyState=" + t.readyState + " label=" + (t.label || ""));
        });
      }else{
        lines.push("localStream=null");
      }
    }catch(e){}

    try{
      if(audioEl){
        lines.push("remoteAudio exists=true paused=" + audioEl.paused + " muted=" + audioEl.muted + " volume=" + audioEl.volume + " readyState=" + audioEl.readyState);
        var rs = audioEl.srcObject;
        if(rs && rs.getAudioTracks){
          var rt = rs.getAudioTracks();
          lines.push("remoteAudioTracks=" + rt.length);
          rt.forEach(function(t, i){
            lines.push("remote[" + i + "] enabled=" + t.enabled + " muted=" + t.muted + " readyState=" + t.readyState + " label=" + (t.label || ""));
          });
        }else{
          lines.push("remoteAudio.srcObject=null");
        }
      }else{
        lines.push("remoteAudio=null");
      }
    }catch(e){}

    var bytesSent = 0;
    var packetsSent = 0;
    var bytesReceived = 0;
    var packetsReceived = 0;
    var audioReports = 0;

    try{
      var stats = await pc.getStats();
      stats.forEach(function(report){
        if(report.type === "outbound-rtp" && (report.kind === "audio" || report.mediaType === "audio")){
          audioReports++;
          bytesSent += report.bytesSent || 0;
          packetsSent += report.packetsSent || 0;
        }
        if(report.type === "inbound-rtp" && (report.kind === "audio" || report.mediaType === "audio")){
          audioReports++;
          bytesReceived += report.bytesReceived || 0;
          packetsReceived += report.packetsReceived || 0;
        }
      });
    }catch(e){
      lines.push("getStats error=" + (e.message || e));
    }

    lines.push("audioReports=" + audioReports);
    lines.push("bytesSent=" + bytesSent);
    lines.push("packetsSent=" + packetsSent);
    lines.push("bytesReceived=" + bytesReceived);
    lines.push("packetsReceived=" + packetsReceived);

    box.textContent = lines.join("\n");
  }

  setInterval(updateWebrtcStats, 1000);
  setTimeout(updateWebrtcStats, 1200);

</script>
</body>
</html>
