<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Citofonami</title>

  <meta name="theme-color" content="#08090c" />
  <meta name="apple-mobile-web-app-title" content="Citofonami" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="/citofonami-manifest.json" />

  <style>
    :root {
      --metal: #171a22;
      --metal2: #282c36;
      --dark: #080a0e;
      --line: rgba(255,255,255,.11);
      --text: #f8f4ea;
      --muted: #aeb1ba;
      --gold: #d7b46a;
      --gold2: #f4d990;
      --green: #3ce083;
      --red: #ff6262;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(215,180,106,.18), transparent 34%),
        linear-gradient(180deg, #12141b 0%, #050609 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .wrap {
      width: 100%;
      max-width: 390px;
    }

    .intercom {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 20px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.03)),
        linear-gradient(180deg, var(--metal2), var(--metal));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 34px 90px rgba(0,0,0,.56),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -1px 0 rgba(0,0,0,.58);
    }

    .intercom::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.045);
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -.055em;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(60,224,131,.10);
      border: 1px solid rgba(60,224,131,.22);
      color: var(--green);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px rgba(60,224,131,.75);
    }

    .screen {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      padding: 18px 16px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.28), rgba(255,255,255,.025)),
        #0b0d11;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 14px 34px rgba(0,0,0,.48);
      text-align: center;
      margin-bottom: 18px;
      pointer-events: none;
    }

    .screen small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .screen h1 {
      margin: 0;
      font-size: clamp(32px, 9vw, 42px);
      line-height: .98;
      letter-spacing: -.06em;
    }

    .screen p {
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      max-width: 290px;
    }

    .speaker {
      position: relative;
      z-index: 1;
      margin: 0 auto 18px;
      width: 76%;
      border-radius: 20px;
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22)),
        #101217;
      border: 1px solid rgba(255,255,255,.08);
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 8px;
      box-shadow: inset 0 12px 26px rgba(0,0,0,.44);
    }

    .hole {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      justify-self: center;
      background: rgba(255,255,255,.16);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.6);
    }

    .call-button {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 92px;
      border: 1px solid rgba(215,180,106,.38);
      border-radius: 20px;
      padding: 18px 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.10)),
        linear-gradient(135deg, #fff1bd, #d7b46a);
      color: #211807;
      cursor: pointer;
      box-shadow:
        0 18px 42px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.48),
        inset 0 -5px 12px rgba(82,55,14,.18);
      font: inherit;
      text-align: center;
      transition: transform .14s ease, filter .14s ease;
    }

    .call-button:active {
      transform: translateY(2px) scale(.99);
    }

    .call-button .action {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 950;
      opacity: .82;
    }

    .call-button .name {
      display: block;
      font-size: clamp(28px, 8vw, 38px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 950;
      margin-top: 5px;
    }

    .call-button .sub {
      display: block;
      font-size: 13px;
      margin-top: 8px;
      font-weight: 750;
      opacity: .72;
    }

    .status-box {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      min-height: 48px;
      border-radius: 16px;
      padding: 13px 14px;
      background: rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.075);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.38;
      text-align: center;
    }

    .status-box.ok {
      color: var(--green);
      border-color: rgba(60,224,131,.22);
      background: rgba(60,224,131,.08);
    }

    .status-box.ko {
      color: var(--red);
      border-color: rgba(255,98,98,.22);
      background: rgba(255,98,98,.08);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      text-align: center;
      color: rgba(247,244,236,.42);
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 360px) {
      .intercom {
        padding: 17px;
        border-radius: 30px;
      }

      .screen h1 {
        font-size: 31px;
      }

      .call-button .name {
        font-size: 29px;
      }
    }
  
    .voicemail-panel {
      display: none;
      position: relative;
      z-index: 1;
      margin-top: 14px;
      border-radius: 18px;
      padding: 14px;
      background: rgba(215,180,106,.10);
      border: 1px solid rgba(215,180,106,.24);
      color: var(--text);
    }

    .voicemail-panel.open {
      display: block;
    }

    .voicemail-panel strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .voicemail-panel p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .voicemail-actions {
      display: grid;
      gap: 9px;
    }

    .voicemail-actions button {
      width: 100%;
      border: 1px solid rgba(215,180,106,.34);
      border-radius: 15px;
      padding: 13px;
      background: rgba(255,255,255,.08);
      color: var(--text);
      font: inherit;
      font-weight: 850;
    }

    .voicemail-actions button.primary {
      background: linear-gradient(135deg, #fff1bd, #d7b46a);
      color: #211807;
    }

    .voicemail-panel audio {
      width: 100%;
      margin: 10px 0;
      display: none;
    }

  </style>
</head>

<body>
  <main class="wrap">
    <section class="intercom">
      <div class="top">
        <div class="brand">Citofonami</div>
        <div class="online"><span class="dot"></span> Online</div>
      </div>

      <div class="screen">
        <small>Citofono digitale</small>
        <h1 id="ownerName">Mario Rossi</h1>
        <p id="publicText">Premi il pulsante per parlare con il proprietario.</p>
      </div>

      <div class="speaker" id="speaker"></div>

      <button class="call-button" id="callButton" type="button">
        <span class="action">Suona</span>
        <span class="name" id="buttonName">Mario Rossi</span>
        <span class="sub">premi per parlare</span>
      </button>

      <div class="status-box" id="statusBox">
        Premi il pulsante per chiamare.
      </div>


      <div class="voicemail-panel" id="voicemailPanel">
        <strong>Non riesco a rispondere in questo momento.</strong>
        <p>Vuoi lasciarmi un messaggio vocale?</p>
        <audio id="voicemailPreview" controls></audio>
        <div class="voicemail-actions">
          <button class="primary" id="recordVoicemailButton" type="button">Registra</button>
          <button id="playVoicemailButton" type="button">Riascolta</button>
          <button id="sendVoicemailButton" type="button">Invia</button>
        </div>
      </div>

      <div class="footer">
        Numero protetto · Nessun telefono visibile
      </div>
    </section>
  </main>

  <script>
    const speaker = document.getElementById('speaker');
    const statusBox = document.getElementById('statusBox');
    const ownerName = document.getElementById('ownerName');
    const publicText = document.getElementById('publicText');
    const buttonName = document.getElementById('buttonName');
    const callButton = document.getElementById('callButton');

    const code = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'DEMO').toUpperCase();

    let config = null;
    let localStream = null;

    for (let i = 0; i < 63; i++) {
      const dot = document.createElement('span');
      dot.className = 'hole';
      speaker.appendChild(dot);
    }

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = 'status-box' + (type ? ' ' + type : '');
    }

    async function loadConfig() {
      try {
        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/config`);
        const data = await res.json();

        if (!data.ok || !data.config) {
          throw new Error('Configurazione non trovata');
        }

        config = data.config;
      } catch (error) {
        config = {
          firstName: 'Mario',
          lastName: 'Rossi',
          publicText: 'Premi il pulsante per parlare con il proprietario.',
          qrCode: 'DEMO',
          buttonLabel: 'Mario Rossi',
          radius: 50,
          latitude: 45.584500,
          longitude: 9.274400,
          enabled: true,
          pushEnabled: true,
          fallbackEnabled: true,
          requireLocation: true
        };
      }

      render();
    }

    function render() {
      const owner = `${config.firstName || 'Mario'} ${config.lastName || 'Rossi'}`;
      const label = config.buttonLabel || owner;

      ownerName.textContent = owner;
      buttonName.textContent = label;
      publicText.textContent = config.publicText || 'Premi il pulsante per parlare con il proprietario.';

      if (config.enabled === false) {
        setStatus('Citofono momentaneamente non disponibile.', 'ko');
        callButton.disabled = true;
        callButton.style.opacity = '.5';
        callButton.style.filter = 'grayscale(1)';
      } else {
        setStatus('Premi il pulsante per chiamare.');
      }
    }

    async function getPositionIfNeeded() {
      if (config.requireLocation === false) {
        return null;
      }

      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocalizzazione non disponibile'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          () => reject(new Error('Posizione non autorizzata')),
          {
            enableHighAccuracy: true,
            timeout: 9000,
            maximumAge: 0
          }
        );
      });
    }

    async function openMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Microfono non disponibile');
      }

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

      return true;
    }

    async function ring() {
      setStatus('Connessione in corso…');

      try {
        let position = null;

        if (config.requireLocation !== false) {
          setStatus('Verifico la tua posizione…');
          position = await getPositionIfNeeded();
        }

        setStatus('Attivo il microfono…');

        try {
          await openMicrophone();
        } catch (micError) {
          console.warn(micError);
        }

        const payload = {
          door: {
            name: config.buttonLabel || `${config.firstName || 'Mario'} ${config.lastName || 'Rossi'}`,
            description: 'Citofono principale'
          },
          lat: position ? position.coords.latitude : null,
          lng: position ? position.coords.longitude : null,
          accuracy: position ? position.coords.accuracy : null,
          userAgent: navigator.userAgent
        };

        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/ring`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Richiesta non riuscita');
        }

        if (data.allowed === false) {
          setStatus('Devi essere in prossimità del citofono per parlare.', 'ko');
          return;
        }

        setStatus('Chiamata inviata. Attendi la risposta…', 'ok');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Non è stato possibile chiamare.', 'ko');
      }
    }

    callButton.addEventListener('click', ring);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/citofonami-sw.js').catch(() => null);
    }

    loadConfig();
  
    let activeCallId = null;
    let voicemailRecorder = null;
    let voicemailChunks = [];
    let voicemailBlob = null;

    function openVoicemailPanel(callId) {
      activeCallId = callId;
      voicemailPanel.classList.add('open');
      setStatus('L’admin non può rispondere ora. Puoi lasciare un messaggio vocale.', 'ok');
    }

    async function startVoicemailRecording() {
      try {
        voicemailChunks = [];
        voicemailBlob = null;

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        voicemailRecorder = new MediaRecorder(stream);

        voicemailRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size) {
            voicemailChunks.push(event.data);
          }
        };

        voicemailRecorder.onstop = () => {
          voicemailBlob = new Blob(voicemailChunks, { type: voicemailRecorder.mimeType || 'audio/webm' });
          voicemailPreview.src = URL.createObjectURL(voicemailBlob);
          voicemailPreview.style.display = 'block';
          setStatus('Registrazione pronta. Puoi riascoltarla o inviarla.', 'ok');
          stream.getTracks().forEach(track => track.stop());
        };

        voicemailRecorder.start();
        recordVoicemailButton.textContent = 'Stop registrazione';
        setStatus('Registrazione in corso…');

        recordVoicemailButton.onclick = stopVoicemailRecording;
      } catch (error) {
        console.error(error);
        setStatus('Non riesco ad accedere al microfono.', 'ko');
      }
    }

    function stopVoicemailRecording() {
      if (voicemailRecorder && voicemailRecorder.state !== 'inactive') {
        voicemailRecorder.stop();
      }

      recordVoicemailButton.textContent = 'Registra di nuovo';
      recordVoicemailButton.onclick = startVoicemailRecording;
    }

    function playVoicemail() {
      if (!voicemailBlob || !voicemailPreview.src) {
        setStatus('Prima registra un messaggio.', 'ko');
        return;
      }

      voicemailPreview.play().catch(() => null);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function sendVoicemail() {
      if (!activeCallId) {
        setStatus('Chiamata non trovata.', 'ko');
        return;
      }

      if (!voicemailBlob) {
        setStatus('Prima registra un messaggio.', 'ko');
        return;
      }

      try {
        setStatus('Invio messaggio vocale…');

        const audioBase64 = await blobToBase64(voicemailBlob);

        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/calls/${encodeURIComponent(activeCallId)}/voicemail`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            callerId: getCitofonamiCallerId(),
            audioBase64,
            mimeType: voicemailBlob.type || 'audio/webm'
          })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Invio non riuscito');
        }

        setStatus('Messaggio vocale inviato.', 'ok');
        voicemailPanel.classList.remove('open');
      } catch (error) {
        console.error(error);
        setStatus('Errore invio messaggio vocale: ' + error.message, 'ko');
      }
    }

    recordVoicemailButton.onclick = startVoicemailRecording;
    playVoicemailButton.addEventListener('click', playVoicemail);
    sendVoicemailButton.addEventListener('click', sendVoicemail);

  </script>
</body>
</html>
