<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Citofonami</title>

  <meta name="theme-color" content="#08090c" />
  <meta name="apple-mobile-web-app-title" content="Citofonami" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="/citofonami-manifest.json" />

  <style>
    :root {
      --metal: #171a22;
      --metal2: #282c36;
      --dark: #080a0e;
      --line: rgba(255,255,255,.11);
      --text: #f8f4ea;
      --muted: #aeb1ba;
      --gold: #d7b46a;
      --gold2: #f4d990;
      --green: #3ce083;
      --red: #ff6262;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(215,180,106,.18), transparent 34%),
        linear-gradient(180deg, #12141b 0%, #050609 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .wrap {
      width: 100%;
      max-width: 390px;
    }

    .intercom {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 20px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.03)),
        linear-gradient(180deg, var(--metal2), var(--metal));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 34px 90px rgba(0,0,0,.56),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -1px 0 rgba(0,0,0,.58);
    }

    .intercom::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.045);
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -.055em;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(60,224,131,.10);
      border: 1px solid rgba(60,224,131,.22);
      color: var(--green);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px rgba(60,224,131,.75);
    }

    .screen {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      padding: 18px 16px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.28), rgba(255,255,255,.025)),
        #0b0d11;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 14px 34px rgba(0,0,0,.48);
      text-align: center;
      margin-bottom: 18px;
      pointer-events: none;
    }

    .screen small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .screen h1 {
      margin: 0;
      font-size: clamp(32px, 9vw, 42px);
      line-height: .98;
      letter-spacing: -.06em;
    }

    .screen p {
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      max-width: 290px;
    }

.speaker {
      position: relative;
      z-index: 1;
      margin: 4px auto 22px;
      width: 92%;
      min-height: 190px;
      border-radius: 28px;
      padding: 22px;
      background:
        radial-gradient(circle at 50% 20%, rgba(215,180,106,.08), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,.065), rgba(0,0,0,.26)),
        #101217;
      border: 1px solid rgba(255,255,255,.085);
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 11px;
      box-shadow:
        inset 0 18px 38px rgba(0,0,0,.52),
        0 16px 34px rgba(0,0,0,.26);
    }

    .hole {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      justify-self: center;
      align-self: center;
      background: rgba(255,255,255,.16);
      box-shadow:
        inset 0 2px 4px rgba(0,0,0,.65),
        0 0 0 rgba(215,180,106,0);
      transition:
        background .08s ease,
        box-shadow .08s ease,
        transform .08s ease,
        opacity .08s ease;
      opacity: .62;
    }

    .hole.live {
      background: rgba(244,217,144,.95);
      box-shadow:
        0 0 12px rgba(215,180,106,.58),
        inset 0 1px 2px rgba(255,255,255,.35);
      transform: scale(1.22);
      opacity: 1;
    }

    .low-volume-warning {
      display: none;
      position: relative;
      z-index: 1;
      margin: -8px 0 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(215,180,106,.12);
      border: 1px solid rgba(215,180,106,.26);
      color: var(--gold2);
      font-size: 14px;
      line-height: 1.35;
      text-align: center;
      font-weight: 750;
    }

    .low-volume-warning.show {
      display: block;
    }

    .call-button {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 92px;
      border: 1px solid rgba(215,180,106,.38);
      border-radius: 20px;
      padding: 18px 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.10)),
        linear-gradient(135deg, #fff1bd, #d7b46a);
      color: #211807;
      cursor: pointer;
      box-shadow:
        0 18px 42px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.48),
        inset 0 -5px 12px rgba(82,55,14,.18);
      font: inherit;
      text-align: center;
      transition: transform .14s ease, filter .14s ease;
    }

    .call-button:active {
      transform: translateY(2px) scale(.99);
    }

    .call-button .action {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 950;
      opacity: .82;
    }

    .call-button .name {
      display: block;
      font-size: clamp(28px, 8vw, 38px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 950;
      margin-top: 5px;
    }

    .call-button .sub {
      display: block;
      font-size: 13px;
      margin-top: 8px;
      font-weight: 750;
      opacity: .72;
    }

    .status-box {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      min-height: 48px;
      border-radius: 16px;
      padding: 13px 14px;
      background: rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.075);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.38;
      text-align: center;
    }

    .status-box.ok {
      color: var(--green);
      border-color: rgba(60,224,131,.22);
      background: rgba(60,224,131,.08);
    }

    .status-box.ko {
      color: var(--red);
      border-color: rgba(255,98,98,.22);
      background: rgba(255,98,98,.08);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      text-align: center;
      color: rgba(247,244,236,.42);
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 360px) {
      .intercom {
        padding: 17px;
        border-radius: 30px;
      }

      .screen h1 {
        font-size: 31px;
      }

      .call-button .name {
        font-size: 29px;
      }
    }
  
    .voicemail-panel {
      display: none;
      position: relative;
      z-index: 1;
      margin-top: 14px;
      border-radius: 18px;
      padding: 14px;
      background: rgba(215,180,106,.10);
      border: 1px solid rgba(215,180,106,.24);
      color: var(--text);
    }

    .voicemail-panel.open {
      display: block;
    }

    .voicemail-panel strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .voicemail-panel p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .voicemail-actions {
      display: grid;
      gap: 9px;
    }

    .voicemail-actions button {
      width: 100%;
      border: 1px solid rgba(215,180,106,.34);
      border-radius: 15px;
      padding: 13px;
      background: rgba(255,255,255,.08);
      color: var(--text);
      font: inherit;
      font-weight: 850;
    }

    .voicemail-actions button.primary {
      background: linear-gradient(135deg, #fff1bd, #d7b46a);
      color: #211807;
    }

    .voicemail-panel audio {
      width: 100%;
      margin: 10px 0;
      display: none;
    }

  
    .user-talk-now-button {
      display: none;
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: 12px;
      min-height: 62px;
      border-radius: 20px;
      border: 0;
      background: linear-gradient(135deg, #d7ffe7, #39d77b);
      color: #06170d;
      font: inherit;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .06em;
      box-shadow: 0 16px 34px rgba(0,0,0,.34);
    }

    .user-talk-now-button.show {
      display: block;
    }

  </style>
</head>

<body>
  <main class="wrap">
    <section class="intercom">
      <div class="top">
        <div class="brand">Citofonami</div>
        <div class="online"><span class="dot"></span> Online</div>
      </div>

      <div class="speaker" id="speaker" aria-label="Indicatore audio"></div>

      <div class="low-volume-warning" id="lowVolumeWarning">Per cortesia avvicinati, non sento bene. Grazie.</div>

      <button class="call-button" id="callButton" type="button">
        <span class="action">Citofona</span>
        <span class="name" id="buttonName">Mario Rossi</span>
        <span class="sub">premi e chiama</span>
      </button>

      <div class="status-box" id="statusBox">
        Premi e chiama.
      </div>


      <div class="voicemail-panel" id="voicemailPanel">
        <strong>Non riesco a rispondere in questo momento.</strong>
        <p>Vuoi lasciarmi un messaggio vocale?</p>
        <audio id="voicemailPreview" controls></audio>
        <div class="voicemail-actions">
          <button class="primary" id="recordVoicemailButton" type="button">Registra</button>
          <button id="playVoicemailButton" type="button">Riascolta</button>
          <button id="sendVoicemailButton" type="button">Invia</button>
        </div>
      </div>

      <div class="footer">
        Numero protetto · Nessun telefono visibile
      </div>
    </section>
  </main>

  <script>

    // CITOFONAMI_FRESH_SCAN_SESSION
    // Ogni apertura/scansione deve partire con una sessione pulita.
    window.CITOFONAMI_SCAN_SESSION_ID =
      'scan_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);

    window.CITOFONAMI_PAGE_OPENED_AT = Date.now();

    try {
      // Non riutilizzare mai vecchie chiamate o vecchi stati conversazione.
      sessionStorage.removeItem('citofonami_active_call_id');
      sessionStorage.removeItem('citofonami_active_call_status');
      sessionStorage.removeItem('citofonami_voicemail_call_id');
    } catch (error) {}

    function citofonamiNoStoreFetch(url, options) {
      const finalOptions = Object.assign({}, options || {}, {
        cache: 'no-store'
      });

      const separator = String(url).includes('?') ? '&' : '?';
      const freshUrl = String(url) + separator + '_fresh=' + encodeURIComponent(window.CITOFONAMI_SCAN_SESSION_ID) + '_' + Date.now();

      return fetch(freshUrl, finalOptions);
    }

    const speaker = document.getElementById('speaker');
    const statusBox = document.getElementById('statusBox');
    const buttonName = document.getElementById('buttonName');
    const callButton = document.getElementById('callButton');

    const code = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'DEMO').toUpperCase();

    let config = null;
    let localStream = null;
    let citofonamiDebugStep = 'inizio';
    let citofonamiMemoryCallerId = null;
    let citofonamiSessionCallerId = 'caller_tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);

    for (let i = 0; i < 120; i++) {
      const dot = document.createElement('span');
      dot.className = 'hole';
      speaker.appendChild(dot);
    }


    function setCitofonamiStep(step) {
      citofonamiDebugStep = step;
      try {
        console.log('[Citofonami step]', step);
      } catch (error) {}
    }

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = 'status-box' + (type ? ' ' + type : '');
    }


    function cleanCitofonamiError(error, fallback) {
      const raw = error && error.message ? String(error.message) : String(error || '');

      if (
        raw.includes('The string did not match the expected pattern') ||
        raw.includes('expected pattern')
      ) {
        return fallback || 'Il browser ha bloccato un passaggio tecnico della chiamata. Riprova o usa un altro browser.';
      }

      if (raw.includes('Permission denied') || raw.includes('NotAllowedError')) {
        return 'Permesso non concesso.';
      }

      if (raw.includes('NotFoundError')) {
        return 'Microfono non trovato.';
      }

      if (raw.includes('NotReadableError')) {
        return 'Microfono già in uso da un’altra app.';
      }

      return raw || (fallback || 'Operazione non riuscita.');
    }

    function logCitofonamiStep(step, extra) {
      try {
        console.log('[Citofonami]', step, extra || '');
      } catch (error) {}
    }

    async function loadConfig() {
      try {
        const res = await citofonamiNoStoreFetch(`/api/citofonami/${encodeURIComponent(code)}/config`);
        setCitofonamiStep('lettura risposta server');
        const data = await res.json();

        if (!data.ok || !data.config) {
          throw new Error('Configurazione non trovata');
        }

        config = data.config;
      } catch (error) {
        config = {
          firstName: 'Mario',
          lastName: 'Rossi',
          publicText: 'Premi e chiama.',
          qrCode: 'DEMO',
          buttonLabel: 'Mario Rossi',
          radius: 50,
          latitude: 45.584500,
          longitude: 9.274400,
          enabled: true,
          pushEnabled: true,
          fallbackEnabled: true,
          requireLocation: true
        };
      }

      render();
    }

    function render() {
      const owner = `${config.firstName || 'Mario'} ${config.lastName || 'Rossi'}`;
      const label = config.buttonLabel || owner;

      buttonName.textContent = label;

      if (config.enabled === false) {
        setStatus('Citofono momentaneamente non disponibile.', 'ko');
        callButton.disabled = true;
        callButton.style.opacity = '.5';
        callButton.style.filter = 'grayscale(1)';
      } else {
        setStatus('Premi e chiama.');
      }
    }


    let citofonamiSessionCallCount = 0;

    function getLocalCitofonamiCallCount() {
      return citofonamiSessionCallCount;
    }

    function incrementLocalCitofonamiCallCount() {
      citofonamiSessionCallCount += 1;
      return citofonamiSessionCallCount;
    }

    function shouldAskLocationNow() {
      // Se admin disattiva geolocalizzazione, non chiediamo mai posizione.
      if (!config || config.requireLocation === false) return false;

      // Se admin attiva geolocalizzazione:
      // prima chiamata locale senza posizione, dalla seconda in poi con posizione.
      return getLocalCitofonamiCallCount() >= 1;
    }

    async function getPositionIfNeeded() {
      if (!shouldAskLocationNow()) {
        return null;
      }

      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocalizzazione non disponibile'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          () => reject(new Error('Posizione non autorizzata')),
          {
            enableHighAccuracy: true,
            timeout: 9000,
            maximumAge: 0
          }
        );
      });
    }


    let audioContext = null;
    let analyser = null;
    let audioDataArray = null;
    let audioMeterAnimation = null;
    let lowVolumeFrames = 0;

    function stopAudioLevelMeter() {
      if (audioMeterAnimation) {
        cancelAnimationFrame(audioMeterAnimation);
        audioMeterAnimation = null;
      }

      document.querySelectorAll('.hole.live').forEach(dot => dot.classList.remove('live'));

      if (typeof lowVolumeWarning !== 'undefined' && lowVolumeWarning) {
        lowVolumeWarning.classList.remove('show');
      }
    }

    function startAudioLevelMeter(stream) {
      try {
        stopAudioLevelMeter();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.72;

        source.connect(analyser);

        audioDataArray = new Uint8Array(analyser.frequencyBinCount);

        const dots = Array.from(document.querySelectorAll('.hole'));

        function tick() {
          analyser.getByteFrequencyData(audioDataArray);

          let sum = 0;
          for (let i = 0; i < audioDataArray.length; i++) {
            sum += audioDataArray[i];
          }

          const average = sum / audioDataArray.length;
          const normalized = Math.min(1, average / 82);

          const activeDots = Math.max(2, Math.round(normalized * dots.length));

          dots.forEach((dot, index) => {
            if (index < activeDots && normalized > 0.045) {
              dot.classList.add('live');
            } else {
              dot.classList.remove('live');
            }
          });

          if (normalized < 0.055) {
            lowVolumeFrames++;
          } else {
            lowVolumeFrames = 0;
            if (typeof lowVolumeWarning !== 'undefined' && lowVolumeWarning) {
              lowVolumeWarning.classList.remove('show');
            }
          }

          // circa 3 secondi a 60 fps
          if (lowVolumeFrames > 180) {
            if (typeof lowVolumeWarning !== 'undefined' && lowVolumeWarning) {
              lowVolumeWarning.classList.add('show');
            }
          }

          audioMeterAnimation = requestAnimationFrame(tick);
        }

        tick();
      } catch (error) {
        console.warn('Citofonami audio meter non disponibile:', error);
      }
    }

    async function openMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return {
          ok: false,
          error: 'Microfono non disponibile'
        };
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

        startAudioLevelMeter(localStream);

        return {
          ok: true
        };
      } catch (error) {
        console.warn('Citofonami microfono non attivo:', error);

        return {
          ok: false,
          error: cleanCitofonamiError(error, 'Microfono non attivato.')
        };
      }
    }


    async function userStartTalkingAfterAnswer() {
      setStatus('Attivo il microfono…');

      const micResult = await openMicrophone();

      if (!micResult.ok) {
        setStatus('Microfono non attivo: ' + micResult.error, 'ko');
        return;
      }

      talkNowButton.classList.remove('show');
      setStatus('Microfono attivo. Parla vicino al telefono, come a un citofono.', 'ok');
    }

    async function ring() {
      setCitofonamiStep('inizio chiamata pulita');
      setStatus('Sto suonando…');

      const callCode = String(code || 'DEMO');

      const simpleCallerId =
        'web_' +
        Date.now().toString() +
        '_' +
        Math.random().toString(36).slice(2, 8);

      const simplePayload = {
        callerId: simpleCallerId,
        door: {
          name: 'Fabrizio Vezzoli',
          description: 'Citofono'
        }
      };

      try {
        setCitofonamiStep('invio chiamata server');

        const response = await fetch('/api/citofonami/' + encodeURIComponent(callCode) + '/ring-v2', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(simplePayload)
        });

        setCitofonamiStep('lettura risposta chiamata');

        const rawText = await response.text();

        let data = null;

        try {
          data = JSON.parse(rawText);
        } catch (parseError) {
          console.error('Risposta non JSON:', rawText);
          throw new Error('Il server ha risposto in modo non valido.');
        }

        if (!response.ok || !data.ok) {
          if (data && data.blocked) {
            throw new Error('Sei stato bloccato dal sistema.');
          }

          throw new Error((data && data.error) || 'Chiamata non riuscita.');
        }

        if (data.allowed === false) {
          setStatus('Devi essere vicino al citofono per parlare.', 'ko');
          return;
        }

        setCitofonamiStep('chiamata inviata');
        setStatus('Chiamata inviata. Attendi la risposta…', 'ok');

        if (data.callId && typeof pollCallStatus === 'function') {
          pollCallStatus(data.callId);
        }
      } catch (error) {
        console.error('Citofonami ring clean error:', error);

        const message =
          error && error.message
            ? error.message
            : 'Non è stato possibile inviare la chiamata.';

        setStatus('Errore fase: ' + citofonamiDebugStep + '. ' + message, 'ko');
      }
    }


    callButton.addEventListener('click', ring);
    talkNowButton.addEventListener('click', userStartTalkingAfterAnswer);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/citofonami-sw.js').catch((error) => {
        console.warn('Citofonami service worker non registrato:', error);
      });
    }

    loadConfig();
  
    let activeCallId = null;
    let voicemailRecorder = null;
    let voicemailChunks = [];
    let voicemailBlob = null;

    function openVoicemailPanel(callId) {
      activeCallId = callId;
      voicemailPanel.classList.add('open');
      setStatus('L’admin non può rispondere ora. Puoi lasciare un messaggio vocale.', 'ok');
    }

    async function startVoicemailRecording() {
      try {
        voicemailChunks = [];
        voicemailBlob = null;

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        voicemailRecorder = new MediaRecorder(stream);

        voicemailRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size) {
            voicemailChunks.push(event.data);
          }
        };

        voicemailRecorder.onstop = () => {
          voicemailBlob = new Blob(voicemailChunks, { type: voicemailRecorder.mimeType || 'audio/webm' });
          voicemailPreview.src = URL.createObjectURL(voicemailBlob);
          voicemailPreview.style.display = 'block';
          setStatus('Registrazione pronta. Puoi riascoltarla o inviarla.', 'ok');
          stream.getTracks().forEach(track => track.stop());
        };

        voicemailRecorder.start();
        recordVoicemailButton.textContent = 'Stop registrazione';
        setStatus('Registrazione in corso…');

        recordVoicemailButton.onclick = stopVoicemailRecording;
      } catch (error) {
        console.error(error);
        setStatus('Non riesco ad accedere al microfono.', 'ko');
      }
    }

    function stopVoicemailRecording() {
      if (voicemailRecorder && voicemailRecorder.state !== 'inactive') {
        voicemailRecorder.stop();
      }

      recordVoicemailButton.textContent = 'Registra di nuovo';
      recordVoicemailButton.onclick = startVoicemailRecording;
    }

    function playVoicemail() {
      if (!voicemailBlob || !voicemailPreview.src) {
        setStatus('Prima registra un messaggio.', 'ko');
        return;
      }

      voicemailPreview.play().catch(() => null);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function sendVoicemail() {
      if (!activeCallId) {
        setStatus('Chiamata non trovata.', 'ko');
        return;
      }

      if (!voicemailBlob) {
        setStatus('Prima registra un messaggio.', 'ko');
        return;
      }

      try {
        setStatus('Invio messaggio vocale…');

        const audioBase64 = await blobToBase64(voicemailBlob);

        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/calls/${encodeURIComponent(activeCallId)}/voicemail`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            callerId: getCitofonamiCallerId(),
            audioBase64,
            mimeType: voicemailBlob.type || 'audio/webm'
          })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Invio non riuscito');
        }

        setStatus('Messaggio vocale inviato.', 'ok');
        voicemailPanel.classList.remove('open');
      } catch (error) {
        console.error(error);
        setStatus('Errore invio messaggio vocale: ' + error.message, 'ko');
      }
    }

    recordVoicemailButton.onclick = startVoicemailRecording;
    playVoicemailButton.addEventListener('click', playVoicemail);
    sendVoicemailButton.addEventListener('click', sendVoicemail);

  
    // ==============================
    // CITOFONAMI_DEMO_CONFIG_SYNC_FINAL
    // ==============================
    let citofonamiLiveConfig = null;
    let citofonamiLiveCallerId = 'caller_demo_' + window.CITOFONAMI_SCAN_SESSION_ID;
    let citofonamiLiveCallId = null;
    let citofonamiLiveStatusTimer = null;

    function getCitofonamiCodeFinal() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const last = parts[parts.length - 1] || 'DEMO';
      return String(last || 'DEMO').trim().toUpperCase();
    }

    function applyCitofonamiConfigFinal(config) {
      citofonamiLiveConfig = config || citofonamiLiveConfig || {};

      const first = citofonamiLiveConfig.firstName || '';
      const last = citofonamiLiveConfig.lastName || '';
      const fallbackName = (first + ' ' + last).trim() || 'Citofonami';
      const buttonLabel = citofonamiLiveConfig.buttonLabel || fallbackName;
      const publicText = citofonamiLiveConfig.publicText || 'Premi e chiama.';

      try {
        const buttonName = document.getElementById('buttonName');
        if (buttonName) buttonName.textContent = buttonLabel;

        const ownerName = document.getElementById('ownerName');
        if (ownerName) ownerName.textContent = buttonLabel;

        const publicTextEl = document.getElementById('publicText');
        if (publicTextEl) publicTextEl.textContent = publicText;

        document.querySelectorAll('.call-button .action').forEach(el => {
          el.textContent = 'Citofona';
        });

        document.querySelectorAll('.call-button .sub').forEach(el => {
          el.textContent = 'premi e chiama';
        });
      } catch (error) {
        console.warn('applyCitofonamiConfigFinal error:', error);
      }
    }

    async function loadCitofonamiConfigFinal() {
      const code = getCitofonamiCodeFinal();

      try {
        const res = await citofonamiNoStoreFetch(`/api/citofonami/${encodeURIComponent(code)}/config`, {
          cache: 'no-store'
        });

        const data = await res.json();

        if (data && data.ok && data.config) {
          applyCitofonamiConfigFinal(data.config);
          return data.config;
        }
      } catch (error) {
        console.warn('loadCitofonamiConfigFinal error:', error);
      }

      return citofonamiLiveConfig;
    }

    async function ringCitofonamiFinal(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const code = getCitofonamiCodeFinal();
      const config = await loadCitofonamiConfigFinal();

      const first = config && config.firstName ? config.firstName : '';
      const last = config && config.lastName ? config.lastName : '';
      const fallbackName = (first + ' ' + last).trim() || 'Citofonami';
      const buttonLabel = config && config.buttonLabel ? config.buttonLabel : fallbackName;

      setStatus('Sto chiamando…');

      const payload = {
        callerId: citofonamiLiveCallerId,
        door: {
          name: buttonLabel,
          description: 'Citofono'
        }
      };

      try {
        const response = await fetch(`/api/citofonami/${encodeURIComponent(code)}/ring-v2`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          if (data && data.blocked) {
            throw new Error('Sei stato bloccato dal sistema.');
          }

          throw new Error((data && data.error) || 'Chiamata non riuscita.');
        }

        if (data.allowed === false) {
          setStatus('Devi essere vicino al citofono per parlare.', 'ko');
          return;
        }

        citofonamiLiveCallId = data.callId;

        setStatus('Chiamata inviata. Attendi la risposta…', 'ok');

        startCitofonamiStatusPollingFinal();
      } catch (error) {
        console.error('ringCitofonamiFinal error:', error);
        setStatus('Errore chiamata: ' + (error.message || error), 'ko');
      }
    }

    function startCitofonamiStatusPollingFinal() {
      if (citofonamiLiveStatusTimer) {
        clearInterval(citofonamiLiveStatusTimer);
      }

      citofonamiLiveStatusTimer = setInterval(checkCitofonamiCallStatusFinal, 1500);
      checkCitofonamiCallStatusFinal();
    }

    async function checkCitofonamiCallStatusFinal() {
      if (!citofonamiLiveCallId) return;

      const code = getCitofonamiCodeFinal();

      try {
        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/calls/${encodeURIComponent(citofonamiLiveCallId)}/status?callerId=${encodeURIComponent(citofonamiLiveCallerId)}&t=${Date.now()}`, {
          cache: 'no-store'
        });

        const data = await res.json();

        if (!data || !data.ok) return;

        if (data.status === 'answered') {
          clearInterval(citofonamiLiveStatusTimer);
          citofonamiLiveStatusTimer = null;

          setStatus('Admin ha risposto. Tocca “Parla ora” e avvicinati al telefono.', 'ok');

          const talkNowButton = document.getElementById('talkNowButton');
          if (talkNowButton) {
            talkNowButton.classList.add('show');
          }

          return;
        }

        if (data.status === 'voicemail_requested') {
          clearInterval(citofonamiLiveStatusTimer);
          citofonamiLiveStatusTimer = null;

          if (typeof openVoicemailPanel === 'function') {
            openVoicemailPanel(citofonamiLiveCallId);
          } else {
            setStatus('Admin non disponibile. Puoi lasciare un messaggio vocale.', 'ok');
          }

          return;
        }

        if (data.status === 'closed') {
          clearInterval(citofonamiLiveStatusTimer);
          citofonamiLiveStatusTimer = null;
          setStatus('Chiamata chiusa dall’admin.', 'ko');
          return;
        }

        if (data.status === 'blocked') {
          clearInterval(citofonamiLiveStatusTimer);
          citofonamiLiveStatusTimer = null;
          setStatus('Sei stato bloccato dal sistema.', 'ko');
          return;
        }
      } catch (error) {
        console.warn('checkCitofonamiCallStatusFinal error:', error);
      }
    }

    async function userStartTalkingFinal() {
      setStatus('Attivo il microfono…');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

        if (typeof startAudioLevelMeter === 'function') {
          startAudioLevelMeter(stream);
        }

        const talkNowButton = document.getElementById('talkNowButton');
        if (talkNowButton) {
          talkNowButton.classList.remove('show');
        }

        setStatus('Microfono attivo. Parla vicino al telefono, come a un citofono.', 'ok');
      } catch (error) {
        setStatus('Microfono non attivo: ' + (error.message || error), 'ko');
      }
    }

    function wireCitofonamiFinalButtons() {
      const callButton = document.getElementById('callButton');
      const talkNowButton = document.getElementById('talkNowButton');

      if (callButton) {
        callButton.onclick = ringCitofonamiFinal;
      }

      if (talkNowButton) {
        talkNowButton.onclick = userStartTalkingFinal;
      }
    }

    loadCitofonamiConfigFinal();
    wireCitofonamiFinalButtons();
    setTimeout(loadCitofonamiConfigFinal, 500);
    setTimeout(wireCitofonamiFinalButtons, 700);

  </script>
</body>
