<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Citofonami</title>

  <meta name="theme-color" content="#08090c" />
  <meta name="apple-mobile-web-app-title" content="Citofonami" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="/citofonami-manifest.json" />

  <style>
    :root {
      --metal: #171a22;
      --metal2: #282c36;
      --dark: #080a0e;
      --line: rgba(255,255,255,.11);
      --text: #f8f4ea;
      --muted: #aeb1ba;
      --gold: #d7b46a;
      --gold2: #f4d990;
      --green: #3ce083;
      --red: #ff6262;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(215,180,106,.18), transparent 34%),
        linear-gradient(180deg, #12141b 0%, #050609 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .wrap {
      width: 100%;
      max-width: 390px;
    }

    .intercom {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 20px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.03)),
        linear-gradient(180deg, var(--metal2), var(--metal));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 34px 90px rgba(0,0,0,.56),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -1px 0 rgba(0,0,0,.58);
    }

    .intercom::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.045);
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -.055em;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(60,224,131,.10);
      border: 1px solid rgba(60,224,131,.22);
      color: var(--green);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px rgba(60,224,131,.75);
    }

    .screen {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      padding: 18px 16px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.28), rgba(255,255,255,.025)),
        #0b0d11;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 14px 34px rgba(0,0,0,.48);
      text-align: center;
      margin-bottom: 18px;
      pointer-events: none;
    }

    .screen small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .screen h1 {
      margin: 0;
      font-size: clamp(32px, 9vw, 42px);
      line-height: .98;
      letter-spacing: -.06em;
    }

    .screen p {
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      max-width: 290px;
    }

.speaker {
      position: relative;
      z-index: 1;
      margin: 4px auto 22px;
      width: 92%;
      min-height: 190px;
      border-radius: 28px;
      padding: 22px;
      background:
        radial-gradient(circle at 50% 20%, rgba(215,180,106,.08), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,.065), rgba(0,0,0,.26)),
        #101217;
      border: 1px solid rgba(255,255,255,.085);
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 11px;
      box-shadow:
        inset 0 18px 38px rgba(0,0,0,.52),
        0 16px 34px rgba(0,0,0,.26);
    }

    .hole {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      justify-self: center;
      align-self: center;
      background: rgba(255,255,255,.16);
      box-shadow:
        inset 0 2px 4px rgba(0,0,0,.65),
        0 0 0 rgba(215,180,106,0);
      transition:
        background .08s ease,
        box-shadow .08s ease,
        transform .08s ease,
        opacity .08s ease;
      opacity: .62;
    }

    .hole.live {
      background: rgba(244,217,144,.95);
      box-shadow:
        0 0 12px rgba(215,180,106,.58),
        inset 0 1px 2px rgba(255,255,255,.35);
      transform: scale(1.22);
      opacity: 1;
    }

    .low-volume-warning {
      display: none;
      position: relative;
      z-index: 1;
      margin: -8px 0 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(215,180,106,.12);
      border: 1px solid rgba(215,180,106,.26);
      color: var(--gold2);
      font-size: 14px;
      line-height: 1.35;
      text-align: center;
      font-weight: 750;
    }

    .low-volume-warning.show {
      display: block;
    }

    .call-button {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 92px;
      border: 1px solid rgba(215,180,106,.38);
      border-radius: 20px;
      padding: 18px 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.10)),
        linear-gradient(135deg, #fff1bd, #d7b46a);
      color: #211807;
      cursor: pointer;
      box-shadow:
        0 18px 42px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.48),
        inset 0 -5px 12px rgba(82,55,14,.18);
      font: inherit;
      text-align: center;
      transition: transform .14s ease, filter .14s ease;
    }

    .call-button:active {
      transform: translateY(2px) scale(.99);
    }

    .call-button .action {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 950;
      opacity: .82;
    }

    .call-button .name {
      display: block;
      font-size: clamp(28px, 8vw, 38px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 950;
      margin-top: 5px;
    }

    .call-button .sub {
      display: block;
      font-size: 13px;
      margin-top: 8px;
      font-weight: 750;
      opacity: .72;
    }

    .status-box {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      min-height: 48px;
      border-radius: 16px;
      padding: 13px 14px;
      background: rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.075);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.38;
      text-align: center;
    }

    .status-box.ok {
      color: var(--green);
      border-color: rgba(60,224,131,.22);
      background: rgba(60,224,131,.08);
    }

    .status-box.ko {
      color: var(--red);
      border-color: rgba(255,98,98,.22);
      background: rgba(255,98,98,.08);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      text-align: center;
      color: rgba(247,244,236,.42);
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 360px) {
      .intercom {
        padding: 17px;
        border-radius: 30px;
      }

      .screen h1 {
        font-size: 31px;
      }

      .call-button .name {
        font-size: 29px;
      }
    }
  
    .voicemail-panel {
      display: none;
      position: relative;
      z-index: 1;
      margin-top: 14px;
      border-radius: 18px;
      padding: 14px;
      background: rgba(215,180,106,.10);
      border: 1px solid rgba(215,180,106,.24);
      color: var(--text);
    }

    .voicemail-panel.open {
      display: block;
    }

    .voicemail-panel strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .voicemail-panel p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .voicemail-actions {
      display: grid;
      gap: 9px;
    }

    .voicemail-actions button {
      width: 100%;
      border: 1px solid rgba(215,180,106,.34);
      border-radius: 15px;
      padding: 13px;
      background: rgba(255,255,255,.08);
      color: var(--text);
      font: inherit;
      font-weight: 850;
    }

    .voicemail-actions button.primary {
      background: linear-gradient(135deg, #fff1bd, #d7b46a);
      color: #211807;
    }

    .voicemail-panel audio {
      width: 100%;
      margin: 10px 0;
      display: none;
    }

  
    .user-talk-now-button {
      display: none;
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: 12px;
      min-height: 62px;
      border-radius: 20px;
      border: 0;
      background: linear-gradient(135deg, #d7ffe7, #39d77b);
      color: #06170d;
      font: inherit;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .06em;
      box-shadow: 0 16px 34px rgba(0,0,0,.34);
    }

    .user-talk-now-button.show {
      display: block;
    }

  
    .user-webrtc-debug-line {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

  </style>

<script>
/* CITOFONAMI_DYNAMIC_ICE_CONFIG_USER_20260602 */
(function () {
  window.citofonamiDefaultIceServers = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ];

  window.citofonamiLoadIceConfig = async function () {
    try {
      const data = await fetch("/api/citofonami/ice-config?t=" + Date.now(), {
        cache: "no-store"
      }).then(r => r.json());

      if (data && data.ok && Array.isArray(data.iceServers) && data.iceServers.length) {
        return {
          iceServers: data.iceServers,
          iceTransportPolicy: data.iceTransportPolicy === "relay" ? "relay" : "all"
        };
      }
    } catch (e) {
      console.warn("ICE config fallback STUN:", e);
    }

    return {
      iceServers: window.citofonamiDefaultIceServers,
      iceTransportPolicy: "all"
    };
  };

  window.citofonamiLoadIceServers = async function () {
    const cfg = await window.citofonamiLoadIceConfig();
    return cfg.iceServers;
  };
})();
</script>

</head>

<body>
  <main class="wrap">
    <section class="intercom">
      <div class="top">
        <div class="brand">Citofonami</div>
        <div class="online"><span class="dot"></span> Online</div>
      </div>

      <div class="speaker" id="speaker" aria-label="Indicatore audio"></div>

      <div class="low-volume-warning" id="lowVolumeWarning">Per cortesia avvicinati, non sento bene. Grazie.</div>

      <button class="call-button" id="callButton" type="button">
        <span class="action">Citofona</span>
        <span class="name" id="buttonName">Mario Rossi</span>
        <span class="sub">premi e chiama</span>
      </button>

      <div class="status-box" id="statusBox">
        Premi e chiama.
      </div>


      <div class="voicemail-panel" id="voicemailPanel">
        <strong>Non riesco a rispondere in questo momento.</strong>
        <p>Vuoi lasciarmi un messaggio vocale?</p>
        <audio id="voicemailPreview" controls></audio>
        <div class="voicemail-actions">
          <button class="primary" id="recordVoicemailButton" type="button">Registra</button>
          <button id="playVoicemailButton" type="button">Riascolta</button>
          <button id="sendVoicemailButton" type="button">Invia</button>
        </div>
      </div>

      <div class="footer">
        Numero protetto · Nessun telefono visibile
      </div>
    </section>
  </main>

  <script>

    // ==============================
    // CITOFONAMI_FORCE_UNREGISTER_OLD_SW_20260601
    // ==============================
    async function forceCleanOldCitofonamiServiceWorker() {
      try {
        if (!('serviceWorker' in navigator)) return;

        const alreadyCleaned = sessionStorage.getItem('citofonami_sw_cleaned_once') === '1';

        const regs = await navigator.serviceWorker.getRegistrations();
        let removed = false;

        for (const reg of regs) {
          const script = reg.active && reg.active.scriptURL ? reg.active.scriptURL : '';
          if (script.includes('citofonami-sw.js')) {
            await reg.unregister();
            removed = true;
          }
        }

        if (removed && !alreadyCleaned) {
          sessionStorage.setItem('citofonami_sw_cleaned_once', '1');
          window.location.reload();
        }
      } catch (error) {
        console.warn('forceCleanOldCitofonamiServiceWorker error:', error);
      }
    }

    forceCleanOldCitofonamiServiceWorker();


    // CITOFONAMI_FRESH_SCAN_SESSION
    // Ogni apertura/scansione deve partire con una sessione pulita.
    window.CITOFONAMI_SCAN_SESSION_ID =
      'scan_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);

    window.CITOFONAMI_PAGE_OPENED_AT = Date.now();

    try {
      // Non riutilizzare mai vecchie chiamate o vecchi stati conversazione.
      sessionStorage.removeItem('citofonami_active_call_id');
      sessionStorage.removeItem('citofonami_active_call_status');
      sessionStorage.removeItem('citofonami_voicemail_call_id');
    } catch (error) {}

    function citofonamiNoStoreFetch(url, options) {
      const finalOptions = Object.assign({}, options || {}, {
        cache: 'no-store'
      });

      const separator = String(url).includes('?') ? '&' : '?';
      const freshUrl = String(url) + separator + '_fresh=' + encodeURIComponent(window.CITOFONAMI_SCAN_SESSION_ID) + '_' + Date.now();

      return fetch(freshUrl, finalOptions);
    }

    const speaker = document.getElementById('speaker');
    const statusBox = document.getElementById('statusBox');
    const buttonName = document.getElementById('buttonName');
    const callButton = document.getElementById('callButton');

    const code = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'DEMO').toUpperCase();

    let config = null;
    let localStream = null;
    let citofonamiDebugStep = 'inizio';
    let citofonamiMemoryCallerId = null;
    let citofonamiSessionCallerId = 'caller_tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);

    for (let i = 0; i < 120; i++) {
      const dot = document.createElement('span');
      dot.className = 'hole';
      speaker.appendChild(dot);
    }


    function setCitofonamiStep(step) {
      citofonamiDebugStep = step;
      try {
        console.log('[Citofonami step]', step);
      } catch (error) {}
    }

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = 'status-box' + (type ? ' ' + type : '');
    }


    function cleanCitofonamiError(error, fallback) {
      const raw = error && error.message ? String(error.message) : String(error || '');

      if (
        raw.includes('The string did not match the expected pattern') ||
        raw.includes('expected pattern')
      ) {
        return fallback || 'Il browser ha bloccato un passaggio tecnico della chiamata. Riprova o usa un altro browser.';
      }

      if (raw.includes('Permission denied') || raw.includes('NotAllowedError')) {
        return 'Permesso non concesso.';
      }

      if (raw.includes('NotFoundError')) {
        return 'Microfono non trovato.';
      }

      if (raw.includes('NotReadableError')) {
        return 'Microfono già in uso da un’altra app.';
      }

      return raw || (fallback || 'Operazione non riuscita.');
    }

    function logCitofonamiStep(step, extra) {
      try {
        console.log('[Citofonami]', step, extra || '');
      } catch (error) {}
    }

    async function loadConfig() {
      try {
        const res = await citofonamiNoStoreFetch(`/api/citofonami/${encodeURIComponent(code)}/config`);
        setCitofonamiStep('lettura risposta server');
        const data = await res.json();

        if (!data.ok || !data.config) {
          throw new Error('Configurazione non trovata');
        }

        config = data.config;
      } catch (error) {
        config = {
          firstName: 'Mario',
          lastName: 'Rossi',
          publicText: 'Premi e chiama.',
          qrCode: 'DEMO',
          buttonLabel: 'Mario Rossi',
          radius: 50,
          latitude: 45.584500,
          longitude: 9.274400,
          enabled: true,
          pushEnabled: true,
          fallbackEnabled: true,
          requireLocation: true
        };
      }

      render();
    }

    function render() {
      const owner = `${config.firstName || 'Mario'} ${config.lastName || 'Rossi'}`;
      const label = config.buttonLabel || owner;

      buttonName.textContent = label;

      if (config.enabled === false) {
        setStatus('Citofono momentaneamente non disponibile.', 'ko');
        callButton.disabled = true;
        callButton.style.opacity = '.5';
        callButton.style.filter = 'grayscale(1)';
      } else {
        setStatus('Premi e chiama.');
      }
    }


    let citofonamiSessionCallCount = 0;

    function getLocalCitofonamiCallCount() {
      return citofonamiSessionCallCount;
    }

    function incrementLocalCitofonamiCallCount() {
      citofonamiSessionCallCount += 1;
      return citofonamiSessionCallCount;
    }

    function shouldAskLocationNow() {
      // Se admin disattiva geolocalizzazione, non chiediamo mai posizione.
      if (!config || config.requireLocation === false) return false;

      // Se admin attiva geolocalizzazione:
      // prima chiamata locale senza posizione, dalla seconda in poi con posizione.
      return getLocalCitofonamiCallCount() >= 1;
    }

    async function getPositionIfNeeded() {
      if (!shouldAskLocationNow()) {
        return null;
      }

      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocalizzazione non disponibile'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          () => reject(new Error('Posizione non autorizzata')),
          {
            enableHighAccuracy: true,
            timeout: 9000,
            maximumAge: 0
          }
        );
      });
    }


    let audioContext = null;
    let analyser = null;
    let audioDataArray = null;
    let audioMeterAnimation = null;
    let lowVolumeFrames = 0;

    function stopAudioLevelMeter() {
      if (audioMeterAnimation) {
        cancelAnimationFrame(audioMeterAnimation);
        audioMeterAnimation = null;
      }

      document.querySelectorAll('.hole.live').forEach(dot => dot.classList.remove('live'));

      if (typeof lowVolumeWarning !== 'undefined' && lowVolumeWarning) {
        lowVolumeWarning.classList.remove('show');
      }
    }

    function startAudioLevelMeter(stream) {
      try {
        stopAudioLevelMeter();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.72;

        source.connect(analyser);

        audioDataArray = new Uint8Array(analyser.frequencyBinCount);

        const dots = Array.from(document.querySelectorAll('.hole'));

        function tick() {
          analyser.getByteFrequencyData(audioDataArray);

          let sum = 0;
          for (let i = 0; i < audioDataArray.length; i++) {
            sum += audioDataArray[i];
          }

          const average = sum / audioDataArray.length;
          const normalized = Math.min(1, average / 82);

          const activeDots = Math.max(2, Math.round(normalized * dots.length));

          dots.forEach((dot, index) => {
            if (index < activeDots && normalized > 0.045) {
              dot.classList.add('live');
            } else {
              dot.classList.remove('live');
            }
          });

          if (normalized < 0.055) {
            lowVolumeFrames++;
          } else {
            lowVolumeFrames = 0;
            if (typeof lowVolumeWarning !== 'undefined' && lowVolumeWarning) {
              lowVolumeWarning.classList.remove('show');
            }
          }

          // circa 3 secondi a 60 fps
          if (lowVolumeFrames > 180) {
            if (typeof lowVolumeWarning !== 'undefined' && lowVolumeWarning) {
              lowVolumeWarning.classList.add('show');
            }
          }

          audioMeterAnimation = requestAnimationFrame(tick);
        }

        tick();
      } catch (error) {
        console.warn('Citofonami audio meter non disponibile:', error);
      }
    }

    async function openMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return {
          ok: false,
          error: 'Microfono non disponibile'
        };
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

        startAudioLevelMeter(localStream);

        return {
          ok: true
        };
      } catch (error) {
        console.warn('Citofonami microfono non attivo:', error);

        return {
          ok: false,
          error: cleanCitofonamiError(error, 'Microfono non attivato.')
        };
      }
    }


    async function userStartTalkingAfterAnswer() {
      setStatus('Attivo il microfono…');

      const micResult = await openMicrophone();

      if (!micResult.ok) {
        setStatus('Microfono non attivo: ' + micResult.error, 'ko');
        return;
      }

      talkNowButton.classList.remove('show');
      setStatus('Microfono attivo. Parla vicino al telefono, come a un citofono.', 'ok');
    }

    async function ring() {
      setCitofonamiStep('inizio chiamata pulita');
      setStatus('Sto suonando…');

      const callCode = String(code || 'DEMO');

      const simpleCallerId =
        'web_' +
        Date.now().toString() +
        '_' +
        Math.random().toString(36).slice(2, 8);

      const simplePayload = {
        callerId: simpleCallerId,
        door: {
          name: 'Mario Rossi',
          description: 'Citofono'
        }
      };

      try {
        setCitofonamiStep('invio chiamata server');

        const response = await fetch('/api/citofonami/' + encodeURIComponent(callCode) + '/ring-v2', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(simplePayload)
        });

        setCitofonamiStep('lettura risposta chiamata');

        const rawText = await response.text();

        let data = null;

        try {
          data = JSON.parse(rawText);
        } catch (parseError) {

    async function postUserIceCandidate(code, callId, candidate) {
      try {
        await fetch(`/api/citofonami/${encodeURIComponent(code)}/calls/${encodeURIComponent(callId)}/webrtc/ice`, {
          method: 'POST',

    async function pollUserRemoteIce(code, callId) {
      try {
        if (!userRtcPeer) return;

        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/calls/${encodeURIComponent(callId)}/webrtc/ice?role=user&t=${Date.now()}`, {
          cache: 'no-store'
        });

        const data = await res.json();

        if (!data.ok || !Array.isArray(data.candidates)) return;

        for (const candidate of data.candidates) {
          const key = JSON.stringify(candidate);
          if (userRtcSeenIce.has(key)) continue;

          userRtcSeenIce.add(key);

          try {
            await userRtcPeer.addIceCandidate(candidate);
          } catch (iceError) {
            console.warn('User addIceCandidate error:', iceError);
          }
        }
      } catch (error) {
        console.warn('pollUserRemoteIce error:', error);
      }
    }

          cache: 'no-store'
        });

        const data = await res.json();

        if (data.ok && data.offer) {

        await new Promise(resolve => setTimeout(resolve, 700));

    async function startUserWebrtcAudio() {

      const callId = getUserWebrtcCallId();

      if (!callId) {
        setStatus('Chiamata non trovata. Riprova a citofonare.', 'ko');
        return;
      }

      try {
        stopUserWebrtcAudio();

        setStatus('Attivo il microfono…');

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Microfono non supportato da questo browser.');
        }

        userRtcStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });

        if (typeof startAudioLevelMeter === 'function') {
          startAudioLevelMeter(userRtcStream);
        }

        setStatus('Collegamento audio in corso…', 'ok');

        const offer = await waitForAdminOffer(code, callId);

        userRtcPeer = new RTCPeerConnection(await window.citofonamiLoadIceConfig());

        userRtcStream.getTracks().forEach(track => {
          userRtcPeer.addTrack(track, userRtcStream);
        });

        userRtcPeer.ontrack = (event) => {
          const audio = ensureUserRemoteAudio();
          audio.srcObject = event.streams[0];
          audio.play().catch(() => null);
        };

        userRtcPeer.onicecandidate = (event) => {
          if (event.candidate) {
            postUserIceCandidate(code, callId, event.candidate);
          }
        };

        userRtcPeer.onconnectionstatechange = () => {
          const state = userRtcPeer ? userRtcPeer.connectionState : '';

          if (state === 'connected') {
            setStatus('Audio collegato. Parla come a un citofono.', 'ok');
          }

          if (state === 'failed' || state === 'disconnected') {
            setStatus('Audio non stabile. Riprova ad avvicinarti o richiama.', 'ko');
          }
        };

        await userRtcPeer.setRemoteDescription(offer);

        const answer = await userRtcPeer.createAnswer();
        await userRtcPeer.setLocalDescription(answer);

        await fetch(`/api/citofonami/${encodeURIComponent(code)}/calls/${encodeURIComponent(callId)}/webrtc/answer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            answer: userRtcPeer.localDescription
          })
        });

        userRtcIceTimer = setInterval(() => pollUserRemoteIce(code, callId), 1200);

        const talkNowButton = document.getElementById('talkNowButton');
        if (talkNowButton) talkNowButton.classList.remove('show');

        setStatus('Audio attivo. Parla vicino al telefono, come a un citofono.', 'ok');
      } catch (error) {
        console.error('startUserWebrtcAudio error:', error);
        setStatus('Errore collegamento audio: ' + (error.message || error), 'ko');
      }
    }

      });

      const data = await res.json();

      if (!data || !data.ok || !Array.isArray(data.calls) || !data.calls.length) return;

      const minTime = state.callStartedAt || state.pageOpenedAt;

      const recent = data.calls.find(function (call) {
        const created = call.createdAt ? new Date(call.createdAt).getTime() : 0;
        return created >= (minTime - 20000);
      }) || data.calls[0];

      if (!recent) return;

      const debug = document.getElementById("citofonamiExternalDebug");
      if (debug) {
        debug.textContent = "callId: " + recent.id + " · stato: " + recent.status;
      }

      if (recent.status === "answered") {
        showPanel(recent);

        try {
          const status = document.getElementById("statusBox");
          if (status) {
            status.textContent = "Admin ha risposto. Tocca “Parla ora” e avvicinati al telefono.";
            status.className = "status ok";
          }
        } catch (e) {}

        return;
      }

      if (recent.status === "closed" || recent.status === "blocked" || recent.status === "voicemail_requested") {
        state.active = false;
      }
    } catch (error) {
      const debug = document.getElementById("citofonamiExternalDebug");
      if (debug) {
        debug.textContent = "Errore controllo risposta: " + (error && error.message ? error.message : error);
      }
    }
  }

  function wireCallDetection() {
    const btn = document.getElementById("callButton");

    if (btn && !btn.dataset.externalAnswerPanelWired) {
      btn.dataset.externalAnswerPanelWired = "1";
      btn.addEventListener("click", function () {
        markCallStarted();
      }, true);
    }

    const status = document.getElementById("statusBox");

    if (status && !status.dataset.externalAnswerObserver) {
      status.dataset.externalAnswerObserver = "1";

      const observer = new MutationObserver(function () {
        const text = (status.textContent || "").toLowerCase();

        if (text.includes("chiamata inviata") || text.includes("attendi la risposta")) {
          markCallStarted();
        }
      });

      observer.observe(status, {
        childList: true,
        characterData: true,
        subtree: true
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", wireCallDetection);
  } else {
    wireCallDetection();
  }

  setTimeout(wireCallDetection, 500);
  setTimeout(wireCallDetection, 1500);
  setInterval(wireCallDetection, 3000);
  setInterval(function () {
    if (state.active) pollLatest();
  }, 1200);
})();
</script>


<script>
/* CITOFONAMI_FORCE_TALK_NOW_MIC_20260601 */
(function () {
  let forcedUserStream = null;
  let forcedRemoteAudio = null;

  function setUserText(text, type) {
    try {
      if (typeof forceSetStatus === "function") {
        forceSetStatus(text, type);
        return;
      }

      if (typeof setStatus === "function") {
        setStatus(text, type);
        return;
      }

      const box = document.getElementById("statusBox");
      if (box) {
        box.textContent = text;
        box.className = "status " + (type || "");
      }
    } catch (e) {}
  }

  function getCurrentCallId() {
    return (
      (window.CITOFONAMI_FORCE_STATE && window.CITOFONAMI_FORCE_STATE.callId) ||
      (typeof citofonamiLiveCallId !== "undefined" ? citofonamiLiveCallId : "") ||
      sessionStorage.getItem("citofonami_active_call_id") ||
      ""
    );
  }

  async function forceTalkNowMicAndAudio() {
    const btn =
      document.getElementById("citofonamiExternalTalkButton") ||
      document.getElementById("talkNowButton");

    const callId = getCurrentCallId();

    if (!callId) {
      setUserText("Chiamata non trovata. Riprova a citofonare.", "ko");
      return;
    }

    try {
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Attivo microfono…";
      }

      setUserText("Attivo il microfono…");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Microfono non supportato da questo browser.");
      }

      forcedUserStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      try {
        if (typeof startAudioLevelMeter === "function") {
          startAudioLevelMeter(forcedUserStream);
        }
      } catch (e) {}

      if (window.CITOFONAMI_FORCE_STATE) {
        window.CITOFONAMI_FORCE_STATE.callId = callId;
      }

      if (typeof citofonamiLiveCallId !== "undefined") {
        citofonamiLiveCallId = callId;
      }

      try {
        sessionStorage.setItem("citofonami_active_call_id", callId);
      } catch (e) {}

      // Se il modulo WebRTC è presente, lo uso.
      if (typeof startUserWebrtcAudio === "function") {
        setUserText("Microfono attivo. Collegamento audio in corso…", "ok");
        await startUserWebrtcAudio();

        if (btn) {
          btn.textContent = "Audio attivo";
        }

        return;
      }

      // Fallback minimo: microfono attivo anche se WebRTC non parte.
      setUserText("Microfono attivo. Parla vicino al telefono, come a un citofono.", "ok");

      if (btn) {
        btn.textContent = "Microfono attivo";
      }
    } catch (error) {
      setUserText("Microfono non attivo: " + (error && error.message ? error.message : error), "ko");

      if (btn) {
        btn.disabled = false;
        btn.textContent = "Parla ora";
      }
    }
  }

  function wireTalkNowButtonsHard() {
    const buttons = [
      document.getElementById("citofonamiExternalTalkButton"),
      document.getElementById("talkNowButton")
    ].filter(Boolean);

    buttons.forEach((btn) => {
      if (btn.dataset.forceTalkMicWired === "1") return;

      btn.dataset.forceTalkMicWired = "1";

      btn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (event.stopImmediatePropagation) event.stopImmediatePropagation();

        forceTalkNowMicAndAudio();
      }, true);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", wireTalkNowButtonsHard);
  } else {
    wireTalkNowButtonsHard();
  }

  setTimeout(wireTalkNowButtonsHard, 500);
  setTimeout(wireTalkNowButtonsHard, 1500);
  setInterval(wireTalkNowButtonsHard, 2000);
})();
</script>


<script>
/* CITOFONAMI_TALK_NOW_DIAGNOSTIC_20260601 */
(function () {
  let diagnosticStream = null;
  let diagnosticAudioUnlocked = false;

  function ensureDiagnosticPanel() {
    let panel = document.getElementById("citofonamiTalkDiagnosticPanel");

    if (panel) return panel;

    panel = document.createElement("div");
    panel.id = "citofonamiTalkDiagnosticPanel";
    panel.style.cssText = [
      "display:none",
      "position:fixed",
      "left:12px",
      "right:12px",
      "top:12px",
      "z-index:1000000",
      "padding:14px",
      "border-radius:20px",
      "background:rgba(8,10,14,.96)",
      "border:1px solid rgba(215,180,106,.38)",
      "box-shadow:0 20px 60px rgba(0,0,0,.48)",
      "color:white",
      "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",
      "font-size:13px",
      "line-height:1.35"
    ].join(";");

    panel.innerHTML = `
      <div style="font-weight:950;font-size:17px;margin-bottom:8px;color:#f4d990;">
        Diagnostica audio Citofonami
      </div>
      <div id="citofonamiTalkDiagnosticSteps"></div>
      <button id="citofonamiTalkDiagnosticClose" type="button" style="
        margin-top:10px;
        width:100%;
        min-height:38px;
        border:1px solid rgba(255,255,255,.14);
        border-radius:13px;
        background:rgba(255,255,255,.08);
        color:white;
        font-weight:800;
      ">Nascondi diagnostica</button>
    `;

    document.body.appendChild(panel);

    document.getElementById("citofonamiTalkDiagnosticClose").addEventListener("click", function () {
      panel.style.display = "none";
    });

    return panel;
  }

  function diagnosticLine(text, ok) {
    const panel = ensureDiagnosticPanel();
    const box = document.getElementById("citofonamiTalkDiagnosticSteps");

    panel.style.display = "block";

    const row = document.createElement("div");
    row.style.cssText = [
      "padding:7px 8px",
      "margin-top:5px",
      "border-radius:12px",
      "background:" + (ok === true ? "rgba(57,215,123,.12)" : ok === false ? "rgba(255,98,98,.14)" : "rgba(255,255,255,.07)"),
      "border:1px solid " + (ok === true ? "rgba(57,215,123,.28)" : ok === false ? "rgba(255,98,98,.30)" : "rgba(255,255,255,.10)"),
      "color:" + (ok === true ? "#39d77b" : ok === false ? "#ff7777" : "rgba(255,255,255,.78)")
    ].join(";");

    row.textContent = text;
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  function resetDiagnostic() {
    const panel = ensureDiagnosticPanel();
    const box = document.getElementById("citofonamiTalkDiagnosticSteps");
    box.innerHTML = "";
    panel.style.display = "block";
  }

  function setMainStatus(text, type) {
    try {
      if (typeof forceSetStatus === "function") {
        forceSetStatus(text, type);
        return;
      }

      if (typeof setStatus === "function") {
        setStatus(text, type);
        return;
      }

      const status = document.getElementById("statusBox");
      if (status) {
        status.textContent = text;
        status.className = "status " + (type || "");
      }
    } catch (e) {}
  }

  function getKnownCallId() {
    return (
      (window.CITOFONAMI_FORCE_STATE && window.CITOFONAMI_FORCE_STATE.callId) ||
      (typeof citofonamiLiveCallId !== "undefined" ? citofonamiLiveCallId : "") ||
      sessionStorage.getItem("citofonami_active_call_id") ||
      ""
    );
  }

  async function unlockRemoteAudioElement() {
    diagnosticLine("Preparo audio remoto…");

    let audio = document.getElementById("citofonamiDiagnosticRemoteAudio");

    if (!audio) {
      audio = document.createElement("audio");
      audio.id = "citofonamiDiagnosticRemoteAudio";
      audio.autoplay = true;
      audio.playsInline = true;
      audio.controls = false;
      document.body.appendChild(audio);
    }

    try {
      // Piccolo stream vuoto non necessario: su mobile basta tentare play dentro il tap.
      await audio.play().catch(() => null);
      diagnosticAudioUnlocked = true;
      diagnosticLine("Audio remoto sbloccato dal tap utente.", true);
    } catch (error) {
      diagnosticLine("Audio remoto non sbloccato ora: " + (error.message || error), false);
    }

    return audio;
  }

  async function requestMicrophoneDiagnostic() {
    diagnosticLine("Controllo supporto microfono…");

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      diagnosticLine("Questo browser non supporta getUserMedia.", false);
      throw new Error("Microfono non supportato da questo browser.");
    }

    diagnosticLine("Richiedo autorizzazione microfono…");

    try {
      diagnosticStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      const tracks = diagnosticStream.getAudioTracks ? diagnosticStream.getAudioTracks() : [];
      const label = tracks[0] && tracks[0].label ? tracks[0].label : "microfono autorizzato";

      diagnosticLine("Microfono autorizzato: " + label, true);

      try {
        if (typeof startAudioLevelMeter === "function") {
          startAudioLevelMeter(diagnosticStream);
          diagnosticLine("Misuratore volume avviato.", true);
        }
      } catch (meterError) {
        diagnosticLine("Misuratore volume non avviato: " + (meterError.message || meterError), false);
      }

      return diagnosticStream;
    } catch (error) {
      const name = error && error.name ? error.name : "";
      const message = error && error.message ? error.message : String(error || "");

      if (name === "NotAllowedError" || name === "PermissionDeniedError") {
        diagnosticLine("Microfono negato o bloccato nelle impostazioni del browser.", false);
        setMainStatus("Microfono bloccato. Tocca il lucchetto del browser e consenti il microfono.", "ko");
      } else if (name === "NotFoundError" || name === "DevicesNotFoundError") {
        diagnosticLine("Nessun microfono trovato sul dispositivo.", false);
        setMainStatus("Nessun microfono trovato su questo dispositivo.", "ko");
      } else if (name === "NotReadableError") {
        diagnosticLine("Microfono già in uso da un’altra app o non leggibile.", false);
        setMainStatus("Microfono non disponibile: potrebbe essere usato da un’altra app.", "ko");
      } else {
        diagnosticLine("Errore microfono: " + message, false);
        setMainStatus("Errore microfono: " + message, "ko");
      }

      throw error;
    }
  }

  async function diagnosticStartWebRtc(stream) {
    const callId = getKnownCallId();

    if (!callId) {
      diagnosticLine("CallId mancante: non posso avviare WebRTC.", false);
      setMainStatus("Chiamata non trovata. Riprova a citofonare.", "ko");
      return;
    }

    diagnosticLine("CallId trovato: " + callId, true);

    try {
      if (window.CITOFONAMI_FORCE_STATE) {
        window.CITOFONAMI_FORCE_STATE.callId = callId;
      }

      if (typeof citofonamiLiveCallId !== "undefined") {
        citofonamiLiveCallId = callId;
      }

      sessionStorage.setItem("citofonami_active_call_id", callId);
    } catch (e) {}

    if (typeof startUserWebrtcAudio === "function") {
      diagnosticLine("Avvio modulo WebRTC utente…");
      await startUserWebrtcAudio();
      diagnosticLine("Funzione WebRTC chiamata. Verifica se compare Audio collegato.", true);
      return;
    }

    diagnosticLine("Modulo WebRTC startUserWebrtcAudio non trovato.", false);
    setMainStatus("Microfono attivo, ma modulo WebRTC non trovato.", "ko");
  }

  async function runTalkNowDiagnostic(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) event.stopImmediatePropagation();
    }

    resetDiagnostic();
    diagnosticLine("Tap Parla ora ricevuto.", true);
    setMainStatus("Richiesta microfono in corso…");

    const btn =
      document.getElementById("citofonamiExternalTalkButton") ||
      document.getElementById("talkNowButton");

    if (btn) {
      btn.disabled = true;
      btn.textContent = "Controllo audio…";
    }

    try {
      await unlockRemoteAudioElement();
      const stream = await requestMicrophoneDiagnostic();
      setMainStatus("Microfono autorizzato. Collegamento audio in corso…", "ok");
      await diagnosticStartWebRtc(stream);

      if (btn) {
        btn.textContent = "Audio in corso";
      }
    } catch (error) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = "Parla ora";
      }
    }
  }

  function hardWireDiagnosticTalkButtons() {
    const selectors = [
      "#citofonamiExternalTalkButton",
      "#talkNowButton"
    ];

    selectors.forEach(function (selector) {
      const btn = document.querySelector(selector);
      if (!btn || btn.dataset.talkDiagnosticWired === "1") return;

      btn.dataset.talkDiagnosticWired = "1";

      btn.addEventListener("click", runTalkNowDiagnostic, true);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", hardWireDiagnosticTalkButtons);
  } else {
    hardWireDiagnosticTalkButtons();
  }

  setTimeout(hardWireDiagnosticTalkButtons, 400);
  setTimeout(hardWireDiagnosticTalkButtons, 1200);
  setTimeout(hardWireDiagnosticTalkButtons, 2500);
  setInterval(hardWireDiagnosticTalkButtons, 2000);

  window.citofonamiRunTalkNowDiagnostic = runTalkNowDiagnostic;
})();
</script>


<script>
/* CITOFONAMI_FORCE_USER_ANSWER_20260601 */
(function () {
  let peer = null;
  let stream = null;
  let remoteAudio = null;
  let iceTimer = null;
  const seenIce = new Set();

  function code() {
    const parts = window.location.pathname.split("/").filter(Boolean);
    return String(parts[parts.length - 1] || "DEMO").trim().toUpperCase();
  }

  function setMsg(text, type) {
    try {
      if (typeof forceSetStatus === "function") {
        forceSetStatus(text, type);
        return;
      }

      if (typeof setStatus === "function") {
        setStatus(text, type);
        return;
      }

      const box = document.getElementById("statusBox");
      if (box) {
        box.textContent = text;
        box.className = "status " + (type || "");
      }
    } catch (e) {}
  }

  function debug(text) {
    let el = document.getElementById("citofonamiForceAnswerDebug");

    if (!el) {
      el = document.createElement("div");
      el.id = "citofonamiForceAnswerDebug";
      el.style.cssText = [
        "position:fixed",
        "left:12px",
        "right:12px",
        "top:12px",
        "z-index:1000002",
        "padding:10px 12px",
        "border-radius:16px",
        "background:rgba(8,10,14,.94)",
        "border:1px solid rgba(215,180,106,.35)",
        "color:#f4d990",
        "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",
        "font-size:12px",
        "line-height:1.35",
        "overflow-wrap:anywhere"
      ].join(";");

      document.body.appendChild(el);
    }

    el.style.display = "block";
    el.textContent = text;
  }

  function currentCallId() {
    return (
      (window.CITOFONAMI_FORCE_STATE && window.CITOFONAMI_FORCE_STATE.callId) ||
      (typeof citofonamiLiveCallId !== "undefined" ? citofonamiLiveCallId : "") ||
      sessionStorage.getItem("citofonami_active_call_id") ||
      ""
    );
  }

  async function recoverLatestAnsweredCallId() {
    const current = currentCallId();

    if (current) return current;

    const res = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls-list/latest?t=${Date.now()}`, {
      cache: "no-store"
    });

    const data = await res.json();

    if (!data || !data.ok || !Array.isArray(data.calls) || !data.calls.length) {
      throw new Error("Nessuna chiamata trovata.");
    }

    const call =
      data.calls.find(item => item.status === "answered") ||
      data.calls[0];

    if (!call || !call.id) {
      throw new Error("CallId non trovata.");
    }

    try {
      if (window.CITOFONAMI_FORCE_STATE) {
        window.CITOFONAMI_FORCE_STATE.callId = call.id;
        window.CITOFONAMI_FORCE_STATE.callerId = call.callerId || window.CITOFONAMI_FORCE_STATE.callerId;
      }

      if (typeof citofonamiLiveCallId !== "undefined") {
        citofonamiLiveCallId = call.id;
      }

      sessionStorage.setItem("citofonami_active_call_id", call.id);
      if (call.callerId) sessionStorage.setItem("citofonami_active_caller_id", call.callerId);
    } catch (e) {}

    return call.id;
  }

  function ensureRemoteAudio() {
    if (remoteAudio) return remoteAudio;

    remoteAudio = document.createElement("audio");
    remoteAudio.id = "citofonamiUserForceRemoteAudio";
    remoteAudio.autoplay = true;
    remoteAudio.playsInline = true;
    remoteAudio.controls = false;

    document.body.appendChild(remoteAudio);
    return remoteAudio;
  }

  async function postIce(callId, candidate) {
    try {
      await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/ice`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          role: "user",
          candidate
        })
      });
    } catch (error) {
      console.warn("User postIce error:", error);
    }
  }

  async function pollAdminIce(callId) {
    try {
      if (!peer) return;

      const res = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/ice?role=user&t=${Date.now()}`, {
        cache: "no-store"
      });

      const data = await res.json();

      if (!data || !data.ok || !Array.isArray(data.candidates)) return;

      for (const candidate of data.candidates) {
        const key = JSON.stringify(candidate);
        if (seenIce.has(key)) continue;

        seenIce.add(key);

        try {
          await peer.addIceCandidate(candidate);
        } catch (error) {
          console.warn("User addIceCandidate error:", error);
        }
      }
    } catch (error) {
      console.warn("User pollAdminIce error:", error);
    }
  }

  async function forceCreateUserAnswer() {
    let btn =
      document.getElementById("citofonamiExternalTalkButton") ||
      document.getElementById("talkNowButton");

    try {
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Collego audio…";
      }

      const callId = await recoverLatestAnsweredCallId();

      debug("callId: " + callId + " · leggo offer admin…");
      setMsg("Collegamento audio in corso…", "ok");

      const offerRes = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/offer?t=${Date.now()}`, {
        cache: "no-store"
      });

      const offerData = await offerRes.json();

      if (!offerData || !offerData.ok || !offerData.offer) {
        throw new Error("Offerta audio admin non disponibile.");
      }

      debug("Offer ricevuta. Richiedo microfono…");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Microfono non supportato da questo browser.");
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      debug("Microfono autorizzato. Creo answer…");

      try {
        if (typeof startAudioLevelMeter === "function") {
          startAudioLevelMeter(stream);
        }
      } catch (e) {}

      peer = new RTCPeerConnection(await window.citofonamiLoadIceConfig());

      stream.getTracks().forEach(track => peer.addTrack(track, stream));

      peer.ontrack = function (event) {
        const audio = ensureRemoteAudio();
        audio.srcObject = event.streams[0];
        audio.play().catch(() => null);
      };

      peer.onicecandidate = function (event) {
        if (event.candidate) {
          postIce(callId, event.candidate);
        }
      };

      peer.onconnectionstatechange = function () {
        const state = peer ? peer.connectionState : "";

        debug("callId: " + callId + " · WebRTC: " + state);

        if (state === "connected") {
          setMsg("Audio collegato. Parla come a un citofono.", "ok");
          if (btn) btn.textContent = "Audio collegato";
        }

        if (state === "failed" || state === "disconnected") {
          setMsg("Audio non stabile. Potrebbe servire un server TURN.", "ko");
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Riprova audio";
          }
        }
      };

      await peer.setRemoteDescription(offerData.offer);

      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);

      const save = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/answer`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          answer: peer.localDescription
        })
      });

      const saved = await save.json();

      if (!save.ok || !saved.ok) {
        throw new Error((saved && saved.error) || "Answer non salvata.");
      }

      debug("Answer salvata. Scambio ICE in corso…");
      setMsg("Microfono attivo. Collegamento audio in corso…", "ok");

      if (iceTimer) clearInterval(iceTimer);
      iceTimer = setInterval(() => pollAdminIce(callId), 800);
      pollAdminIce(callId);

      if (btn) {
        btn.textContent = "Audio in corso";
      }
    } catch (error) {
      console.error("forceCreateUserAnswer error:", error);

      debug("Errore: " + (error.message || error));
      setMsg("Errore audio: " + (error.message || error), "ko");

      if (btn) {
        btn.disabled = false;
        btn.textContent = "Parla ora";
      }
    }
  }

  function wire() {
    const buttons = [
      document.getElementById("citofonamiExternalTalkButton"),

<script>
/* CITOFONAMI_POINTERDOWN_USER_ANSWER_20260601 */
(function () {
  let running = false;
  let peer = null;
  let stream = null;
  let remoteAudio = null;
  let iceTimer = null;
  const seenIce = new Set();

  function code() {
    const parts = window.location.pathname.split("/").filter(Boolean);
    return String(parts[parts.length - 1] || "DEMO").trim().toUpperCase();
  }

  function msg(text, type) {
    try {
      if (typeof forceSetStatus === "function") {
        forceSetStatus(text, type);
        return;
      }
      if (typeof setStatus === "function") {
        setStatus(text, type);
        return;
      }
      const box = document.getElementById("statusBox");
      if (box) {
        box.textContent = text;
        box.className = "status " + (type || "");
      }
    } catch (e) {}
  }

  function dbg(text) {
    let el = document.getElementById("citofonamiPointerAnswerDebug");
    if (!el) {
      el = document.createElement("div");
      el.id = "citofonamiPointerAnswerDebug";
      el.style.cssText = [
        "position:fixed",
        "left:12px",
        "right:12px",
        "top:12px",
        "z-index:1000005",
        "padding:11px 12px",
        "border-radius:16px",
        "background:rgba(8,10,14,.96)",
        "border:1px solid rgba(57,215,123,.35)",
        "color:#39d77b",
        "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",
        "font-size:12px",
        "line-height:1.35",
        "overflow-wrap:anywhere"
      ].join(";");
      document.body.appendChild(el);
    }
    el.style.display = "block";
    el.textContent = text;
  }

  function ensureRemoteAudio() {
    if (remoteAudio) return remoteAudio;

    remoteAudio = document.createElement("audio");
    remoteAudio.id = "citofonamiPointerRemoteAudio";
    remoteAudio.autoplay = true;
    remoteAudio.playsInline = true;
    remoteAudio.controls = false;
    document.body.appendChild(remoteAudio);

    return remoteAudio;
  }

  async function latestAnsweredCall() {
    const res = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls-list/latest?pointer=${Date.now()}`, {
      cache: "no-store"
    });
    const data = await res.json();

    if (!data || !data.ok || !Array.isArray(data.calls) || !data.calls.length) {
      throw new Error("Nessuna chiamata trovata.");
    }

    const call =
      data.calls.find(c => c.status === "answered") ||
      data.calls[0];

    if (!call || !call.id) {
      throw new Error("CallId non trovata.");
    }

    try {
      if (window.CITOFONAMI_FORCE_STATE) {
        window.CITOFONAMI_FORCE_STATE.callId = call.id;
        window.CITOFONAMI_FORCE_STATE.callerId = call.callerId || window.CITOFONAMI_FORCE_STATE.callerId;
      }
      if (typeof citofonamiLiveCallId !== "undefined") {
        citofonamiLiveCallId = call.id;
      }
      sessionStorage.setItem("citofonami_active_call_id", call.id);
      if (call.callerId) sessionStorage.setItem("citofonami_active_caller_id", call.callerId);
    } catch (e) {}

    return call;
  }

  async function postIce(callId, candidate) {
    try {
      await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/ice`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          role: "user",
          candidate
        })
      });
    } catch (error) {
      console.warn("pointer user postIce error:", error);
    }
  }

  async function pollAdminIce(callId) {
    try {
      if (!peer) return;

      const res = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/ice?role=user&t=${Date.now()}`, {
        cache: "no-store"
      });

      const data = await res.json();

      if (!data || !data.ok || !Array.isArray(data.candidates)) return;

      for (const candidate of data.candidates) {
        const key = JSON.stringify(candidate);
        if (seenIce.has(key)) continue;
        seenIce.add(key);

        try {
          await peer.addIceCandidate(candidate);
        } catch (error) {
          console.warn("pointer user addIceCandidate error:", error);
        }
      }
    } catch (error) {
      console.warn("pointer user pollAdminIce error:", error);
    }
  }

  async function createAnswerFromPointerGesture() {
    if (running) return;
    running = true;

    const btn =
      document.getElementById("citofonamiExternalTalkButton") ||
      document.getElementById("talkNowButton");

    try {
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Collego audio…";
      }

      dbg("Gesto utente ricevuto. Recupero chiamata answered…");
      msg("Collegamento audio in corso…", "ok");

      const call = await latestAnsweredCall();
      const callId = call.id;

      dbg("callId: " + callId + " · leggo offer admin…");

      const offerRes = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/offer?t=${Date.now()}`, {
        cache: "no-store"
      });
      const offerData = await offerRes.json();

      if (!offerData || !offerData.ok || !offerData.offer) {
        throw new Error("Offer admin non disponibile.");
      }

      dbg("Offer ricevuta. Richiedo microfono…");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Microfono non supportato da questo browser.");
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      dbg("Microfono autorizzato. Creo RTCPeerConnection…");

      try {
        if (typeof startAudioLevelMeter === "function") {
          startAudioLevelMeter(stream);
        }
      } catch (e) {}

      peer = new RTCPeerConnection(await window.citofonamiLoadIceConfig());

      stream.getTracks().forEach(track => peer.addTrack(track, stream));

      peer.ontrack = function (event) {
        const audio = ensureRemoteAudio();
        audio.srcObject = event.streams[0];
        audio.play().catch(() => null);
      };

      peer.onicecandidate = function (event) {
        if (event.candidate) {
          postIce(callId, event.candidate);
        }
      };

      peer.onconnectionstatechange = function () {
        const state = peer ? peer.connectionState : "";
        dbg("callId: " + callId + " · WebRTC: " + state);

        if (state === "connected") {
          msg("Audio collegato. Parla come a un citofono.", "ok");
          if (btn) btn.textContent = "Audio collegato";
        }

        if (state === "failed" || state === "disconnected") {
          msg("Audio non stabile. Potrebbe servire un server TURN.", "ko");
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Riprova audio";
          }
        }
      };

      await peer.setRemoteDescription(offerData.offer);

      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);

      dbg("Answer creata. Salvo sul server…");

      const save = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/answer`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          answer: peer.localDescription
        })
      });

      const saved = await save.json();

      if (!save.ok || !saved.ok) {
        throw new Error((saved && saved.error) || "Answer non salvata.");
      }

      dbg("Answer salvata. Scambio ICE in corso…");
      msg("Microfono attivo. Collegamento audio in corso…", "ok");

      if (iceTimer) clearInterval(iceTimer);
      iceTimer = setInterval(() => pollAdminIce(callId), 800);
      pollAdminIce(callId);

      if (btn) btn.textContent = "Audio in corso";
    } catch (error) {
      console.error("createAnswerFromPointerGesture error:", error);
      dbg("Errore: " + (error.message || error));
      msg("Errore audio: " + (error.message || error), "ko");

      if (btn) {
        btn.disabled = false;
        btn.textContent = "Parla ora";
      }
    } finally {
      setTimeout(() => {
        running = false;
      }, 1200);
    }
  }

  function isTalkTarget(event) {
    const target = event.target && event.target.closest
      ? event.target.closest("#citofonamiExternalTalkButton, #talkNowButton")
      : null;
    return target;
  }

  ["pointerdown", "touchstart", "mousedown"].forEach(eventName => {
    document.addEventListener(eventName, function (event) {
      if (!isTalkTarget(event)) return;

      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) event.stopImmediatePropagation();

      createAnswerFromPointerGesture();
    }, true);
  });

  window.citofonamiPointerCreateUserAnswer = createAnswerFromPointerGesture;
})();
</script>


<script>
/* CITOFONAMI_PUBLIC_BUTTON_FROM_NAME_20260602 */

    return window.CITOFONAMI_SERVER_CONFIG || {};

    return String(v || "").trim();

    const c = cfg();

    const fromParts = [clean(c.firstName), clean(c.lastName)].filter(Boolean).join(" ");
    const fromName = clean(c.name);

    return fromParts || fromName || fromButton || "Mario Rossi";

      "[data-citofonami-call-button]"

(function () {

  function code() {

        window.citofonamiLiveCallId ||
        ""
      );
    } catch(e) {
      return "";
    }
  }

  async function latestCallId() {
    const direct = activeCallId();
    if (direct) return direct;

    try {
      const data = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls-list/latest?t=${Date.now()}`, {
        cache: "no-store"
      }).then(r => r.json());

      if (data && data.ok && Array.isArray(data.calls) && data.calls[0] && data.calls[0].id) {
        return data.calls[0].id;
      }
    } catch(e) {}

    return "";
  }

  function stopUserAudio() {
    const peerNames = [
      "userPeer",
      "userPc",
      "userConnection",
      "citofonamiUserPeer",
      "citofonamiUserPc",
      "pc"
    ];

    for (const name of peerNames) {
      try {
        const pc = window[name];
        if (pc && typeof pc.close === "function") pc.close();
        window[name] = null;
      } catch(e) {}
    }

    const streamNames = [
      "userStream",
      "localStream",
      "citofonamiUserStream",
      "forcedUserStream",
      "diagnosticStream"
    ];

    for (const name of streamNames) {
      try {
        const stream = window[name];
        if (stream && stream.getTracks) {
          stream.getTracks().forEach(track => {
            try { track.stop(); } catch(e) {}
          });
        }
        window[name] = null;
      } catch(e) {}
    }

    try {
      document.querySelectorAll("audio, video").forEach(el => {
        try { el.pause(); } catch(e) {}

        try { el.removeAttribute("src"); } catch(e) {}
        try { el.load(); } catch(e) {}
      });
    } catch(e) {}
  }

  async function clearUserCache() {

      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(
          keys
            .filter(key => String(key || "").toLowerCase().includes("citofonami"))
            .map(key => caches.delete(key))
        );
      }
    } catch(e) {}

    try {
      sessionStorage.removeItem("citofonami_active_call_id");
      sessionStorage.removeItem("citofonami_live_call_id");
      sessionStorage.removeItem("citofonami_last_call_id");
    } catch(e) {}

    try {

            Grazie per la chiamata.<br>
            Puoi chiudere questa pagina.
          </div>
        </div>
      </div>
    `;

    setTimeout(function () {
      try { window.close(); } catch(e) {}
    }, 900);

    setTimeout(function () {
      try {
        if (history.length > 1) history.back();
      } catch(e) {}
    }, 1600);
  }

  async function handleClosedByAdmin() {
    if (closedHandled) return;
    closedHandled = true;

    stopUserAudio();
    await clearUserCache();
    showThanksAndClosePage();
  }

  async function pollClosed() {
    if (closedHandled) return;

    const callId = await latestCallId();
    if (!callId) return;

    try {
      const data = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}?t=${Date.now()}`, {
        cache: "no-store"

        ">
          <div style="font-size:15px;color:rgba(255,255,255,.62);margin-bottom:8px;">Citofonami</div>
          <div style="font-size:28px;font-weight:950;letter-spacing:-.05em;margin-bottom:10px;">Collegamento chiuso</div>
          <div style="font-size:15px;line-height:1.45;color:rgba(255,255,255,.72);">
            Grazie per la chiamata.<br>
            Puoi chiudere questa pagina.
          </div>
        </div>
      </div>
    `;

    setTimeout(function () {
      try { window.close(); } catch(e) {}
    }, 900);

    setTimeout(function () {
      try {
        if (history.length > 1) history.back();
      } catch(e) {}
    }, 1600);
  }

  async function handleClosed() {
    if (handled) return;
    handled = true;

    stopUserAudio();
    await clearUserAfterClose();
    showThanks();
  }

  async function pollOnlyCurrentCall() {
    if (handled) return;

    const callId = getSessionCallId();

    // Fondamentale: se questa pagina non ha generato una chiamata, non controlla latest.
    if (!callId) return;

    try {
      const data = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}?t=${Date.now()}`, {
        cache: "no-store"
      }).then(r => r.json());

      if (!data || !data.ok || !data.call) return;

      // Evita chiusure su chiamate vecchie precedenti all'apertura pagina.
      const createdAt = data.call.createdAt ? new Date(data.call.createdAt).getTime() : 0;
      if (createdAt && createdAt < pageOpenedAt - 15000) return;

      if (data.call.status === "closed") {
        await handleClosed();
      }
    } catch(e) {}
  }

  // Pulizia iniziale: elimina richiami a qualsiasi chiamata precedente.
  clearOldCallReferencesOnOpen();

  // Pulizia cache non bloccante: aiuta a evitare asset/route Citofonami vecchi.
  clearCitofonamiBrowserCache();

  patchFetchForCallId();

  setInterval(pollOnlyCurrentCall, 900);

  window.citofonamiUserCloseOnlyCurrentCall = pollOnlyCurrentCall;
  window.citofonamiUserClearOldCallReferences = clearOldCallReferencesOnOpen;
})();
</script>


<script>
/* CITOFONAMI_USER_TALK_NOW_CREATES_IMMEDIATE_ANSWER_20260604 */
(function () {
  let running = false;

  function code() {
    try {
      const fromPath = window.location.pathname.split("/").filter(Boolean).pop();
      return String(fromPath || "DEMO").trim().toUpperCase();
    } catch (e) {
      return "DEMO";
    }
  }

  function setMsg(text, ok) {
    try {
      if (typeof window.setStatus === "function") {
        window.setStatus(text, ok === false ? "ko" : "ok");
      }
    } catch (e) {}

    try {
      const status = document.getElementById("status");
      if (status) {
        status.textContent = text;
        status.className = ok === false ? "status ko" : "status ok";
      }
    } catch (e) {}

    try {
      const btn =
        document.getElementById("citofonamiExternalTalkButton") ||
        document.getElementById("talkNowButton");

      if (btn) btn.textContent = text.includes("Audio collegato") ? "Audio collegato" : btn.textContent;
    } catch (e) {}

    console.log("Citofonami user immediate answer:", text);
  }

  async function latestAnsweredCall() {
    const c = code();

    try {
      const res = await fetch(`/api/citofonami/${encodeURIComponent(c)}/calls-list/latest?t=${Date.now()}`, {
        cache: "no-store"
      });

      const data = await res.json();

      if (data && data.ok && Array.isArray(data.calls)) {
        const answered = data.calls.find(call => call && call.status === "answered");
        if (answered) return answered;

        const active = data.calls.find(call => call && call.status !== "closed");
        if (active) return active;
      }
    } catch (e) {
      console.warn("latestAnsweredCall error:", e);
    }

    return null;
  }

  async function getOffer(callId) {
    const res = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/offer?t=${Date.now()}`, {
      cache: "no-store"
    });

    return res.json().catch(() => null);
  }

  async function postAnswer(callId, answer) {
    const res = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer }),
      cache: "no-store"
    });

    return res.json().catch(() => null);
  }

  async function postIce(callId, candidate) {
    try {
      await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/ice`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          role: "admin",
          candidate
        }),
        cache: "no-store"
      });
    } catch (e) {
      console.warn("User immediate postIce error:", e);
    }
  }

  async function pollAdminIce(peer, callId) {
    try {
      const res = await fetch(`/api/citofonami/${encodeURIComponent(code())}/calls/${encodeURIComponent(callId)}/webrtc/ice?role=user&t=${Date.now()}`, {
        cache: "no-store"
      });

      const data = await res.json();

      if (!data || !data.ok || !Array.isArray(data.candidates)) return;

      window.citofonamiUserSeenIce = window.citofonamiUserSeenIce || new Set();

      for (const candidate of data.candidates) {
        const key = JSON.stringify(candidate);
        if (window.citofonamiUserSeenIce.has(key)) continue;
        window.citofonamiUserSeenIce.add(key);

        try {
          await peer.addIceCandidate(candidate);
        } catch (e) {
          console.warn("User immediate addIceCandidate error:", e);
        }
      }
    } catch (e) {
      console.warn("User immediate pollAdminIce error:", e);
    }
  }

  function ensureRemoteAudio() {
    let audio = document.getElementById("citofonamiUserImmediateRemoteAudio");

    if (!audio) {
      audio = document.createElement("audio");
      audio.id = "citofonamiUserImmediateRemoteAudio";
      audio.autoplay = true;
      audio.playsInline = true;
      audio.setAttribute("playsinline", "");
      audio.controls = false;
      audio.style.display = "none";
      document.body.appendChild(audio);
    }

    return audio;
  }

  async function createImmediateAnswerFromTalkNow() {
    if (running) return;
    running = true;

    const btn =
      document.getElementById("citofonamiExternalTalkButton") ||
      document.getElementById("talkNowButton");

    try {
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Collego audio…";
      }

      setMsg("Cerco la chiamata risposta dall'admin…", true);

      const call = await latestAnsweredCall();

      if (!call || !call.id) {
        throw new Error("Nessuna chiamata answered trovata.");
      }

      const callId = call.id;

      setMsg("Leggo offerta audio admin…", true);

      const offerData = await getOffer(callId);

      if (!offerData || !offerData.ok || !offerData.offer) {
        throw new Error("Offer admin non disponibile.");
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Microfono non supportato da questo browser.");
      }

      setMsg("Autorizzo microfono e creo risposta audio…", true);

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      try {
        if (typeof window.startAudioLevelMeter === "function") {
          window.startAudioLevelMeter(stream);
        }
      } catch (e) {}

      let iceConfig = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" }
        ],
        iceTransportPolicy: "all"
      };

      try {
        if (typeof window.citofonamiLoadIceConfig === "function") {
          iceConfig = await window.citofonamiLoadIceConfig();
        }
      } catch (e) {}

      const peer = new RTCPeerConnection(iceConfig);

      window.citofonamiUserImmediatePeer = peer;
      window.citofonamiUserImmediateStream = stream;

      stream.getTracks().forEach(track => peer.addTrack(track, stream));

      peer.onicecandidate = function (event) {
        if (event.candidate) {
          postIce(callId, event.candidate);
        }
      };

      peer.ontrack = function (event) {
        try {
          const audio = ensureRemoteAudio();
          audio.srcObject = event.streams[0];

          const play = audio.play();
          if (play && play.catch) {
            play.catch(err => console.warn("User remote audio play blocked:", err));
          }
        } catch (e) {
          console.warn("User immediate ontrack error:", e);
        }
      };

      peer.onconnectionstatechange = function () {
        const state = peer.connectionState;
        console.log("Citofonami user WebRTC:", state);

        if (state === "connected") {
          setMsg("Audio collegato. Parla ora.", true);
          if (btn) btn.textContent = "Audio collegato";
        }

        if (state === "failed" || state === "disconnected") {
          setMsg("Audio non stabile. Riprova.", false);
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Riprova audio";
          }
        }
      };

      peer.oniceconnectionstatechange = function () {
        console.log("Citofonami user ICE:", peer.iceConnectionState);
      };

      await peer.setRemoteDescription(offerData.offer);

      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);

      const saved = await postAnswer(callId, peer.localDescription);

      if (!saved || !saved.ok) {
        throw new Error((saved && saved.error) || "Answer non salvata.");
      }

      setMsg("Answer audio salvata. Collegamento in corso…", true);

      if (btn) btn.textContent = "Audio in corso";

      if (window.citofonamiUserImmediateIceTimer) {
        clearInterval(window.citofonamiUserImmediateIceTimer);
      }

      window.citofonamiUserImmediateIceTimer = setInterval(function () {
        pollAdminIce(peer, callId);
      }, 700);

      pollAdminIce(peer, callId);

    } catch (error) {
      console.error("User immediate answer error:", error);
      setMsg("Errore audio: " + (error.message || error), false);

      if (btn) {
        btn.disabled = false;
        btn.textContent = "Parla ora";
      }
    } finally {
      setTimeout(function () {
        running = false;
      }, 1400);
    }
  }

  document.addEventListener("pointerdown", function (event) {
    const target = event.target && event.target.closest ? event.target.closest("button") : null;
    if (!target) return;

    const txt = String(target.textContent || "").toLowerCase();
    const id = String(target.id || "");

    if (
      id === "citofonamiExternalTalkButton" ||
      id === "talkNowButton" ||
      txt.includes("parla ora") ||
      txt.includes("riprova audio")
    ) {
      createImmediateAnswerFromTalkNow();
    }
  }, true);

  document.addEventListener("click", function (event) {
    const target = event.target && event.target.closest ? event.target.closest("button") : null;
    if (!target) return;

    const txt = String(target.textContent || "").toLowerCase();
    const id = String(target.id || "");

    if (
      id === "citofonamiExternalTalkButton" ||
      id === "talkNowButton" ||
      txt.includes("parla ora") ||
      txt.includes("riprova audio")
    ) {
      createImmediateAnswerFromTalkNow();
    }
  }, true);

  window.citofonamiUserCreateImmediateAnswerFromTalkNow = createImmediateAnswerFromTalkNow;
})();
</script>
