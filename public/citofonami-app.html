<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Citofonami</title>

  <meta name="theme-color" content="#090a0d" />
  <meta name="apple-mobile-web-app-title" content="Citofonami" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="/citofonami-manifest.json" />

  <style>
    :root {
      --bg: #07080a;
      --metal: #151820;
      --metal2: #222631;
      --line: rgba(255,255,255,.1);
      --text: #f7f4ec;
      --muted: #aeb1ba;
      --gold: #d7b46a;
      --gold2: #f4d990;
      --green: #3ce083;
      --red: #ff6262;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(215,180,106,.18), transparent 34%),
        linear-gradient(180deg, #11131a 0%, #06070a 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .wrap {
      width: 100%;
      max-width: 390px;
    }

    .intercom {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 20px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.03)),
        linear-gradient(180deg, var(--metal2), var(--metal));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 34px 90px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -1px 0 rgba(0,0,0,.55);
    }

    .intercom::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.045);
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -.05em;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(60,224,131,.10);
      border: 1px solid rgba(60,224,131,.22);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px rgba(60,224,131,.75);
    }

    .screen {
      position: relative;
      z-index: 1;
      border-radius: 22px;
      padding: 18px 16px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.28), rgba(255,255,255,.025)),
        #0b0d11;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 14px 34px rgba(0,0,0,.48);
      text-align: center;
      margin-bottom: 16px;
    }

    .screen small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .screen h1 {
      margin: 0;
      font-size: clamp(30px, 9vw, 40px);
      line-height: .98;
      letter-spacing: -.06em;
    }

    .screen p {
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      max-width: 290px;
    }

    .speaker {
      position: relative;
      z-index: 1;
      margin: 0 auto 18px;
      width: 76%;
      border-radius: 20px;
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22)),
        #101217;
      border: 1px solid rgba(255,255,255,.08);
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 8px;
      box-shadow: inset 0 12px 26px rgba(0,0,0,.44);
    }

    .hole {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      justify-self: center;
      background: rgba(255,255,255,.16);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.6);
    }

    .buttons {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 11px;
    }

    .door-button {
      width: 100%;
      min-height: 66px;
      border: 1px solid rgba(215,180,106,.32);
      border-radius: 17px;
      padding: 14px 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.16)),
        rgba(215,180,106,.13);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow:
        0 12px 28px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.12);
      font: inherit;
      text-align: left;
    }

    .door-button:active {
      transform: translateY(1px);
    }

    .door-button .name {
      display: block;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.035em;
    }

    .door-button .desc {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .door-button .bell {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: linear-gradient(135deg, #fff1bd, #d7b46a);
      color: #211807;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
    }

    .status-box {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      min-height: 48px;
      border-radius: 16px;
      padding: 13px 14px;
      background: rgba(0,0,0,.24);
      border: 1px solid rgba(255,255,255,.075);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.38;
      text-align: center;
    }

    .status-box.ok {
      color: var(--green);
      border-color: rgba(60,224,131,.22);
      background: rgba(60,224,131,.08);
    }

    .status-box.ko {
      color: var(--red);
      border-color: rgba(255,98,98,.22);
      background: rgba(255,98,98,.08);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      text-align: center;
      color: rgba(247,244,236,.42);
      font-size: 12px;
    }

    @media (max-width: 360px) {
      .intercom {
        padding: 17px;
        border-radius: 30px;
      }

      .screen h1 {
        font-size: 30px;
      }

      .door-button .name {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="intercom">
      <div class="top">
        <div class="brand">Citofonami</div>
        <div class="online"><span class="dot"></span> Online</div>
      </div>

      <div class="screen">
        <small>Citofono digitale</small>
        <h1 id="ownerName">Mario Rossi</h1>
        <p id="publicText">Premi il pulsante per parlare con il proprietario. Nessun numero telefonico verrà mostrato.</p>
      </div>

      <div class="speaker" id="speaker"></div>

      <div class="buttons" id="buttons"></div>

      <div class="status-box" id="statusBox">
        Premi il pulsante del citofono.
      </div>

      <div class="footer">
        Numero protetto · Contatto diretto tramite piattaforma
      </div>
    </section>
  </main>

  <script>
    const speaker = document.getElementById('speaker');
    const buttons = document.getElementById('buttons');
    const statusBox = document.getElementById('statusBox');
    const ownerName = document.getElementById('ownerName');
    const publicText = document.getElementById('publicText');

    const code = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'DEMO').toUpperCase();

    let config = null;
    let localStream = null;

    for (let i = 0; i < 63; i++) {
      const dot = document.createElement('span');
      dot.className = 'hole';
      speaker.appendChild(dot);
    }

    function setStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = 'status-box' + (type ? ' ' + type : '');
    }

    async function loadConfig() {
      try {
        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/config`);
        const data = await res.json();

        if (!data.ok || !data.config) {
          throw new Error('Configurazione non trovata');
        }

        config = data.config;
      } catch (error) {
        config = {
          firstName: 'Mario',
          lastName: 'Rossi',
          locationName: 'Studio Mario Rossi',
          publicText: 'Premi il pulsante per parlare con il proprietario. Nessun numero telefonico verrà mostrato.',
          qrCode: 'DEMO',
          radius: 50,
          latitude: 45.584500,
          longitude: 9.274400,
          enabled: true,
          pushEnabled: true,
          fallbackEnabled: true,
          doors: [
            { name: 'Mario Rossi', description: 'Citofono principale' }
          ]
        };
      }

      render();
    }

    function render() {
      ownerName.textContent = `${config.firstName || 'Mario'} ${config.lastName || 'Rossi'}`;
      publicText.textContent = config.publicText || 'Premi il pulsante per parlare con il proprietario.';

      buttons.innerHTML = '';

      const list = Array.isArray(config.doors) && config.doors.length
        ? config.doors
        : [{ name: `${config.firstName || 'Mario'} ${config.lastName || 'Rossi'}`, description: 'Citofono principale' }];

      list.forEach(door => {
        const btn = document.createElement('button');
        btn.className = 'door-button';
        btn.type = 'button';
        btn.innerHTML = `
          <span>
            <span class="name">${escapeHtml(door.name)}</span>
            <span class="desc">${escapeHtml(door.description || 'Premi per parlare')}</span>
          </span>
          <span class="bell">↗</span>
        `;

        btn.addEventListener('click', () => ring(door));
        buttons.appendChild(btn);
      });

      if (config.enabled === false) {
        setStatus('Citofono momentaneamente non disponibile.', 'ko');
        document.querySelectorAll('.door-button').forEach(btn => {
          btn.disabled = true;
          btn.style.opacity = '.45';
          btn.style.filter = 'grayscale(1)';
        });
      } else {
        setStatus('Premi il pulsante del citofono.');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocalizzazione non disponibile'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          () => reject(new Error('Posizione non autorizzata')),
          {
            enableHighAccuracy: true,
            timeout: 9000,
            maximumAge: 0
          }
        );
      });
    }

    async function openMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Microfono non disponibile');
      }

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

      return true;
    }

    async function ring(door) {
      setStatus('Connessione in corso…');

      try {
        const position = await getPosition();

        setStatus('Apro il microfono…');

        try {
          await openMicrophone();
        } catch (micError) {
          console.warn(micError);
        }

        const payload = {
          door,
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: position.coords.accuracy,
          userAgent: navigator.userAgent
        };

        const res = await fetch(`/api/citofonami/${encodeURIComponent(code)}/ring`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Richiesta non riuscita');
        }

        if (data.allowed === false) {
          setStatus('Devi essere in prossimità del citofono per parlare.', 'ko');
          return;
        }

        setStatus('Richiesta inviata. Attendi la risposta dell’admin…', 'ok');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Non è stato possibile suonare.', 'ko');
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/citofonami-sw.js').catch(() => null);
    }

    loadConfig();
  </script>
</body>
</html>
