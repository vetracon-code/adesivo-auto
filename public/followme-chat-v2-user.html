<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FollowMe Chat V2</title>
  <style>
    :root{
      --wa-green:#00a884;
      --wa-green-dark:#008069;
      --wa-bg:#efeae2;
      --wa-panel:#f0f2f5;
      --wa-text:#111b21;
      --wa-muted:#667781;
      --bubble-me:#d9fdd3;
      --bubble-admin:#ffffff;
      --danger:#ff3b30;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--wa-text);
      background:var(--wa-bg);
      overflow:hidden;
    }
    .app{
      height:100dvh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      background:
        linear-gradient(rgba(239,234,226,.9),rgba(239,234,226,.9)),
        radial-gradient(circle at 10% 20%,rgba(0,0,0,.04) 0 1px,transparent 1px);
      background-size:auto,22px 22px;
    }
    .top{
      min-height:58px;
      padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
      background:var(--wa-green-dark);
      color:white;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:0 2px 12px rgba(0,0,0,.12);
    }
    .avatar{
      width:40px;height:40px;border-radius:999px;
      background:rgba(255,255,255,.18);
      display:grid;place-items:center;
      font-size:20px;font-weight:900;
    }
    .title{display:grid;gap:1px;min-width:0}
    .title strong{font-size:16px;line-height:1.15}
    .title span{font-size:12px;opacity:.9}
    .messages{
      overflow-y:auto;
      padding:14px 10px 16px;
      display:flex;
      flex-direction:column;
      gap:7px;
      min-height:0;
    }
    .notice{
      margin:20px auto;
      max-width:320px;
      text-align:center;
      background:rgba(255,255,255,.78);
      border-radius:22px;
      padding:18px;
      color:var(--wa-muted);
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    .notice strong{display:block;color:#263238;margin-bottom:5px}
    .bubble{
      max-width:82%;
      padding:8px 10px 6px;
      border-radius:12px;
      line-height:1.28;
      font-size:15px;
      box-shadow:0 1px 1px rgba(0,0,0,.08);
      word-wrap:break-word;
      white-space:pre-wrap;
    }
    .bubble.owner{
      align-self:flex-start;
      background:var(--bubble-admin);
      border-top-left-radius:4px;
    }
    .bubble.visitor{
      align-self:flex-end;
      background:var(--bubble-me);
      border-top-right-radius:4px;
    }
    .time{
      display:block;
      margin-top:3px;
      font-size:10px;
      color:#667781;
      text-align:right;
    }
    .composer{
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      background:var(--wa-panel);
      display:flex;
      align-items:flex-end;
      gap:7px;
      border-top:1px solid rgba(0,0,0,.06);
    }
    .plus{
      width:42px;height:42px;flex:0 0 auto;
      border-radius:999px;border:0;background:transparent;
      color:#54656f;font-size:30px;line-height:1;
      display:none;
    }
    body.extra-on .plus{display:block}
    .input-wrap{
      flex:1;min-height:42px;background:white;border-radius:22px;
      display:flex;align-items:center;padding:0 12px;
      box-shadow:0 1px 2px rgba(0,0,0,.06);
    }
    textarea{
      width:100%;border:0;outline:0;resize:none;max-height:110px;min-height:22px;
      font:500 16px/22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:#111b21;background:transparent;padding:10px 0;
    }
    .send{
      width:44px;height:44px;flex:0 0 auto;border-radius:999px;border:0;
      background:var(--wa-green);color:white;display:grid;place-items:center;
      box-shadow:0 8px 18px rgba(0,168,132,.28);
    }
    .send svg{
      width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;
      stroke-linecap:round;stroke-linejoin:round;transform:translateX(1px);
    }
    .closed .composer{display:none}
    .toast{
      position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(12px);z-index:50;
      max-width:88vw;padding:11px 15px;border-radius:999px;
      background:rgba(17,27,33,.94);color:white;font-size:13px;font-weight:800;
      opacity:0;pointer-events:none;transition:.18s ease;box-shadow:0 16px 44px rgba(0,0,0,.34);
      text-align:center;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .attachment-card{display:grid;gap:6px}
    .attachment-card img{max-width:240px;width:100%;border-radius:12px;display:block}
    .attachment-file{
      display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;
      background:rgba(255,255,255,.55);color:#111b21;text-decoration:none;font-weight:850;
    }
    .attachment-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
    .voice-card{display:grid;gap:7px;min-width:210px}
    .voice-row{
      display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;
      background:rgba(255,255,255,.58);
    }
    .voice-row audio{width:190px;max-width:100%;height:34px}
    .voice-temp{font-size:10px;color:#667781;font-weight:850;text-align:right}
    /* followme-map-preview-css-20260528 */
    .map-preview-card{min-width:240px;max-width:280px}
    .map-preview-link{
      position:relative;
      display:block;
      width:100%;
      height:150px;
      overflow:hidden;
      border-radius:14px;
      background:#dfe5e7;
      box-shadow:0 1px 2px rgba(0,0,0,.10);
    }
    .map-preview-frame{
      width:100%;
      height:100%;
      border:0;
      display:block;
      pointer-events:none;
    }
    .map-preview-overlay{
      position:absolute;
      right:8px;
      bottom:8px;
      padding:6px 9px;
      border-radius:999px;
      background:rgba(17,27,33,.82);
      color:#fff;
      font-size:11px;
      font-weight:900;
      box-shadow:0 6px 18px rgba(0,0,0,.24);
    }

  
    /* FOLLOWME_CHAT_V2_USER_EXTRA_FULL_20260528 */
    .user-extra-menu-v2{
      position:fixed;
      left:10px;
      right:10px;
      bottom:calc(64px + env(safe-area-inset-bottom));
      z-index:70;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(0,0,0,.08);
      border-radius:24px;
      padding:12px;
      box-shadow:0 20px 60px rgba(0,0,0,.20);
      display:none;
    }
    .user-extra-menu-v2.open{display:block}
    .user-extra-grid-v2{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:9px;
    }
    .user-extra-grid-v2 button{
      border:0;
      border-radius:18px;
      background:#f0f2f5;
      padding:10px 6px;
      min-height:74px;
      font-weight:900;
      color:#111b21;
      display:grid;
      gap:4px;
      place-items:center;
      cursor:pointer;
    }
    .user-extra-grid-v2 .ico{
      width:36px;
      height:36px;
      border-radius:999px;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:18px;
    }
    .user-extra-grid-v2 .photo{background:linear-gradient(135deg,#34c759,#00a884)}
    .user-extra-grid-v2 .file{background:linear-gradient(135deg,#0a84ff,#5e5ce6)}
    .user-extra-grid-v2 .voice{background:linear-gradient(135deg,#ff9500,#ffcc00)}
    .user-extra-grid-v2 .loc{background:linear-gradient(135deg,#ff3b30,#ff9500)}
    .user-extra-grid-v2 .lbl{font-size:11px}
    .user-voice-sheet-v2{
      position:fixed;
      left:10px;
      right:10px;
      bottom:calc(64px + env(safe-area-inset-bottom));
      z-index:80;
      background:#fff;
      border-radius:24px;
      padding:16px;
      box-shadow:0 20px 70px rgba(0,0,0,.28);
      display:none;
      text-align:center;
    }
    .user-voice-sheet-v2.open{display:block}
    .user-voice-title-v2{
      font-size:16px;
      font-weight:950;
      color:#111b21;
      margin-bottom:5px;
    }
    .user-voice-sub-v2{
      font-size:12px;
      color:#667781;
      font-weight:750;
      margin-bottom:12px;
    }
    .user-voice-time-v2{
      font-size:34px;
      font-weight:950;
      color:#111b21;
      margin:10px 0 14px;
      letter-spacing:-1px;
    }
    .user-voice-actions-v2{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
    }
    .user-voice-actions-v2 button{
      border:0;
      border-radius:16px;
      min-height:44px;
      font-weight:950;
      cursor:pointer;
    }
    #userVoiceCancelV2{background:#f0f2f5;color:#111b21}
    #userVoiceStartV2{background:#ff3b30;color:#fff}
    #userVoiceSendV2{background:#00a884;color:#fff}
    #userVoiceSendV2:disabled{opacity:.45}
    
  </style>

<style id="FOLLOWME_CHAT_V2_USER_CLOSED_RETURN_PAGE_STYLE_20260528">
  .followme-chat-closed-return-20260528{
    margin:14px auto;
    max-width:88%;
    padding:16px;
    border-radius:22px;
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,250,252,.96));
    border:1px solid rgba(15,23,42,.10);
    box-shadow:0 18px 50px rgba(15,23,42,.12);
    text-align:center;
    color:#0f172a;
  }

  .followme-chat-closed-return-20260528 strong{
    display:block;
    font-size:16px;
    margin-bottom:7px;
  }

  .followme-chat-closed-return-20260528 p{
    margin:0 0 12px;
    color:#475569;
    font-size:13px;
    line-height:1.38;
  }

  .followme-chat-closed-return-20260528 a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:0 16px;
    border-radius:999px;
    background:#0f172a;
    color:#fff;

    font-weight:900;
    font-size:13px;
  }

  body.followme-chat-closed-20260528 .composer,
  body.followme-chat-closed-20260528 .inputbar,
  body.followme-chat-closed-20260528 form{
    opacity:.55;
    pointer-events:none;

</style>

</head>
<body>
  <main class="app" id="app">
    <header class="top">
      <div class="avatar">F</div>
      <div class="title">
        <strong>FollowMe</strong>
        <span id="status">Connessione...</span>
      </div>
    </header>
    <section class="messages" id="messages">
      <div class="notice"><strong>Benvenuto</strong>Scrivi al proprietario. Riceverà subito il tuo messaggio.</div>
    </section>
    <footer class="composer">
      <button class="plus" id="plusBtn" type="button">+</button>
      <div class="input-wrap">
        <textarea id="textInput" rows="1" placeholder="Scrivi un messaggio..."></textarea>
      </div>
      <button class="send" id="sendBtn" type="button" aria-label="Invia">
        <svg viewBox="0 0 24 24"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg>
      </button>
    </footer>
  </main>
  <div class="toast" id="toast"></div>

  <!-- FOLLOWME_CHAT_V2_USER_EXTRA_FULL_20260528 -->
  <div class="user-extra-menu-v2" id="userExtraMenuV2" aria-hidden="true">
    <div class="user-extra-grid-v2">
      <button type="button" id="userPickPhotoV2"><span class="ico photo">🖼️</span><span class="lbl">Foto</span></button>
      <button type="button" id="userPickFileV2"><span class="ico file">📄</span><span class="lbl">File</span></button>
      <button type="button" id="userVoiceMsgV2"><span class="ico voice">🎙️</span><span class="lbl">Vocale</span></button>
      <button type="button" id="userLocationV2"><span class="ico loc">📍</span><span class="lbl">Posizione</span></button>
    </div>
  </div>

  <div class="user-voice-sheet-v2" id="userVoiceRecorderV2" aria-hidden="true">
    <div class="user-voice-title-v2">Messaggio vocale</div>
    <div class="user-voice-sub-v2">Massimo 20 secondi. Temporaneo.</div>
    <div class="user-voice-time-v2" id="userVoiceTimerV2">00:00</div>
    <div class="user-voice-actions-v2">
      <button type="button" id="userVoiceCancelV2">Annulla</button>
      <button type="button" id="userVoiceStartV2">Registra</button>
      <button type="button" id="userVoiceSendV2" disabled>Invia</button>
    </div>
  </div>

  <input id="userPhotoInputV2" type="file" accept="image/*,video/*" style="display:none">
  <input id="userFileInputV2" type="file" accept=".pdf,image/*,video/*,application/pdf,text/plain" style="display:none">


  <script>
  (function(){
    const tokenMatch = location.pathname.match(/\/fm\/chat-v2\/c\/([^\/?#]+)/i);
    const TOKEN = tokenMatch ? decodeURIComponent(tokenMatch[1]).trim() : "";

    let sessionId = localStorage.getItem("fm_chat_v2_session_" + TOKEN) || "";
    let lastMessageId = 0;
    let messagesById = new Set();
    let sending = false;

    const els = {
      app:document.getElementById("app"),
      status:document.getElementById("status"),
      messages:document.getElementById("messages"),
      input:document.getElementById("textInput"),
      send:document.getElementById("sendBtn"),
      plus:document.getElementById("plusBtn"),
      toast:document.getElementById("toast")
    };

    function toast(msg){
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(els.toast._t);
      els.toast._t = setTimeout(()=>els.toast.classList.remove("show"), 2200);
    }

    function esc(s){
      return String(s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function timeOf(v){
      try{return new Date(v).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}
      catch(e){return "";}
    }

    async function api(url, opts){
      const res = await fetch(url, Object.assign({cache:"no-store"}, opts || {}));
      const data = await res.json().catch(()=>null);
      if(!res.ok || !data || data.success === false){
        throw new Error((data && data.error) || ("HTTP " + res.status));
      }
      return data;
    }

    async function post(url, body){
      return api(url, {
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify(body || {})
      });
    }

    function setClosed(text){
      document.body.classList.add("closed");
      els.status.textContent = "Chat chiusa";
      els.messages.innerHTML = '<div class="notice"><strong>Grazie</strong>' + esc(text || "La conversazione è stata chiusa.") + '</div>';
    }

    function setBlocked(){
      els.status.textContent = "Servizio momentaneamente non disponibile";
      els.input.disabled = true;
      els.send.disabled = true;
      toast("Servizio momentaneamente non disponibile. Riprova più tardi.");
    }

    function parseAttachmentV2(raw){
      try{
        const obj = JSON.parse(String(raw || ""));
        if(obj && obj.__followme_attachment_v2) return obj;
      }catch(e){}
      return null;
    }


    function parseMapCoordsV2(att){
      const lat = Number(att.latitude || att.lat || 0);
      const lng = Number(att.longitude || att.lng || att.lon || 0);

      if(Number.isFinite(lat) && Number.isFinite(lng) && lat && lng){
        return { lat, lng };
      }

      const raw = String(att.url || att.maps_url || "");
      const m = raw.match(/q=([^&]+)/i);
      if(m && m[1]){
        const q = decodeURIComponent(m[1]).trim();
        const mm = q.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
        if(mm){
          return { lat:Number(mm[1]), lng:Number(mm[2]) };
        }
      }

      const mm2 = raw.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      if(mm2){
        return { lat:Number(mm2[1]), lng:Number(mm2[2]) };
      }

      return null;
    }

    function buildDeviceMapUrlV2(att){
      const coords = parseMapCoordsV2(att);
      const fallback = String(att.url || att.maps_url || "");
      if(!coords) return fallback || "https://maps.google.com";

      const lat = coords.lat;
      const lng = coords.lng;
      const ua = navigator.userAgent || "";
      const isApple = /iPad|iPhone|iPod|Macintosh|Mac OS X/i.test(ua);
      const isAndroid = /Android/i.test(ua);

      if(isApple){
        return "https://maps.apple.com/?q=" + encodeURIComponent(lat + "," + lng);
      }

      if(isAndroid){
        return "geo:" + encodeURIComponent(lat + "," + lng) + "?q=" + encodeURIComponent(lat + "," + lng);
      }

      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lat + "," + lng);
    }

    function buildEmbeddedMapUrlV2(att){
      const coords = parseMapCoordsV2(att);
      if(!coords) return "";
      return "https://maps.google.com/maps?q=" + encodeURIComponent(coords.lat + "," + coords.lng) + "&z=16&output=embed";
    }

    function renderAttachmentV2(att, createdAt){
      const isImage = String(att.mime || "").startsWith("image/");
      const isVoice = String(att.kind || "") === "voice" || String(att.mime || "").startsWith("audio/");
      const label = esc(att.label || att.filename || "Allegato");
      const url = esc(att.url || "#");

      if(String(att.kind || "") === "location"){
        const openMap = esc(buildDeviceMapUrlV2(att));
        const embedMap = esc(buildEmbeddedMapUrlV2(att));
        const acc = att.accuracy_m ? " · precisione " + Math.round(Number(att.accuracy_m)) + " m" : "";

        return '<div class="attachment-card map-preview-card">' +
          (embedMap
            ? '<a class="map-preview-link" href="' + openMap + '" target="_blank" rel="noopener" aria-label="Apri posizione condivisa">' +
                '<iframe class="map-preview-frame" src="' + embedMap + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>' +
                '<span class="map-preview-overlay">Apri in Maps</span>' +
              '</a>'
            : '') +
          '<a class="attachment-file" href="' + openMap + '" target="_blank" rel="noopener">📍 <span>Posizione condivisa' + esc(acc) + '</span></a>' +
          '<span class="voice-temp">messaggio temporaneo</span>' +
          '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
        '</div>';
      }

      if(isVoice){
        return '<div class="voice-card">' +
          '<div class="voice-row">🎙️ <audio controls preload="metadata" src="' + url + '" data-voice-message-id=""></audio></div>' +
          '<span class="voice-temp">messaggio temporaneo</span>' +
          '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
        '</div>';
      }

      if(isImage){
        return '<div class="attachment-card">' +
          '<a href="' + url + '" target="_blank" rel="noopener">' +
          '<img src="' + url + '" alt="' + label + '">' +
          '</a>' +
          '<a class="attachment-file" href="' + url + '" target="_blank" rel="noopener">📎 <span>' + label + '</span></a>' +
          '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
        '</div>';
      }

      return '<div class="attachment-card">' +
        '<a class="attachment-file" href="' + url + '" target="_blank" rel="noopener">📎 <span>' + label + '</span></a>' +
        '<span class="time">' + esc(timeOf(createdAt)) + '</span>' +
      '</div>';
    }


    function pruneExpiredAttachmentsV2(){
      const now = Date.now();
      document.querySelectorAll("[data-expires-at]").forEach(el=>{
        const t = Date.parse(el.getAttribute("data-expires-at") || "");
        if(t && t <= now){
          el.remove();
        }
      });
    }


    async function registerVoiceListenV2(messageId, bubble){
      try{
        const res = await fetch("/api/followme/chat-v2/message/" + encodeURIComponent(messageId) + "/listen", {
          method:"POST",
          headers:{"Content-Type":"application/json","Accept":"application/json"},
          cache:"no-store",
          body:JSON.stringify({})
        });

        const data = await res.json().catch(()=>null);

        if(res.status === 410 || (data && data.deleted)){
          if(bubble) bubble.remove();
          toast("Messaggio vocale eliminato.");
          return;
        }

        if(!res.ok || !data || !data.success){
          if(res.status === 410 && bubble) bubble.remove();
        }
      }catch(e){}
    }

    function bindVoiceListenOnceV2(audio){
      if(!audio || audio.dataset.listenBound === "1") return;
      audio.dataset.listenBound = "1";

      audio.addEventListener("play", function(){
        if(audio.dataset.listenRegistered === "1") return;
        audio.dataset.listenRegistered = "1";
        const id = audio.getAttribute("data-voice-message-id");
        const bubble = audio.closest(".bubble");
        if(id) registerVoiceListenV2(id, bubble);
      }, { once:true });
    }

    function appendMessage(m){
      if(!m || !m.id) return;
      const id = String(m.id);
      if(messagesById.has(id)) return;
      messagesById.add(id);

      const div = document.createElement("div");
      div.className = "bubble " + (m.sender === "owner" ? "owner" : "visitor");
      div.dataset.id = id;

      const att = parseAttachmentV2(m.message);
      if(att && att.expires_at){
        div.setAttribute("data-expires-at", att.expires_at);
      }

      div.innerHTML = att
        ? renderAttachmentV2(att, m.created_at)
        : esc(m.message).replace(/\n/g,"<br>") + '<span class="time">' + esc(timeOf(m.created_at)) + '</span>';

      if(els.messages.querySelector(".notice")) els.messages.innerHTML = "";
      els.messages.appendChild(div);

      if(att && (String(att.kind || "") === "voice" || String(att.mime || "").startsWith("audio/"))){
        const audio = div.querySelector("audio[data-voice-message-id]");
        if(audio){
          audio.setAttribute("data-voice-message-id", String(m.id));
          bindVoiceListenOnceV2(audio);
        }
      }

      els.messages.scrollTop = els.messages.scrollHeight;
      lastMessageId = Math.max(lastMessageId, Number(m.id) || 0);
    }

    async function ensureSession(){
      if(!TOKEN){
        setClosed("Chat non disponibile.");
        return;
      }

      try{
        const data = await post("/api/followme/chat-v2/c/" + encodeURIComponent(TOKEN) + "/session", {
          session_id: sessionId || null
        });

        sessionId = String(data.session_id || data.session?.id || "");
        if(sessionId) localStorage.setItem("fm_chat_v2_session_" + TOKEN, sessionId);

        els.status.textContent = "Online";
        document.body.classList.toggle("extra-on", !!(data.session && data.session.uploads_enabled));

        if(data.session && data.session.status === "closed"){
          setClosed("La conversazione è stata chiusa.\nGrazie per aver parlato con me.");
          return;
        }

        if(data.session && data.session.is_blocked){
          setBlocked();
        }

        await loadMessages(true);
      }catch(err){
        setClosed(err.message || "Chat non disponibile.");
      }
    }

    async function loadState(){
      if(!sessionId || document.body.classList.contains("closed")) return;
      try{
        const data = await api("/api/followme/chat-v2/session/" + encodeURIComponent(sessionId) + "/state?v=" + Date.now());
        const s = data.session;
        if(!s) return;

        if(s.status === "closed"){
          setClosed("La conversazione è stata chiusa.\nGrazie per aver parlato con me.");
          return;
        }

        document.body.classList.toggle("extra-on", !!s.uploads_enabled);

        if(s.is_blocked){
          setBlocked();
        }else{
          els.status.textContent = "Online";
          els.input.disabled = false;
          els.send.disabled = false;
        }
      }catch(e){}
    }

    async function loadMessages(initial){
      if(!sessionId || document.body.classList.contains("closed")) return;
      try{
        const after = initial ? 0 : lastMessageId;
        const data = await api("/api/followme/chat-v2/session/" + encodeURIComponent(sessionId) + "/messages?after=" + after + "&v=" + Date.now());
        (data.messages || []).forEach(appendMessage);
      }catch(err){
        if(String(err.message || "").toLowerCase().includes("chiusa")){
          setClosed("La conversazione è stata chiusa.\nGrazie per aver parlato con me.");
        }
      }
    }

    async function send(){
      if(sending || !sessionId || document.body.classList.contains("closed")) return;
      const text = els.input.value.trim();
      if(!text) return;

      sending = true;
      els.input.value = "";
      autosize();

      try{
        const data = await post("/api/followme/chat-v2/session/" + encodeURIComponent(sessionId) + "/message", {
          sender:"visitor",
          message:text
        });
        if(data.message) appendMessage(data.message);
      }catch(err){
        els.input.value = text;
        autosize();

        const msg = String(err.message || "");
        if(msg.toLowerCase().includes("bloccato") || msg.toLowerCase().includes("momentaneamente non disponibile")){
          setBlocked();
        }else if(msg.toLowerCase().includes("chiusa")){
          setClosed("La conversazione è stata chiusa.\nGrazie per aver parlato con me.");
        }else{
          toast("Errore invio: " + msg);
        }
      }finally{
        sending = false;
      }
    }

    function autosize(){
      els.input.style.height = "auto";
      els.input.style.height = Math.min(110, els.input.scrollHeight) + "px";
    }

    function bind(){
      els.send.onclick = send;
      els.input.addEventListener("input", autosize);
      els.input.addEventListener("keydown", ev=>{
        if(ev.key === "Enter" && !ev.shiftKey){
          ev.preventDefault();
          send();
        }
      });
      els.plus.onclick = () => {
        if(document.body.classList.contains("extra-on")) toast("Extra attivo. Allegati nella prossima fase.");
        else toast("Extra non abilitato dal proprietario.");
      };
    }

    bind();
    ensureSession();
    setInterval(()=>{ if(document.visibilityState === "visible") { pruneExpiredAttachmentsV2(); loadMessages(false); } }, 400);
    setInterval(()=>{ if(document.visibilityState === "visible") loadState(); }, 900);
  })();
  </script>

        toast("Extra non abilitato dal proprietario.");
        return null;
      }

      if(file.size > max){
        toast("File troppo grande. Limite 20 MB.");
        return null;
      }

      const qs = new URLSearchParams({
        sender:"visitor",
        kind:kind || "file",
        filename:file.name || "allegato",

    async function sendLocation(){

          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy || 0);
          const mapsUrl = "https://maps.google.com/?q=" + encodeURIComponent(lat + "," + lng);

          const payload = {
            __followme_attachment_v2:true,
            temporary:true,
            ttl_seconds:120,
            kind:"location",
            sender:"visitor",
            url:mapsUrl,
            label:"Posizione condivisa",
            latitude:lat,
            longitude:lng,
            accuracy_m:acc,

            method:"POST",

    let mediaRecorder = null;

    let blob = null;
    let startedAt = 0;
    let tick = null;

    function preferredMime(){

        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/aac"
      ];

      const send = $("userVoiceSendV2");
      const start = $("userVoiceStartV2");
      const timer = $("userVoiceTimerV2");

      if(send) send.disabled = true;
      if(start) start.textContent = "Registra";
      if(timer) timer.textContent = "00:00";

      if(sheet){
        sheet.classList.add("open");
        sheet.setAttribute("aria-hidden","false");

      try{
        if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();

      clearInterval(tick);
      clearTimeout(stopTimer);

      const sheet = $("userVoiceRecorderV2");
      if(sheet){
        sheet.classList.remove("open");
        sheet.setAttribute("aria-hidden","true");
      }
    }

    function updateTimer(){
      const elapsed = Math.min(20, Math.floor((Date.now() - startedAt) / 1000));
      const timer = $("userVoiceTimerV2");
      if(timer) timer.textContent = "00:" + String(elapsed).padStart(2,"0");

    async function startRecording(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){

          const send = $("userVoiceSendV2");
          const start = $("userVoiceStartV2");

          clearInterval(tick);

        mediaRecorder.start(250);

        tick = setInterval(updateTimer, 250);

        const start = $("userVoiceStartV2");

          try{

      if(mediaRecorder && mediaRecorder.state === "recording"){

        closeExtraMenu();
      });
    }

      document.addEventListener("DOMContentLoaded", bind);
    }else{
      bind();
    }
  })();
  </script>


<script id="FOLLOWME_CHAT_V2_USER_STATE_LIVE_EXTRA_BLOCK_20260528">
(function(){
  "use strict";

  if(window.__followMeChatV2UserStateLiveExtraBlock20260528) return;
  window.__followMeChatV2UserStateLiveExtraBlock20260528 = true;

  const SERVICE_OFF = "Servizio momentaneamente non disponibile. Riprova più tardi.";
  const SERVICE_ON = "Servizio nuovamente funzionante.";
  let lastBlocked = null;
  let lastUploads = null;
  let lastNoticeText = "";

  function token(){
    try{
      const m = location.pathname.match(/\/fm\/chat-v2\/c\/([^\/?#]+)/i);
      return m ? decodeURIComponent(m[1] || "") : "";
    }catch(e){ return ""; }
  }

  function sessionId(){
    const t = token();
    if(!t) return "";
    return localStorage.getItem("fm_chat_v2_session_" + t) || "";
  }

  function $(id){ return document.getElementById(id); }

  function toast(msg){
    try{
      if(typeof window.toast === "function"){ window.toast(msg); return; }
    }catch(e){}
    const t = $("toast");
    if(t){
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(function(){ t.classList.remove("show"); }, 2200);
      return;
    }
    console.log("[FollowMe]", msg);
  }

  function addSystemNotice(text){
    if(!text || text === lastNoticeText) return;
    lastNoticeText = text;

    const box = $("messages");
    if(!box) return;

    const div = document.createElement("div");
    div.className = "notice followme-live-state-notice-20260528";
    div.innerHTML = "<strong>Avviso</strong>" +
      String(text).replace(/[<>&]/g, function(c){
        return c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&amp;";
      });

    box.appendChild(div);
    try{ box.scrollTop = box.scrollHeight; }catch(e){}
  }

  function applyBlocked(isBlocked){
    document.body.classList.toggle("followme-service-temporarily-off-20260528", !!isBlocked);

    const status = $("status");
    const input = $("input");
    const send = $("sendBtn") || $("send");

    if(isBlocked){
      if(status) status.textContent = "Servizio momentaneamente non disponibile";
      if(input){
        input.disabled = true;
        input.placeholder = "Servizio momentaneamente non disponibile";
      }
      if(send) send.disabled = true;
      addSystemNotice(SERVICE_OFF);
      toast(SERVICE_OFF);
    }else{
      if(status) status.textContent = "Online";
      if(input){
        input.disabled = false;
        input.placeholder = "Scrivi un messaggio...";
      }
      if(send) send.disabled = false;

      if(lastBlocked === true){
        addSystemNotice(SERVICE_ON);
        toast(SERVICE_ON);
      }
    }
  }

  function applyUploads(enabled){
    document.body.classList.toggle("extra-on", !!enabled);

    const plus = $("plusBtn");
    if(plus){
      plus.style.display = enabled ? "block" : "";
      plus.disabled = false;
      plus.title = enabled
        ? "Invia foto, file, audio o posizione"
        : "Extra non abilitato dal proprietario";
    }

    if(lastUploads !== null && lastUploads !== enabled){
      toast(enabled ? "Funzioni extra attivate." : "Funzioni extra disattivate.");
    }
  }

  async function refreshState(){
    const sid = sessionId();
    if(!sid) return;

    try{
      const res = await fetch("/api/followme/chat-v2/session/" + encodeURIComponent(sid) + "/state?v=" + Date.now(), {
        cache:"no-store"
      });

      const data = await res.json().catch(function(){ return null; });
      if(!res.ok || !data || data.success === false || !data.session) return;

      const s = data.session;
      const blocked = !!s.is_blocked;
      const uploads = !!s.uploads_enabled;

      applyUploads(uploads);
      applyBlocked(blocked);

      lastBlocked = blocked;
      lastUploads = uploads;
    }catch(e){
      // silenzioso: non disturbiamo l'utente durante il polling
    }
  }

  document.addEventListener("DOMContentLoaded", function(){
    refreshState();
    setTimeout(refreshState, 700);
    setTimeout(refreshState, 1600);
  });

  setInterval(refreshState, 1800);

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") refreshState();
  });
})();
</script>

      var q = decodeURIComponent(m[1]).trim();
      var mm = q.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      if(mm) return {lat:Number(mm[1]),lng:Number(mm[2])};
    }
    return null;
  }

  function mapOpen(att){
    var c = coords(att);
    if(!c) return String(att.url || att.maps_url || "https://maps.google.com");
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.lat + "," + c.lng);
  }

  function mapEmbed(att){
    var c = coords(att);
    if(!c) return "";
    return "https://maps.google.com/maps?q=" + encodeURIComponent(c.lat + "," + c.lng) + "&z=16&output=embed";
  }

  function html(att){
    var kind = String(att.kind || "");
    var mime = String(att.mime || "");
    var url = esc(att.url || "#");
    var label = esc(att.label || att.filename || "Allegato");

    if(kind === "location"){
      var open = esc(mapOpen(att));
      var embed = esc(mapEmbed(att));
      return '<div class="attachment-card map-preview-card">' +
        (embed ? '<a class="map-preview-link" href="' + open + '" target="_blank" rel="noopener">' +
          '<iframe class="map-preview-frame" src="' + embed + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>' +
          '<span class="map-preview-overlay">Apri in Maps</span></a>' : '') +
        '<a class="attachment-file" href="' + open + '" target="_blank" rel="noopener">📍 <span>Posizione condivisa</span></a>' +
      '</div>';
    }

    if(kind === "voice" || mime.indexOf("audio/") === 0){
      return '<div class="voice-card"><div class="voice-row">🎙️ <audio controls preload="metadata" src="' + url + '"></audio></div></div>';
    }

    if(mime.indexOf("image/") === 0 || kind === "image" || kind === "media"){
      return '<div class="attachment-card">' +
        '<a href="' + url + '" target="_blank" rel="noopener"><img src="' + url + '" alt="' + label + '"></a>' +
        '<a class="attachment-file" href="' + url + '" target="_blank" rel="noopener">📎 <span>' + label + '</span></a>' +
      '</div>';
    }

    return '<div class="attachment-card">' +
      '<a class="attachment-file" href="' + url + '" target="_blank" rel="noopener">📎 <span>' + label + '</span></a>' +
    '</div>';
  }

  function fixBubble(b){
    if(!b || b.dataset.attachmentGuardRendered === "1") return;

    var raw = String(b.textContent || "").trim();
    if(raw.indexOf("__followme_attachment_v2") < 0) return;

    var att = parse(raw);
    if(!att) return;

    b.innerHTML = html(att);
    b.dataset.attachmentGuardRendered = "1";
  }

  function scan(){
    document.querySelectorAll(".bubble").forEach(fixBubble);
  }

  document.addEventListener("DOMContentLoaded", scan);
  setInterval(scan, 500);
})();
</script>

</body>
</html>
