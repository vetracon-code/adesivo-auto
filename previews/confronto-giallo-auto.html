<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Confronto giallo cartello auto</title>
<style>
  body{
    margin:0;
    background:#d5d5d5;
    font-family:Arial, Helvetica, sans-serif;
    padding:24px;
  }
  h1{
    margin:0 0 18px;
    font-size:24px;
  }
  .wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    align-items:start;
  }
  .card{
    background:#fff;
    padding:14px;
    border-radius:14px;
    box-shadow:0 10px 28px rgba(0,0,0,.18);
  }
  .label{
    text-align:center;
    font-weight:900;
    margin-bottom:10px;
    font-size:16px;
  }
  img{
    width:100%;
    height:auto;
    display:block;
    border:1px solid #bbb;
  }
</style>
</head>
<body>
<h1>Confronto giallo cartello Auto</h1>

<div class="wrap">
  <div class="card">
    <div class="label">AUTO ATTUALE</div>
    <img src="./auto-giallo-attuale.png" alt="Auto attuale">
  </div>

  <div class="card">
    <div class="label">AUTO CON GIALLO DEGLI ALTRI CARTELLI</div>
    <img src="./auto-giallo-allineato-cartelli.png" alt="Auto giallo allineato">
  </div>
</div>

</body>
</html>
